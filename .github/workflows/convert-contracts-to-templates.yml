name: Convert Contracts To Templates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-contracts-to-templates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert contracts UI to templates and customer assignments
        run: python tools/convert_contracts_to_templates.py

      - name: Validate JavaScript
        run: |
          node --check admin/admin.js
          node --check portal/portal.js

      - name: Commit contract template architecture
        shell: bash
        run: |
          git config user.name "XYNTRAMARK"
          git config user.email "mark@xyntra-ai.com"
          git add admin/admin.js admin/index.html portal/portal.js portal/index.html
          git commit -m "Use contract templates with customer-level assignments"
          git push
