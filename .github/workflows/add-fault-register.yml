name: Add Fault Register

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-fault-register.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add fault log register and close workflow
        run: python tools/add_fault_register.py

      - name: Validate JavaScript
        run: |
          node --check admin/admin.js
          node --check portal/portal.js

      - name: Commit fault register feature
        shell: bash
        run: |
          git config user.name "XYNTRAMARK"
          git config user.email "mark@xyntra-ai.com"
          git add admin/admin.js admin/index.html portal/portal.js portal/index.html
          git commit -m "Add fault log register and close actions"
          git push
