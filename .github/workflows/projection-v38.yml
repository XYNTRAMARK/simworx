name: Publish projection configurator V38
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v38.yml'
      - '.projection-v38-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v38
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V38 from published V37
        run: python3 .projection-v38-deploy/build_v38.py
      - name: Run V38 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v38-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v38-deploy/test_v38.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v38-proof
          path: /tmp/v38-proof.png
          retention-days: 1
      - name: Publish immutable V38
        run: python3 .projection-v38-deploy/publish_v38.py
