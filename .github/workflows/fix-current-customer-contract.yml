name: Fix Current Customer Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-current-customer-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply current customer contract fix
        run: python tools/fix_current_customer_contract.py

      - name: Validate JavaScript
        run: |
          node --check admin/admin.js
          node --check portal/portal.js

      - name: Commit current contract fix
        shell: bash
        run: |
          git config user.name "XYNTRAMARK"
          git config user.email "mark@xyntra-ai.com"
          git add admin/admin.js admin/index.html portal/portal.js portal/index.html
          git commit -m "Show the customer's current assigned contract in portal"
          git push
