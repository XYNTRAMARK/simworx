name: Extract report render functions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-report-render-functions.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract focused functions
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          out=[];f.retrbinary('RETR /htdocs/reports/app.js',out.append);s=b''.join(out).decode('utf-8','replace');f.quit()
          names=['wiModels','wiFunnel','renderConfigurators','renderTraffic','deriveReport','filterEvents','renderOverview']
          for name in names:
              for pat in [r'function\s+'+re.escape(name)+r'\s*\(',r'const\s+'+re.escape(name)+r'\s*=']:
                  m=re.search(pat,s)
                  if m:
                      start=m.start()
                      # next named function boundary or 18000 chars
                      n=re.search(r'\nfunction\s+[A-Za-z_$][\w$]*\s*\(',s[m.end():])
                      end=min(len(s),start+18000)
                      if n and m.end()+n.start()<end:end=m.end()+n.start()
                      print('\n###FUNCTION',name)
                      print(s[start:end])
                      break
          PY
