name: Deploy arrival attribution preservation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-arrival-attribution.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check assets/js/simworx-arrival-v1.js
      - name: Upload arrival tracker only
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,hashlib
          from io import BytesIO
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          local='assets/js/simworx-arrival-v1.js';remote='/htdocs/assets/js/simworx-arrival-v1.js'
          data=open(local,'rb').read();f.storbinary('STOR '+remote,BytesIO(data))
          out=[];f.retrbinary('RETR '+remote,out.append);live=b''.join(out)
          if hashlib.sha256(live).digest()!=hashlib.sha256(data).digest():raise RuntimeError('verify failed')
          print('DEPLOYED',remote)
          f.quit()
          PY
