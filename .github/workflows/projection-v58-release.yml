name: Release projector configurator V58 compact price bar
on:
  push:
    branches: [main]
    paths:
      - '.projection-v58-deploy/**'
      - '.github/workflows/projection-v58-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v58
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V58 strictly from live V57
        run: python3 .projection-v58-deploy/build_v58.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify compact sticky price bar only
        run: |
          python3 -m http.server 8765 >/tmp/v58-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v58-deploy/test_v58_pricebar.py
          kill $P || true
      - name: Publish V58 and promote stable page
        run: python3 .projection-v58-deploy/publish_v58.py
