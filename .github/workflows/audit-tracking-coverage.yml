name: Audit tracking coverage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-tracking-coverage.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check every public HTML page for intelligence tracking
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,posixpath,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          entries=list(f.mlsd('/htdocs'))
          def read(path):
              out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          rows=[]
          for name,facts in entries:
              if facts.get('type')!='file' or not name.lower().endswith(('.html','.htm')):continue
              if name.startswith('.') or re.search(r'-(?:v|V)\d+\.html$',name):continue
              s=read('/htdocs/'+name)
              tracked='simworx-intelligence-bootstrap-v1.js' in s
              product=bool(re.search(r'(configurator|product|software|simulator|cockpit|frame|visual|mission)',name,re.I))
              rows.append((name,tracked,product))
          for row in sorted(rows):print('PAGE',row[0],'TRACKED' if row[1] else 'MISSING','PRODUCT' if row[2] else '')
          print('TOTAL',len(rows),'TRACKED',sum(r[1] for r in rows),'MISSING',sum(not r[1] for r in rows))
          f.quit()
          PY
