name: Inspect live LED quote controls for reporting validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-led-reporting-controls.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read quote controls only
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          parts=[];f.retrbinary('RETR /htdocs/led-screen-configurator.html',parts.append);f.quit()
          s=b''.join(parts).decode('utf-8','replace')
          for term in ['led-quote-form','led-quote-action','data-quote-action','led-email','Email me Quote','Save','Print']:
              print('\n###',term)
              for m in list(re.finditer(re.escape(term),s,re.I))[:8]:
                  print(s[max(0,m.start()-1200):m.start()+2600].replace('\n',' ')[:3800])
          PY
