name: Publish projection configurator V35
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v35.yml'
      - '.projection-v35-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v35
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V35 from published V34
        run: python3 .projection-v35-deploy/build_v35.py
      - name: Run V35 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v35-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v35-deploy/test_v35.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v35-proof
          path: /tmp/v35-proof.png
          retention-days: 1
      - name: Publish immutable V35
        run: python3 .projection-v35-deploy/publish_v35.py
