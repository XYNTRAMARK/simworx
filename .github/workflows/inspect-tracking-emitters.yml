name: Inspect tracking emitters and ingestion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tracking-emitters.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read tracker and configurator emitter logic
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(path):
              out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          for path in ['/htdocs/assets/js/simworx-intelligence-tracker-v1.js','/htdocs/assets/js/simworx-intelligence-configurator-v1.js']:
              s=read(path)
              print('\n###FILE',path,'LEN',len(s))
              # compactly print declarations and event names
              strings=sorted(set(re.findall(r"['\"]([a-z][a-z0-9_]{2,79})['\"]",s)))
              eventish=[x for x in strings if any(k in x for k in ['configurator','configuration','email','pdf','download','screen','projector','simulator','product','software','page','session','engagement','scroll','cta','utm','lead'])]
              print('EVENT_STRINGS',eventish)
              for term in ['function track','track(','emit(','queue','flush','consent','cookie','localStorage','sessionStorage','utm_source','utm_medium','utm_campaign','configurator_step_viewed','configuration_downloaded','configuration_emailed','email_entered','save','pdf','simulator_model_selected','software_product_clicked']:
                  hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                  if hits:
                      print('\nTERM',term,'COUNT',len(hits))
                      for i in hits[:8]: print(s[max(0,i-1000):min(len(s),i+2600)])
          f.quit()
          PY
