name: Compact live LED pixel pitch selector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the Pixel pitch fieldset
        run: |
          python3 - <<'PY'
          import ftplib, ssl, os, re, hashlib
          from urllib.parse import urlsplit

          path='/htdocs/led-screen-configurator.html'
          raw=os.environ['FTP_HOST'].strip()
          p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          class F(ftplib.FTP_TLS):
              prefer_epsv=False
              def makepasv(self):
                  if self.prefer_epsv:
                      try:return ftplib.parse229(self.sendcmd('EPSV'),self.sock.getpeername())
                      except ftplib.error_perm:pass
                  return super().makepasv()
              def ntransfercmd(self,c,rest=None):
                  try:return super().ntransfercmd(c,rest)
                  except ftplib.error_temp as e:
                      if str(e).startswith('425') and not self.prefer_epsv:
                          self.prefer_epsv=True; return super().ntransfercmd(c,rest)
                      raise
          f=F(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21)
          f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          f.prot_p()

          parts=[]
          f.retrbinary('RETR '+path,parts.append)
          original=b''.join(parts).decode('utf-8','replace')
          print('BEFORE_SHA256',hashlib.sha256(original.encode()).hexdigest())

          marker='sw-led-pitch-compact-v1'
          if marker in original:
              raise SystemExit('Compact marker already present; refusing duplicate patch')

          heading_matches=list(re.finditer(r'<(?:legend|h[1-6])\b[^>]*>\s*Pixel pitch\s*</(?:legend|h[1-6])>',original,re.I))
          if len(heading_matches)!=1:
              raise SystemExit(f'Expected exactly one visible Pixel pitch heading, found {len(heading_matches)}')
          i=heading_matches[0].start()

          # Prefer the fieldset visible in the current design; fall back only to a containing section.
          wrapper=None
          for tag in ('fieldset','section'):
              opens=list(re.finditer(r'<'+tag+r'\b[^>]*>',original[:i],re.I))
              for m in reversed(opens):
                  close=re.search(r'</'+tag+r'\s*>',original[i:],re.I)
                  if close:
                      wrapper=(tag,m)
                      break
              if wrapper:
                  break
          if not wrapper:
              raise SystemExit('Could not identify the Pixel pitch wrapper safely')

          tag,m=wrapper
          opening=m.group(0)
          if 'class=' in opening.lower():
              patched_open=re.sub(r'class=(["\'])',r'class=\1simworx-pitch-compact-v1 ',opening,count=1,flags=re.I)
          else:
              patched_open=opening[:-1]+' class="simworx-pitch-compact-v1">'
          changed=original[:m.start()]+patched_open+original[m.end():]

          css='''\n<style id="sw-led-pitch-compact-v1">
/* Intentionally scoped to the LED Pixel pitch selector only. */
.simworx-pitch-compact-v1{padding-top:10px!important;padding-bottom:10px!important}
.simworx-pitch-compact-v1 legend{margin-bottom:0!important}
.simworx-pitch-compact-v1 p{margin-top:5px!important;margin-bottom:5px!important;line-height:1.32!important}
.simworx-pitch-compact-v1 label{min-height:160px!important;height:auto!important;padding-top:10px!important;padding-bottom:10px!important}
.simworx-pitch-compact-v1 label>span,
.simworx-pitch-compact-v1 label>div,
.simworx-pitch-compact-v1 label>small,
.simworx-pitch-compact-v1 label>p{margin-top:2px!important;margin-bottom:2px!important}
.simworx-pitch-compact-v1 [class*="grid"],
.simworx-pitch-compact-v1 [class*="options"],
.simworx-pitch-compact-v1 [class*="choices"]{row-gap:8px!important}
</style>\n'''
          if '</head>' not in changed.lower():
              raise SystemExit('No </head> found; refusing upload')
          changed=re.sub(r'</head>',css+'</head>',changed,count=1,flags=re.I)

          if changed.count('simworx-pitch-compact-v1') < 2:
              raise SystemExit('Patch validation failed')
          # Ensure no unrelated visible copy changed.
          if original.replace(opening,'',1).count('Pixel pitch') != changed.replace(patched_open,'',1).replace(css,'',1).count('Pixel pitch'):
              raise SystemExit('Unexpected Pixel pitch text mutation')

          payload=changed.encode('utf-8')
          from io import BytesIO
          f.storbinary('STOR '+path,BytesIO(payload))
          f.quit()
          print('WRAPPER',tag)
          print('AFTER_SHA256',hashlib.sha256(payload).hexdigest())
          print('PATCH_OK')
          PY
