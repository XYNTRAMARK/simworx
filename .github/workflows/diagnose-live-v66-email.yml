name: Diagnose live V66 email with real Turnstile
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-v66-email.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Exercise real live V66 email path
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-unsafe-swiftshader'])
              p=b.new_page(viewport={'width':1600,'height':1000})
              logs=[]
              p.on('console',lambda m: logs.append('console '+m.type+': '+m.text) if m.type in ['error','warning'] else None)
              p.on('pageerror',lambda e: logs.append('pageerror: '+str(e)))
              responses=[]
              def on_response(r):
                  if 'projection-quote-submit.php' in r.url:
                      try: body=r.text()
                      except: body='[unreadable]'
                      responses.append({'url':r.url,'status':r.status,'body':body[:2000]})
              p.on('response',on_response)
              p.goto('https://www.sim-worx.com/projection-screen-configurator.html?diag=v66-real',wait_until='domcontentloaded',timeout=60000)
              p.wait_for_timeout(3500)

              marker=p.evaluate("""() => ({
                v66:document.documentElement.innerHTML.includes('projection_images'),
                v65:document.documentElement.innerHTML.includes('projection-v65-real-pdf-js'),
                endpoint:document.getElementById('v48-email-form')?.action||''
              })""")
              print('LIVE_MARKERS',marker)

              p.locator('[data-guided-go="2"]').click();p.wait_for_timeout(500)
              p.locator('[data-guided-go="3"]').click();p.wait_for_timeout(700)
              calc=p.locator('#guided-calculate');calc.click()
              for _ in range(350):
                  if p.locator('#guided-result').is_visible() and not calc.is_disabled(): break
                  p.wait_for_timeout(100)
              p.wait_for_timeout(700)
              p.locator('[data-guided-go="4"]').click();p.wait_for_timeout(1500)
              if p.locator('#v39-country').count():p.locator('#v39-country').select_option('GB')
              if p.locator('#v37-customer-type').count():p.locator('#v37-customer-type').select_option('business')
              p.wait_for_timeout(300)
              p.locator('#v37-email-proposal').click();p.wait_for_timeout(500)
              p.locator('#v37-email-address').fill('mark@sim-worx.com')

              # Wait for the real Turnstile token.
              token=''
              for _ in range(120):
                  token=p.locator('#v48-email-form [name="cf-turnstile-response"]').input_value() if p.locator('#v48-email-form [name="cf-turnstile-response"]').count() else ''
                  if token: break
                  p.wait_for_timeout(250)
              print('TURNSTILE_TOKEN_LENGTH',len(token))
              print('EMAIL_STATUS_BEFORE',p.locator('#v37-email-status').text_content() or '')

              if token:
                  p.locator('#v37-email-send').click()
                  p.wait_for_timeout(5000)
              print('EMAIL_STATUS_AFTER',p.locator('#v37-email-status').text_content() or '')
              print('PROPOSAL_STATUS_AFTER',p.locator('#v37-proposal-status').text_content() or '')
              print('RESPONSES',responses)
              print('LOGS',logs[-40:])
              b.close()
          PY
