name: Publish projection configurator V33
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v33.yml'
      - '.projection-v33-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v33
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V33 from published V32
        run: python3 .projection-v33-deploy/build_v33.py
      - name: Run V33 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v33-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v33-deploy/test_v33.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v33-proof
          path: /tmp/v33-proof.png
          retention-days: 1
      - name: Publish immutable V33
        run: python3 .projection-v33-deploy/publish_v33.py
