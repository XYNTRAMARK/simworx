name: Browser control test projection V15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v15-browser-control.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V15
        run: python3 .projection-v15-deploy/build_v15.py
      - name: Run V15 in headless Chrome
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 45 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --enable-logging=stderr --v=0 --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/projection-screen-configurator-v15.html >/tmp/dom.html 2>/tmp/console.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          grep -E 'SyntaxError|CONSOLE:' /tmp/console.log || true
          grep -o 'id="led-viewer-status"[^<]*>[^<]*' /tmp/dom.html || true
          if grep -q 'Loading interactive 3D preview' /tmp/dom.html; then exit 4; fi
          exit $RC
