name: Inspect live LED outbound mail provider
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-led-outbound-mail.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read provider/routing snippets only
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          out=[];f.retrbinary('RETR /htdocs/led-quote-submit.php',out.append);s=b''.join(out).decode('utf-8','replace');f.quit()
          markers=['Authorization: Bearer','stream_context_create','https://','mail($to','@mail($to']
          seen=set()
          for term in markers:
              for m in re.finditer(re.escape(term),s,re.I):
                  frag=s[max(0,m.start()-1200):m.start()+3000]
                  frag=re.sub(r'Bearer\s+[A-Za-z0-9._-]+','Bearer [redacted]',frag)
                  frag=re.sub(r'([A-Za-z0-9_]*KEY[A-Za-z0-9_]*)\s*=\s*[^;\n]+',r'\1=[redacted]',frag,flags=re.I)
                  if frag not in seen:
                      seen.add(frag);print('\n---\n'+frag)
          PY
