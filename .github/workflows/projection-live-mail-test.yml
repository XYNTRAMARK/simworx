name: Send and verify Projection email via LED routine
on:
  push:
    branches: [main]
    paths:
      - '.projection-live-mail-test/**'
      - '.github/workflows/projection-live-mail-test.yml'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload one-time Projection mail test
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          body=open('.projection-live-mail-test/send.php','rb').read()
          f.storbinary('STOR /htdocs/projection-live-mail-test.php',io.BytesIO(body));f.quit()
          PY
      - name: Send real test message
        run: |
          curl -fsS https://www.sim-worx.com/projection-live-mail-test.php
      - name: Remove one-time endpoint
        if: always()
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          try:f.delete('/htdocs/projection-live-mail-test.php')
          except:pass
          f.quit()
          PY
