name: Audit live reporting instrumentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-reporting.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inventory live reports and tracking code
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re,hashlib,json,posixpath
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()

          def listdir(path):
              try:return list(f.mlsd(path))
              except:return []
          def read(path):
              out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          def walk(path,depth=0):
              out=[]
              if depth>4:return out
              for name,facts in listdir(path):
                  if facts.get('type') in ('cdir','pdir'):continue
                  full=posixpath.join(path,name)
                  out.append((full,facts))
                  if facts.get('type')=='dir':
                      out.extend(walk(full,depth+1))
              return out

          allfiles=walk('/htdocs')
          print('TOTAL_ENTRIES',len(allfiles))
          for full,facts in allfiles:
              low=full.lower()
              if any(k in low for k in ['/reports','report','analytics','tracking','stats','traffic','funnel','lead']):
                  print('CANDIDATE',facts.get('type'),facts.get('size'),full)

          textual=[]
          for full,facts in allfiles:
              if facts.get('type')!='file':continue
              low=full.lower()
              if not any(low.endswith(ext) for ext in ['.html','.htm','.js','.php','.json','.css']):continue
              try:
                  size=int(facts.get('size') or 0)
              except:size=0
              if size>1500000:continue
              try:s=read(full)
              except:continue
              terms=['/reports','page_view','pageview','configurator','visitor_id','session_id','utm_','analytics','track','funnel','lead','supabase','fetch(','navigator.sendBeacon','localStorage','pdf','email']
              if any(t.lower() in s.lower() for t in terms):
                  textual.append((full,s))

          print('TEXTUAL_MATCH_FILES',len(textual))
          for full,s in textual:
              print('\n###FILE',full,'LEN',len(s),'SHA',hashlib.sha256(s.encode()).hexdigest())
              # Extract URLs/endpoints and high-value snippets.
              urls=sorted(set(re.findall(r'(?:"|\')((?:https?://|/)[^"\'\s]{3,220})(?:"|\')',s)))
              if urls: print('URLS',urls[:80])
              for term in ['navigator.sendBeacon','fetch(','page_view','configurator','utm_','visitor','session','lead','pdf','email','aircraft','simulator','reports','supabase']:
                  hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                  if hits:
                      print('TERM',term,'COUNT',len(hits))
                      for i in hits[:4]:
                          frag=s[max(0,i-500):min(len(s),i+1800)]
                          print(frag.replace('\n',' ')[:2300])
          f.quit()
          PY
