name: Audit key page tracking coverage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact public product/configurator pages
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(path):
              out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          pages=[
            'index.html','simulators.html','frames.html','custom-simulator.html',
            'a320-single-seat.html','a320-full-cockpit.html','a320-supershort.html','f16-frames.html',
            'software.html','simstarter.html','simstarter-pro-software.html','certification-pro.html',
            'visual-systems.html','led-screen-configurator.html','projection-screen-configurator.html'
          ]
          for page in pages:
              try:s=read('/htdocs/'+page)
              except Exception as e:
                  print('PAGE_MISSING',page,type(e).__name__);continue
              refs=re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I)
              trackers=[x for x in refs if 'simworx-intelligence' in x]
              print('\nPAGE',page)
              print('TRACKERS',trackers if trackers else 'NONE')
              for term in ['data-simworx-product','framecfg','led-quote-form','v48-email-form','v65-save-pdf','href="software.html"','href="/software.html"']:
                  if term in s:print('HAS',term)
          # Print bootstrap config only.
          for asset in ['simworx-intelligence-bootstrap-v1.js','simworx-intelligence-bootstrap-v2.js']:
              try:s=read('/htdocs/assets/js/'+asset)
              except:continue
              print('\nBOOTSTRAP',asset)
              print(s[:5000])
          f.quit()
          PY
