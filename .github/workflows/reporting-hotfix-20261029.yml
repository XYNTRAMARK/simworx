name: Deploy reporting hotfix 2026-10-29
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check reporting files
        run: |
          node --check reports/analytics.js
          node --check reports/app.js
      - name: Run canonical reporting tests
        run: node .reporting-v3/tests/analytics.mjs
      - name: Upload only reporting hotfix files
        run: |
          python3 - <<'PY'
          import ftplib, ssl, os, hashlib
          from io import BytesIO
          from urllib.parse import urlsplit

          raw=os.environ['FTP_HOST'].strip()
          p=urlsplit(raw if '://' in raw else 'ftp://'+raw)

          class F(ftplib.FTP_TLS):
              prefer_epsv=False
              def makepasv(self):
                  if self.prefer_epsv:
                      try:return ftplib.parse229(self.sendcmd('EPSV'),self.sock.getpeername())
                      except ftplib.error_perm:pass
                  return super().makepasv()
              def ntransfercmd(self,c,rest=None):
                  try:return super().ntransfercmd(c,rest)
                  except ftplib.error_temp as e:
                      if str(e).startswith('425') and not self.prefer_epsv:
                          self.prefer_epsv=True
                          return super().ntransfercmd(c,rest)
                      raise

          f=F(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21)
          f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          f.prot_p()

          for local,remote in [
              ('reports/analytics.js','/htdocs/reports/analytics.js'),
              ('reports/app.js','/htdocs/reports/app.js')
          ]:
              data=open(local,'rb').read()
              f.storbinary('STOR '+remote,BytesIO(data))
              check=[]
              f.retrbinary('RETR '+remote,check.append)
              live=b''.join(check)
              if hashlib.sha256(live).digest()!=hashlib.sha256(data).digest():
                  raise SystemExit('FTP verification mismatch: '+remote)
              print('DEPLOYED',remote,hashlib.sha256(data).hexdigest())
          f.quit()
          PY
      - name: Verify public reporting source
        run: |
          python3 - <<'PY'
          import urllib.request, time
          checks=[
            ('https://www.sim-worx.com/reports/analytics.js?hotfix=20261029','tracking_validation'),
            ('https://www.sim-worx.com/reports/app.js?hotfix=20261029','sessionModel=new Map()')
          ]
          for url,needle in checks:
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'SimworxReportingVerify/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  body=r.read().decode('utf-8','replace')
              if needle not in body:
                  raise SystemExit('Public verification failed for '+url)
              print('PUBLIC_OK',url,len(body))
          PY
