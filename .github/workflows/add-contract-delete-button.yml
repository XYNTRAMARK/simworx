name: Add Contract Delete Button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-contract-delete-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add delete button and cache-bust admin app
        run: python tools/add_contract_delete_button.py

      - name: Validate JavaScript
        run: node --check admin/admin.js

      - name: Commit contract delete feature
        shell: bash
        run: |
          git config user.name "XYNTRAMARK"
          git config user.email "mark@xyntra-ai.com"
          git add admin/admin.js admin/index.html
          git commit -m "Add safe contract deletion to admin portal"
          git push
