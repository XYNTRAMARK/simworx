name: Inspect tracker click API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tracker-click-api.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Print focused tracker snippets
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45);f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          for name in ['simworx-intelligence-tracker-v1.js','simworx-intelligence-tracker-v2.js']:
            out=[];f.retrbinary('RETR /htdocs/assets/js/'+name,out.append);s=b''.join(out).decode('utf-8','replace')
            print('\n###',name)
            for term in ["cta_clicked","addEventListener('click'","trackEvent:","window.SimworxIntelligence =","pageId = uuid"]:
              for m in list(re.finditer(re.escape(term),s,re.I))[:5]:
                print('\nTERM',term,'\n',s[max(0,m.start()-2200):m.start()+6500])
          f.quit()
          PY
