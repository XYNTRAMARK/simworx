name: Reproduce exact Projection client failure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repro-projection-client-failure.yml'
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Trace exact client exception before fetch
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-unsafe-swiftshader'])
              p=b.new_page(viewport={'width':1600,'height':1000})
              p.add_init_script("""
                window.turnstile={
                  render:(el,opts)=>{
                    const input=document.createElement('input');
                    input.type='hidden';input.name='cf-turnstile-response';input.value='test-token';
                    el.appendChild(input);setTimeout(()=>opts.callback?.('test-token'),0);return 77;
                  },
                  getResponse:id=>id===77?'test-token':'',
                  reset:()=>{}
                };
              """)
              errors=[];console=[]
              p.on('pageerror',lambda e: errors.append(str(e)))
              p.on('console',lambda m: console.append(m.type+': '+m.text) if m.type in ['error','warning'] else None)
              p.goto('https://www.sim-worx.com/projection-screen-configurator.html?repro-client=1',wait_until='domcontentloaded',timeout=60000)
              p.wait_for_timeout(1800)
              p.locator('[data-guided-go="2"]').click();p.wait_for_timeout(450)
              p.locator('[data-guided-go="3"]').click();p.wait_for_timeout(600)
              calc=p.locator('#guided-calculate');calc.click()
              for _ in range(300):
                  if p.locator('#guided-result').is_visible() and not calc.is_disabled(): break
                  p.wait_for_timeout(100)
              p.wait_for_timeout(700)
              p.locator('[data-guided-go="4"]').click();p.wait_for_timeout(1200)
              if p.locator('#v39-country').count():p.locator('#v39-country').select_option('GB')
              if p.locator('#v37-customer-type').count():p.locator('#v37-customer-type').select_option('business')
              p.wait_for_timeout(250)
              p.locator('#v37-email-proposal').click();p.wait_for_timeout(250)
              p.locator('#v37-email-address').fill('mark@sim-worx.com')
              p.locator('#v37-email-name').fill('Mark')

              p.evaluate("""() => {
                window.__fetchTrace=[];
                window.__fetchFailure='';
                const native=window.fetch.bind(window);
                window.fetch=async(...args)=>{
                  window.__fetchTrace.push({url:String(args[0]),method:args[1]?.method||'GET'});
                  try{return await native(...args)}
                  catch(e){window.__fetchFailure=String(e?.stack||e);throw e}
                };
                window.addEventListener('unhandledrejection',e=>window.__unhandled=String(e.reason?.stack||e.reason||''));
                window.addEventListener('error',e=>window.__windowError=String(e.error?.stack||e.message||''));
              }""")
              p.locator('#v37-email-send').click();p.wait_for_timeout(2500)
              state=p.evaluate("""() => ({
                emailStatus:document.getElementById('v37-email-status')?.textContent||'',
                fetchTrace:window.__fetchTrace||[],
                fetchFailure:window.__fetchFailure||'',
                unhandled:window.__unhandled||'',
                windowError:window.__windowError||'',
                action:document.getElementById('v48-email-form')?.action||'',
                token:document.querySelector('#v48-email-form [name="cf-turnstile-response"]')?.value||'',
                scriptRan:window.__v37ProposalScriptRan||''
              })""")
              print('STATE',state)
              print('PAGEERRORS',errors)
              print('CONSOLE',console[-30:])
              b.close()
          PY
