<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex,nofollow"><title>Simworx Portal Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
:root{--gold:#f2a900;--dark:#10161b;--ink:#20262c;--muted:#707983;--line:#dfe4e8;--bg:#f4f6f8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#18232d,#07090b)}.login-card{width:min(430px,92vw);background:#fff;padding:38px;border-radius:12px}.brand{font-size:28px;font-weight:900;letter-spacing:2px}.brand b{color:var(--gold)}.sub{font-size:12px;color:var(--muted);line-height:1.6}.pin{font-size:28px;letter-spacing:12px;text-align:center}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6dc;border-radius:6px;background:#fff}textarea{min-height:100px}.btn{border:0;border-radius:6px;padding:11px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--gold);color:#111}.dark{background:var(--dark);color:#fff}.ghost{background:#eef1f3}.danger{background:#ffeaea;color:#922}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--dark);color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0;width:260px;overflow:auto}.side .brand{margin:0 10px 30px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d6dce1;border:0;padding:12px;border-radius:6px;margin:3px 0}.nav button.active,.nav button:hover{background:#27313a}.main{grid-column:2}.top{height:72px;background:#0c1115;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.content{padding:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.card strong.big{font-size:28px;display:block;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:14px}.row{display:flex;gap:8px;align-items:center}.stack{display:grid;gap:9px}.stack label{display:grid;gap:6px;font-size:12px;font-weight:700}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.tag{font-size:10px;padding:4px 7px;border-radius:20px;background:#edf1f4}.gold{background:#fff3d4;color:#855a00}.chat{display:grid;gap:8px}.bubble{padding:10px;border-radius:8px;background:#eef1f3;font-size:12px}.bubble.staff{background:#fff5db}.muted{color:var(--muted);font-size:12px}.notice{background:#fff8e8;border:1px solid #eed18c;border-radius:7px;padding:12px;margin-top:12px;font-size:12px}.upload-box{border:1px dashed #b8c0c7;border-radius:7px;padding:14px;background:#fafbfc;cursor:pointer}.upload-box input{margin-top:8px;background:#fff}.attachment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}.media-card,.file-card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff;color:#20262c;text-decoration:none;min-width:0}.media-card img,.media-card video{width:100%;height:150px;object-fit:cover;border-radius:5px;background:#111}.media-card span,.file-card span,.file-card strong{font-size:11px;overflow-wrap:anywhere}.file-card small{color:var(--muted)}.check-list{display:grid;gap:7px;border:1px solid var(--line);border-radius:6px;padding:10px;background:#fafbfc}.check-list label{display:flex;gap:8px;align-items:center;font-weight:400}.check-list input{width:auto}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:11px 14px;border-radius:7px;display:none;z-index:100}.toast.show{display:block}
@media(max-width:900px){.app{display:block}.side{position:static;width:auto}.main{grid-column:auto}.cards,.grid{grid-template-columns:1fr}.top{height:auto;padding:14px}.content{padding:14px}.table{min-width:760px}.panel{overflow-x:auto}}
</style></head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand">SIMWOR<b>X</b></div><h1>Staff portal</h1><p class="sub">Enter the Simworx admin PIN.</p><form id="pin-form" class="stack"><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required autofocus><button class="btn primary">CONTINUE</button></form><p id="pin-msg" class="sub"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">SIMWOR<b>X</b></div><div class="nav" id="nav">
<button data-view="dashboard" class="active">Dashboard</button><button data-view="tickets">Support Requests</button><button data-view="customers">Customers & Access</button><button data-view="contracts">Support Contracts</button><button data-view="builds">Build Updates</button></div><button id="signout" class="btn ghost" style="width:100%;margin-top:26px">Lock portal</button></aside>
<main class="main"><header class="top"><div><strong>Customer Support & Build Portal</strong><div style="font-size:10px;color:#bbc3c9">SIMWORX STAFF ADMINISTRATION</div></div><div style="font-size:12px">PIN-protected admin · build 2026.10.09.2</div></header><section id="content" class="content"></section></main></div>
<div id="toast" class="toast"></div><script src="./admin.js?v=20261009-0858"></script>
</body></html>
