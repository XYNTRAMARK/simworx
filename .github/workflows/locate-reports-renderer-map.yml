name: Locate reports renderer map
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/locate-reports-renderer-map.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read renderer-map vicinity
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45);f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          out=[];f.retrbinary('RETR /htdocs/reports/app.js',out.append);f.quit();s=b''.join(out).decode('utf-8','replace')
          for pat in ['const renderers','let renderers','renderers =','renderers=']:
            i=s.find(pat);print('PAT',pat,'AT',i)
            if i>=0:print(s[max(0,i-2500):i+5000])
          PY
