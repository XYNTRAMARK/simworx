name: Inspect live PDF capabilities
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-pdf-capabilities.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing server PDF libraries read-only
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          hits=[]
          stack=[('/htdocs',0)]
          while stack:
              folder,depth=stack.pop()
              if depth>3: continue
              try:
                  for name,facts in f.mlsd(folder):
                      typ=facts.get('type')
                      path=folder+'/'+name
                      low=name.lower()
                      if any(x in low for x in ['dompdf','tcpdf','fpdf','mpdf','wkhtml','composer']):
                          hits.append((path,typ))
                      if typ=='dir' and not name.startswith('.') and name not in ['node_modules']:
                          stack.append((path,depth+1))
              except Exception:
                  pass
          print('PDF_HITS',hits[:200])
          f.quit()
          PY
