name: Publish projection configurator V40
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v40.yml'
      - '.projection-v40-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v40
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V40 from published V39
        run: python3 .projection-v40-deploy/build_v40.py
      - name: Run V40 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v40-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v40-deploy/test_v40.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v40-proof
          path: /tmp/v40-proof.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Publish immutable V40
        run: python3 .projection-v40-deploy/publish_v40.py
