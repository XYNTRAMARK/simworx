name: Inspect configurator page shells
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-configurator-shells.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare LED and Projection page shells
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          for name,url in [
            ('LED','https://www.sim-worx.com/led-screen-configurator.html'),
            ('PROJ','https://www.sim-worx.com/projection-screen-configurator-v42.html')
          ]:
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Simworx-shell-inspector'})
            with urllib.request.urlopen(req,timeout=45) as r:s=r.read().decode('utf-8','replace')
            print('\n###',name)
            for kind,pat in [
              ('HEADER',r'(<header\b[^>]*class=["\'][^"\']*global-header[^"\']*["\'][\s\S]*?</header>)'),
              ('FOOTER',r'(<footer\b[^>]*(?:id=["\']sw-global-footer["\']|class=["\'][^"\']*sw-global-footer[^"\']*["\'])[^>]*>[\s\S]*?</footer>)')
            ]:
              m=re.search(pat,s,re.I)
              if not m: print(kind,'NONE'); continue
              x=m.group(1)
              x=re.sub(r'src=["\']data:image/[^"\']+["\']','src="[INLINE-LOGO]"',x,flags=re.I)
              print(kind,x)
            css=re.findall(r'<link[^>]+href=["\']([^"\']*global-header\.css[^"\']*)["\'][^>]*>',s,re.I)
            js=re.findall(r'<script[^>]+src=["\']([^"\']*global-header\.js[^"\']*)["\'][^>]*></script>',s,re.I)
            print('CSS',json.dumps(css));print('JS',json.dumps(js))
          PY
