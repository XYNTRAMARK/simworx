name: Read LED spacing rules
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-led-spacing.yml'
      - '.navigation-deploy/compact_led_pitch.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Compact live LED Pixel pitch selector
        run: python3 .navigation-deploy/compact_led_pitch.py
