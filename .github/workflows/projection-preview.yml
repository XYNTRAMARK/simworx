name: Publish projection configurator preview

on:
  push:
    branches: [main]
    paths:
      - 'projection-screen-configurator-preview.html'
      - '.projection-deploy/**'
      - '.github/workflows/projection-preview.yml'

permissions:
  contents: read

concurrency:
  # Share the site's publication queue so a navigation backup cannot overlap.
  group: simworx-navigation-production
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Add the separate projection preview only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate the reviewed preview payload
        run: python3 .projection-deploy/publish.py validate
      - name: Verify create-only publication and cleanup rules
        run: python3 .projection-deploy/test_publish.py
      - name: Upload the new preview and verify existing pages unchanged
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .projection-deploy/publish.py publish
