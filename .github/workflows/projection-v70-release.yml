name: Release projector configurator V70 intro text
on:
  push:
    branches: [main]
    paths:
      - '.projection-v70-deploy/**'
      - '.github/workflows/projection-v70-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v70
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V70 strictly from live V69
        run: python3 .projection-v70-deploy/build_v70.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify intro text only
        run: |
          python3 -m http.server 8765 >/tmp/v70-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v70-deploy/test_v70_text.py
          kill $P || true
      - name: Publish V70 and promote stable page
        run: python3 .projection-v70-deploy/publish_v70.py
