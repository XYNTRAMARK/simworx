tock receipt',detail:'30 × SW-AL-100',at:'2026-11-10T09:42:00Z'},\n    {id:'log3',actor:'Sim-Worx Admin',action:'Approval request',detail:'Cockpit panel layout — Rev C',at:'2026-11-10T14:02:00Z'}\n  ],\n  settings:{theme:'light'}\n});\n","model":"/* Sim-Worx Project Hub. Pure domain functions for the local demonstration.\n   This is not a security boundary: production requires server-side permission checks and RLS. */\nexport const uid = (prefix = 'id') => `${prefix}-${Math.random().toString(36).slice(2, 10)}`;\nexport const today = () => new Date().toISOString().slice(0, 10);\nexport const money = n => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Number(n || 0));\nexport const number = n => new Intl.NumberFormat('en-GB').format(Number(n || 0));\nexport const escapeHtml = value => String(value ?? '').replace(/[&\u003c>\"']/g, char => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[char]));\nexport const taskProgress = (projectId, tasks) => {\n  const list = tasks.filter(t => t.projectId === projectId && !t.archivedAt && t.status !== 'Cancelled' && !tasks.some(child => !child.archivedAt && child.parentId === t.id));\n  return list.length ? Math.round(list.reduce((sum,t)=>sum + (t.status === 'Done' ? 100 : t.status === 'Inspection' ? 80 : t.status === 'In progress' ? 45 : 0),0)/list.length) : 0;\n};\nexport const availableStock = part => Number(part.onHand) - Number(part.reserved);\nexport const lineOutstanding = line => Math.max(0, Number(line.quantity)-Number(line.received||0));\nexport function stockMove(state, {partId, quantity, type, actor = 'Sim-Worx Admin', projectId = null}) {\n  const part = state.parts.find(p=>p.id===partId);\n  if (!part) throw Error('Part not found');\n  const q = Number(quantity);\n  if (!Number.isFinite(q) || q \u003c= 0 || !Number.isInteger(q)) throw Error('Quantity must be a positive whole number');\n  if (!['receipt','issue','adjust-in','adjust-out'].includes(type)) throw Error('Invalid movement');\n  if (['issue','adjust-out'].includes(type) && availableStock(part)\u003cq) throw Error('Insufficient available stock');\n  if (type==='issue' || type==='adjust-out') part.onHand-=q;\n  else part.onHand+=q;\n  state.movements.unshift({id:uid('mv'),partId,quantity:q,type,actor,projectId,date:new Date().toISOString()});\n  state.audit.unshift({id:uid('audit'),actor,action:`Stock ${type}`,detail:`${q} × ${part.code}`,at:new Date().toISOString()});\n  return part;\n}\nexport function receiveOrder(state, orderId, actor='Sim-Worx Admin') {\n  const order=state.orders.find(o=>o.id===orderId);\n  if(!order)throw Error('Purchase order not found');\n  const quantities=order.items.map(i=>lineOutstanding(i));\n  if(!quantities.some(q=>q>0))throw Error('This order is already fully received');\n  // Validate every line before mutating anything.\n  order.items.forEach(i=>{if(!state.parts.some(p=>p.id===i.partId)) throw Error('Order has an unknown part')});\n  order.items.forEach((i,idx)=>{\n    if(quantities[idx]>0){stockMove(state,{partId:i.partId,quantity:quantities[idx],type:'receipt',actor,projectId:order.projectId});i.received=Number(i.quantity)}\n  });\n  order.status='Received';\n  state.audit.unshift({id:uid('audit'),actor,action:'Purchase order received',detail:order.code,at:new Date().toISOString()});\n}\nexport function publishUpdate(state, updateId, actor='Sim-Worx Admin') {\n  const u=state.updates.find(u=>u.id===updateId);\n  if(!u)throw Error('Update not found');\n  if(u.status==='published')throw Error('Already published');\n  u.status='published';u.publishedAt=new Date().toISOString();u.publishedBy=actor;\n  state.audit.unshift({id:uid('audit'),actor,action:'Customer publication',detail:u.title,at:u.publishedAt});\n  state.notifications.unshift({id:uid('note'),text:`${u.title} has been published to the customer portal.`,date:today(),read:false});\n}\nexport function decideApproval(state, approvalId, decision, actor='Client Approver'){\n  const a=state.approvals.find(a=>a.id===approvalId);\n  if(!a || a.status!=='Pending')throw Error('Approval is not pending');\n  if(!['Approved','Changes requested','Rejected'].includes(decision))throw Error('Invalid decision');\n  a.status=decision;a.decisionBy=actor;a.decidedAt=new Date().toISOString();\n  state.audit.unshift({id:uid('audit'),actor,action:'Customer decision',detail:`${a.title} (${a.revision}): ${decision}`,at:a.decidedAt});\n}\nexport function clientProjection(state, orgId, projectId, memberId=null){\n  const organization=state.organizations.find(o=>o.id===orgId && !o.archivedAt);\n  if(!organization)return null;\n  const accessibleProjects=state.projects.filter(p=>!p.archivedAt && p.orgId===orgId && (!memberId || state.members.some(m=>!m.archivedAt&&m.id===memberId&&m.orgId===orgId&&m.projects.includes(p.id))));\n  const project=accessibleProjects.find(p=>p.id===projectId)||accessibleProjects[0];\n  if(!project)return {organization,projects:accessibleProjects,project:null,updates:[],approvals:[],documents:[],messages:[],members:[]};\n  // Explicit allowlist: no internal cost, task, supplier, PO or stock fields escape this function.\n  return {\n    organization:{id:organization.id,name:organization.name,accent:organization.accent,logo:organization.logo},\n    projects:accessibleProjects.map(p=>({id:p.id,name:p.name,code:p.code})),\n    project:{id:project.id,name:project.name,code:project.code,description:project.publicDescription||project.description,delivery:project.due,publishedProgress:project.publishedProgress,phase:project.phase},\n    updates:state.updates.filter(u=>!u.archivedAt&&u.projectId===project.id&&u.status==='published').map(u=>({id:u.id,title:u.title,description:u.description,kind:u.kind,part:u.part,status:u.status,publishedAt:u.publishedAt||u.date})),\n    approvals:state.approvals.filter(a=>!a.archivedAt&&a.projectId===project.id&&a.shared).map(a=>({id:a.id,title:a.title,kind:a.kind,revision:a.revision,status:a.status,due:a.due,requested:a.requested})),\n    documents:state.documents.filter(d=>!d.archivedAt&&d.projectId===project.id&&d.visibility==='customer').map(d=>({id:d.id,title:d.title,rev:d.rev,type:d.type,date:d.date})),\n    messages:state.messages.filter(m=>!m.archivedAt&&m.projectId===project.id&&m.visibility==='customer').map(m=>({id:m.id,author:m.author,text:m.text,at:m.at})),\n    members:state.members.filter(m=>!m.archivedAt&&m.orgId===orgId && m.projects.includes(project.id)).map(m=>({id:m.id,name:m.name,role:m.role,email:m.email}))\n  };\n}\nexport function clientInvite(state,{orgId,name,email,role,projectIds},actor='Client Admin'){\n  if(!name?.trim()||!email?.includes('@'))throw Error('Enter a valid name and email');\n  if(!['Client Viewer','Client Engineer','Client Approver','Client Lead'].includes(role))throw Error('Role outside delegation ceiling');\n  if(!projectIds?.length || !projectIds.every(p=>state.projects.some(x=>x.id===p&&x.orgId===orgId)))throw Error('Project outside customer organisation');\n  if(state.members.some(m=>m.email.toLowerCase()===email.toLowerCase()))throw Error('Email already exists in this demo');\n  state.members.push({id:uid('mem'),orgId,name:name.trim(),email:email.trim(),role,projects:projectIds,status:'Demo invite'});\n  state.audit.unshift({id:uid('audit'),actor,action:'Client invitation drafted',detail:`${email} / ${role} / ${projectIds.join(',')}`,at:new Date().toISOString()});\n}\n\n// V0.2 local-domain integrity rules. Production must enforce these server-side.\nexport const activeRecords = list => list.filter(item => !item.archivedAt);\nconst requireText = (value,label) => {\n  const text=String(value ?? '').trim();\n  if(!text)throw Error(`${label} is required`);\n  return text;\n};\nconst requireAmount = (value,label) => {\n  const n=Number(value);\n  if(!Number.isFinite(n)||n\u003c0)throw Error(`${label} must be zero or greater`);\n  return n;\n};\nconst logChange = (state,action,detail) => {\n  state.audit.unshift({id:uid('audit'),actor:'Sim-Worx Admin',action,detail,at:new Date().toISOString()});\n};\nexport function saveOrganization(state,{id,name,code,contact,accent}){\n  const n=requireText(name,'Customer name'),c=requireText(code,'Customer code').toUpperCase();\n  if(state.organizations.some(o=>o.id!==id && o.code.toUpperCase()===c))throw Error('Customer code already exists');\n  const color=/^#[0-9a-f]{6}$/i.test(accent)?accent:'#5369c4';\n  if(id){const o=state.organizations.find(o=>o.id===id && !o.archivedAt);if(!o)throw Error('Customer unavailable');\n    Object.assign(o,{name:n,code:c,contact:String(contact||''),accent:color,logo:n[0]?.toUpperCase()||'?'});logChange(state,'Customer updated',n);return o;}\n  const org={id:uid('org'),name:n,code:c,contact:String(contact||''),accent:color,logo:n[0].toUpperCase()};\n  state.organizations.push(org);logChange(state,'Customer created',n);return org;\n}\nexport function saveProject(state,{id,orgId,name,template,status,phase,due,budget,contract,lead,description}){\n  const org=state.organizations.find(o=>o.id===orgId&&!o.archivedAt);\n  if(!org)throw Error('Choose an active customer');\n  const n=requireText(name,'Project name');const b=requireAmount(budget,'Budget'),c=requireAmount(contract,'Contract value');\n  if(id){const p=state.projects.find(p=>p.id===id&&!p.archivedAt);if(!p)throw Error('Project unavailable');\n    if(p.orgId!==orgId)throw Error('Moving a project to a different customer is not permitted');\n    Object.assign(p,{name:n,status:status||p.status,phase:phase||p.phase,due:String(due||''),budget:b,contract:c,lead:String(lead||''),description:String(description||'')});\n    logChange(state,'Project updated',p.code);return p;}\n  const code=`SW-${String(new Date().getFullYear()).slice(-2)}${String(Math.max(0,...state.projects.map(x=>Number(String(x.code).match(/\\d{3}$/)?.[0]||0)))+1).padStart(3,'0')}`;\n  const p={id:uid('p'),orgId,name:n,code,template:template||'Bespoke Simulator',status:'Des p){const org=projectOrg(p);const mfgAlerts=projectManufacturingAlerts(data,p.id);const mfgBanner=mfgAlerts.length?`\u003cdiv class=\"plan-warning\">\u003cb>Manufacturing attention:\u003c/b> ${mfgAlerts.length} linked job(s) have drawing or material warnings. \u003cbutton type=\"button\" class=\"btn small\" data-action=\"project-tab\" data-id=\"assembly\">Open assembly control\u003c/button>\u003c/div>`:'';const nav=['structure','register','schedule','bom','assembly','materials','documents','publishing'];const labels=['Work breakdown','Work register','Gantt plan','Bill of materials','Assembly control','Material readiness','Documents','Client publishing'];const contents={structure:projectStructure(p),register:projectRegister(p),schedule:projectSchedule(p),bom:projectBom(p),assembly:ui.projectTab==='assembly'?renderManufacturing(data,ui,p.id):'',materials:projectMaterials(p),documents:projectDocuments(p),publishing:projectPublishing(p)};\n return `\u003cdiv id=\"project-detail\" class=\"project-hero\">\u003cdiv class=\"project-hero-art\">${glyph(p.template)}\u003c/div>\u003cdiv class=\"project-meta\">\u003cdiv class=\"eyebrow\">${e(p.code)} · ${e(org?.name||\"Customer\")}\u003c/div>\u003cdiv class=\"project-hero-title\">\u003ch2>${e(p.name)}\u003c/h2>${button('Edit project','edit-project','small',`data-id=\"${p.id}\"`)}\u003c/div>\u003cp>${e(p.description)}\u003c/p>\u003cdiv class=\"meta-row\">\u003cdiv>Project lead\u003cstrong>${e(p.lead)}\u003c/strong>\u003c/div>\u003cdiv>Current phase\u003cstrong>${e(p.phase)}\u003c/strong>\u003c/div>\u003cdiv>Target delivery\u003cstrong>${day(p.due)}\u003c/strong>\u003c/div>\u003cdiv>Internal progress\u003cstrong>${taskProgress(p.id,data.tasks)}%\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003c/div>${mfgBanner}\u003cdiv class=\"card\">\u003cdiv class=\"tabs\">${nav.map((n,i)=>`\u003cbutton data-action=\"project-tab\" data-id=\"${n}\" class=\"${ui.projectTab===n?'active':''}\">${labels[i]}\u003c/button>`).join('')}\u003c/div>${contents[ui.projectTab]||contents.structure}\u003c/div>`;\n}\nfunction projectStructure(p){\n const sections=active(data.sections).filter(s=>s.projectId===p.id);\n const roots=sectionId=>active(data.tasks).filter(t=>t.sectionId===sectionId&&!t.parentId);\n const renderTree=(t,depth=0,visited=new Set())=>{\n   if(visited.has(t.id)||depth>12)return '';\n   const next=new Set([...visited,t.id]);const children=active(data.tasks).filter(x=>x.parentId===t.id);\n   const dependency=t.blockedBy?data.tasks.find(x=>x.id===t.blockedBy):null;\n   return `\u003cdiv class=\"wbs-tree-node\" style=\"--depth:${Math.min(depth,8)}\">\u003cdiv class=\"task-item\">\u003cbutton class=\"task-bullet ${t.status==='Done'?'done':''}\" data-action=\"toggle-task\" data-id=\"${t.id}\" title=\"Toggle completion\">${t.status==='Done'?ico('check',12):''}\u003c/button>\u003cdiv class=\"details\">\u003cstrong>${e(t.title)}\u003c/strong>\u003csmall>${e(t.assignee)} · Due ${day(t.due)}${dependency?` · After: ${e(dependency.title)}`:''}\u003c/small>\u003c/div>\u003cspan class=\"tag ${e(t.department.toLowerCase())}\">${e(t.department)}\u003c/span>${badge(t.status)}\u003cdiv class=\"row-actions\">${button('Edit','edit-task','small',`data-id=\"${t.id}\"`)}${button('Sub-job','add-subtask','small',`data-id=\"${t.id}\"`)}${button(ico('close',13),'archive-record','small danger',`data-kind=\"tasks\" data-id=\"${t.id}\" title=\"Archive job\" aria-label=\"Archive ${e(t.title)}\"`)}\u003c/div>\u003c/div>${children.map(c=>renderTree(c,depth+1,next)).join('')}\u003c/div>`;\n };\n return `\u003cdiv class=\"toolbar\">\u003cdiv class=\"subtle\">WBS · Project → Sections → Jobs → Sub-jobs\u003c/div>\u003cdiv class=\"spacer\">\u003c/div>${button('Export WBS CSV','export-wbs','small',`data-id=\"${p.id}\"`)}${button(`${ico('plus')} Section`,'add-section','small',`data-project=\"${p.id}\"`)}${button(`${ico('plus')} Job`,'open-task-modal','small primary',`data-project=\"${p.id}\"`)}\u003c/div>\u003cdiv class=\"hierarchy\">${sections.map((sec,i)=>{const tasks=active(data.tasks).filter(t=>t.sectionId===sec.id);const done=tasks.length?Math.round(tasks.filter(t=>t.status==='Done').length/tasks.length*100):0;return `\u003cdiv class=\"hierarchy-section\">\u003cdiv class=\"hierarchy-section-title\">\u003cdiv class=\"wbs-section-label\">${ico('projects')}\u003cspan class=\"wbs-code\">${i+1}.0\u003c/span>${e(sec.name)} \u003cspan class=\"subtle\">${tasks.length} jobs\u003c/span>\u003c/div>\u003cdiv class=\"row-actions\">${meter(done)}\u003cspan>${done}%\u003c/span>${button('Edit','edit-section','small',`data-id=\"${sec.id}\"`)}${button(ico('close',13),'archive-record','small danger',`data-kind=\"sections\" data-id=\"${sec.id}\" title=\"Archive section\" aria-label=\"Archive ${e(sec.name)}\"`)}\u003c/div>\u003c/div>\u003cdiv class=\"hierarchy-tasks\">${tasks.length?roots(sec.id).map(t=>renderTree(t)).join(''):'\u003cdiv class=\"subtle\" style=\"padding:12px\">No jobs in this section yet.\u003c/div>'}\u003c/div>\u003c/div>`}).join('')||'\u003cdiv class=\"empty\">Add a section to begin the project work breakdown.\u003c/div>'}\u003c/div>`;\n}\n\n// V0.3 planning views use the *same internal jobs* as the workshop board.\nconst DAY=86400000;\nconst asUtc = date => Date.parse(`${date}T12:00:00Z`);\nconst shiftDate = (date,offset) => new Date(asUtc(date)+offset*DAY).toISOString().slice(0,10);\nfunction flattenedProjectJobs(p){\n const jobs=active(data.tasks).filter(t=>t.projectId===p.id),sections=active(data.sections).filter(s=>s.projectId===p.id);\n const output=[];\n const traverse=(t,code,depth,seen=new Set())=>{if(seen.has(t.id)||depth>12)return;output.push({task:t,code,depth});const next=new Set([...seen,t.id]);jobs.filter(child=>child.parentId===t.id).forEach((child,i)=>traverse(child,`${code}.${i+1}`,depth+1,next));};\n sections.forEach((sec,i)=>{output.push({section:sec,code:`${i+1}.0`,depth:0});jobs.filter(t=>t.sectionId===sec.id&&(!t.parentId||!jobs.some(x=>x.id===t.parentId))).forEach((t,k)=>traverse(t,`${i+1}.${k+1}`,0));});\n return output;\n}\nfunction projectRegister(p){\n const rows=flattenedProjectJobs(p);\n const statusOptions=['Backlog','Ready','In progress','Blocked','Inspection','Done','Cancelled'];\n const departments=['Office','Workshop','Purchasing','Quality'];\n const selector=(task,field,values)=>`\u003cselect class=\"sheet-control\" data-inline-task=\"${e(task.id)}\" data-field=\"${field}\" aria-label=\"${field} for ${e(task.title)}\">${values.map(v=>`\u003coption value=\"${e(v)}\" ${task[field]===v?'selected':''}>${e(v)}\u003c/option>`).join('')}\u003c/select>`;\n return `\u003cdiv class=\"planning-intro\">\u003cdiv>\u003cstrong>Engineering work register\u003c/strong>\u003cp>Edit cells directly, or open any job for predecessor and hierarchy settings. Changes remain in this browser demo.\u003c/p>\u003c/div>\u003cdiv class=\"row-actions\">${button('Export WBS CSV','export-wbs','small',`data-id=\"${p.id}\"`)}${button(`${ico('plus')} New job`,'open-task-modal','small primary',`data-project=\"${p.id}\"`)}\u003c/div>\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"work-sheet\">\u003cthead>\u003ctr>\u003cth>WBS\u003c/th>\u003cth style=\"min-width:240px\">Job / Work package\u003c/th>\u003cth>Owner\u003c/th>\u003cth>Department\u003c/th>\u003cth>Start\u003c/th>\u003cth>Finish\u003c/th>\u003cth>Status\u003c/th>\u003cth>Priority\u003c/th>\u003cth>Dependencies\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(row=>{\n if(row.section)return `\u003ctr class=\"sheet-section\">\u003ctd class=\"mono\">${e(row.code)}\u003c/td>\u003ctd colspan=\"9\">${ico('projects',13)} ${e(row.section.name)}\u003c/td>\u003c/tr>`;\n const t=row.task;const predecessors=predecessorIds(t).map(id=>data.tasks.find(x=>x.id===id)?.title||id).join(', ');\n return `\u003ctr>\u003ctd class=\"mono sheet-wbs\">${e(row.code)}\u003c/td>\u003ctd>\u003cdiv class=\"sheet-title\" style=\"padding-left:${row.depth*15}px\">${row.depth?'↳ ':''}\u003cstrong> t=jobs.map(row=>{\n  if(row.section)return `\u003cdiv class=\"gantt-row gantt-section\">\u003cdiv class=\"gantt-label\">${e(row.code)} · ${e(row.section.name)}\u003c/div>\u003cdiv class=\"gantt-grid\">\u003c/div>\u003c/div>`;\n  const t=row.task,start=t.start||'',due=t.due||'',base=p.baseline?.jobs?.[t.id],deps=predecessorIds(t),conflict=summary.conflicts.some(x=>x.jobId===t.id);\n  let bar='';\n  if(start&&due){const left=Math.max(0,xPos(start)),right=Math.min(100,xPos(shiftDate(due,1)));if(right>left)bar=`\u003cdiv class=\"gantt-bar ${t.status==='Done'?'complete':''} ${conflict?'conflict':''}\" title=\"${e(t.title)}: ${day(start)} – ${day(due)}\" style=\"left:${left}%;width:${Math.max(0.5,right-left)}%\">\u003c/div>`;}\n  else if(due){const mark=xPos(due);if(mark>=0&&mark\u003c=100)bar=`\u003cdiv class=\"gantt-marker\" style=\"left:${mark}%\" title=\"Finish ${day(due)} — add a start date\">\u003c/div>`;}\n  let baseline='';if(base?.start&&base?.due){const left=Math.max(0,xPos(base.start)),right=Math.min(100,xPos(shiftDate(base.due,1)));if(right>left)baseline=`\u003cdiv class=\"gantt-baseline\" style=\"left:${left}%;width:${Math.max(0.5,right-left)}%\" title=\"Original baseline ${day(base.start)}–${day(base.due)}\">\u003c/div>`;}\n  return `\u003cdiv class=\"gantt-row\">\u003cdiv class=\"gantt-label gantt-job\" style=\"padding-left:${14+row.depth*17}px\">\u003cspan class=\"mono\">${e(row.code)}\u003c/span>\u003cbutton data-action=\"edit-task\" data-id=\"${e(t.id)}\" title=\"Edit job plan\">${e(t.title)}\u003c/button>\u003csmall>${e(t.department)}${deps.length?` · ${deps.length} predecessor${deps.length>1?'s':''}`:''}\u003c/small>\u003c/div>\u003cdiv class=\"gantt-grid\" data-action=\"edit-task\" data-id=\"${e(t.id)}\" title=\"Edit ${e(t.title)}\">${baseline}${bar}${!start?'\u003cspan class=\"gantt-unscheduled\">Plan start\u003c/span>':''}${todayX>=0&&todayX\u003c=100?`\u003cspan class=\"gantt-today\" style=\"left:${todayX}%\">\u003c/span>`:''}\u003c/div>\u003c/div>`;\n }).join('');\n const alerts=[...summary.conflicts.map(x=>`\u003cdiv class=\"plan-warning\">${ico('clock',15)} \u003cb>Dependency clash\u003c/b> · ${e(x.job)} starts before ${e(x.predecessor)} finishes.\u003c/div>`),...(summary.overdue.length?[`\u003cdiv class=\"plan-warning\">${ico('bell',15)} \u003cb>${summary.overdue.length} past-due jobs\u003c/b> are not marked complete.\u003c/div>`]:[])];\n return `\u003cdiv class=\"planning-intro\">\u003cdiv>\u003cstrong>Baseline & dependency schedule\u003c/strong>\u003cp>Manual planned dates · finish-to-start logic · original baselines remain visible as dotted bars.\u003c/p>\u003c/div>\u003cdiv class=\"row-actions\">${button('◀ 4 weeks','gantt-prev','small')}${button('Today','gantt-today','small')}${button('4 weeks ▶','gantt-next','small')}${summary.unscheduled.length?button('Fill example dates','fill-demo-dates','small',`data-id=\"${p.id}\"`):''}${button('Capture baseline','capture-baseline','small primary',`data-id=\"${p.id}\"`)}\u003c/div>\u003c/div>\u003cdiv class=\"plan-kpis\">\u003cdiv>\u003cstrong>${summary.planned}/${summary.total}\u003c/strong>\u003cspan>Jobs with start and finish\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>${summary.unscheduled.length}\u003c/strong>\u003cspan>Unscheduled jobs\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>${summary.conflicts.length}\u003c/strong>\u003cspan>Dependency clashes\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>${summary.slipped.length}\u003c/strong>\u003cspan>Finish dates past baseline\u003c/span>\u003c/div>\u003c/div>${p.baseline?`\u003cdiv class=\"baseline-note\">${ico('check',14)} Baseline captured ${day(p.baseline.capturedAt)} · dotted bars show original plan. Capture again only when you intentionally rebaseline.\u003c/div>`:''}\u003cdiv class=\"gantt-scroll\">\u003cdiv class=\"gantt-chart\">${header}${content}\u003c/div>\u003c/div>\u003cdiv class=\"gantt-legend\">\u003cspan>\u003ci class=\"gantt-key planned\">\u003c/i> Planned work\u003c/span>\u003cspan>\u003ci class=\"gantt-key baseline\">\u003c/i> Baseline\u003c/span>\u003cspan>\u003ci class=\"gantt-key completion\">\u003c/i> Completed\u003c/span>\u003cspan>\u003ci class=\"gantt-key issue\">\u003c/i> Clash\u003c/span>\u003cspan>◆ finish only\u003c/span>\u003c/div>${alerts.slice(0,8).join('')}\u003cp class=\"planning-foot\">Scheduling conflicts are warnings rather than automatic date changes. Critical-path calculations and resource levelling require a later verified planning engine.\u003c/p>`;\n}\nfunction projectMaterials(p){\n const rows=materialReadiness(data,p.id),gaps=rows.filter(r=>r.estimatedGap>0);const moneyAtRisk=gaps.reduce((sum,r)=>sum+r.estimatedGap*Number(r.part?.cost||0),0);\n return `\u003cdiv class=\"planning-intro\">\u003cdiv>\u003cstrong>Materials readiness\u003c/strong>\u003cp>BOM requirements linked with stock and open purchase orders, without changing live stock allocations.\u003c/p>\u003c/div>\u003cdiv class=\"row-actions\">${button('View purchasing','nav','small',`data-id=\"purchasing\"`)}${button('Edit project BOM','project-tab','small primary',`data-id=\"bom\"`)}\u003c/div>\u003c/div>\u003cdiv class=\"plan-kpis\">\u003cdiv>\u003cstrong>${rows.length}\u003c/strong>\u003cspan>BOM lines\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>${gaps.length}\u003c/strong>\u003cspan>Potential shortfall lines\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>${money(moneyAtRisk)}\u003c/strong>\u003cspan>Estimated uncovered value\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>${rows.reduce((sum,r)=>sum+r.incoming,0)}\u003c/strong>\u003cspan>Items on open POs\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth>Part / assembly\u003c/th>\u003cth>Remaining need\u003c/th>\u003cth>Unreserved stores\u003c/th>\u003cth>On project POs\u003c/th>\u003cth>Uncovered estimate\u003c/th>\u003cth>Suggested action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(r=>{const s=data.sections.find(x=>x.id===r.sectionId)?.name||'Unassigned assembly';return `\u003ctr>\u003ctd>\u003cstrong>${e(r.part?.code||'Unknown')}\u003c/strong>\u003csmall style=\"display:block\">${e(r.part?.name||'Missing part')} · ${e(s)}\u003c/small>\u003c/td>\u003ctd>${number(r.quantityOutstanding)}\u003c/td>\u003ctd>${number(r.freeStock)}\u003c/td>\u003ctd>${number(r.incoming)}\u003c/td>\u003ctd>${badge(String(r.estimatedGap),r.estimatedGap?'red':'green')}\u003c/td>\u003ctd>${r.estimatedGap?'Check sourcing / ordering':'Material forecast covered'}\u003c/td>\u003c/tr>`}).join('')||'\u003ctr>\u003ctd colspan=\"6\">No BOM requirements\u003c/td>\u003c/tr>'}\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"planning-foot\">Forecast only: stores quantities can be shared across projects; this view does not reserve stock, allocate incoming orders or certify availability. Production must use transactional reservations.\u003c/div>`;\n}\n\nfunction taskItem(t){return `\u003cdiv class=\"task-item\">\u003cbutton class=\"task-bullet ${t.status==='Done'?'done':''}\" data-action=\"toggle-task\" data-id=\"${t.id}\" aria-label=\"Toggle task completion\">${t.status==='Done'?ico('check',12):''}\u003c/button>\u003cdiv class=\"details\">\u003cstrong>${e(t.title)}\u003c/strong>\u003csmall>${e(t.assignee)} · Due ${day(t.due)}\u003c/small>\u003c/div>\u003cspan class=\"tag ${e(t.department.toLowerCase())}\">${e(t.department)}\u003c/span>${badge(t.status)}${button('Edit','edit-task','small',`data-id=\"${t.id}\"`)}\u003c/div>`}\n\nfunction projectBom(p){const rows=active(data.bom).filter(b=>b.projectId===p.id);return `\u003cdiv class=\"toolbar\">\u003cspan class=\"subtle\">Project-specific part requirements and stock\u003c/span>\u003cdiv class=\"spacer\">\u003c/div>${button(`${ico('plus')} Add BOM part`,'add-bom','small primary',`data-project=\"${p.id}\"`)}${button('Manage inventory '+ico('external'),'nav','small',`data-id=\"inventory\"`)}\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth> 'edit-document','small',`data-id=\"${d.id}\"`)}${button('Archive','archive-record','small danger',`data-kind=\"documents\" data-id=\"${d.id}\"`)}\u003c/div>\u003c/td>\u003c/tr>`).join('')||'\u003ctr>\u003ctd colspan=\"6\" class=\"subtle\">No documents\u003c/td>\u003c/tr>'}\u003c/tbody>\u003c/table>\u003c/div>`}\nfunction projectPublishing(p){const u=active(data.updates).filter(x=>x.projectId===p.id);return `\u003cdiv class=\"toolbar\">\u003cdiv class=\"subtle\">Never automatically expose internal jobs to customers\u003c/div>\u003cdiv class=\"spacer\">\u003c/div>${button(`${ico('plus')} Draft update`,'open-update-modal','small',`data-project=\"${p.id}\"`)}\u003c/div>\u003cdiv class=\"card-body\" style=\"padding-top:4px\">${u.map(x=>`\u003cdiv class=\"approval-row\">\u003cdiv>\u003cstrong>${e(x.title)}\u003c/strong>\u003csmall>${e(x.kind)} · ${e(x.description)}\u003c/small>\u003c/div>\u003cdiv class=\"row-actions\">${badge(x.status==='published'?'Published':'Draft',x.status==='published'?'green':'purple')}${x.status==='draft'?button('Edit','edit-update','small',`data-id=\"${x.id}\"`):''}${x.status==='draft'?button('Publish','publish','small primary',`data-id=\"${x.id}\"`):''}${x.status==='published'?button('Withdraw','withdraw-update','small danger',`data-id=\"${x.id}\"`):''}${x.status==='draft'?button('Archive','archive-record','small danger',`data-kind=\"updates\" data-id=\"${x.id}\"`):''}\u003c/div>\u003c/div>`).join('')||'\u003cdiv class=\"empty\">No updates yet\u003c/div>'}\u003cp class=\"form-hint\">Publishing here updates only the local demo customer preview. Production requires a separate allowlisted customer representation and verified permissions.\u003c/p>\u003c/div>`}\nfunction tasksPage(){const project=ui.taskProject||'all';const filtered=active(data.tasks).filter(t=>allActiveProjects().some(p=>p.id===t.projectId)&&(ui.dept==='All'||t.department===ui.dept)&&(project==='all'||t.projectId===project));\n  const projectFilter=`\u003cselect class=\"filter-select\" data-filter=\"taskProject\">\u003coption value=\"all\">All projects\u003c/option>${allActiveProjects().map(p=>`\u003coption value=\"${p.id}\" ${project===p.id?'selected':''}>${e(p.code)} — ${e(p.name)}\u003c/option>`).join('')}\u003c/select>`;\n  const deptFilter=`\u003cselect class=\"filter-select\" data-filter=\"dept\">${['All','Office','Workshop','Purchasing','Quality'].map(d=>`\u003coption ${ui.dept===d?'selected':''}>${d}\u003c/option>`).join('')}\u003c/select>`;\n  const headTools=`${button(`${ico('plus')} New job`,'open-task-modal','primary')}`;\n  const cols=[['Backlog','Backlog'],['Ready','Ready'],['In progress','In progress'],['Blocked','Blocked'],['Inspection','Inspection'],['Done','Done']];\n  const board=`\u003cdiv class=\"kanban\">${cols.map(([status,label])=>{const list=filtered.filter(t=>t.status===status);return `\u003cdiv class=\"kanban-col\">\u003cdiv class=\"kanban-head\">\u003cstrong>${label}\u003c/strong>\u003cspan class=\"pill no-dot gray\">${list.length}\u003c/span>\u003c/div>${list.map(t=>`\u003cdiv class=\"task-card\">\u003cdiv class=\"row-actions\" style=\"float:right\">${button(ico('more',14),'edit-task','small',`data-id=\"${t.id}\" title=\"Edit job\" aria-label=\"Edit ${e(t.title)}\"`)}\u003c/div>\u003cstrong>${e(t.title)}\u003c/strong>\u003cp>${e(findProject(t.projectId)?.code)} · ${e(t.assignee)}\u003c/p>\u003cdiv class=\"task-footer\">\u003cspan class=\"tag ${e(t.department.toLowerCase())}\">${e(t.department)}\u003c/span>\u003cselect class=\"filter-select\" style=\"max-width:120px;min-height:29px;padding:5px\" data-task-status=\"${t.id}\" aria-label=\"Change task status\">${cols.map(([val])=>`\u003coption value=\"${val}\" ${t.status===val?'selected':''}>${val}\u003c/option>`).join('')}\u003c/select>\u003c/div>\u003c/div>`).join('')||'\u003cdiv class=\"subtle\" style=\"padding:12px 4px\">No jobs\u003c/div>'}\u003c/div>`}).join('')}\u003c/div>`;\n  const rows=filtered.map(t=>`\u003ctr>\u003ctd>\u003cb>${e(t.title)}\u003c/b>\u003cdiv class=\"subtle\">${e(findProject(t.projectId)?.code)}\u003c/div>\u003c/td>\u003ctd>${e(t.department)}\u003c/td>\u003ctd>${e(t.assignee)}\u003c/td>\u003ctd>${badge(t.status)}\u003c/td>\u003ctd>${day(t.due)}\u003c/td>\u003ctd>\u003cselect data-task-status=\"${t.id}\" class=\"filter-select\" style=\"max-width:150px\">${cols.map(([v])=>`\u003coption value=\"${v}\" ${t.status===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/td>\u003ctd>\u003cdiv class=\"row-actions\">${button('Edit','edit-task','small',`data-id=\"${t.id}\"`)}${button('Archive','archive-record','small danger',`data-kind=\"tasks\" data-id=\"${t.id}\"`)}\u003c/div>\u003c/td>\u003c/tr>`).join('');\n  return head('Workshop & office jobs','Assignable work across engineering, production, purchasing and quality.',headTools)+`\u003cdiv class=\"card\">\u003cdiv class=\"toolbar\">${projectFilter}${deptFilter}\u003cdiv class=\"spacer\">\u003c/div>\u003cdiv class=\"segmented\">${button('Board','task-board',`small ${ui.taskView==='board'?'active':''}`)}${button('List','task-list',`small ${ui.taskView==='list'?'active':''}`)}\u003c/div>\u003c/div>\u003cdiv class=\"card-body\">${ui.taskView==='board'?board:`\u003cdiv class=\"table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth>Job\u003c/th>\u003cth>Department\u003c/th>\u003cth>Assigned\u003c/th>\u003cth>Status\u003c/th>\u003cth>Due\u003c/th>\u003cth>Update\u003c/th>\u003cth>Edit / archive\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows}\u003c/tbody>\u003c/table>\u003c/div>`}\u003c/div>\u003c/div>`;\n}\nfunction purchasingPage(){const orders=active(data.orders),open=orders.filter(o=>o.status!=='Received');const total=orders.reduce((s,o)=>s+o.items.reduce((x,l)=>x+Number(l.quantity)*Number(l.unitCost),0),0);\n  return head('Purchasing','Supplier orders, open commitments and materials due for the workshop.',button(`${ico('plus')} New purchase order`,'open-po-modal','primary'))+`\u003cdiv class=\"kpis\">\u003cdiv class=\"kpi\">\u003cdiv>\u003cdiv class=\"kpi-label\">Purchase orders\u003c/div>\u003cdiv class=\"kpi-value\">${orders.length}\u003c/div>\u003cdiv class=\"kpi-note\">All tracked orders\u003c/div>\u003c/div>\u003cdiv class=\"kpi-icon\">${ico('purchasing')}\u003c/div>\u003c/div>\u003cdiv class=\"kpi\">\u003cdiv>\u003cdiv class=\"kpi-label\">Open orders\u003c/div>\u003cdiv class=\"kpi-value\">${open.length}\u003c/div>\u003cdiv class=\"kpi-note\">Awaiting goods\u003c/div>\u003c/div>\u003cdiv class=\"kpi-icon\">${ico('clock')}\u003c/div>\u003c/div>\u003cdiv class=\"kpi\">\u003cdiv>\u003cdiv class=\"kpi-label\">Order value\u003c/div>\u003cdiv class=\"kpi-value\" style=\"font-size:23px\">${money(total)}\u003c/div>\u003cdiv class=\"kpi-note\">Demonstration purchases\u003c/div>\u003c/div>\u003cdiv class=\"kpi-icon\">${ico('finance')}\u003c/div>\u003c/div>\u003cdiv class=\"kpi\">\u003cdiv>\u003cdiv class=\"kpi-label\">Partially received\u003c/div>\u003cdiv class=\"kpi-value\">${orders.filter(o=>o.status==='Part received').length}\u003c/div>\u003cdiv class=\"kpi-note\">Outstanding balances\u003c/div>\u003c/div>\u003cdiv class=\"kpi-icon\">${ico('inventory')}\u003c/div>\u003c/div>\u003c/div>${card('Purchase order register',`\u003cdiv class=\"table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth>Order\u003c/th>\u003cth>Supplier\u003c/th>\u003cth>Allocated project\u003c/th>\u003cth>Value\u003c/th>\u003cth>Delivery status\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${orders.map(o=>`\u003ctr>\u003ctd>\u003cb>${e(o.code)}\u003c/b>\u003cdiv class=\"subtle\">${day(o.date)}\u003c/div>\u003c/td>\u003ctd>${e(o.supplier)}\u003c/td>\u003ctd>\u003cspan class=\"subtle\">${e(findProject(o.projectId)?.code)}\u003c/span>\u003c/td>\u003ctd>${money(o.items.reduce((x,l)=>x+l.quantity*l.unitCost,0))}\u003c/td>\u003ctd>${badge(o.status)}\u003c/td>\u003ctd>\u003cdiv class=\"row-actions\">${o.status==='Received'?'\u003cspan class=\"subtle\">All received\u003c/span>':button('Rec 'Section','Job','Department','Assigned to','Priority','Status','Planned start','Planned finish','Predecessor jobs'];\n  const rows=[headings];active(data.sections).filter(s=>s.projectId===project.id).forEach((sec,i)=>{\n    rows.push([`${i+1}.0`,sec.name,'','','','','','','','']);\n    const visited=new Set();let index=0;\n    const visit=(task,wbs,depth)=>{if(visited.has(task.id)||depth>12)return;visited.add(task.id);\n      rows.push([wbs,sec.name,task.title,task.department,task.assignee,task.priority,task.status,task.start||'',task.due,predecessorIds(task).map(id=>data.tasks.find(t=>t.id===id)?.title||id).join('; ')]);\n      active(data.tasks).filter(t=>t.parentId===task.id).forEach((child,k)=>visit(child,`${wbs}.${k+1}`,depth+1));\n    };\n    active(data.tasks).filter(t=>t.sectionId===sec.id&&!t.parentId).forEach(t=>visit(t,`${i+1}.${++index}`,0));\n  });\n  const csv=rows.map(row=>row.map(value=>'\"'+String(value??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\\r\\n');\n  const url=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));\n  const a=document.createElement('a');a.href=url;a.download=`${project.code}-WBS.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);\n}\nfunction handleAction(el){const action=el.dataset.action,id=el.dataset.id;\n if(action?.startsWith('mfg-')){try{handleManufacturingAction(data,ui,el,window.confirm);persist();render();toast('Manufacturing demo updated locally');}catch(err){toast(err.message||'Manufacturing action failed',true)}return;}\n try{switch(action){\n  case 'nav':changePage(id);break;\n  case 'project-open':ui.page='projects';ui.project=id;ui.projectTab='structure';render();document.getElementById('project-detail')?.scrollIntoView({behavior:'smooth',block:'start'});break;\n  case 'project-tab':ui.projectTab=id;render();break;\n  case 'client-tab':ui.clientTab=id;render();break;\n  case 'task-board':ui.taskView='board';render();break;\n  case 'task-list':ui.taskView='list';render();break;\n  case 'department-open':ui.dept=id;ui.page='tasks';render();break;\n  case 'open-project-modal':openModal('project');break;\n  case 'edit-project':openModal('project',{id});break;\n  case 'edit-customer':openModal('customer',{id});break;\n  case 'edit-task':openModal('task',{id});break;\n  case 'add-subtask':{const t=data.tasks.find(x=>x.id===id);if(t)openModal('task',{project:t.projectId,parent:t.id,section:t.sectionId});break;}\n  case 'add-section':openModal('section',{project:el.dataset.project||ui.project});break;\n  case 'edit-section':openModal('section',{id});break;\n  case 'add-part':openModal('part');break;\n  case 'edit-part':openModal('part',{id});break;\n  case 'add-bom':openModal('bom',{project:el.dataset.project||ui.project});break;\n  case 'edit-bom':openModal('bom',{id});break;\n  case 'edit-document':openModal('document',{id});break;\n  case 'edit-update':openModal('update',{id});break;\n  case 'open-task-modal':openModal('task',{project:el.dataset.project||ui.project});break;\n  case 'open-customer-modal':openModal('customer');break;\n  case 'open-po-modal':openModal('po');break;\n  case 'stock-modal':openModal('stock',{id});break;\n  case 'invite-modal':openModal('invite',{org:el.dataset.org||ui.clientOrg});break;\n  case 'open-update-modal':openModal('update',{project:el.dataset.project||ui.project});break;\n  case 'open-document-modal':openModal('document',{project:el.dataset.project||ui.project});break;\n  case 'open-client-document-modal':openModal('client-document');break;\n  case 'customer-detail':ui.customerDetail=id;render();break;\n  case 'close-modal':case 'dismiss-modal':closeModal();break;\n  case 'theme':data.settings.theme=data.settings.theme==='light'?'dark':'light';persist();render();break;\n  case 'toggle-task':{const t=data.tasks.find(x=>x.id===id);if(t){setTaskStatus(data,id,t.status==='Done'?'Ready':'Done');persist();render();toast('Job status saved locally')}break;}\n  case 'publish':{if(confirm('Publish this exact draft to the customer preview?')){publishUpdate(data,id);persist();render();toast('Update published to the demo customer portal')}break;}\n  case 'withdraw-update':{const u=data.updates.find(x=>x.id===id);if(u?.status==='published'&&confirm('Withdraw this customer update? It will no longer be visible in the demo portal.')){u.status='withdrawn';audit('Customer publication withdrawn',u.title);persist();render();toast('Publication withdrawn')}break;}\n  case 'archive-record':{const kind=el.dataset.kind,row=data[kind]?.find(x=>x.id===id);if(row&&confirm(`Archive ${row.name||row.title||row.code||id}?\\nThe record stays in history and may be restored in Settings.`)){archiveRecord(data,kind,id);persist();render();toast('Record archived · restore from Settings')}break;}\n  case 'restore-record':{restoreRecord(data,el.dataset.kind,id);persist();render();toast('Record restored');break;}\n  case 'export-wbs':{exportWbs(id);toast('Project work breakdown exported as CSV');break;}\n  case 'gantt-prev':ui.ganttOffset-=1;render();break;\n  case 'gantt-next':ui.ganttOffset+=1;render();break;\n  case 'gantt-today':ui.ganttOffset=0;render();break;\n  case 'fill-demo-dates':{if(!confirm('Generate illustrative seven-day dates for unscheduled jobs that have finish dates? This changes only local fictional demo records; it is not a real project plan.'))break;let changed=0;active(data.tasks).filter(t=>t.projectId===id&&!t.start&&t.due).forEach(t=>{updateTaskPlan(data,t.id,{start:shiftDate(t.due,-7)});changed++;});persist();render();toast(`${changed} illustrative dates added to demo jobs`);break;}\n  case 'capture-baseline':{const project=findProject(id);if(project?.baseline&&!confirm('Replace the existing schedule baseline with the current plan? Original baseline dates will be overwritten in this browser demo.'))break;const baseline=captureBaseline(data,id);persist();render();toast(`Baseline saved for ${Object.keys(baseline.jobs).length} jobs`);break;}\n\n  case 'decide-approval':{decideApproval(data,id,el.dataset.decision);notify(`Client decision: ${el.dataset.decision}`);persist();render();toast(`Decision recorded: ${el.dataset.decision}`);break;}\n  case 'receive-po':{receiveOrder(data,id);persist();render();toast('Outstanding purchase order quantities received into stock');break;}\n  case 'notifications':openModal('notifications');break;\n  case 'mark-read':data.notifications.forEach(x=>x.read=true);persist();closeModal();toast('Notifications marked as read');break;\n  case 'reset-demo':if(confirm('Reset all local demo records and changes? This cannot be undone.')){data=seed();persist();ui.page='overview';ui.project='p1';ui.clientOrg='noah';ui.clientProject='p1';render();toast('Demo reset to original sample data')}break;\n  case 'refresh':render();toast('Dashboard refreshed from local demo records');break;\n  }}catch(err){toast(err.message||'Unable to complete this action',true)}\n}\nfunction formHandler(form){const fd=new FormData(form);const get=n=>String(fd.get(n)||'').trim();const type=form.dataset.form;\n if(type?.startsWith('mfg-')){try{handleManufacturingSubmit(data,ui,form);persist();render();toast('Manufacturing record saved locally');}catch(err){toast(err.message||'Manufacturing form failed',true)}return;}\n try{switch(type){\n  case 'project':{\n    const existing=get('recordId');const record=saveProject(data,{id:existing||null,orgId:get('orgId'),name:get('name'),template:get('template'),status:get('status'),phase:get('phase'),due:get('due'),budget:get('budget'),contract:get('contract'),lead:get('lead'),description:get('description')});\n    if(!existing){const names=record.template==='DA62'?['Cockpit','Visual system','Avionics','Testing & delivery']:record.template==='Motion Upgrade'?['Mechanics','Control systems','Installation & test']:['Cockpit & structure','Control loading','Visual system','Avionics & software','Testing & delivery'];names.forEach(name=>saveSection(data,{projectId:record.id,name,weight:Math.round(100/names.length)}));}\n    ui.project=record.id;ui.page='projects';ui.projectTab='structure';break;\n  }\n  case 'customer':{\n    const org=saveOrganization(data,{id:get('recordId')||null,name:get('name'),code:get('code'),contact:get('contact'),accent:get('accent')});ui.customerDetail=org.id;ui.page='customers';break;\n  }\n  case 'task':{\n    const record=saveTask(data,{id:get('recordId')||null,projectId:get('projectId'),sectionId:get('sectionId'),title:get('title'),department:get('department'),assignee:get('assignee'),priority:get('priority'),status:get('status'),due:get('due'),parentId:get('parentId'),blockedBy:null,predecessors:fd.getAll('predecessors').map(String),start:get('start')});ui.project=record.projectId;ui.page='projects';if(!['register','schedule'].includes(ui.projectTab))ui.projectTab='structure';break;\n  }\n  case 'section':{\n    const record=saveSection(data,{id:get('recordId')||null,projectId:get('projectId'),name:get('name'),weight:get('weight')});ui.project=record.projectId;ui.page='projects';ui.projectTab='structure';break;\n  }\n  case 'part':{\n    savePart(data,{id:get('recordId')||null,code:get('code'),name:get('name'),unit:get('unit'),supplier:get('supplier'),location:get('location'),min:get('min'),cost:get('cost')});ui.page='inventory';break;\n  }\n  case 'bom':{\n    const record=saveBomLine(data,{id:get('recordId')||null,projectId:get('projectId'),partId:get('partId'),required:get('required'),sectionId:get('sectionId')});ui.project=record.projectId;ui.page='projects';ui.projectTab='bom';break;\n  }\n  case 'stock':{stockMove(data,{partId:get('partId'),quantity:get('quantity'),type:get('type')});ui.page='inventory';break;}\n  case 'po':{const part=findPart(get('partId'));if(!part)throw Error('Part not found');const q=Number(get('quantity')),cost=Number(get('unitCost'));if(!Number.isInteger(q)||q\u003c1||!Number.isFinite(cost)||cost\u003c0)throw Error('Check order quantity and unit cost');const code=`PO-${new Date().getFullYear().toString().slice(2)}${String(data.orders.length+120).padStart(4,'0')}`;data.orders.unshift({id:uid('po'),code,projectId:get('projectId'),supplier:get('supplier')||part.supplier,date:today(),status:'Awaiting delivery',items:[{partId:part.id,quantity:q,received:0,unitCost:cost}]});audit('Purchase order created',code);ui.page='purchasing';break;}\n  case 'invite':{clientInvite(data,{orgId:get('orgId'),name:get('name'),email:get('email'),role:get('role'),projectIds:[get('projectId')]});ui.page=ui.page==='client'?'client':'customers';break;}\n  case 'update':{const id=get('recordId');const record=id?data.updates.find(x=>x.id===id):null;if(record){if(record.status!=='draft')throw Error('Only drafts can be edited');Object.assign(record,{title:get('title'),kind:get('kind'),part:get('part'),description:get('description')});audit('Customer draft updated',record.title)}else{data.updates.unshift({id:uid('u'),projectId:get('projectId'),title:get('title'),kind:get('kind'),part:get('part'),description:get('description'),date:today(),status:'draft'});audit('Customer update drafted',get('title'))}ui.page='projects';ui.project=get('projectId');ui.projectTab='publishing';break;}\n  case 'document':case 'client-document':{const record=get('recordId')?data.documents.find(x=>x.id===get('recordId')):null;const visibility=type==='client-document'?'internal':get('visibility');if(record){if(record.rev!==get('rev')&&record.visibility==='customer')record.visibility='internal';Object.assign(record,{title:get('title'),rev:get('rev'),type:get('type'),visibility:record.rev!==get('rev')?'internal':visibility,date:today()});audit('Document metadata updated',record.title)}else{data.documents.unshift({id:uid('d'),projectId:get('projectId'),title:get('title'),rev:get('rev'),type:get('type'),visibility,date:today()});audit(type==='client-document'?'Customer document metadata submitted':'Document registered',get('title'))}break;}\n  case 'message':{const text=get('text');if(!text)throw Error('Enter a message');data.messages.push({id:uid('msg'),projectId:ui.clientProject,author:'Customer demo user',text,visibility:'customer',at:new Date().toISOString()});audit('Customer message drafted',`Message in ${ui.clientProject}`);break;}\n  default:return;\n }ui.modal=null;persist();render();toast(type==='invite'?'Demo invitation recorded — no email sent':type==='client-document'?'Metadata saved for internal review — no file uploaded':'Saved to local demo workspace');\n }catch(err){toast(err.message||'Unable to save form',true)}\n}\ndocument.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el){if(el.dataset.action==='dismiss-modal'&&ev.target!==el)return;handleAction(el)}});\ndocument.addEventListener('submit',ev=>{const form=ev.target.closest('form[data-form]');if(form){ev.preventDefault();formHandler(form)}});\ndocument.addEventListener('change',ev=>{try{const el=ev.target;const filter=el.dataset.filter;\n if(filter==='mfgProject'){ui.project=el.value;ui.mfgAssemblyId=null;ui.mfgEditor=null;render()}\n else if(filter==='dept'){ui.dept=el.value;render()}\n else if(filter==='taskProject'){ui.taskProject=el.value;render()}\n else if(filter==='clientOrg'){ui.clientOrg=el.value;ui.clientProject=activeOrgProjects(el.value)[0]?.id;ui.clientTab='updates';render()}\n else if(filter==='clientProject'){ui.clientProject=el.value;render()}\n else if(filter==='modalProject'){ui.modal.project=el.value;render()}\n else if(el.dataset.inlineTask){const t=data.tasks.find(x=>x.id===el.dataset.inlineTask&&!x.archivedAt);if(!t)throw Error('Job missing');const field=el.dataset.field;if(field==='status')setTaskStatus(data,t.id,el.value);else if(['start','due'].includes(field))updateTaskPlan(data,t.id,{[field]:el.value});else if(['assignee','department','priority'].includes(field))saveTask(data,{...t,[field]:el.value});else throw Error('Field not editable');persist();render();toast('Work register updated locally')}\n else if(el.dataset.taskStatus){setTaskStatus(data,el.dataset.taskStatus,el.value);persist();render();toast('Job status updated')}\n}catch(err){toast(err.message||'Cannot update status',true);render()}});\ndocument.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal)closeModal()});\nrender();"}</script>
<script type="module">
/* Self-contained module loader: exact code from verified GitHub V0.4.0 branch.
   Blob modules allow the existing application to run without any server or CDN.
   No production network requests, credentials or external dependencies. */
try {
 const s=JSON.parse(document.getElementById('projecthub-source').textContent);
 const moduleURL=code=>URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
 const modules={seed:moduleURL(s.seed),model:moduleURL(s.model),manufacturing:moduleURL(s.manufacturing)};
 const withImport=(source,oldPath,newUrl)=>{
  const literal="from './"+oldPath+"'";
  if(!source.includes(literal))throw new Error('Bundled module import missing: '+oldPath);
  return source.replace(literal,"from '"+newUrl+"'");
 };
 const manufacturingUI=withImport(s.ui,'manufacturing.mjs',modules.manufacturing);
 modules.ui=moduleURL(manufacturingUI);
 let app=s.app;
 for(const [name,url] of [['demo-data.mjs',modules.seed],['model.mjs',modules.model],['manufacturing.mjs',modules.manufacturing],['manufacturing-ui.mjs',modules.ui]])
  app=withImport(app,name,url);
 await import(moduleURL(app));
} catch(err) {
 document.getElementById('app').innerHTML='<div style="max-width:680px;margin:40px auto;padding:25px;border:1px solid #eab;border-radius:12px;font:14px system-ui"><h1>Project Hub could not start</h1><p>Download a fresh copy or open the full source build from GitHub. No browser records have been deleted.</p><pre id="launch-error" style="white-space:pre-wrap"></pre></div>';
 document.getElementById('launch-error').textContent=String(err&&err.stack||err);
}
</script>
