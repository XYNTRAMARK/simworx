name: Locate live tracking collectors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/locate-live-tracking-collectors.yml'
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate and inspect event emitters
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,posixpath,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def ls(path):
            try:return list(f.mlsd(path))
            except:return []
          def read(path):
            out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          def walk(path,depth=0):
            if depth>3:return []
            rows=[]
            for n,x in ls(path):
              if x.get('type') in ('cdir','pdir'):continue
              full=posixpath.join(path,n);rows.append((full,x))
              if x.get('type')=='dir' and n not in ['archive','reports','portal','admin']:rows+=walk(full,depth+1)
            return rows
          files=walk('/htdocs')
          markers=['simworx-intelligence','functions/v1/simworx-intelligence','configuration_emailed','configurator_step_viewed','led_configurator_opened','projection_configurator_opened','session_started','page_performance','web_vitals']
          matches=[]
          for path,x in files:
            if x.get('type')!='file':continue
            if not any(path.lower().endswith(e) for e in ['.js','.html','.php']):continue
            try:size=int(x.get('size') or 0)
            except:size=0
            if size>1200000:continue
            try:s=read(path)
            except:continue
            hit=[m for m in markers if m in s]
            if hit:matches.append((path,hit,s))
          print('MATCH_FILES',len(matches))
          for path,hit,s in matches:
            print('\n###FILE',path,'MARKERS',hit,'LEN',len(s))
            for term in hit:
              for m in list(re.finditer(re.escape(term),s,re.I))[:5]:
                print('TERM',term)
                print(s[max(0,m.start()-1300):min(len(s),m.start()+4200)].replace('\n',' ')[:5500])
          f.quit()
          PY
