name: Measure real live projector email payload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measure-live-projector-email.yml'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Build a real configuration and measure the live email payload
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-unsafe-swiftshader'])
              p=b.new_page(viewport={'width':1680,'height':1050})
              p.add_init_script("""
                window.turnstile={
                  render:(el,opts)=>{
                    const input=document.createElement('input');
                    input.type='hidden';input.name='cf-turnstile-response';input.value='measure-token';
                    el.appendChild(input);setTimeout(()=>opts.callback?.('measure-token'),0);return 88;
                  },
                  getResponse:id=>id===88?'measure-token':'',
                  reset:()=>{}
                };
              """)
              p.goto('https://www.sim-worx.com/projection-screen-configurator.html?measure-email=1',wait_until='domcontentloaded',timeout=60000)
              p.wait_for_timeout(2500)

              # Use the real workflow and renderer.
              p.locator('[data-guided-go="2"]').click();p.wait_for_timeout(600)
              if p.locator('#led-showSimulator').count() and not p.locator('#led-showSimulator').is_checked():
                  p.locator('#led-showSimulator').check();p.wait_for_timeout(300)
              p.locator('[data-guided-go="3"]').click();p.wait_for_timeout(700)
              calc=p.locator('#guided-calculate')
              calc.click()
              for _ in range(350):
                  if p.locator('#guided-result').is_visible() and not calc.is_disabled():break
                  p.wait_for_timeout(100)
              p.wait_for_timeout(800)
              p.locator('[data-guided-go="4"]').click();p.wait_for_timeout(1800)

              if p.locator('#v39-country').count():p.locator('#v39-country').select_option('GB')
              if p.locator('#v37-customer-type').count():p.locator('#v37-customer-type').select_option('business')
              p.wait_for_timeout(350)

              p.locator('#v37-email-proposal').click();p.wait_for_timeout(350)
              p.locator('#v37-email-address').fill('test@example.com')
              p.locator('#v37-email-name').fill('Payload Test')

              p.evaluate("""() => {
                window.__measurePayload=null;
                const native=window.fetch.bind(window);
                window.fetch=async(input,init={})=>{
                  if(String(input).includes('projection-quote-submit.php')){
                    const entries={};
                    let total=0;
                    if(init.body instanceof FormData){
                      for(const [k,v] of init.body.entries()){
                        const s=typeof v==='string'?v:'[blob]';
                        entries[k]={length:s.length,prefix:s.slice(0,40)};
                        total+=new TextEncoder().encode(s).length;
                      }
                    }
                    window.__measurePayload={total,entries};
                    return new Response(JSON.stringify({ok:true,reference:'MEASURE'}),{status:200,headers:{'Content-Type':'application/json'}});
                  }
                  return native(input,init);
                };
              }""")
              p.locator('#v37-email-send').click();p.wait_for_timeout(2200)
              data=p.evaluate("""() => ({
                payload:window.__measurePayload,
                views:(window.__projectionProposalViews||[]).map(v=>({view:v.view,length:(v.data||'').length})),
                status:document.getElementById('v37-email-status')?.textContent||''
              })""")
              print('REAL_LIVE_EMAIL_MEASURE',data)
              assert data['payload'],data
              b.close()
          PY
