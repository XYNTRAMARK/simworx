name: Publish projection configurator V31
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v31.yml'
      - '.projection-v31-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v31
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V31 from published V30
        run: python3 .projection-v31-deploy/build_v31.py
      - name: Run V31 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v31-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v31-deploy/test_v31.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v31-proof
          path: /tmp/v31-proof.png
          retention-days: 1
      - name: Publish immutable V31
        run: python3 .projection-v31-deploy/publish_v31.py
