name: Publish projection configurator V41
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v41.yml'
      - '.projection-v41-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v41
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V41 from published V40
        run: python3 .projection-v41-deploy/build_v41.py
      - name: Run V41 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v41-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v41-deploy/test_v41.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v41-proof
          path: /tmp/v41-proof.png
          retention-days: 1
      - name: Publish immutable V41
        run: python3 .projection-v41-deploy/publish_v41.py
