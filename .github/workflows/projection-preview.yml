name: Publish projection configurator preview
on:
  push:
    branches: [main]
    paths:
      - 'projection/**'
      - 'tools/build-projection-guided.py'
      - 'projection-screen-configurator-preview.html'
      - '.projection-deploy/**'
      - '.github/workflows/projection-preview.yml'
permissions:
  contents: read
concurrency:
  group: simworx-navigation-production
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    name: Back up live site, then update only guided projection preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild collaborative standalone preview
        run: python3 tools/build-projection-guided.py
      - name: Check projection JavaScript syntax
        run: |
          for file in projection/src/*.js; do node --check "$file"; done
      - name: Run projection planner tests
        run: |
          rm -rf .projection-test
          mkdir -p .projection-test/src
          cp projection/src/optics.js .projection-test/src/optics.js
          sed 's#projection:/src/optics.js#./optics.js#g' projection/src/layout-planner.js > .projection-test/src/layout-planner.js
          sed 's#../../projection/src/layout-planner.js#./src/layout-planner.js#g' tests/projection/layout-planner.mjs > .projection-test/layout-planner.mjs
          node .projection-test/layout-planner.mjs
      - name: Validate projection commercial pricing
        run: |
          python3 - <<'PY'
          import json, math
          c=json.load(open('projection/catalogue.json'))
          commercial=c['commercial']
          assert commercial['fabrication']['screenSystemPerM2Eur']==750
          assert commercial['enclosures']['semi-enclosed']['fixedEur']==1000
          assert commercial['enclosures']['fully-enclosed']['fixedEur']==4000
          assert commercial['mountingKit']['priceEur']==1000
          assert set(commercial['mountingKit']['includedIn'])=={'semi-enclosed','fully-enclosed'}
          plans={p['id']:p['rate']['amount'] for p in c['ledTariff']['servicePlans']}
          assert plans=={'self':0,'spain':3500,'onsite':5000}
          # Exact fractional curved-area pricing; do not round square metres first.
          area=(4.5/2)*math.radians(220)*2.15
          assert abs(area*750-round(area,0)*750)>0.01
          print('Projection commercial pricing checks passed:',area,area*750)
          PY
      - name: Validate exact reviewed projection preview
        run: python3 .projection-deploy/publish.py validate
      - name: Test one-page scope and backup requirements
        run: python3 .projection-deploy/test_publish.py
      - name: Back up and verify all live htdocs files before any write
        run: python3 .projection-deploy/publish.py backup
      - name: Encrypt and verify complete site backup
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/simworx-projection-guided/verified-backup.json"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/simworx-projection-guided/live-htdocs.tar.gz" -out "$RUNNER_TEMP/simworx-projection-guided/live-htdocs.tar.gz.enc" -pass env:FTP_PASSWORD
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/simworx-projection-guided/live-htdocs.tar.gz.enc" -pass env:FTP_PASSWORD | cmp - "$RUNNER_TEMP/simworx-projection-guided/live-htdocs.tar.gz"
          cd "$RUNNER_TEMP/simworx-projection-guided"
          sha256sum live-htdocs.tar.gz.enc > live-htdocs.tar.gz.enc.sha256
      - name: Retain encrypted backup before publishing
        id: retained_backup
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-live-backup-before-projection-guide-${{ github.sha }}
          path: |
            ${{ runner.temp }}/simworx-projection-guided/live-htdocs.tar.gz.enc
            ${{ runner.temp }}/simworx-projection-guided/live-htdocs.tar.gz.enc.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Update only projection preview and verify all protected pages
        env:
          RETAINED_BACKUP_ARTIFACT_ID: ${{ steps.retained_backup.outputs.artifact-id }}
        run: python3 .projection-deploy/publish.py publish
