name: Publish projection configurator V10
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/projection-v10.yml'
      - '.projection-v10-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v10
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated V10
        run: python3 .projection-v10-deploy/build_v10.py
      - name: Check JavaScript syntax
        run: |
          for file in projection/src/*.js; do
            node --check "$file"
          done
      - name: Publish immutable V10
        run: python3 .projection-v10-deploy/publish_v10.py
