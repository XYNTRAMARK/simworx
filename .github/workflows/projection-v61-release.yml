name: Release projector configurator V61 adaptive email cap
on:
  push:
    branches: [main]
    paths:
      - '.projection-v61-deploy/**'
      - '.github/workflows/projection-v61-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v61
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V61 strictly from live V60
        run: python3 .projection-v61-deploy/build_v61.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Stress-test email payload hard cap
        run: |
          python3 -m http.server 8765 >/tmp/v61-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v61-deploy/test_v61_email.py
          kill $P || true
      - name: Publish V61 and promote stable page
        run: python3 .projection-v61-deploy/publish_v61.py
