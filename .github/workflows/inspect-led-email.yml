name: Inspect live LED email implementation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-led-email.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect LED server mail transport safely
        run: |
          python3 - <<'PY'
          import ftplib,os,ssl,re
          from urllib.parse import urlsplit
          class F(ftplib.FTP_TLS):
              prefer_epsv=False
              def makepasv(self):
                  if self.prefer_epsv:
                      try:return ftplib.parse229(self.sendcmd("EPSV"),self.sock.getpeername())
                      except ftplib.error_perm:pass
                  return super().makepasv()
              def ntransfercmd(self,c,rest=None):
                  try:return super().ntransfercmd(c,rest)
                  except ftplib.error_temp as e:
                      if str(e).startswith("425") and not self.prefer_epsv:
                          self.prefer_epsv=True;return super().ntransfercmd(c,rest)
                      raise
          raw=os.environ["FTP_HOST"].strip();p=urlsplit(raw if "://" in raw else "ftp://"+raw)
          f=F(context=ssl.create_default_context(),timeout=45);f.connect(p.hostname,p.port or 21);f.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]);f.prot_p()
          chunks=[];f.retrbinary("RETR /htdocs/led-quote-submit.php",chunks.append);f.quit()
          text=b"".join(chunks).decode("utf-8","replace")
          print("BYTES",len(text))
          pats=[
            r'\b(?:include|include_once|require|require_once)\s*\(?\s*[^;]+',
            r'\bmail\s*\(',
            r'PHPMailer',
            r'\bSMTP\b',
            r'\bwp_mail\b',
            r'function\s+[A-Za-z0-9_]+\s*\(',
            r'quote_action',
            r'led_configuration',
            r'json_encode\s*\(',
          ]
          for pat in pats:
              print("\nPATTERN",pat)
              for m in list(re.finditer(pat,text,re.I))[:60]:
                  a=max(0,m.start()-220);b=min(len(text),m.end()+420)
                  frag=text[a:b].replace("\n"," ")
                  frag=re.sub(r'(?i)(password|passwd|secret|token|api[_-]?key)\s*([=:>]+)\s*[^,;\s]+',r'\\1\\2[REDACTED]',frag)
                  print(frag)
          PY
