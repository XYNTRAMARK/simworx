name: Compare live LED and Projection email senders
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-live-email-senders.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read exact live sender flows
        run: |
          python3 - <<'PY'
          import ftplib,os,ssl,re
          from urllib.parse import urlsplit
          class F(ftplib.FTP_TLS):
              prefer_epsv=False
              def makepasv(self):
                  if self.prefer_epsv:
                      try:return ftplib.parse229(self.sendcmd("EPSV"),self.sock.getpeername())
                      except ftplib.error_perm:pass
                  return super().makepasv()
              def ntransfercmd(self,c,rest=None):
                  try:return super().ntransfercmd(c,rest)
                  except ftplib.error_temp as e:
                      if str(e).startswith("425") and not self.prefer_epsv:
                          self.prefer_epsv=True;return super().ntransfercmd(c,rest)
                      raise
          raw=os.environ["FTP_HOST"].strip();p=urlsplit(raw if "://" in raw else "ftp://"+raw)
          f=F(context=ssl.create_default_context(),timeout=45);f.connect(p.hostname,p.port or 21);f.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]);f.prot_p()
          def read(path):
              c=[];f.retrbinary("RETR "+path,c.append);return b"".join(c).decode("utf-8","replace")
          files={
            "LED_PAGE":read("/htdocs/led-screen-configurator.html"),
            "LED_PHP":read("/htdocs/led-quote-submit.php"),
            "PROJ_PAGE":read("/htdocs/projection-screen-configurator.html"),
            "PROJ_PHP":read("/htdocs/projection-quote-submit.php"),
          }
          f.quit()
          def emit(label,text,terms):
              print("\n###",label)
              seen=[]
              for term in terms:
                  for m in re.finditer(re.escape(term),text,re.I):
                      frag=text[max(0,m.start()-1800):min(len(text),m.start()+7000)]
                      frag=re.sub(r'(?i)(password|passwd|secret|token|api[_-]?key)\s*([=:>]+)\s*[^,;\s]+',r'\\1\\2[REDACTED]',frag)
                      if frag not in seen:
                          seen.append(frag);print("\nTERM",term,"\n",frag)
                      if len(seen)>=8:return
          emit("LED_PAGE",files["LED_PAGE"],["led-quote-form","quote_action","led_images","led-email","Send quote","fetch("])
          emit("LED_PHP",files["LED_PHP"],["SimworxLedQuoteActions::deliver","quote_action","led_images","mail($to","@mail($to","multipart/related"])
          emit("PROJ_PAGE",files["PROJ_PAGE"],["v48-email-form","emailProposal","proposal_html","HTMLFormElement.prototype.submit.call(form)"])
          emit("PROJ_PHP",files["PROJ_PHP"],["mail($email","@mail($email","multipart/related","proposal_html"])
          PY
