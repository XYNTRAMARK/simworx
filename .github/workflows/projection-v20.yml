name: Publish projection configurator V20
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v20.yml'
      - '.projection-v20-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v20
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated V20
        run: python3 .projection-v20-deploy/build_v20.py
      - name: Verify enclosure options removed
        run: |
          ! grep -q 'Semi enclosed' projection-screen-configurator-v20.html
          ! grep -q 'Fully enclosed' projection-screen-configurator-v20.html
          grep -q 'value="screen-only" checked' projection-screen-configurator-v20.html
      - name: Browser startup smoke test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 45 "$CHROME"             --headless=new --no-sandbox --disable-dev-shm-usage             --use-gl=swiftshader --enable-unsafe-swiftshader             --enable-logging=stderr --v=0             --virtual-time-budget=10000             --dump-dom http://127.0.0.1:8765/projection-screen-configurator-v20.html             >/tmp/v20-dom.html 2>/tmp/v20-console.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          echo "Chrome rc=$RC"
          grep -E 'SyntaxError|TypeError|ReferenceError|CONSOLE:' /tmp/v20-console.log || true
          if grep -Eq 'SyntaxError|TypeError|ReferenceError' /tmp/v20-console.log; then
            echo "Browser console contains startup errors"
            exit 5
          fi
          if ! grep -q 'data-standalone-ready="true"' /tmp/v20-dom.html; then
            echo "Standalone app did not reach ready state"
            exit 6
          fi
      - name: Publish immutable V20
        run: python3 .projection-v20-deploy/publish_v20.py
