name: Inspect live anti-spam browser controller
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-antispam-browser.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read submit listener from live LED page
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re,json
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          out=[];f.retrbinary('RETR /htdocs/led-screen-configurator.html',out.append);s=b''.join(out).decode('utf-8','replace');f.quit()
          needle='const sources=';i=s.find(needle)
          raw=s[i+len(needle):].lstrip();sources,_=json.JSONDecoder().raw_decode(raw)
          anti=[v for v in sources.values() if isinstance(v,str) and 'Loading spam protection' in v and 'form[data-antispam]' in v][0]
          for term in ["addEventListener('submit'","submission-complete","turnstile.getResponse","verified"]:
              j=anti.find(term)
              print('\nTERM',term,'AT',j)
              if j>=0: print(anti[max(0,j-3000):j+7000])
          PY
