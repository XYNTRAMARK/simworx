name: Prune superseded projection preview releases

on:
  push:
    paths:
      - '.github/workflows/projection-prune.yml'

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded queued projection preview runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          repo=os.environ['REPO']
          token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/projection-preview.yml/runs?branch=main&per_page=100',
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          )
          with urllib.request.urlopen(req) as r:
              runs=json.load(r)['workflow_runs']
          candidates=[x for x in runs if x['status'] in ('queued','pending')]
          if not candidates:
              print('No queued projection releases to prune.')
              raise SystemExit
          newest=max(candidates,key=lambda x:x['run_number'])
          print('Keeping newest queued run',newest['run_number'],newest['id'])
          for run in candidates:
              if run['id']==newest['id']:
                  continue
              url=f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel"
              request=urllib.request.Request(url,method='POST',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(request) as response:
                      print('Cancelled superseded queued run',run['run_number'],run['id'],response.status)
              except Exception as e:
                  print('Could not cancel run',run['run_number'],run['id'],e)
          PY
