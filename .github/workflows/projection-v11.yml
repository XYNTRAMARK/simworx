name: Publish projection configurator V11
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/projection-v11.yml'
      - '.projection-v11-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v11
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated V11
        run: python3 .projection-v11-deploy/build_v11.py
      - name: Check JavaScript syntax
        run: |
          for file in projection/src/*.js; do
            node --check "$file"
          done
      - name: Publish immutable V11
        run: python3 .projection-v11-deploy/publish_v11.py
