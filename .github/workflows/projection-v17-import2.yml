name: Identify V17 failing browser import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v17-import2.yml'
      - '.diagnostics/instrument-v17.py'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V17
        run: python3 .projection-v17-deploy/build_v17.py
      - name: Instrument loader
        run: python3 .diagnostics/instrument-v17.py
      - name: Run Chrome
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 45 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --enable-logging=stderr --v=0 --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/projection-screen-configurator-v17.html >/tmp/dom.html 2>/tmp/console.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          grep -E 'IMPORTTEST|IMPORTOK|IMPORTFAIL|SyntaxError|CONSOLE:' /tmp/console.log || true
          exit 0
