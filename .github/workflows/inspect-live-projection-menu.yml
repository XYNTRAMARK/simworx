name: Inspect live Projection menu block
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-projection-menu.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Print exact live menu block
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          parts=[];f.retrbinary('RETR /htdocs/assets/js/global-header.js',parts.append);f.quit()
          s=b''.join(parts).decode('utf-8','replace')
          old="title: 'Projector Configurator'"
          i=s.find(old)
          print('COUNT',s.count(old))
          print('SNIPPET_START')
          print(s[max(0,i-400):i+1000] if i>=0 else 'NOT FOUND')
          print('SNIPPET_END')
          PY
