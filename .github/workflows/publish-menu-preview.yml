name: Publish isolated homepage layout preview only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-menu-preview.yml']
permissions:
  contents: read
concurrency:
  group: simworx-menu-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create only home-preview.html and verify production files unchanged
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, io, os, hashlib, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          target = '/htdocs/home-preview.html'
          payload = Path('previews/home-preview.html').read_bytes()
          assert b'noindex,nofollow' in payload and b'<style' in payload
          host = os.environ['FTP_HOST']
          parsed = urlparse(host if '://' in host else 'ftp://' + host)
          ftp = ftplib.FTP_TLS(timeout=45)
          ftp.connect(parsed.hostname, parsed.port or 21)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          def read(path):
              result = io.BytesIO()
              ftp.retrbinary('RETR ' + path, result.write)
              return result.getvalue()
          protected = ['/htdocs/index.html', '/htdocs/assets/css/global-header.css', '/htdocs/assets/js/global-header.js', '/htdocs/assets/css/global-header-approved.css', '/htdocs/assets/js/global-header-approved.js']
          before = {path: hashlib.sha256(read(path)).hexdigest() for path in protected}
          names = ftp.nlst('/htdocs')
          assert hashlib.sha256(read('/htdocs/home-preview.html')).hexdigest() == '4dbbf18f9fbb5ffb4c8c8b1e819b9ad5e2274beb55431025f3cc3e65cbbc9c35', 'Preview changed; no overwrite'
          ftp.storbinary('STOR ' + target, io.BytesIO(payload))
          assert read(target) == payload, 'Preview FTP verification failed'
          assert {path: hashlib.sha256(read(path)).hexdigest() for path in protected} == before, 'Protected production files changed'
          ftp.quit()
          request = urllib.request.Request('https://sim-worx.com/home-preview.html?verify=' + os.environ['GITHUB_SHA'], headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(request, timeout=45) as response:
              assert response.read() == payload, 'Preview HTTPS verification failed'
          print('Preview verified at https://sim-worx.com/home-preview.html. Production homepage, header CSS and header JavaScript are unchanged.')
          
          PY
