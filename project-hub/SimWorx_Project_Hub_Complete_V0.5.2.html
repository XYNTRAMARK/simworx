Only JPG, PNG, WebP photos and PDF documents are supported');\n const value=String(dataUrl||'');\n const prefixes={'image/jpeg':'/9j','image/png':'iVBOR','image/webp':'UklGR','application/pdf':'JVBERi0'};\n const prefix='data:'+kind+';base64,';\n if(!value.startsWith(prefix)||!value.slice(prefix.length).startsWith(prefixes[kind])||!/^[A-Za-z0-9+/]+={0,2}$/.test(value.slice(prefix.length)))\n  throw Error('Invalid encoded file, file type or signature');\n const max=kind==='application/pdf'?530000:330000;\n if(value.length\u003emax)throw Error('File is too large for local workspace storage. Keep original privately; use a compressed image or a small PDF');\n return value;\n}\nconst purchaseOnly=['Supplier order confirmation','Receipt / supplier invoice'];\nexport function attachWorkEvidence(s,{projectId,taskId,occurrenceId='',orderId='',lineId='',title,kind,notes='',filename,mime,dataUrl}){\n ensureWorkEvidence(s);project(s,projectId);const job=task(s,taskId,projectId);\n const occ=requirement(s,occurrenceId,projectId,job.id);\n if(!evidenceKinds.some(x=\u003ex[0]===kind))throw Error('Select an evidence category');\n const order=orderId?s.orders?.find(o=\u003elive(o)\u0026\u0026o.id===orderId\u0026\u0026o.projectId===projectId):null;\n const line=lineId?order?.items?.find(x=\u003ex.id===lineId):null;\n if(orderId\u0026\u0026!order)throw Error('Actual supplier PO reference not found in this project');\n if(lineId\u0026\u0026!line)throw Error('PO line does not belong to selected order');\n if(occ\u0026\u0026line\u0026\u0026line.sourceOccurrenceId!==occ.id)throw Error('PO line is not linked to this engineering material');\n if(line\u0026\u0026!occ)throw Error('Select the exact engineering material before attaching supplier order evidence');\n if(purchaseOnly.includes(kind)\u0026\u0026!line)throw Error('Order confirmation/invoice evidence must be attached to a previously recorded actual supplier PO line');\n const data=safeFile(mime,dataUrl),now=stamp();\n const active=s.workEvidence.filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId);\n if(active.length\u003e=30)throw Error('Project evidence limit reached (30 files). Archive obsolete evidence, keeping the originals safely');\n const used=active.reduce((n,x)=\u003en+(x.dataUrl?.length||0),0);\n if(used+data.length\u003e5_500_000)throw Error('Local embedded evidence exceeds the 5.5 MB project limit. Keep originals externally and attach smaller reference images');\n const description=String(notes||'').trim();if(description.length\u003e1000)throw Error('Evidence notes exceed 1,000 characters');\n const row={id:uid('workproof'),projectId,sectionId:job.sectionId,taskId:job.id,occurrenceId:occ?.id||null,\n  orderId:order?.id||null,lineId:line?.id||null,title:required(title,'Evidence title',180),\n  kind,notes:description,filename:required(filename,'File name',180),mime,dataUrl:data,fileChecksum:checksum(data),\n  customerApproval:null,createdAt:now,provenance:'owner-supplied file (not independently verified)'};\n s.workEvidence.push(row);\n audit(s,'Private work / purchasing evidence attached',row.id+' / '+job.title+' / '+kind+' / '+(order?.code||'No PO'));\n return row;\n}\nexport function evidenceForJob(s,taskId){\n ensureWorkEvidence(s);\n return s.workEvidence.filter(x=\u003elive(x)\u0026\u0026x.taskId===taskId).sort((a,b)=\u003eString(b.createdAt).localeCompare(String(a.createdAt)));\n}\nexport function evidenceForOccurrence(s,occurrenceId){\n ensureWorkEvidence(s);\n return s.workEvidence.filter(x=\u003elive(x)\u0026\u0026x.occurrenceId===occurrenceId).sort((a,b)=\u003eString(b.createdAt).localeCompare(String(a.createdAt)));\n}\nexport function setEvidenceCustomerPreview(s,{evidenceId,visible,reviewer='',caption='',redactionConfirmed=false}){\n ensureWorkEvidence(s);const e=s.workEvidence.find(x=\u003elive(x)\u0026\u0026x.id===evidenceId);\n if(!e)throw Error('Evidence unavailable');\n if(!visible){const prev=e.customerApproval;e.customerApproval=null;audit(s,'Customer evidence local preview revoked',e.id+(prev?' / previous '+prev.reviewer:''));return e;}\n // Client-safe image must be individually selected even when its work package is permitted.\n const section=s.customerShareRules?.find(x=\u003ex.projectId===e.projectId\u0026\u0026x.sectionId===e.sectionId\u0026\u0026x.visible);\n if(!section)throw Error('First allow this work package in the Customer preview section. Each image then requires separate review.');\n if(!e.mime.startsWith('image/'))throw Error('PDFs and original documents are not supported in the customer-safe preview. Supply a reviewed and redacted image instead.');\n if(!redactionConfirmed)throw Error('Confirm that the image contains no confidential supplier prices, account numbers, personal data, addresses or sensitive contract terms');\n const who=required(reviewer,'Person approving this specific image',120);\n const publicCaption=required(caption,'Customer-safe description',400);\n e.customerApproval={visible:true,reviewer:who,caption:publicCaption,at:stamp(),scope:'OWNER PREVIEW ONLY — no live customer publication',reviewedFingerprint:evidenceFingerprint(s,e)};\n audit(s,'Owner marked redacted evidence for LOCAL customer preview',e.id+' / '+who);\n return e;\n}\nexport function customerEvidenceProjection(s,projectId){\n ensureWorkEvidence(s);project(s,projectId);\n const sections=new Set((s.customerShareRules||[]).filter(r=\u003er.projectId===projectId\u0026\u0026r.visible).map(r=\u003er.sectionId));\n return s.workEvidence.filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId\u0026\u0026sections.has(x.sectionId)\u0026\u0026x.customerApproval?.visible===true\u0026\u0026x.mime.startsWith('image/')\u0026\u0026x.customerApproval.reviewedFingerprint===evidenceFingerprint(s,x))\n  .map(x=\u003e({id:x.id,sectionId:x.sectionId,title:'Reviewed progress photo',caption:x.customerApproval.caption,approvedAt:x.customerApproval.at,\n   image:x.dataUrl})); // No private buyer, supplier, cost, original filename, source path, PO number, notes, or contact information.\n}\nexport function archiveWorkEvidence(s,id){\n ensureWorkEvidence(s);const e=s.workEvidence.find(x=\u003elive(x)\u0026\u0026x.id===id);if(!e)throw Error('Evidence unavailable');\n if(e.orderId\u0026\u0026e.lineId)throw Error('This attachment is historical evidence on an actual PO line. Archiving it would conceal purchasing evidence; retain it and add a corrective note instead.');\n e.archivedAt=stamp();if(e.customerApproval)e.customerApproval=null;\n audit(s,'Evidence archived (owner local)',id+' / '+e.title+' / retained in existing private backups');\n return e;\n}\n\n/* Revision-aware local preview: prior approvals are not enough after job, source or file changes.\n   JSON fingerprint is a stale-review detector, NOT a cryptographic signature. */\nexport function evidenceFingerprint(s,e){\n const t=s.tasks?.find(x=\u003ex.id===e.taskId),o=s.assemblyBOM?.find(x=\u003ex.id===e.occurrenceId);\n return checksum(JSON.stringify([e.dataUrl,t?.sectionId||'',t?.description||'',t?.jobAssurance?.technicalRevision||'',\n  o?.notes||'',o?.sourceTrace||null,o?.specReview?.fingerprint||'',o?.purchaseSource||null]));\n}\n/* Always run before accepting imported JSON or exporting a private recovery copy. Does not\n   mutate historical evidence; malformed data rejects the entire import atomically. */\nexport function validateWorkEvidence(s){\n if(s.workEvidence===undefined)return true; // V0.5.0 and older backups\n if(!Array.isArray(s.workEvidence))throw Error('Invalid work evidence array in backup');\n const ids=new Set();\n for(const e of s.workEvidence){\n  if(!e||typeof e!=='object'||ids.has(e.id))throw Error('Duplicate or malformed evidence ID');\n  ids.add(e.id);\n  const p=s.projects?.find(p=\u003ep.id===e.projectId);\n  const t=s.tasks?.find(t=\u003et.id===e.taskId\u0026\u0026t.projectId===e.projectId);\n  if(!p||!t)throw Error('Evidence references a missing project or unrelated job: '+e.id);\n  const o=e.occurrenceId?s.assemblyBOM?.find(x=\u003ex.id===e.occurrenceId\u0026\u0026x.projectId===e.projectId):null;\n  if(e.occurrenceId\u0026\u0026(!o||o.linkedTaskId!==e.taskId))throw Error('Evidence references a missing, unrelated or cross-project material: '+e.id);\n  if(!s.sections?.some(section=\u003esection.id===e.sectionId\u0026\u0026section.projectId===e.projectId))throw Error('Evidence original work package is missing or belongs to another project: '+e.id);\n  if(e.lineId){\n   const po=s.orders?.find(x=\u003ex.id===e.orderId\u0026\u0026x.projectId===e.projectId);\n   const line=po?.items?.find(x=\u003ex.id===e.lineId);\n   if(!line||!o||line.sourceOccurrenceId!==o.id)throw Error('Evidence PO line does not match the original engineering requirement: '+e.id);\n  } else if(e.orderId)throw Error('Evidence references a PO without its line: '+e.id);\n  if(purchaseOnly.includes(e.kind)\u0026\u0026!e.lineId)throw Error('Supplier invoice/confirmation evidence missing original PO line: '+e.id);\n  safeFile(e.mime,e.dataUrl);\n  if(e.fileChecksum\u0026\u0026e.fileChecksum!==checksum(e.dataUrl))throw Error('Evidence file checksum mismatch: '+e.id);\n  if(e.customerApproval?.visible===true){\n   if(!e.mime.startsWith('image/')||!e.customerApproval.reviewer||!e.customerApproval.caption)\n    throw Error('Invalid customer photo preview approval: '+e.id);\n  }\n }\n return true;\n}\n","work-evidence-ui-v051.mjs":"/* V0.5.2 inline guidance, source-linked evidence and local customer preview controls. */\nimport {evidenceForJob,evidenceForOccurrence,evidenceKinds,customerEvidenceProjection} from './work-evidence-v051.mjs';\nconst e=x=\u003eString(x??'').replace(/[\u0026\u003c\u003e\"']/g,ch=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;','\"':'\u0026quot;',\"'\" :'\u0026#39;'}[ch]));\nconst live=x=\u003ex\u0026\u0026!x.archivedAt;\nconst btn=(action,id,label,extra='')=\u003e'\u003cbutton type=\"button\" class=\"btn small '+extra+'\" data-action=\"'+e(action)+'\" data-id=\"'+e(id)+'\"\u003e'+e(label)+'\u003c/button\u003e';\nconst option=(val,label,selected)=\u003e'\u003coption value=\"'+e(val)+'\" '+(selected===val?'selected':'')+'\u003e'+e(label)+'\u003c/option\u003e';\nexport function helpTip(definition){\n const txt=e(definition);\n return '\u003cspan class=\"v51-help\" tabindex=\"0\" aria-label=\"Help: '+txt+'\" title=\"'+txt+'\"\u003e\u003cspan aria-hidden=\"true\"\u003e?\u003c/span\u003e\u003cspan class=\"v51-tooltip\" role=\"tooltip\"\u003e'+txt+'\u003c/span\u003e\u003c/span\u003e';\n}\nexport const helpTopics={\n workpackage:'A work package is a major portion of a project, such as Cockpit, Electronics or Testing. It contains jobs and their sub-jobs.',\n job:'A job is a deliverable or task. Give it an action-oriented name and describe what Done means.',\n subjob:'A sub-job is a smaller step underneath the exact row you clicked. You can keep nesting, e.g. MIP → G1000 → Order display → Check receipt.',\n description:'Write practical instructions, specifications, what to produce and how success will be checked. This is your internal working brief.',\n owner:'The person responsible for completing or coordinating the work. Only you can assign people in this offline version.',\n dates:'Planning dates are estimates until you verify them against an approved schedule. These are not automatically contractual deadlines.',\n buyflag:'Flags work needing procurement attention. It creates an action queue entry, NOT an order or supplier commitment. Add the actual part and quantity separately.',\n requirement:'A material requirement specifies WHAT is needed and how many, whether manufactured, bought or customer-supplied. It does not authorize purchasing.',\n spec:'A controlled technical specification: required model/size/interface/performance, source clause and revision. Supplier descriptions do not automatically become contract requirements.',\n evidence:'Attach a photo, screenshot or small PDF to the exact job/material/real purchase-order line. Uploads remain private and are not independently verified.',\n purchaseOrder:'PO means Purchase Order: a genuine documented supplier order. A planning flag, quote or order-confirmation file must not generate a PO automatically.',\n proof:'A quote shows an offer; an order confirmation refers to a recorded PO; a receipt/invoice is not proof of payment; a delivery note is not QA acceptance.',\n customer:'This is an OWNER-ONLY PREVIEW. A work package must first be allowed, and each redacted image separately reviewed and approved. Staff/client access stays disabled.',\n inspection:'QA means Quality Assurance. Inspect physically received goods for correct model, quantity, damage and supporting evidence before accepting stock.',\n budget:'A departmental allowance is the maximum internal amount assigned to the owner for planned buying. It is NOT an approved quote or purchase; specific supplier orders require separate authorization.',\n rfq:'RFQ means Request for Quotation: asking suppliers for price and delivery details. The supplier quotation is an offer, not a placed order.',\n revision:'A revision identifies which approved drawing or technical requirement is current. A change to the source must trigger new engineering verification.',\n nonconformance:'A nonconformance (NCR) records a product that failed specification or quality inspection and needs corrective action.',\n status:'A status is the current work stage. Mark completed only after required child steps, checks and approvals are finished.'\n};\nfunction orderOptions(s,occ){\n if(!occ)return [];\n return (s.orders||[]).filter(live).flatMap(po=\u003e(po.items||[]).filter(i=\u003ei.sourceOccurrenceId===occ.id)\n  .map(i=\u003e({value:po.id+'|'+i.id,label:po.code+' · '+po.supplier+' · '+i.quantity+' units'})));\n}\nfunction uploader(s,task,occ){\n const pos=occ?s.parts.find(p=\u003ep.id===occ.partId):null;\n const orders=orderOptions(s,occ),kind='Photo / screenshot';\n return '\u003cform class=\"v51-upload\" data-form=\"v51-evidence-add\"\u003e'+\n '\u003cinput type=\"hidden\" name=\"projectId\" value=\"'+e(task.projectId)+'\"\u003e'+\n '\u003cinput type=\"hidden\" name=\"taskId\" value=\"'+e(task.id)+'\"\u003e'+\n '\u003cinput type=\"hidden\" name=\"occurrenceId\" value=\"'+e(occ?.id||'')+'\"\u003e'+\n '\u003cdiv class=\"v51-attach-title\"\u003e\u003cb\u003eAttach '+e(occ?'evidence to '+(pos?.name||'this material'):'evidence to '+task.title)+'\u003c/b\u003e'+helpTip(helpTopics.evidence)+'\u003c/div\u003e'+\n '\u003clabel\u003eTitle\u003cinput name=\"title\" required maxlength=\"180\" placeholder=\"e.g. Supplier order confirmation, connector photograph\"\u003e\u003c/label\u003e'+\n '\u003clabel\u003eDocument category'+helpTip(helpTopics.proof)+'\u003cselect name=\"kind\"\u003e'+evidenceKinds.map(([v,t])=\u003eoption(v,t,kind)).join('')+'\u003c/select\u003e\u003c/label\u003e'+\n '\u003clabel\u003eAssociated real PO line (only if applicable)'+helpTip(helpTopics.purchaseOrder)+\n '\u003cselect name=\"orderLine\"\u003e'+option('','No recorded supplier PO / job reference', '')+orders.map(row=\u003eoption(row.value,row.label,'')).join('')+'\u003c/select\u003e\u003c/label\u003e'+\n '\u003clabel class=\"v51-wide\"\u003eNotes / evidence reference\u003cinput name=\"notes\" maxlength=\"1000\" placeholder=\"Drawing number, source, order reference or what photograph shows\"\u003e\u003c/label\u003e'+\n '\u003clabel class=\"v51-wide\"\u003ePrivate JPEG, PNG, WebP or small PDF\u003cinput name=\"file\" type=\"file\" accept=\".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf\" required\u003e\u003c/label\u003e'+\n '\u003cp class=\"v51-info v51-wide\"\u003eImages are compressed before saving. Small PDF files are embedded; keep the original on your PC. This is a local evidence attachment only — it never authorizes, creates or pays an order. The attachment counts toward the private workspace backup size limit.\u003c/p\u003e'+\n '\u003cdiv class=\"v51-wide\"\u003e\u003cbutton class=\"btn small primary\" type=\"submit\"\u003eAttach private evidence\u003c/button\u003e\u003c/div\u003e\u003c/form\u003e';\n}\nfunction gallery(s,rows,ui){\n if(!rows.length)return '\u003cp class=\"v51-info\"\u003eNo job-specific evidence attached yet. Supporting photos can show a purchaser the precise item required.\u003c/p\u003e';\n return '\u003cdiv class=\"v51-evidence-grid\"\u003e'+rows.map(f=\u003e{\n  const share=f.customerApproval?.visible===true,preview=ui.v51ShareEditor===f.id;\n  const isImg=f.mime?.startsWith('image/');\n  const file=isImg?'\u003ca href=\"'+e(f.dataUrl)+'\" download=\"'+e(f.filename)+'\" title=\"Open or save private image\"\u003e'+\n   '\u003cimg class=\"v51-evidence-image\" src=\"'+e(f.dataUrl)+'\" alt=\"'+e(f.title)+'\" loading=\"lazy\"\u003e\u003c/a\u003e':\n   '\u003ca class=\"v51-pdf\" href=\"'+e(f.dataUrl)+'\" download=\"'+e(f.filename)+'\"\u003ePDF · save private document\u003c/a\u003e';\n  const controls='\u003cdiv class=\"v51-evidence-actions\"\u003e'+(isImg?\n    btn('v51-share-edit',f.id,preview?'Close review':share?'Review / revoke customer image':'Review customer preview'):'' )+\n    btn('v51-archive-evidence',f.id,'Archive')+'\u003c/div\u003e';\n  const form=preview?'\u003cform class=\"v51-share-form\" data-form=\"v51-evidence-share\"\u003e'+\n   '\u003cinput type=\"hidden\" name=\"evidenceId\" value=\"'+e(f.id)+'\"\u003e'+\n   '\u003clabel\u003eReviewer\u003cinput name=\"reviewer\" required maxlength=\"120\" value=\"'+e(f.customerApproval?.reviewer||'')+'\" placeholder=\"Your name / reviewer\"\u003e\u003c/label\u003e'+\n   '\u003clabel\u003eCustomer-safe caption\u003cinput name=\"caption\" required maxlength=\"400\" value=\"'+e(f.customerApproval?.caption||'')+'\" placeholder=\"e.g. Display module order confirmed\"\u003e\u003c/label\u003e'+\n   '\u003clabel class=\"v51-check\"\u003e\u003cinput type=\"checkbox\" name=\"redactionConfirmed\" required\u003e I reviewed and redacted confidential supplier prices, account numbers, personal details and contract data.\u003c/label\u003e'+\n   '\u003cp class=\"v51-info\"\u003eThis only marks the image for the owner’s LOCAL customer preview after the work package is separately allowed. No customer login, automatic publication or live portal is enabled.\u003c/p\u003e'+\n   '\u003cbutton class=\"btn small primary\" type=\"submit\"\u003eApprove redacted image for local preview\u003c/button\u003e'+\n   (share?btn('v51-revoke-share',f.id,'Revoke visibility'):'')+'\u003c/form\u003e':'';\n  const context=f.orderId?' · linked to an actual supplier PO':f.occurrenceId?' · linked to material requirement':' · linked to job';\n  return '\u003carticle class=\"v51-evidence-item\"\u003e'+file+'\u003cdiv class=\"v51-evidence-body\"\u003e\u003cb\u003e'+e(f.title)+'\u003c/b\u003e'+\n   '\u003csmall\u003e'+e(f.kind)+context+'\u003c/small\u003e\u003csmall\u003e'+e(f.createdAt?.slice(0,10)||'Date not recorded')+' · owner uploaded, not independently verified\u003c/small\u003e'+\n   (f.notes?'\u003cp\u003e'+e(f.notes)+'\u003c/p\u003e':'')+'\u003cspan class=\"v51-share-state '+(share?'reviewed':'')+'\"\u003e'+(share?'Selected for local customer preview':'Private · not customer-visible')+'\u003c/span\u003e'+\n   controls+form+'\u003c/div\u003e\u003c/article\u003e'\n }).join('')+'\u003c/div\u003e';\n}\nexport function renderJobEvidence(s,ui,task){\n const recent=evidenceForJob(s,task.id);\n const legacy=(s.projectEvidence||[]).filter(x=\u003elive(x)\u0026\u0026x.taskId===task.id);\n const legacyHtml=legacy.length?'\u003cdetails\u003e\u003csummary\u003e'+legacy.length+' photo(s) from existing project photo gallery\u003c/summary\u003e\u003cdiv class=\"v51-evidence-grid\"\u003e'+legacy.map(x=\u003e\n '\u003cdiv class=\"v51-evidence-item\"\u003e\u003cimg class=\"v51-evidence-image\" src=\"'+e(x.dataUrl)+'\" alt=\"'+e(x.title)+'\"\u003e\u003cdiv class=\"v51-evidence-body\"\u003e\u003cb\u003e'+e(x.title)+'\u003c/b\u003e\u003csmall\u003eLegacy private project photo, not approved for customers\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e').join('')+'\u003c/div\u003e\u003c/details\u003e':'';\n const selectedId=ui.v51EvidenceOccurrence;\n const occ=selectedId?s.assemblyBOM?.find(x=\u003elive(x)\u0026\u0026x.id===selectedId\u0026\u0026x.linkedTaskId===task.id):null;\n const add=ui.v51EvidenceTask===task.id;\n return '\u003csection class=\"v51-job-evidence\"\u003e\u003cdiv class=\"v51-evidence-heading\"\u003e\u003cdiv\u003e\u003ch4\u003ePhotos, documents \u0026amp; purchasing proof '+helpTip(helpTopics.evidence)+'\u003c/h4\u003e'+\n '\u003cp\u003eEvidence travels with the linked job and material. Private by default; never treated as a verified order or a paid invoice.\u003c/p\u003e\u003c/div\u003e'+\n btn('v51-add-job-evidence',task.id,add?'Close uploader':'+ Attach photo / proof','primary')+'\u003c/div\u003e'+\n (add?uploader(s,task,occ):'')+\n gallery(s,recent,ui)+legacyHtml+'\u003c/section\u003e';\n}\nexport function renderMaterialEvidence(s,ui,occ){\n const job=s.tasks?.find(t=\u003elive(t)\u0026\u0026t.id===occ.linkedTaskId\u0026\u0026t.projectId===occ.projectId);\n const evidence=evidenceForOccurrence(s,occ.id);\n const open=ui.v51EvidenceOccurrence===occ.id\u0026\u0026ui.v51EvidenceTask===job?.id;\n return '\u003csection class=\"v51-material-evidence\"\u003e\u003cdiv class=\"v51-evidence-heading\"\u003e\u003cdiv\u003e\u003ch4\u003eSupplier images and purchasing evidence '+helpTip(helpTopics.proof)+'\u003c/h4\u003e'+\n '\u003cp\u003eSupporting documents should be attached to this exact requirement and, for an actual confirmation or invoice, its recorded PO line.\u003c/p\u003e\u003c/div\u003e'+\n (job?btn('v51-evidence-material',occ.id,open?'Close attachment':'+ Attach to this item','primary'):'\u003csmall\u003eLink this requirement to a job in Work Plan to attach evidence.\u003c/small\u003e')+'\u003c/div\u003e'+\n (open\u0026\u0026job?uploader(s,job,occ):'')+\n gallery(s,evidence,ui)+'\u003c/section\u003e';\n}\nexport function renderApprovedCustomerEvidence(s,projectId){\n const list=customerEvidenceProjection(s,projectId);\n if(!list.length)return '\u003cp\u003eNo redacted evidence individually approved for the owner-only customer preview. The work-package allowlist and each attachment both default to hidden.\u003c/p\u003e';\n return '\u003csection class=\"v51-customer-preview\"\u003e\u003ch4\u003eReviewed photos in LOCAL customer preview\u003c/h4\u003e'+\n '\u003cp class=\"v51-info\"\u003eNo real customer account can currently access these files. Only descriptions and selected images appear here; original order documents, notes and supplier details remain internal.\u003c/p\u003e'+\n '\u003cdiv class=\"v51-evidence-grid\"\u003e'+list.map(x=\u003e'\u003carticle class=\"v51-evidence-item\"\u003e\u003cimg class=\"v51-evidence-image\" src=\"'+e(x.image)+'\" alt=\"'+e(x.caption)+'\"\u003e'+\n '\u003cdiv class=\"v51-evidence-body\"\u003e\u003cb\u003e'+e(x.title)+'\u003c/b\u003e\u003cp\u003e'+e(x.caption)+'\u003c/p\u003e\u003csmall\u003eLocally reviewed '+e(x.approvedAt?.slice(0,10)||'')+'\u003c/small\u003e\u003c/div\u003e\u003c/article\u003e').join('')+\n '\u003c/div\u003e\u003c/section\u003e';\n}\n","ops-v052.mjs":"/* V0.5.2 — explicit offline operational records. All data stays in private local workspace.\n * None of these entries proves a transaction independently or executes a payment/order. */\nimport {approvalStatus} from './procurement-control-v049.mjs';\nimport {contractControlled} from './procurement-workflow-v047.mjs';\nimport {flaggedUnspecifiedPurchases,jobRequirements} from './workplan-v050.mjs';\nconst live=x=\u003ex\u0026\u0026!x.archivedAt;\nconst now=()=\u003enew Date().toISOString();\nconst uid=p=\u003ep+'-'+Math.random().toString(36).slice(2,12);\nconst str=(x,label,min=3,max=300)=\u003e{const v=String(x??'').trim();if(v.length\u003cmin||v.length\u003emax)throw Error(label+' requires '+min+'–'+max+' characters');return v;};\nconst qty=(v,label)=\u003e{const n=Number(v);if(!Number.isSafeInteger(n)||n\u003c1||n\u003e10000000)throw Error(label+' must be a positive whole number');return n;};\nconst euros=(v,label,allowZero=false)=\u003e{const n=Number(v);if(!Number.isFinite(n)||(allowZero?n\u003c0:n\u003c=0)||n\u003e1e9||Math.abs(n*100-Math.round(n*100))\u003e.00001)throw Error(label+' needs a valid amount with at most two decimals');return Math.round(n*100)/100;};\nconst audit=(s,action,detail)=\u003e{s.audit??=[];s.audit.unshift({id:uid('audit'),at:now(),actor:'Owner (offline self-entry)',action,detail})};\nexport function ensureOps(s){s.supplierAcknowledgements??=[];s.supplierInvoices??=[];s.supplierPayments??=[];s.qualityNCRs??=[];return s;}\nfunction order(s,id){const o=s.orders?.find(x=\u003elive(x)\u0026\u0026x.id===id);if(!o)throw Error('Recorded supplier PO not found');return o;}\nfunction orderLine(s,orderId,lineId){const o=order(s,orderId),line=o.items?.find(x=\u003ex.id===lineId);if(!line)throw Error('Supplier PO line not found');return {o,line};}\nconst round=x=\u003eMath.round((x+Number.EPSILON)*100)/100;\nexport function recordAcknowledgement(s,{orderId,reference,actor,notes=''}) {\n ensureOps(s);const o=order(s,orderId),ref=str(reference,'Supplier confirmation reference',4,180),who=str(actor,'Person recording confirmation',3,120);\n if(s.supplierAcknowledgements.some(x=\u003ex.orderId===o.id\u0026\u0026x.reference.toLowerCase()===ref.toLowerCase()))throw Error('Confirmation reference already recorded on this PO');\n const a={id:uid('ack'),projectId:o.projectId,orderId:o.id,reference:ref,actor:who,notes:String(notes||'').trim().slice(0,1000),recordedAt:now(),nature:'Manual confirmation reference, not supplier-verified'};\n s.supplierAcknowledgements.push(a);audit(s,'Supplier acknowledgement recorded',o.code+' / '+ref);return a;\n}\nexport function recordedAcceptedQuantity(s,orderId,lineId){\n return Math.max(0,(s.procurementReceipts||[]).filter(r=\u003er.orderId===orderId\u0026\u0026r.lineId===lineId)\n  .reduce((n,r)=\u003en+Number(r.quantity||0)-Number(r.returned||0),0));\n}\nexport function invoiceMatch(s,invoice){\n const o=s.orders?.find(x=\u003ex.id===invoice.orderId),line=o?.items?.find(x=\u003ex.id===invoice.lineId);\n if(!o||!line)return {matched:false,reasons:['Original PO line missing']};\n const accepted=recordedAcceptedQuantity(s,o.id,line.id);\n const invoices=(s.supplierInvoices||[]).filter(x=\u003ex.id!==invoice.id\u0026\u0026x.orderId===o.id\u0026\u0026x.lineId===line.id);\n const already=invoices.reduce((n,x)=\u003en+Number(x.quantity||0),0);\n const reasons=[];\n if(accepted\u003calready+Number(invoice.quantity||0))reasons.push('Invoiced quantity exceeds QA-accepted net goods');\n if(Number(invoice.unitPrice)\u003eNumber(line.unitCost)+0.00001)reasons.push('Supplier invoice unit price exceeds recorded PO');\n if(invoice.currency!==o.currency)reasons.push('Invoice currency differs from PO');\n if(Number(invoice.taxRate)!==Number(o.taxRate||0))reasons.push('Invoice tax assumption differs from PO');\n if(Number(invoice.quantity)\u003eNumber(line.quantity))reasons.push('Invoiced quantity exceeds ordered quantity');\n return {matched:reasons.length===0,reasons,accepted,already,orderQuantity:Number(line.quantity),poUnitPrice:Number(line.unitCost||0)};\n}\nexport function recordSupplierInvoice(s,{orderId,lineId,invoiceRef,quantity,unitPrice,taxRate,currency,evidenceRef,actor}){\n ensureOps(s);const {o,line}=orderLine(s,orderId,lineId);\n const ref=str(invoiceRef,'Actual supplier invoice number',4,160),who=str(actor,'Person recording invoice',3,120);\n const original=String(currency||o.currency);\n if(s.supplierInvoices.some(x=\u003ex.projectId===o.projectId\u0026\u0026x.supplier===o.supplier\u0026\u0026x.invoiceRef.toLowerCase()===ref.toLowerCase()))\n  throw Error('Duplicate supplier invoice number. One invoice reference per recorded line is supported; do not split an invoice across records');\n const invoice={id:uid('invoice'),projectId:o.projectId,supplier:o.supplier,orderId:o.id,lineId:line.id,\n  invoiceRef:ref,quantity:qty(quantity,'Invoice quantity'),unitPrice:euros(unitPrice,'Invoice unit price',true),\n  taxRate:euros(taxRate??o.taxRate??0,'Invoice tax percentage',true),currency:original,\n  evidenceRef:str(evidenceRef,'Actual supplier invoice/evidence reference',4,240),actor:who,recordedAt:now(),\n  nature:'Owner-entered supplier invoice register; not posted accounting or proof of payment'};\n if(invoice.taxRate\u003e100)throw Error('Invoice tax percentage exceeds 100%');\n if(!['EUR','GBP','USD','CAD'].includes(original))throw Error('Unsupported invoice currency');\n // Exception invoices may be recorded, never silently marked matched or paid.\n s.supplierInvoices.push(invoice);\n audit(s,'Supplier invoice manually recorded',o.code+' / '+ref+' / '+(invoiceMatch(s,invoice).matched?'matching candidate':'UNMATCHED EXCEPTION'));\n return invoice;\n}\nexport function paymentBalance(s,invoiceId){\n ensureOps(s);const inv=s.supplierInvoices.find(x=\u003ex.id===invoiceId);\n if(!inv)throw Error('Supplier invoice not found');\n const due=round(inv.quantity*inv.unitPrice*(1+inv.taxRate/100));\n const paid=round(s.supplierPayments.filter(x=\u003ex.invoiceId===invoiceId).reduce((n,x)=\u003en+x.amount,0));\n return {invoice:inv,due,paid,remaining:round(due-paid)};\n}\nexport function recordSupplierPayment(s,{invoiceId,amount,reference,actor}){\n const {invoice,remaining}=paymentBalance(s,invoiceId);\n if(!invoiceMatch(s,invoice).matched)throw Error('Payment record blocked: PO, QA receipt and invoice are not three-way matched');\n if((s.qualityNCRs||[]).some(n=\u003en.projectId===invoice.projectId\u0026\u0026n.orderId===invoice.orderId\u0026\u0026n.lineId===invoice.lineId\u0026\u0026n.status==='Open'))\n  throw Error('Payment record blocked while a linked NCR remains open');\n const value=euros(amount,'Recorded payment amount');\n if(value\u003eremaining+.00001)throw Error('Payment exceeds remaining invoiced balance');\n const ref=str(reference,'Bank/transfer payment reference',5,180),who=str(actor,'Person recording payment',3,120);\n if(s.supplierPayments.some(p=\u003ep.projectId===invoice.projectId\u0026\u0026p.reference.toLowerCase()===ref.toLowerCase()))\n  throw Error('Duplicate payment reference');\n const p={id:uid('pay'),invoiceId,orderId:invoice.orderId,lineId:invoice.lineId,projectId:invoice.projectId,\n  amount:value,currency:invoice.currency,reference:ref,actor:who,recordedAt:now(),\n  nature:'Manually recorded external payment; never initiates bank transfer'};\n s.supplierPayments.push(p);audit(s,'External payment manually recorded',invoice.invoiceRef+' / '+ref);\n return p;\n}\nexport function recordNCR(s,{projectId,taskId,orderId='',lineId='',finding,correctiveAction,owner,evidenceRef}){\n ensureOps(s);\n const t=s.tasks?.find(x=\u003elive(x)\u0026\u0026x.id===taskId\u0026\u0026x.projectId===projectId);if(!t)throw Error('NCR needs a job within the selected project');\n if(orderId){const {o}=orderLine(s,orderId,lineId);if(o.projectId!==projectId)throw Error('NCR PO belongs to another project');}\n else if(lineId)throw Error('NCR line requires a recorded PO');\n const n={id:uid('ncr'),projectId,taskId,orderId:orderId||null,lineId:lineId||null,\n  finding:str(finding,'Nonconformance finding',8,1500),correctiveAction:str(correctiveAction,'Proposed corrective action',8,1500),\n  owner:str(owner,'Responsible corrective-action owner',3,120),evidenceRef:str(evidenceRef,'Observed evidence reference',4,240),\n  status:'Open',createdAt:now(),closure:null};\n s.qualityNCRs.push(n);audit(s,'NCR opened',n.id+' / '+t.title);return n;\n}\nexport function closeNCR(s,{ncrId,retestEvidence,reviewer,actionTaken}){\n ensureOps(s);const n=s.qualityNCRs.find(x=\u003ex.id===ncrId\u0026\u0026x.status==='Open');\n if(!n)throw Error('Open NCR not found');\n n.closure={at:now(),retestEvidence:str(retestEvidence,'Actual retest/inspection evidence',4,240),\n  reviewer:str(reviewer,'Person recording closure',3,120),actionTaken:str(actionTaken,'Corrective action completed',8,1500)};\n n.status='Closed';audit(s,'NCR manually closed after recorded retest',n.id+' / '+n.closure.reviewer);return n;\n}\nexport function saveJobAssurance(s,{taskId,criteria='',blocker='',delayReason='',estimatedHours='',actualHours='',technicalRevision='',reviewer}){\n const t=s.tasks?.find(x=\u003elive(x)\u0026\u0026x.id===taskId);if(!t)throw Error('Active job not found');\n const who=str(reviewer,'Person recording job plan',3,120);\n const hours=(v,label)=\u003e{if(v===''||v===null||v===undefined)return null;const n=Number(v);if(!Number.isFinite(n)||n\u003c0||n\u003e100000||Math.abs(n*4-Math.round(n*4))\u003e.000001)throw Error(label+' must be in quarter-hour increments');return n};\n const next={criteria:String(criteria||'').trim().slice(0,2200),blocker:String(blocker||'').trim().slice(0,1000),\n  delayReason:String(delayReason||'').trim().slice(0,1000),estimatedHours:hours(estimatedHours,'Estimated hours'),\n  actualHours:hours(actualHours,'Actual hours'),technicalRevision:String(technicalRevision||'').trim().slice(0,160),\n  reviewer:who,recordedAt:now()};\n if(t.jobAssurance){t.jobAssuranceHistory??=[];t.jobAssuranceHistory.push({...t.jobAssurance})}\n t.jobAssurance=next;audit(s,'Job quality and readiness plan revised',t.id+' / '+who);return next;\n}\nexport function attentionItems(s,projectId,today=new Date().toISOString().slice(0,10)){\n ensureOps(s);\n const items=[],push=(priority,type,title,detail,tab,id='')=\u003eitems.push({priority,type,title,detail,tab,id});\n const tasks=(s.tasks||[]).filter(t=\u003elive(t)\u0026\u0026t.projectId===projectId);\n for(const t of tasks){\n  if(t.status==='Done'||t.status==='Cancelled')continue;\n  if(!t.assignee||t.assignee==='Unassigned')push(2,'Job owner',t.title,'Assign a responsible person','work',t.id);\n  if(t.due\u0026\u0026t.due\u003ctoday)push(1,'Overdue job',t.title,'Due '+t.due+'; record the reason for delay','work',t.id);\n  if(t.status==='Blocked'\u0026\u0026!t.jobAssurance?.blocker)push(1,'Blocked job',t.title,'State the blocker and proposed resolution','work',t.id);\n  if(t.status==='Inspection'\u0026\u0026!t.jobAssurance?.criteria)push(2,'Acceptance criteria',t.title,'Define what passing inspection means','work',t.id);\n }\n for(const t of flaggedUnspecifiedPurchases(s,projectId))push(1,'Buy flag',t.title,'Add exact item, specification and quantity; no order exists','work',t.id);\n for(const o of (s.assemblyBOM||[]).filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId\u0026\u0026x.makeBuy!=='Make'\u0026\u0026x.purchaseSource?.responsibility==='Sim-Worx')){\n  if(!String(o.purchaseSource?.quoteRef||'').trim())push(1,'Quotation evidence','Requirement '+o.id,'No recorded supplier quote reference or price evidence','procurement',o.id);\n  if(!String(o.purchaseSource?.vendorSku||'').trim())push(1,'Exact supplier model','Requirement '+o.id,'Choose exact product/model, not a generic order description','procurement',o.id);\n  try{\n   const approval=approvalStatus(s,o.id);\n   if(!approval.approved)push(2,'PO hold','Requirement '+o.id,approval.status,'procurement',o.id);\n  }catch{push(1,'Source integrity','Requirement '+o.id,'Cannot resolve approval/source','procurement',o.id);}\n }\n const project=s.projects?.find(p=\u003ep.id===projectId);\n const orders=(s.orders||[]).filter(o=\u003elive(o)\u0026\u0026o.projectId===projectId);\n const committed=orders.reduce((sum,o)=\u003e{\n  const rate=o.currency==='EUR'?1:Number(o.eurExchangeRate||0);\n  if(!Number.isFinite(rate)||rate\u003c=0){push(1,'Currency evidence',o.code,'Recorded foreign-currency PO needs a verified EUR rate','operations',o.id);return sum}\n  return sum+(o.items||[]).reduce((sub,l)=\u003esub+Math.max(0,Number(l.quantity||0)-Number(l.closedQuantity||0))*Number(l.unitCost||0)*rate*(1+Number(o.taxRate||0)/100),0);\n },0);\n if(project\u0026\u0026orders.length\u0026\u0026(!Number.isFinite(Number(project.budget))||Number(project.budget)\u003c=0))\n  push(1,'Budget exception',project.name,'Actual recorded POs exist but no valid internal purchasing budget is recorded','team');\n if(project\u0026\u0026Number(project.budget)\u003e0\u0026\u0026committed\u003eNumber(project.budget)+0.00001)\n  push(1,'Budget exceeded',project.name,'Recorded order commitments exceed the internal purchasing budget; verify immediately','team');\n if(project\u0026\u0026!contractControlled(s,projectId))push(1,'Purchasing gate',project.name,'New POs BLOCKED: explicitly enable controlled purchasing after migration review','attention');\n for(const o of (s.orders||[]).filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId)){\n  const ack=s.supplierAcknowledgements.some(x=\u003ex.orderId===o.id);\n  if(!ack)push(2,'Supplier confirmation',o.code,'No separately recorded supplier acknowledgement','operations',o.id);\n  for(const l of (o.items||[])){\n   const open=Number(l.quantity||0)-Number(l.received||0)-Number(l.closedQuantity||0);\n   if(open\u003e0\u0026\u0026l.eta\u0026\u0026l.eta\u003ctoday)push(1,'Delayed delivery',o.code,'Line '+l.id+' overdue since '+l.eta,'operations',o.id);\n   if(recordedAcceptedQuantity(s,o.id,l.id)\u003e0\u0026\u0026!(s.supplierInvoices||[]).some(i=\u003ei.lineId===l.id\u0026\u0026i.orderId===o.id))\n     push(2,'Invoice missing',o.code,'Accepted line '+l.id+' has no recorded supplier invoice','operations',o.id);\n  }\n }\n for(const a of (s.procurementArrivals||[]).filter(x=\u003ex.status==='Rejected'||x.status==='Rejected / return required')){\n  const o=s.orders?.find(x=\u003ex.id===a.orderId\u0026\u0026x.projectId===projectId);\n  if(o)push(1,'Rejected delivery',o.code,'Rejected goods '+a.id+' require return/replacement action and NCR review','procurement',a.lineId);\n }\n for(const a of (s.procurementArrivals||[]).filter(x=\u003ex.status==='Awaiting inspection')){\n  const o=s.orders?.find(x=\u003ex.id===a.orderId\u0026\u0026x.projectId===projectId);if(o)push(1,'Awaiting QA',o.code,'Arrival '+a.id+' not inspected','procurement',a.lineId);\n }\n for(const n of s.qualityNCRs.filter(x=\u003ex.projectId===projectId\u0026\u0026x.status==='Open'))\n  push(1,'Open NCR',n.id,n.finding,'operations',n.orderId||n.taskId);\n for(const invoice of s.supplierInvoices.filter(x=\u003ex.projectId===projectId)){\n  const match=invoiceMatch(s,invoice);\n  if(!match.matched)push(1,'Three-way mismatch',invoice.invoiceRef,match.reasons.join('; '),'operations',invoice.orderId);\n  else if(paymentBalance(s,invoice.id).remaining\u003e0)push(2,'Unpaid invoice record',invoice.invoiceRef,'External payment not fully recorded — not an instruction to pay','operations',invoice.orderId);\n }\n items.sort((a,b)=\u003ea.priority-b.priority||a.type.localeCompare(b.type)||a.title.localeCompare(b.title));\n return items;\n}\n\nexport function enableControlledPurchasing(s,{projectId,reviewer,reviewReference}){\n ensureOps(s);\n const p=s.projects?.find(x=\u003elive(x)\u0026\u0026x.id===projectId);\n if(!p)throw Error('Active project not found');\n if(contractControlled(s,projectId))throw Error('Project already has controlled purchasing');\n const who=str(reviewer,'Owner activating strict purchase control',3,120);\n const ref=str(reviewReference,'Purchasing migration/review reference',8,240);\n // Past orders are preserved without reclassifying them as approved or authorizing edits.\n p.specGateRequired=true;\n p.purchaseGateActivation={at:now(),reviewer:who,reviewReference:ref,\n   note:'Historical orders NOT retroactively approved; all NEW orders require exact source, technical and owner approval'};\n audit(s,'Strict future purchasing gate activated',p.id+' / '+ref+' / existing PO history unaffected');\n return p;\n}\n","ops-ui-v052.mjs":"/* V0.5.2 — deliberately manual owner-only operations view, no network, no bank activity. */\nimport {attentionItems,invoiceMatch,paymentBalance,recordedAcceptedQuantity} from './ops-v052.mjs';\nimport {contractControlled} from './procurement-workflow-v047.mjs';\nconst e=v=\u003eString(v??'').replace(/[\u0026\u003c\u003e\"']/g,c=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;','\"':'\u0026quot;',\"'\" :'\u0026#39;'}[c]));\nconst money=(v,c='EUR')=\u003enew Intl.NumberFormat('en-GB',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(v)||0);\nconst btn=(label,action,id='',extras='')=\u003e'\u003cbutton type=\"button\" class=\"btn small '+extras+'\" data-action=\"'+e(action)+'\" data-id=\"'+e(id)+'\"\u003e'+e(label)+'\u003c/button\u003e';\nconst hidden=(n,v)=\u003e'\u003cinput type=\"hidden\" name=\"'+e(n)+'\" value=\"'+e(v)+'\"\u003e';\nconst field=(title,n,value='',type='text',attrs='')=\u003e'\u003clabel class=\"v52-field\"\u003e\u003cspan\u003e'+e(title)+'\u003c/span\u003e\u003cinput name=\"'+e(n)+'\" type=\"'+type+'\" value=\"'+e(value)+'\" '+attrs+'\u003e\u003c/label\u003e';\nconst option=(rows,selected='')=\u003erows.map(([id,name])=\u003e'\u003coption value=\"'+e(id)+'\" '+(String(id)===String(selected)?'selected':'')+'\u003e'+e(name)+'\u003c/option\u003e').join('');\nconst form=(type,title,fields)=\u003e'\u003cform class=\"v52-form\" data-form=\"'+e(type)+'\"\u003e\u003ch4\u003e'+e(title)+'\u003c/h4\u003e'+fields+'\u003cbutton class=\"btn small primary\"\u003eRecord manually\u003c/button\u003e\u003c/form\u003e';\nexport function renderAttention(s,ui,projectId){\n const p=s.projects.find(x=\u003ex.id===projectId),list=attentionItems(s,projectId);\n const counts=[[1,'Urgent'],[2,'Follow-up']].map(([n,name])=\u003e[name,list.filter(x=\u003ex.priority===n).length]);\n const gate=!contractControlled(s,projectId)?'\u003csection class=\"v52-warning\"\u003e\u003ch4\u003eNew supplier orders are blocked for this project\u003c/h4\u003e'+\n '\u003cp\u003eTo start genuine purchasing: first review any old PO history, confirm a private internal spend budget, map exact engineering requirements and enable the strict owner-approved purchase workflow. This action does NOT
