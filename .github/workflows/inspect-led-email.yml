name: Inspect live LED email implementation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-led-email.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect LED handler integration safely
        run: |
          python3 - <<'PY'
          import ftplib,os,ssl,re
          from urllib.parse import urlsplit
          class F(ftplib.FTP_TLS):
              prefer_epsv=False
              def makepasv(self):
                  if self.prefer_epsv:
                      try:return ftplib.parse229(self.sendcmd("EPSV"),self.sock.getpeername())
                      except ftplib.error_perm:pass
                  return super().makepasv()
              def ntransfercmd(self,c,rest=None):
                  try:return super().ntransfercmd(c,rest)
                  except ftplib.error_temp as e:
                      if str(e).startswith("425") and not self.prefer_epsv:
                          self.prefer_epsv=True;return super().ntransfercmd(c,rest)
                      raise
          raw=os.environ["FTP_HOST"].strip();p=urlsplit(raw if "://" in raw else "ftp://"+raw)
          f=F(context=ssl.create_default_context(),timeout=45);f.connect(p.hostname,p.port or 21);f.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]);f.prot_p()
          def read(path):
              c=[];f.retrbinary("RETR "+path,c.append);return b"".join(c).decode("utf-8","replace")
          led=read("/htdocs/led-quote-submit.php")
          anti=read("/htdocs/forms/anti-spam.php")
          f.quit()
          for name,text,needle in [
              ("LED",led,"function simworxLedQuoteActionHandler"),
              ("LED",led,"$send="),
              ("LED",led,"function_exists('mail')"),
              ("ANTI",anti,"function "),
          ]:
              i=text.find(needle)
              print("\n###",name,needle,"AT",i)
              if i>=0:
                  frag=text[max(0,i-2500):min(len(text),i+14000)]
                  frag=re.sub(r'(?i)(password|passwd|secret|token|api[_-]?key)\s*([=:>]+)\s*[^,;\s]+',r'\\1\\2[REDACTED]',frag)
                  print(frag)
          print("\nANTI_FUNCTIONS")
          for m in re.finditer(r'function\s+([A-Za-z0-9_]+)\s*\(([^)]*)\)',anti):
              print(m.group(1),m.group(2)[:400])
          PY
