name: Capture live Projection email response
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-projection-email-response.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Capture response body
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-unsafe-swiftshader'])
              p=b.new_page(viewport={'width':1600,'height':1000})
              p.add_init_script("""
                window.turnstile={
                  render:(el,opts)=>{
                    const input=document.createElement('input');
                    input.type='hidden';input.name='cf-turnstile-response';input.value='test-token';
                    el.appendChild(input);setTimeout(()=>opts.callback?.('test-token'),0);return 77;
                  },
                  getResponse:id=>id===77?'test-token':'',
                  reset:()=>{}
                };
              """)
              captured=[]
              def resp(r):
                  if 'led-quote-submit.php' in r.url:
                      try: body=r.text()
                      except Exception as e: body='[read error '+repr(e)+']'
                      captured.append({'status':r.status,'headers':dict(r.headers),'body':body[:5000]})
              p.on('response',resp)
              p.goto('https://www.sim-worx.com/projection-screen-configurator.html?capture-response=1',wait_until='domcontentloaded',timeout=60000)
              p.wait_for_timeout(1800)
              p.locator('[data-guided-go="2"]').click();p.wait_for_timeout(450)
              p.locator('[data-guided-go="3"]').click();p.wait_for_timeout(600)
              calc=p.locator('#guided-calculate');calc.click()
              for _ in range(300):
                  if p.locator('#guided-result').is_visible() and not calc.is_disabled(): break
                  p.wait_for_timeout(100)
              p.wait_for_timeout(700)
              p.locator('[data-guided-go="4"]').click();p.wait_for_timeout(1100)
              if p.locator('#v39-country').count():p.locator('#v39-country').select_option('GB')
              if p.locator('#v37-customer-type').count():p.locator('#v37-customer-type').select_option('business')
              p.wait_for_timeout(250)
              p.locator('#v37-email-proposal').click();p.wait_for_timeout(250)
              p.locator('#v37-email-address').fill('mark@sim-worx.com')
              p.locator('#v37-email-name').fill('Mark')
              p.locator('#v37-email-send').click();p.wait_for_timeout(3000)
              print('CAPTURED',captured)
              print('STATUS',p.locator('#v37-email-status').text_content() or '')
              b.close()
          PY
