name: Read live intelligence trackers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-live-intelligence-trackers.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read tracker sources
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,hashlib
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          for name in ['simworx-intelligence-bootstrap-v1.js','simworx-intelligence-bootstrap-v2.js','simworx-intelligence-tracker-v1.js','simworx-intelligence-tracker-v2.js','simworx-intelligence-configurator-v1.js','simworx-intelligence-configurator-v2.js']:
            path='/htdocs/assets/js/'+name
            out=[];f.retrbinary('RETR '+path,out.append);body=b''.join(out).decode('utf-8','replace')
            print('\n###FILE',name,'LEN',len(body),'SHA',hashlib.sha256(body.encode()).hexdigest())
            print(body)
          f.quit()
          PY
