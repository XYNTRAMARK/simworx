table class=\"v46-table v46-buy-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePart / requirement\u003c/th\u003e\u003cth\u003eAssembly\u003c/th\u003e\u003cth\u003eQty\u003c/th\u003e\u003cth\u003eSource\u003c/th\u003e'+\n  '\u003cth\u003eGap*\u003c/th\u003e\u003cth\u003eReview status\u003c/th\u003e\u003cth\u003eNeed-by / latest PO date\u003c/th\u003e\u003cth\u003eAction\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e'+\n  (eligible.map(stateLine).join('')||'\u003ctr\u003e\u003ctd colspan=\"8\"\u003eNo requirements match this filter.\u003c/td\u003e\u003c/tr\u003e')+\n  '\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e'+\n  '\u003cp class=\"v46-small\"\u003e* Gap is aggregated for the same stock part across the entire project, including outstanding PO quantities. Repeated part identities therefore share the same project-wide gap and must not be added together. “Plan” only saves dates/assumptions; it does not place an order, approve a quote or change stock.\u003c/p\u003e'+\n  '\u003cdiv class=\"v46-mini-links\"\u003e'+button('Department purchasing responsibility','team')+button('Schedule work','work')+\n  button('External supplier handoffs','external')+'\u003c/div\u003e\u003c/section\u003e';\n}\nexport function saveBuyingReviewForm(s,form){\n const f=new FormData(form),value=key=\u003eString(f.get(key)||'').trim();\n const source=sourceInput({responsibility:value('responsibility')||'Unverified',supplier:value('supplier'),productUrl:value('productUrl'),vendorSku:value('vendorSku'),\n  quoteRef:value('quoteRef'),notes:value('sourceNotes')});\n const plan=saveRequirementPlan(s,{occurrenceId:value('occurrenceId'),requiredBy:value('requiredBy'),\n  leadDays:value('leadDays'),bufferDays:value('bufferDays'),linkedTaskId:value('linkedTaskId'),\n  note:value('note')});\n saveRequirementSource(s,{occurrenceId:value('occurrenceId'),...source});\n return plan;\n}\n","procurement-sourcing-v046.mjs":"/* V0.4.7 sourcing and purchase-history links. Staff-entered metadata only.\n No online lookup, automatic POs, inferred quote approval or stock changes. */\nimport {contractControlled,assertContractPOGate} from './procurement-workflow-v047.mjs';\nconst now=()=\u003enew Date().toISOString();\nconst max=(v,n,label)=\u003e{const s=String(v??'').trim();if(s.length\u003en)throw Error(label+' exceeds '+n+' characters');return s;};\nexport function safeProductURL(value){\n const raw=max(value,2048,'Product URL');\n if(!raw)return '';\n let u;try{u=new URL(raw);}catch{throw Error('Product URL must be a complete HTTPS link');}\n if(u.protocol!=='https:'||!u.hostname||u.username||u.password)\n  throw Error('Product URL must be HTTPS without embedded account credentials');\n return u.href;\n}\nexport function sourceInput({supplier='',productUrl='',vendorSku='',quoteRef='',notes='',responsibility='Unverified'}={}){\n if(!['Unverified','Sim-Worx','Customer-direct','Subcontractor'].includes(responsibility))\n  throw Error('Invalid purchasing responsibility');\n return {responsibility,supplier:max(supplier,160,'Supplier'),productUrl:safeProductURL(productUrl),\n  vendorSku:max(vendorSku,120,'Supplier part number'),quoteRef:max(quoteRef,120,'Quote reference'),\n  notes:max(notes,800,'Sourcing notes')};\n}\nconst plain=v=\u003eJSON.stringify(v);\nexport function saveRequirementSource(s,{occurrenceId,...data}){\n const occ=s.assemblyBOM?.find(x=\u003ex.id===occurrenceId\u0026\u0026!x.archivedAt);\n if(!occ)throw Error('Material requirement not found');\n const next=sourceInput(data),old=occ.purchaseSource||{};\n if(plain(next)===plain({responsibility:old.responsibility||'Unverified',supplier:old.supplier||'',productUrl:old.productUrl||'',\n   vendorSku:old.vendorSku||'',quoteRef:old.quoteRef||'',notes:old.notes||''}))return occ;\n occ.purchaseSourceHistory??=[];\n if(occ.purchaseSource?.updatedAt)occ.purchaseSourceHistory.push({...occ.purchaseSource});\n occ.purchaseSource={...next,updatedAt:now()};\n s.audit??=[];s.audit.unshift({id:'audit-'+Math.random().toString(36).slice(2,12),\n  action:'Sourcing reference edited',detail:'Requirement '+occ.id+' / supplier '+(next.supplier||'unconfirmed'),\n  actor:'Local staff',at:now()});\n return occ;\n}\nconst positive=(v,label)=\u003e{const n=Number(v);if(!Number.isSafeInteger(n)||n\u003c=0||n\u003e1e7)throw Error(label+' must be a positive whole number');return n;};\nconst price=(v)=\u003e{const n=Number(v);if(!Number.isFinite(n)||n\u003c0||n\u003e1e10||Math.abs(n*100-Math.round(n*100))\u003e0.00001)throw Error('Unit cost must be a non-negative amount with at most two decimals');return Math.round(n*100)/100;};\nconst etaDate=value=\u003e{const s=max(value,10,'ETA');if(s\u0026\u0026!/^\\d{4}-\\d{2}-\\d{2}$/.test(s))throw Error('ETA must be YYYY-MM-DD');if(s\u0026\u0026new Date(s+'T12:00:00Z').toISOString().slice(0,10)!==s)throw Error('Invalid ETA');return s;};\nexport function updatePurchaseLineRecord(s,{orderId,lineId,quantity,unitCost,eta,productUrl='',vendorSku='',quoteRef='',notes='',reason=''}){\n const order=s.orders?.find(o=\u003eo.id===orderId\u0026\u0026!o.archivedAt);\n if(!order)throw Error('Purchase order not found');\n const line=order.items?.find(l=\u003el.id===lineId);\n if(!line)throw Error('Order line not found');\n const qty=positive(quantity,'Order quantity'),cost=price(unitCost);\n if(qty\u003cNumber(line.received||0)+Number(line.closedQuantity||0))throw Error('Quantity cannot be less than received + confirmed closed balance');\n if(Number(line.closedQuantity||0)\u003e0\u0026\u0026qty!==Number(line.quantity||0))\n  throw Error('Reopen a closed supplier balance before changing its ordered quantity');\n if(Number(line.received||0)\u003e0\u0026\u0026cost!==Number(line.unitCost||0))\n  throw Error('Received items have locked unit prices; keep history and handle price corrections separately');\n const next={quantity:qty,unitCost:cost,eta:etaDate(eta),productUrl:safeProductURL(productUrl),\n  vendorSku:max(vendorSku,120,'Vendor part number'),quoteRef:max(quoteRef,120,'Supplier quote reference'),notes:max(notes,800,'Purchase note')};\n if(['quantity','unitCost','productUrl','vendorSku','quoteRef']\n  .some(k=\u003eString(line[k]??'')!==String(next[k]??'')))\n  throw Error('Recorded supplier PO financial/identity values are historical evidence and cannot be overwritten, even for legacy orders. Close the remaining balance with a reason; record a corrected, separately approved PO.');\n const prior=Object.fromEntries(Object.keys(next).map(k=\u003e[k,line[k]??'']));\n const identityChange=['productUrl','vendorSku','quoteRef'].some(k=\u003e(line[k]||'')!==(next[k]||''));\n let verified=null;\n if(contractControlled(s,order.projectId)\u0026\u0026identityChange){\n  if(Number(line.received||0)\u003e0)throw Error('Cannot replace the specified model on a line with accepted receipts. Create a corrected purchase and return goods separately.');\n  verified=assertContractPOGate(s,order.projectId,{partId:line.partId,sourceOccurrenceId:line.sourceOccurrenceId,\n   productUrl:next.productUrl,vendorSku:next.vendorSku,quoteRef:next.quoteRef},order.supplier);\n }\n if(JSON.stringify(prior)===JSON.stringify(next))return line;\n const explanation=max(reason,300,'Change reason');\n if(explanation.length\u003c5)throw Error('Explain the confirmed supplier amendment (at least 5 characters)');\n line.revisions??=[];line.revisions.push({at:now(),reason:explanation,before:prior,after:next});\n Object.assign(line,next);\n if(verified)line.specificationEvidence=verified;\n s.audit??=[];s.audit.unshift({id:'audit-'+Math.random().toString(36).slice(2,12),actor:'Local staff',\n  action:'Purchase order line edited',detail:order.code+' / '+line.id,at:now()});\n return line;\n}\n","procurement-workflow-v047.mjs":"/* V0.4.7 supplier workflow and contract specification guard.\n   No remote verification, supplier communication, document transmission or stock accounting.\n   Customer contract information lives only in the user's private imported workspace. */\nconst stamp=()=\u003enew Date().toISOString();\nconst id=(p)=\u003ep+'-'+Math.random().toString(36).slice(2,12);\nconst clean=(v,max=800)=\u003e{const s=String(v??'').trim();if(s.length\u003emax)throw Error('Entry exceeds '+max+' characters');return s;};\nconst valid=(v,label,min=1,max=240)=\u003e{const s=clean(v,max);if(s.length\u003cmin)throw Error(label+' needs at least '+min+' character(s)');return s;};\nconst live=x=\u003ex\u0026\u0026!x.archivedAt;\nconst sourceKey=o=\u003eJSON.stringify([o?.responsibility||'Unverified',o?.supplier||'',o?.productUrl||'',\n o?.vendorSku||'',o?.quoteRef||'']);\nexport function contractControlled(s,projectId){\n const project=s.projects?.find(p=\u003elive(p)\u0026\u0026p.id===projectId);\n if(!project)return false;\n if(project.specGateRequired===true)return true;\n const provenance=s.dataProvenance;\n if(provenance?.type!=='contract-initialization')return false;\n if(provenance.projectId)return provenance.projectId===projectId;\n const projects=(s.projects||[]).filter(live);\n return projects.length===1?projects[0].id===projectId:projects[0]?.id===projectId;\n}\nexport function requirementBaseline(s,occurrenceId){\n const occ=s.assemblyBOM?.find(o=\u003elive(o)\u0026\u0026o.id===occurrenceId);\n if(!occ)throw Error('Active engineering requirement not found');\n const part=s.parts?.find(p=\u003elive(p)\u0026\u0026p.id===occ.partId);\n if(!part)throw Error('Engineering part master missing');\n return {occ,part,projectId:occ.projectId,\n  label:part.name||part.code||'Unnamed requirement',\n  partCode:part.code||'',notes:String(part.notes||'').trim(),\n  requirementNotes:String(occ.notes||'').trim(),\n  quantity:Number(occ.quantity||0),makeBuy:occ.makeBuy||'Buy'};\n}\nexport function specFingerprint(s,occurrenceId){\n const b=requirementBaseline(s,occurrenceId),occ=b.occ;\n return JSON.stringify([b.partCode,b.label,b.notes,b.requirementNotes,b.quantity,b.makeBuy,\n  sourceKey(occ.purchaseSource),JSON.stringify(occ.sourceTrace||null)]);\n}\nexport function specStatus(s,occurrenceId){\n const b=requirementBaseline(s,occurrenceId),v=b.occ.specReview;\n if(!v)return {status:'Unverified',approved:false,reason:'Not compared with controlled contract and drawings'};\n if(v.fingerprint!==specFingerprint(s,occurrenceId))\n  return {status:'Stale',approved:false,reason:'Source item, specification or purchasing responsibility has changed'};\n return {status:v.decision,approved:v.decision==='Matches contract',reason:v.notes||''};\n}\nexport function reviewRequirementSpec(s,{occurrenceId,decision,proposedSpecification,reviewer,evidenceRef,notes=''}){\n const baseline=requirementBaseline(s,occurrenceId),occ=baseline.occ;\n const options=['Matches contract','Deviation proposed','Does not comply'];\n if(!options.includes(decision))throw Error('Choose a specification review decision');\n const source=occ.purchaseSource||{};\n if(decision==='Matches contract'\u0026\u0026source.responsibility!=='Sim-Worx')\n  throw Error('Assign internal buying responsibility before approving an internal PO');\n const candidate=valid(proposedSpecification,'Proposed supplier model and technical specification',10,1500);\n const person=valid(reviewer,'Person who compared specifications',3,160);\n const ref=valid(evidenceRef,'Controlled drawing/contract comparison reference',4,240);\n const explanation=valid(notes,'Evidence and reason for this conclusion',8,1200);\n const previous=occ.specReview;\n occ.specReviewHistory??=[];\n if(previous)occ.specReviewHistory.push({...previous});\n occ.specReview={decision,proposedSpecification:candidate,reviewer:person,evidenceRef:ref,notes:explanation,\n  fingerprint:specFingerprint(s,occurrenceId),checkedAt:stamp(),\n  baseline:{partCode:baseline.partCode,label:baseline.label,partNotes:baseline.notes,requirementNotes:baseline.requirementNotes}};\n s.audit??=[];s.audit.unshift({id:id('audit'),at:stamp(),actor:person,action:'Specification comparison recorded',\n  detail:baseline.partCode+' / '+decision+' / evidence '+ref});\n return occ.specReview;\n}\nexport function assertContractPOGate(s,projectId,input,supplier){\n if(!contractControlled(s,projectId))return null;\n const applicable=(s.assemblyBOM||[]).filter(o=\u003elive(o)\u0026\u0026o.projectId===projectId\u0026\u0026o.partId===input.partId);\n if(!applicable.length)throw Error('Contract-controlled purchase must reference an approved engineering requirement. Add and review the BOM line first');\n const occ=applicable.find(o=\u003eo.id===input.sourceOccurrenceId);\n if(!occ)throw Error('Select the specific contract requirement before recording a supplier purchase');\n if(occ.makeBuy==='Make')throw Error('This requirement is marked for in-house manufacture; engineering must review its source classification');\n if(occ.purchaseSource?.responsibility!=='Sim-Worx')throw Error('Confirm Sim-Worx purchasing responsibility before placing its order');\n const review=specStatus(s,occ.id);\n if(!review.approved)throw Error('Purchase blocked: contract specification check is '+review.status+'. Open Review specification on the requirement');\n const source=occ.purchaseSource||{},expectedSupplier=(source.supplier||'').trim();\n if(!expectedSupplier||expectedSupplier.toLowerCase()!==String(supplier||'').trim().toLowerCase())\n  throw Error('Purchase supplier differs from the verified source; review its specifications again');\n for(const field of ['productUrl','vendorSku','quoteRef']){\n  if((source[field]||'')!==String(input[field]||'').trim())\n   throw Error('Purchase '+field+' differs from the verified item; update the source and repeat the spec check');\n }\n if(!input.productUrl\u0026\u0026!input.vendorSku\u0026\u0026!input.quoteRef)\n  throw Error('At least one verified product URL, vendor SKU or quotation reference is required');\n return {occurrenceId:occ.id,status:'Verified against recorded source',reviewedAt:occ.specReview.checkedAt,\n  reviewer:occ.specReview.reviewer,evidenceRef:occ.specReview.evidenceRef,sourceFingerprint:occ.specReview.fingerprint};\n}\nexport const sourcingStages=['Research','RFQ requested','Quote received','On hold','Change requested','Replacement requested'];\nexport function setSourcingStage(s,{occurrenceId,stage,reason}){\n const b=requirementBaseline(s,occurrenceId);\n if(!sourcingStages.includes(stage))throw Error('Use a planning stage; Ordered and Received require actual PO and receipt records');\n const note=valid(reason,'Reason / supplier communication reference',5,500);\n const old=b.occ.sourcingStage||'Research';\n if(old===stage)return b.occ;\n b.occ.sourcingStageHistory??=[];\n b.occ.sourcingStageHistory.push({at:stamp(),from:old,to:stage,reason:note});\n b.occ.sourcingStage=stage;\n s.audit??=[];s.audit.unshift({id:id('audit'),at:stamp(),actor:'Local staff',action:'Sourcing planning stage updated',\n  detail:b.partCode+' / '+old+' → '+stage+' / '+note});\n return b.occ;\n}\nexport function orderLinesForRequirement(s,occurrenceId){\n return (s.orders||[]).filter(live).flatMap(o=\u003e(o.items||[])\n  .filter(l=\u003el.sourceOccurrenceId===occurrenceId).map(line=\u003e({order:o,line})));\n}\nexport function procurementState(s,occurrenceId){\n const b=requirementBaseline(s,occurrenceId),occ=b.occ,linked=orderLinesForRequirement(s,occurrenceId);\n const review=specStatus(s,occurrenceId),arrivals=(s.procurementArrivals||[])\n  .filter(a=\u003ea.sourceOccurrenceId===occurrenceId);\n const waiting=arrivals.filter(a=\u003ea.status==='Awaiting inspection'),rejected=arrivals.filter(a=\u003ea.status==='Rejected');\n const actualReceived=linked.reduce((n,{line})=\u003en+Number(line.received||0),0);\n const pending=linked.reduce((n,{line})=\u003en+Math.max(0,Number(line.quantity||0)-Number(line.received||0)-Number(line.closedQuantity||0)),0);\n const onWay=linked.some(({order})=\u003eorder.dispatchState==='Out for delivery');\n const planning=occ.sourcingStage||'Research';\n let status=planning;\n if(review.status==='Stale'\u0026\u0026linked.length===0)status='Spec recheck required';\n else if(review.status!=='Matches contract'\u0026\u0026linked.length===0\u0026\u0026planning==='Research')status='Contract check required';\n if(review.approved\u0026\u0026!linked.length\u0026\u0026planning==='Research')status='Spec verified · ready for PO';\n if(linked.length)status=pending\u003e0\n  ?(actualReceived\u003e0?'Part received':onWay?'In transit':'Ordered')\n  :(actualReceived\u003e0?'Received / no remaining balance':'Closed · no incoming quantity');\n const mostRecent=arrivals[0];\n if(mostRecent?.status==='Awaiting inspection')status='Arrived · inspect';\n else if(mostRecent?.status==='Rejected')status='Rejected · replacement needed';\n if(['On hold','Change requested','Replacement requested'].includes(planning)\u0026\u0026\n    mostRecent?.status!=='Accepted'\u0026\u0026mostRecent?.status!=='Awaiting inspection')\n  status=planning+(linked.length?' · PO still recorded':'');\n return {status,review,planning,linked,waiting,rejected,received:actualReceived,pending,\n  needsAction:review.status!=='Matches contract'\u0026\u0026linked.length===0};\n}\nexport function ensureArrivals(s){s.procurementArrivals??=[];return s.procurementArrivals;}\nexport function recordArrival(s,{orderId,lineId,quantity,deliveryRef}){\n ensureArrivals(s);\n const o=s.orders?.find(o=\u003elive(o)\u0026\u0026o.id===orderId);if(!o)throw Error('Purchase order not found');\n const line=o.items?.find(l=\u003el.id===lineId);if(!line)throw Error('Purchase line not found');\n const q=Number(quantity);\n if(!Number.isSafeInteger(q)||q\u003c=0)throw Error('Arrival quantity must be a positive whole number');\n const pending=s.procurementArrivals.filter(a=\u003ea.orderId===orderId\u0026\u0026a.lineId===lineId\u0026\u0026a.status==='Awaiting inspection')\n  .reduce((n,a)=\u003en+a.quantity,0);\n const outstanding=Number(line.quantity||0)-Number(line.received||0)-Number(line.closedQuantity||0);\n if(q\u003eoutstanding-pending)throw Error('Arrival exceeds outstanding units after pending inspection quantities');\n const ref=valid(deliveryRef,'Supplier shipment/delivery reference',3,200);\n const row={id:id('arrival'),orderId,lineId,sourceOccurrenceId:line.sourceOccurrenceId||null,partId:line.partId,\n  quantity:q,deliveryRef:ref,status:'Awaiting inspection',at:stamp()};\n s.procurementArrivals.unshift(row);\n s.audit??=[];s.audit.unshift({id:id('audit'),at:stamp(),action:'Goods arrived for QA',actor:'Local staff',\n  detail:o.code+' / '+q+' units / '+ref});\n return row;\n}\nexport function rejectArrival(s,{arrivalId,reviewer,reason,evidenceRef}){\n const row=ensureArrivals(s).find(x=\u003ex.id===arrivalId);\n if(!row||row.status!=='Awaiting inspection')throw Error('Only a pending arrival can be rejected');\n const who=valid(reviewer,'Inspector',3,160),why=valid(reason,'Measured non-conformity or wrong model',8,800);\n const proof=valid(evidenceRef,'Inspection evidence reference',4,240);\n Object.assign(row,{status:'Rejected',reviewedAt:stamp(),reviewer:who,evidenceRef:proof,notes:why});\n if(row.sourceOccurrenceId){\n  const occ=s.assemblyBOM?.find(x=\u003ex.id===row.sourceOccurrenceId);\n  if(occ){\n   const old=occ.sourcingStage||'Research';occ.sourcingStageHistory??=[];\n   occ.sourcingStageHistory.push({at:stamp(),from:old,to:'Replacement requested',reason:why});\n   occ.sourcingStage='Replacement requested';\n  }\n }\n s.audit??=[];s.audit.unshift({id:id('audit'),at:stamp(),actor:who,action:'Incoming goods rejected – no stock entered',\n  detail:row.orderId+' / '+proof+' / '+why});\n return row;\n}\nexport function acceptArrivalRecord(s,{arrivalId,reviewer,evidenceRef,receiptId}){\n const row=ensureArrivals(s).find(x=\u003ex.id===arrivalId);\n if(!row||row.status!=='Awaiting inspection')throw Error('Arrival no longer awaiting inspection');\n row.status='Accepted';row.reviewedAt=stamp();row.reviewer=valid(reviewer,'Inspector',3,160);\n row.evidenceRef=valid(evidenceRef,'Inspection evidence reference',4,240);row.receiptId=receiptId;\n return row;\n}\n","procurement-ui-v047.mjs":"/* V0.5.2 visible specification, sourcing stage and delivery inspection controls.\n Private contract reference text is read from the owner’s local imported project only. */\nimport {procurementState,requirementBaseline,specStatus} from './procurement-workflow-v047.mjs';\nconst esc=x=\u003eString(x??'').replace(/[\u0026\u003c\u003e\"']/g,c=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;',\"'\" :'\u0026#39;'}[c]));\nconst btn=(action,id,label)=\u003e'\u003cbutton type=\"button\" class=\"btn small\" data-action=\"'+esc(action)+'\" data-id=\"'+esc(id)+'\"\u003e'+esc(label)+'\u003c/button\u003e';\nconst select=(name,items,selected)=\u003e'\u003cselect name=\"'+name+'\"\u003e'+items.map(([v,l])=\u003e'\u003coption value=\"'+esc(v)+'\" '+(v===selected?'selected':'')+'\u003e'+esc(l)+'\u003c/option\u003e').join('')+'\u003c/select\u003e';\nconst field=(label,name,value='',extra='')=\u003e'\u003clabel\u003e'+esc(label)+'\u003cinput name=\"'+name+'\" value=\"'+esc(value)+'\" '+extra+'\u003e\u003c/label\u003e';\nexport function renderPlanningDropzones(){\n return '\u003cdiv class=\"v47-drag-lanes\" role=\"group\" aria-label=\"Move sourcing requirements between planning stages\"\u003e'+\n [['Research','Research'],['RFQ requested','Request quote'],['Quote received','Quote received'],\n ['Change requested','Change required'],['Replacement requested','Replacement needed']].map(([v,l])=\u003e\n '\u003cdiv class=\"v47-drop-stage\" data-v47-drop-stage=\"'+esc(v)+'\" tabindex=\"0\"\u003e'+esc(l)+'\u003c/div\u003e').join('')+\n '\u003cspan class=\"v47-drag-help\"\u003eDrag a requirement to a planning lane, or use its Action menu. Dragging never creates an order or marks goods received.\u003c/span\u003e\u003c/div\u003e';\n}\nexport function renderRequirementOperation(s,ui,occurrenceId){\n const b=requirementBaseline(s,occurrenceId),wf=procurementState(s,occurrenceId);\n const review=specStatus(s,occurrenceId),occ=b.occ,source=occ.purchaseSource||{};\n const ref=esc(occurrenceId);\n const inspecting=ui.v47ArrivalOccurrence===occurrenceId,reviewing=ui.v47SpecOccurrence===occurrenceId;\n const options=[\n  ['','Select action…'],['Research','Return to research'],['RFQ requested','Mark RFQ requested'],\n  ['Quote received','Record quote received'],['On hold','Place on hold'],\n  ['Change requested','Wrong model / change required'],\n  ['Replacement requested','Request replacement or reorder'],\n  ['Ordered','Record an actual supplier order'],['Out for delivery','Record dispatch / in transit'],\n  ['Arrived','Record delivery arrival'],['Received','Inspect / accept / reject delivery']\n ];\n const status='\u003cspan class=\"v47-operational-status\"\u003e'+esc(wf.status)+'\u003c/span\u003e'+\n  '\u003csmall\u003eTechnical check: '+esc(review.status)+'\u003c/small\u003e'+\n  (wf.linked.length?'\u003csmall\u003ePOs: '+wf.linked.map(x=\u003eesc(x.order.code)).join(', ')+'\u003c/small\u003e':'');\n const actions='\u003cdiv class=\"v47-ops\"\u003e'+\n  btn('v47-spec-open',occurrenceId,reviewing?'Close spec check':'Check contract spec')+\n  (wf.linked.length?btn('v47-arrival-open',occurrenceId,inspecting?'Close arrivals':'Delivery / inspection'):'')+\n  '\u003clabel\u003eUpdate stage'+select('notused',options,'').replace('\u003cselect','\u003cselect data-filter=\"v47-buy-step\" data-id=\"'+ref+'\"')+'\u003c/label\u003e\u003c/div\u003e';\n let specPanel='';\n if(reviewing){\n  const spec=occ.specReview||{};\n  specPanel='\u003ctr class=\"v47-spec-review-row\"\u003e\u003ctd colspan=\"8\"\u003e\u003csection class=\"v47-review-panel\"\u003e'+\n  '\u003ch4\u003eCheck the supplier model against the contract and approved drawings\u003c/h4\u003e'+\n  '\u003cp\u003eThis information is the local contract-derived reference, not an automatic machine comparison. Verify the exact performance, dimensions, capacity, hardware variant and source revision yourself before approving a purchase.\u003c/p\u003e'+\n  '\u003cdiv class=\"v47-baseline\"\u003e\u003cdiv\u003e\u003cb\u003eExpected part\u003c/b\u003e\u003cp\u003e'+esc(b.label)+'\u003c/p\u003e\u003csmall\u003e'+esc(b.partCode)+'\u003c/small\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cb\u003eContract hardware reference\u003c/b\u003e\u003cp\u003e'+esc(b.notes||'No part-specific notes recorded; inspect the controlled Annex')+'\u003c/p\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cb\u003eEngineering requirement\u003c/b\u003e\u003cp\u003e'+esc(b.requirementNotes||'No detailed requirement recorded; review the controlled source')+'\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e'+\n  '\u003cform data-form=\"v47-spec-review\" class=\"v46-inline-form\"\u003e'+\n  '\u003cinput type=\"hidden\" name=\"occurrenceId\" value=\"'+ref+'\"\u003e'+\n  '\u003clabel\u003eDecision'+select('decision',[['','Select inspection result'],['Matches contract','Matches specification'],['Deviation proposed','Different specification — hold'],['Does not comply','Wrong specification — reject']],spec.decision||'')+'\u003c/label\u003e'+\n  '\u003clabel class=\"v46-note-wide\"\u003eProposed model and exact supplier specification\u003ctextarea name=\"proposedSpecification\" rows=\"3\" maxlength=\"1500\" required placeholder=\"Manufacturer, model, dimensions, power, software capability, version and key technical specifications\"\u003e'+esc(spec.proposedSpecification||'')+'\u003c/textarea\u003e\u003c/label\u003e'+\n  field('Reviewer','reviewer',spec.reviewer||'','required minlength=\"3\" maxlength=\"160\"')+\n  field('Evidence reference','evidenceRef',spec.evidenceRef||'','required minlength=\"4\" maxlength=\"240\" placeholder=\"Drawing revision, Annex clause, supplier datasheet\"')+\n  '\u003clabel class=\"v46-note-wide\"\u003eWhat was checked?\u003ctextarea name=\"notes\" rows=\"2\" maxlength=\"1200\" required\u003e'+esc(spec.notes||'')+'\u003c/textarea\u003e\u003c/label\u003e'+\n  '\u003cbutton type=\"submit\" class=\"btn small primary\"\u003eRecord specification check\u003c/button\u003e'+\n  btn('v47-spec-close',occurrenceId,'Close')+'\u003c/form\u003e'+\n  '\u003cp class=\"v47-safety-caption\"\u003eA match is a staff-recorded decision, not an independently authenticated customer sign-off. Source or requirement changes invalidate the check. Proposed deviations cannot be ordered without an approved contract change and re-verification.\u003c/p\u003e'+\n  (occ.specReviewHistory?.length?'\u003cdetails\u003e\u003csummary\u003ePrevious technical reviews ('+occ.specReviewHistory.length+')\u003c/summary\u003e'+\n    occ.specReviewHistory.slice(-10).reverse().map(x=\u003e'\u003cp\u003e'+esc(x.checkedAt)+' · '+esc(x.decision)+' · '+esc(x.reviewer)+' / '+esc(x.evidenceRef)+'\u003c/p\u003e').join('')+'\u003c/details\u003e':'')+\n  '\u003c/section\u003e\u003c/td\u003e\u003c/tr\u003e';\n }\n let arrivals='';\n if(inspecting){\n  const openLines=wf.linked.filter(x=\u003eNumber(x.line.quantity||0)-Number(x.line.received||0)-Number(x.line.closedQuantity||0)\u003e0);\n  const orderOptions=openLines.map(x=\u003e[x.order.id+'|'+x.line.id,x.order.code+' · '+x.order.supplier]);\n  arrivals='\u003ctr class=\"v47-arrival-row\"\u003e\u003ctd colspan=\"8\"\u003e\u003csection class=\"v47-review-panel\"\u003e'+\n  '\u003ch4\u003eGoods arrival and receiving quality check\u003c/h4\u003e'+\n  '\u003cp\u003eAn arrival awaiting inspection does not add usable stock. Accept it only after physical checks, or reject it and document the wrong specification or damage.\u003c/p\u003e'+\n  (orderOptions.length?'\u003cform data-form=\"v47-record-arrival\" class=\"v46-inline-form\"\u003e'+\n   '\u003cinput type=\"hidden\" name=\"occurrenceId\" value=\"'+ref+'\"\u003e'+\n   '\u003clabel\u003eActual supplier order line'+select('orderLine',orderOptions,orderOptions[0][0])+'\u003c/label\u003e'+\n   field('Physical quantity arrived','quantity','1','required type=\"number\" min=\"1\" step=\"1\"')+\n   field('Delivery note / courier reference','deliveryRef','','required minlength=\"3\" maxlength=\"200\"')+\n   '\u003cbutton type=\"submit\" class=\"btn small\"\u003eRecord physical arrival\u003c/button\u003e\u003c/form\u003e':\n   '\u003cp\u003eNo unreceived, open order quantities remain; inspect recorded receipts or amend the actual PO balance.\u003c/p\u003e')+\n   wf.waiting.map(a=\u003e'\u003cdiv class=\"v47-arrival-item\"\u003e\u003cstrong\u003e'+esc(a.quantity)+' unit(s) · '+esc(a.deliveryRef)+'\u003c/strong\u003e'+\n    '\u003cform data-form=\"v47-inspect-arrival\" class=\"v46-inline-form\"\u003e'+\n    '\u003cinput type=\"hidden\" name=\"arrivalId\" value=\"'+esc(a.id)+'\"\u003e'+\n    '\u003clabel\u003eResult'+select('decision',[['accept','Accept into stock'],['reject','Reject / request correct replacement']],'accept')+'\u003c/label\u003e'+\n    field('Inspector','reviewer','','required minlength=\"3\" maxlength=\"160\"')+\n    field('Inspection report reference','evidenceRef','','required minlength=\"4\" maxlength=\"240\"')+\n    field('Findings / mismatch details','notes','','maxlength=\"800\" placeholder=\"Mandatory when rejecting\"')+\n    '\u003cbutton type=\"submit\" class=\"btn small primary\"\u003eRecord inspection\u003c/button\u003e\u003c/form\u003e\u003c/div\u003e').join('')+\n   (wf.rejected.length?'\u003cdiv class=\"v47-warning\"\u003e'+wf.rejected.length+' delivery rejection(s) recorded. No rejected arrival was added to stock. Request corrected goods or a confirmed new PO as appropriate.\u003c/div\u003e':'')+\n   btn('v47-arrival-close',occurrenceId,'Close arrivals')+'\u003c/section\u003e\u003c/td\u003e\u003c/tr\u003e';\n }\n return {status,actions,panels:specPanel+arrivals,stage:wf.status,specStatus:review.status};\n}\n","team-workspace-v048.mjs":"/* V0.5.2: owner-managed departmental planning. No user authentication or remote access.\n   All records are private local workspace data (never repository seed data). */\nconst live=x=\u003ex\u0026\u0026!x.archivedAt;\nconst now=()=\u003enew Date().toISOString();\nconst uid=p=\u003ep+'-'+Math.random().toString(36).slice(2,12);\nconst name=(v,label,max=160)=\u003e{const s=String(v??'').trim();if(!s||s.length\u003emax)throw Error(label+' is required (max '+max+' characters)');return s;};\nconst euros=(v,label)=\u003e{const n=Number(v);if(!Number.isFinite(n)||n\u003c0||n\u003e1e9||Math.abs(n*100-Math.round(n*100))\u003e1e-6)throw Error(label+' must be a positive EUR amount with at most two decimals');return Math.round(n*100)/100;};\nconst departments=['Office','Workshop','Purchasing','Quality','IT','Engineering','Electronics','Visual Systems','Mechanical'];\nexport const teamDepartments=departments;\nexport function ensureTeamWorkspace(s){\n s.departmentAllocations??=[];s.projectEvidence??=[];s.customerShareRules??=[];\n return s;\n}\nconst project=(s,id)=\u003e{const p=s.projects?.find(p=\u003elive(p)\u0026\u0026p.id===id);if(!p)throw Error('Project not found');return p;};\nconst audit=(s,action,detail)=\u003e{s.audit??=[];s.audit.unshift({id:uid('audit'),actor:'Owner (local)',action,detail,at:now()});};\nexport function departmentOverview(s,projectId){\n ensureTeamWorkspace(s);const p=project(s,projectId);\n const orders=(s.orders||[]).filter(o=\u003elive(o)\u0026\u0026o.projectId===projectId);\n const allocations=s.departmentAllocations.filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId);\n const requirements=(s.assemblyBOM||[]).filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId);\n const totals=new Map();\n for(const line of allocations){const k=line.department;const r=totals.get(k)||{department:k,allocated:0,committed:0,received:0,unknownCurrency:0,requirements:0,tasks:0,owners:new Set()};r.allocated+=Number(line.amount)||0;r.owners.add(line.assignee);totals.set(k,r);}\n for(const t of s.tasks||[]){if(live(t)\u0026\u0026t.projectId===projectId){const k=t.department||'Unassigned';const r=totals.get(k)||{department:k,allocated:0,committed:0,received:0,unknownCurrency:0,requirements:0,tasks:0,owners:new Set()};r.tasks++;totals.set(k,r);}}\n const byId=new Map(requirements.map(r=\u003e[r.id,r]));\n for(const r of requirements){const k=r.departmentOwner||'Unassigned';const row=totals.get(k)||{department:k,allocated:0,committed:0,received:0,unknownCurrency:0,requirements:0,tasks:0,owners:new Set()};row.requirements++;totals.set(k,row);}\n for(const o of orders){\n  const rate=(o.currency||'EUR')==='EUR'?1:Number(o.eurExchangeRate||0);\n  for(const l of o.items||[]){\n   const dept=byId.get(l.sourceOccurrenceId)?.departmentOwner||'Unassigned';\n   const row=totals.get(dept)||{department:dept,allocated:0,committed:0,received:0,unknownCurrency:0,requirements:0,tasks:0,owners:new Set()};\n   if(!Number.isFinite(rate)||rate\u003c=0){row.unknownCurrency++;totals.set(dept,row);continue;}\n   const cost=(Number(l.unitCost)||0)*rate;\n   row.received+=Math.round((Number(l.received)||0)*cost*100)/100;\n   row.committed+=Math.round(Math.max(0,Number(l.quantity||0)-Number(l.received||0)-Number(l.closedQuantity||0))*cost*100)/100;\n   totals.set(dept,row);\n  }\n }\n const rows=[...totals.values()].map(x=\u003e({...x,allocated:Math.round(x.allocated*100)/100,committed:Math.round(x.committed*100)/100,\n  received:Math.round(x.received*100)/100,owners:[...x.owners],remaining:Math.round((x.allocated-x.committed-x.received)*100)/100})).sort((a,b)=\u003ea.department.localeCompare(b.department));\n const totalAllocated=Math.round(allocations.reduce((a,b)=\u003ea+Number(b.amount||0),0)*100)/100;\n return {project:p,rows,allocations,requirements,totalAllocated,unallocated:Math.round((Number(p.budget||0)-totalAllocated)*100)/100,\n  budget:Math.round(Number(p.budget||0)*100)/100};\n}\nexport function saveDepartmentAllocation(s,{projectId,department,assignee,amount,note='',id=null}){\n ensureTeamWorkspace(s);project(s,projectId);\n if(!departments.includes(department))throw Error('Choose an approved department');\n const owner=name(assignee,'Responsible staff member'),value=euros(amount,'Allocation');\n if(value\u003c=0)throw Error('Allocation must be greater than zero');\n const p=project(s,projectId),budget=Number(p.budget||0);\n if(!budget)throw Error('Set a verified INTERNAL purchasing budget on the project first. Customer contract revenue is not the spending budget');\n const existing=id?s.departmentAllocations.find(x=\u003elive(x)\u0026\u0026x.id===id):null;\n if(id\u0026\u0026!existing)throw Error('Allocation not found');\n if(existing\u0026\u0026existing.projectId!==projectId)throw Error('Cannot move allocation between projects');\n const all=s.departmentAllocations.filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId\u0026\u0026x.id!==id);\n if(all.some(x=\u003ex.department===department\u0026\u0026x.assignee.toLowerCase()===owner.toLowerCase()))\n  throw Error('An allocation already exists for that department and staff member — edit the existing one');\n const used=all.reduce((n,x)=\u003en+Number(x.amount||0),0);\n if(used+value\u003ebudget+1e-6)throw Error('Department allocations exceed the recorded internal project budget');\n const record=existing||{id:uid('allocation'),projectId,createdAt:now()};\n Object.assign(record,{department,assignee:owner,amount:value,note:String(note||'').trim().slice(0,800),updatedAt:now()});\n if(!existing)s.departmentAllocations.push(record);\n audit(s,existing?'Department allocation edited':'Department allocation created',p.code+' / '+department+' / '+owner+' / EUR '+value);\n return record;\n}\nexport function allocateRequirement(s,{projectId,occurrenceId,department,taskId='',owner=''}){\n ensureTeamWorkspace(s);project(s,projectId);\n const r=s.assemblyBOM?.find(x=\u003elive(x)\u0026\u0026x.id===occurrenceId\u0026\u0026x.projectId===projectId);if(!r)throw Error('Material requirement not found');\n if(department\u0026\u0026 !departments.includes(department))throw Error('Invalid department');\n const task=taskId?s.tasks?.find(t=\u003elive(t)\u0026\u0026t.id===taskId\u0026\u0026t.projectId===projectId):null;\n if(taskId\u0026\u0026!task)throw Error('Linked task must belong to this project');\n if(task\u0026\u0026department\u0026\u0026task.department!==department)throw Error('Task and purchasing department must agree');\n r.departmentOwner=department||null;r.responsiblePerson=String(owner||'').trim().slice(0,160);\n r.linkedTaskId=taskId||null;\n audit(s,'Material responsibility assigned',r.id+' / '+(department||'Unassigned')+' / '+(r.responsiblePerson||'No person'));\n return r;\n}\nexport function attachEvidence(s,{projectId,sectionId='',taskId='',title,kind='Photo',dataUrl,filename}){\n ensureTeamWorkspace(s);project(s,projectId);\n if(sectionId\u0026\u0026!s.sections?.some(x=\u003elive(x)\u0026\u0026x.id===sectionId\u0026\u0026x.projectId===projectId))throw Error('Section does not belong to this project');\n const task=taskId?s.tasks?.find(t=\u003elive(t)\u0026\u0026t.id===taskId\u0026\u0026t.projectId===projectId):null;\n if(taskId\u0026\u0026!task)throw Error('Task not in this project');\n if(task\u0026\u0026sectionId\u0026\u0026task.sectionId!==sectionId)throw Error('Task is not in selected section');\n if(!['Photo','Evidence'].includes(kind))throw Error('Invalid evidence type');\n const label=name(title,'Photo / evidence title',180),file=name(filename,'File name',180);\n if(!/^data:image\\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(dataUrl||''))throw Error('Only encoded JPEG/PNG/WebP photos are supported');\n if(dataUrl.length\u003e400000)throw Error('Photo exceeds 300 KB after compression; use a smaller picture');\n if(s.projectEvidence.filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId).length\u003e=30)throw Error('Limit of 30 embedded photos per project; archive older evidence first');\n const row={id:uid('evidence'),projectId,sectionId:sectionId||null,taskId:taskId||null,title:label,kind,\n  filename:file,dataUrl,visibility:'internal',recordedAt:now()};\n s.projectEvidence.push(row);audit(s,'Private project evidence added',label+' / '+file);return row;\n}\nexport function archiveEvidence(s,id){ensureTeamWorkspace(s);const row=s.projectEvidence.find(x=\u003elive(x)\u0026\u0026x.id===id);if(!row)throw Error('Evidence not found');row.archivedAt=now();audit(s,'Project evidence archived',row.filename);return row;}\nexport function setCustomerShareRule(s,{projectId,sectionId,visible,summary=''}){\n ensureTeamWorkspace(s);project(s,projectId);\n if(!s.sections?.some(x=\u003elive(x)\u0026\u0026x.id===sectionId\u0026\u0026x.projectId===projectId))throw Error('Project section missing');\n const row=s.customerShareRules.find(x=\u003ex.projectId===projectId\u0026\u0026x.sectionId===sectionId);\n const target=row||{id:uid('share-rule'),projectId,sectionId,createdAt:now()};\n target.visible=Boolean(visible);target.summary=String(summary||'').slice(0,500);target.updatedAt=now();\n if(!row)s.customerShareRules.push(target);\n audit(s,'Customer preview allowlist edited',sectionId+' / '+(visible?'Allowed in local preview':'Hidden from local preview'));\n return target;\n}\nexport function customerPreviewProjection(s,projectId){\n ensureTeamWorkspace(s);const p=project(s,projectId);\n const allowed=new Map(s.customerShareRules.filter(r=\u003er.projectId===projectId\u0026\u0026r.visible).map(x=\u003e[x.sectionId,x]));\n return {projectName:p.name,sections:(s.sections||[]).filter(x=\u003elive(x)\u0026\u0026x.projectId===projectId\u0026\u0026allowed.has(x.id))\n  .map(sec=\u003e({title:sec.name,summary:allowed.get(sec.id).summary||'',status:'Progress details withheld until owner publishes a verified update'}))};\n}\n","team-ui-v048.mjs":"/* V0.4.8 project workspace views. The only active operator is the owner. */\nimport {departmentOverview,teamDepartments,customerPreviewProjection,ensureTeamWorkspace} from './team-workspace-v048.mjs';\nimport {renderApprovedCustomerEvidence,helpTip,helpTopics} from './work-evidence-ui-v051.mjs';\nconst e=x=\u003eString(x??'').replace(/[\u0026\u003c\u003e\"']/g,c=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;','\"':'\u0026#39;'}[c]));\nconst money=n=\u003e'€'+new Intl.NumberFormat('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);\nconst live=x=\u003ex\u0026\u0026!x.archivedAt;\nconst options=(rows,value)=\u003erows.map(([v,label])=\u003e'\u003coption value=\"'+e(v)+'\" '+(v===value?'selected':'')+'\u003e'+e(label)+'\u003c/option\u003e').join('');\nconst shortcut=(title,tab)=\u003e'\u003cbutton type=\"button\" class=\"btn small\" data-action=\"project-tab\" data-id=\"'+e(tab)+'\"\u003e'+e(title)+'\u003c/button\u003e';\nexport function renderProjectTeam(s,ui,projectId){\n const o=departmentOverview(s,projectId),selected=ui.v48Dept||'All',allowed=teamDepartments;\n const budgetText=o.budget\u003e0?money(o.budget):'Not approved';\n const allocation='\u003cdiv class=\"v48-finance-strip\"\u003e\u003cdiv\u003e\u003csmall\u003eInternal spending budget\u003c/small\u003e\u003cb\u003e'+budgetText+'\u003c/b\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003csmall\u003eAssigned envelopes\u003c/small\u003e\u003cb\u003e'+money(o.totalAllocated)+'\u003c/b\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003csmall\u003eAvailable for allocation\u003c/small\u003e\u003cb\u003e'+ (o.budget\u003e0?money(o.unallocated):'No approved budget')+'\u003c/b\u003e\u003c/div\u003e\u003c/div\u003e';\n const controls='\u003cform class=\"v48-allocation-form\" data-form=\"v48-budget-allocation\"\u003e'+\n  '\u003cinput type=\"hidden\" name=\"projectId\" value=\"'+e(projectId)+'\"\u003e\u003cinput type=\"hidden\" name=\"allocationId\" value=\"'+e(ui.v48EditAllocation||'')+'\"\u003e'+\n  '\u003clabel\u003eDepartment\u003cselect name=\"department\" required\u003e'+options(allowed.map(x=\u003e[x,x]),ui.v48AllocationDepartment||'IT')+'\u003c/select\u003e\u003c/label\u003e'+\n  '\u003clabel\u003eResponsible person\u003cinput name=\"assignee\" maxlength=\"160\" requir unshift({id:uid('audit'),action,detail,actor:'Owner (local record)',at:stamp()})};\nconst project=(s,id)=\u003e{const p=s.projects?.find(x=\u003eactive(x)\u0026\u0026x.id===id);if(!p)throw Error('Project missing');return p};\nconst occurrence=(s,id,projectId=null)=\u003e{const o=s.assemblyBOM?.find(x=\u003eactive(x)\u0026\u0026x.id===id\u0026\u0026(!projectId||x.projectId===projectId));if(!o)throw Error('Engineering requirement not found in selected project');return o};\nexport function ensurePurchaseControls(s){s.purchaseAuthorisations??=[];return s;}\nexport const fulfilmentOptions=[\n ['simworx-make','Sim-Worx manufactures'],['simworx-buy','Sim-Worx purchases'],\n ['buyer-direct-integrated','Buyer pays supplier · Sim-Worx manages and integrates'],\n ['buyer-supplied','Buyer supplies · interface to be agreed'],['subcontracted','Subcontracted deliverable'],\n ['unresolved','Responsibility unresolved']];\nexport const sourceStatuses=[['binding','Controlling agreed requirement'],['indicative','Indicative hardware suggestion'],\n ['provisional','Provisional / design freeze pending'],['pending','Requires formal approval'],['excluded','Excluded / not in scope']];\nexport function saveRequirementTrace(s,{occurrenceId,document,section,revision,requirementStatus,fulfilment,notes=''}){\n const o=occurrence(s,occurrenceId),p=project(s,o.projectId);\n const doc=required(document,'Source document',4,160),sec=required(section,'Clause / drawing reference',2,160),\n rev=required(revision,'Document date or revision',2,90),detail=String(notes||'').trim().slice(0,1200);\n if(!sourceStatuses.some(x=\u003ex[0]===requirementStatus))throw Error('Select the controlling status');\n if(!fulfilmentOptions.some(x=\u003ex[0]===fulfilment))throw Error('Select who supplies/manufactures this requirement');\n const prior=o.sourceTrace;if(prior){o.sourceTraceHistory??=[];o.sourceTraceHistory.push({...prior})}\n o.sourceTrace={document:doc,section:sec,revision:rev,requirementStatus,fulfilment,notes requirementStatus!=='binding')return {status:'Scope not released',approved:false};\n if(o.sourceTrace.fulfilment!=='simworx-buy')return {status:'Not an internal purchase',approved:false};\n if(o.makeBuy==='Make'||o.purchaseSource?.responsibility!=='Sim-Worx')return {status:'Responsibility mismatch',approved:false};\n if(!reviews.approved)return {status:'Technical review required',approved:false};\n const ready=auths.find(a=\u003ea.maxQuantity\u003eorderedAgainst(s,a.id));\n return ready?{status:'Owner authorization recorded',approved:true,authorisation:ready,remaining:ready.maxQuantity-orderedAgainst(s,ready.id)}:\n  {status:'Owner authorization required',approved:false};\n}\nexport function recordOwnerAuthorisation(s,input){\n ensurePurchaseControls(s);\n const o=occurrence(s,input.occurrenceId),p=project(s,o.projectId);\n if(!contractControlled(s,p.id))throw Error('This controlled approval workflow is intended for contract-backed projects only');\n const status=approvalStatus(s,o.id);\n if(status.approved)throw Error('An unused authorization already exists; consume or revoke it before recording another');\n if(status.status!=='Owner authorization required')throw Error('Cannot authorize: '+status.status);\n const source=o.purchaseSource||{};\n const supplier=required(input.supplier,'Supplier',2,160);\n if(!same(supplier,source.supplier))throw Error('Supplier must match the checked source');\n const model=required(input.manufacturerModel,'Exact manufacturer and model',4,300);\n if(!String(o.specReview?.proposedSpecification||'').toLowerCase().includes(model.toLowerCase()))\n  throw Error('Owner-approved manufacturer/model must appear in the engineering technical review');\n const code=required(input.vendorSku,'Supplier model / SKU',2,120);\n if(!same(code,source.vendorSku))throw Error('Product SKU must match the reviewed source');\n const quote=required(input.quoteRef,'Real supplier quotation reference',4,160);\n if(!same(quote,source.quoteRef))throw Error('Quotation reference does not match saved sourcing evidence');\n const qty=whole(input.maxQuantity,'Approved maximum quantity');\n const price=amount(input.maxUnitPrice,'Approved maximum unit price',true);\n const currency=required(input.currency,'Currency',3,3);\n if(!['EUR','USD','GBP','CAD'].includes(currency))throw Error('Unsupported currency');\n const eurRate=currency==='EUR'?1:amount(input.eurRate,'Documented EUR exchange rate');\n const taxRate=amount(input.taxRate??0,'Approved tax rate',true);if(taxRate\u003e100)throw Error('Tax rate must be at most 100%');\n const reviewer=required(input.reviewer,'Owner recording the authorization',3,160);\n const approvalRef=required(input.approvalRef,'Actual authorization reference',5,200);\n const quoteEvidence=required(input.evidenceRef,'Quote and price evidence reference',4,300);\n if((s.purchaseAuthorisations||[]).some(a=\u003ea.projectId===p.id\u0026\u0026a.approvalRef===approvalRef))\n  throw Error('Authorization reference already used for this project');\n const sourceGap=Number((s.assemblyBOM||[]).filter(x=\u003eactive(x)\u0026\u0026x.id===o.id).length?o.quantity:0);\n if(sourceGap\u003c1)throw Error('Engineering quantity not released');\n const estimate=qty*price*eurRate*(1+taxRate/100);\n const budget=budgetCheck(s,p,o,estimate);\n const record={id:uid('auth'),projectId:p.id,occurrenceId:o.id,department:budget.allocation.department,assignee:budget.allocation.assignee,\n   supplier,manufacturerModel:model,vendorSku:code,quoteRef:quote,quoteEvidence,approvalRef,\n   maxQuantity:qty,maxUnitPrice:price,currency,eurRate,taxRate,reviewer,fingerprint:specFingerprint(s,o.id),\n   technicalReviewRef:o.specReview.evidenceRef,sourceDocument:o.sourceTrace.document+' / '+o.sourceTrace.section+' / '+o.sourceTrace.revision,\n   recordedAt:stamp(),recordNature:'Owner-entered local authorization; not digitally signed'};\n s.purchaseAuthorisations.push(record);\n log(s,'Owner purchase authorization recorded',p.code+' / '+o.id+' / '+appro
