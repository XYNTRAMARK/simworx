name: Publish 10pt menu styling only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/menu-font-size.yml']
permissions:
  contents: read
concurrency:
  group: simworx-navigation-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Back up and publish only tested shared header CSS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, io, os, hashlib, urllib.request, time
          from urllib.parse import urlparse
          path = '/htdocs/assets/css/global-header.css'
          expected_before = 'ae395a0357f03efcaa1c9467ed4071186f422e267dbbec0056c71e9659661007'
          expected_after = 'd552e59dfa606264818a643c85a6ac138a1fb11d4e32c6e19e0da1308267b334'
          suffix = "\n/* Readable 10pt navigation; retain existing disclosure and mobile controls. */\n.global-nav>a,.global-nav .global-dropdown-trigger,\n.global-dropdown-menu a,.global-talk{font-size:10pt}\n@media(min-width:981px){\n  .global-nav{display:grid;grid-template-columns:repeat(4,max-content);grid-template-rows:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:0;align-items:stretch;align-content:center}\n  .global-nav>a,.global-nav .global-dropdown-trigger{height:100%;box-sizing:border-box}\n  .global-dropdown{height:auto;min-height:0}\n  .global-dropdown-menu{top:100%}\n}\n".encode()
          host = os.environ['FTP_HOST']
          parsed = urlparse(host if '://' in host else 'ftp://' + host)
          ftp = ftplib.FTP_TLS(timeout=45)
          ftp.connect(parsed.hostname, parsed.port or 21)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          def read():
              data = io.BytesIO()
              ftp.retrbinary('RETR ' + path, data.write)
              return data.getvalue()
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          before = read()
          assert digest(before) == expected_before, 'Live CSS differs from tested baseline; no changes made'
          after = before + suffix
          assert digest(after) == expected_after, 'Payload differs from browser-tested CSS'
          os.makedirs('backup', exist_ok=True)
          open('backup/global-header.css', 'wb').write(before)
          try:
              ftp.storbinary('STOR ' + path, io.BytesIO(after))
              assert read() == after, 'FTP verification failed'
              for attempt in range(6):
                  req = urllib.request.Request('https://sim-worx.com/assets/css/global-header.css?menu-size=' + os.environ['GITHUB_SHA'] + str(attempt), headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      live = response.read()
                  if live == after:
                      print('Verified: only shared header CSS changed, with exact tested 10pt two-row styling.')
                      break
                  time.sleep(5)
              else:
                  raise RuntimeError('Live HTTP verification failed')
          except Exception:
              ftp.storbinary('STOR ' + path, io.BytesIO(before))
              assert read() == before, 'Rollback verification failed'
              raise
          finally:
              ftp.quit()
          
          PY
      - name: Retain original header CSS for rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-css-before-10pt
          path: backup/global-header.css
          retention-days: 14
