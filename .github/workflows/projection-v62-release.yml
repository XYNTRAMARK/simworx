name: Release projector configurator V62 native email transport
on:
  push:
    branches: [main]
    paths:
      - '.projection-v62-deploy/**'
      - '.github/workflows/projection-v62-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v62
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V62 strictly from live V61
        run: python3 .projection-v62-deploy/build_v62.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify native protected form email transport
        run: |
          python3 -m http.server 8765 >/tmp/v62-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v62-deploy/test_v62_email.py
          kill $P || true
      - name: Publish V62 and promote stable page
        run: python3 .projection-v62-deploy/publish_v62.py
