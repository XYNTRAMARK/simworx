name: Inspect live LED email implementation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-led-email.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live LED email code
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          start='https://www.sim-worx.com/led-screen-configurator.html'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Simworx-email-inspector','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','replace')
          html=get(start)
          scripts=[('PAGE',start,html)]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
              try:
                  u=urllib.parse.urljoin(start,src); scripts.append(('SCRIPT',u,get(u)))
              except Exception as e: print('FETCH_FAIL',src,repr(e))
          needles=[
              'led-quote-submit.php','quote_action','led-quote-form','new FormData',
              'fetch(form.action','fetch(endpoint','Email me Quote','email-quote',
              'actionResult','led-action-result','simworx:submission-complete'
          ]
          for typ,url,text in scripts:
              for needle in needles:
                  pos=0
                  while True:
                      i=text.find(needle,pos)
                      if i<0: break
                      print('\n###',typ,url,'NEEDLE',needle,'AT',i)
                      print(text[max(0,i-1800):min(len(text),i+4200)].replace('\n',' '))
                      pos=i+len(needle)
          PY
