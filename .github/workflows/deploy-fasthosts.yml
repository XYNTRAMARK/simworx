name: Deploy Simworx to Fasthosts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simworx-fasthosts-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _deploy
          rsync -a ./ _deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.base44-sync/' \
            --exclude '.base44-sync2/' \
            --exclude '_deploy/' \
            --exclude 'README.md' \
            --exclude 'BASE44_SYNC_STATUS.md'

          test -f _deploy/index.html
          test -f _deploy/admin/index.html
          test -f _deploy/admin/review.js

          echo "Deployment payload prepared."
          find _deploy/admin -maxdepth 2 -type f -print

      - name: Upload website to Fasthosts
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./_deploy/
          server-dir: ${{ secrets.FTP_PATH }}
          dangerous-clean-slate: false

      - name: Verify live website and admin portal
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            HOME_STATUS=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' --max-time 20 "https://sim-worx.com/?deploy=${GITHUB_SHA}" || true)
            ADMIN_STATUS=$(curl -L -sS -o /tmp/admin.html -w '%{http_code}' --max-time 20 "https://sim-worx.com/admin/?deploy=${GITHUB_SHA}" || true)

            if [ "$HOME_STATUS" = "200" ] && [ "$ADMIN_STATUS" = "200" ]; then
              grep -qi '<html' /tmp/home.html
              grep -qi '<html' /tmp/admin.html
              echo "Live site verified: homepage=$HOME_STATUS admin=$ADMIN_STATUS"
              exit 0
            fi

            echo "Attempt $attempt: homepage=$HOME_STATUS admin=$ADMIN_STATUS"
            sleep 10
          done

          echo "Deployment completed but live verification did not return HTTP 200 for both pages." >&2
          exit 1
