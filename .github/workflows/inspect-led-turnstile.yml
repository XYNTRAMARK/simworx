name: Inspect working LED Turnstile flow
# trigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-led-turnstile.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect LED verification code
        run: |
          python3 - <<'PY'
          import urllib.request,re
          u='https://www.sim-worx.com/led-screen-configurator.html'
          req=urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'Simworx-led-turnstile-inspector'})
          with urllib.request.urlopen(req,timeout=45) as r:s=r.read().decode('utf-8','replace')
          needles=['cf-turnstile-response','turnstile','led-quote-submit.php','quote_action','verification']
          seen=set()
          for needle in needles:
            pos=0
            while True:
              i=s.lower().find(needle.lower(),pos)
              if i<0:break
              frag=s[max(0,i-2200):min(len(s),i+5000)]
              key=frag[:180]
              if key not in seen:
                seen.add(key)
                print('\n###',needle,'AT',i,'\n',frag)
              pos=i+len(needle)
          PY
