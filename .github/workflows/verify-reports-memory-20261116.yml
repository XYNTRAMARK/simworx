name: Verify Simworx report memory repair
on:
  push:
    branches: ['fix/reports-memory-20261116']
    paths: ['.github/workflows/verify-reports-memory-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify version 9 live authentication and full snapshot
        run: |
          python3 - <<'PY'
          import json,urllib.request
          # Expiring aggregate-only diagnostic, not a login/session credential.
          url='https://euttubfvsrgkeiescsdm.supabase.co/functions/v1/simworx-reports-repair-check?check=f5ec175a4606b3bd461c869b8a972e6b4db7627793514c57886f210dca326f3d'
          with urllib.request.urlopen(url,timeout=180) as response:
              result=json.loads(response.read())
          print(json.dumps(result,sort_keys=True))
          assert result.get('success') is True, 'Live report verification failed'
          assert result.get('test_session_closed') is True
          assert result.get('unauthenticated_status')==401
          assert result.get('login_status')==200 and result.get('snapshot_status')==200
          assert result.get('seconds',999)<45,'Live snapshot exceeded existing browser timeout'
          PY
