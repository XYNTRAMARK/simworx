name: Inspect live anti-spam validation contract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-antispam-contract.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read validator flow only
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          out=[];f.retrbinary('RETR /htdocs/forms/anti-spam.php',out.append);s=b''.join(out).decode('utf-8','replace');f.quit()
          start=s.find('class SimworxFormProtection')
          if start<0:start=0
          frag=s[start:start+18000]
          frag=re.sub(r'(?i)(secret|api[_-]?key)\s*([=:>]+)\s*[^,;\s]+',r'\\1\\2[REDACTED]',frag)
          print(frag)
          PY
