name: Publish projection configurator V37
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v37.yml'
      - '.projection-v37-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v37
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V37 from published V36
        run: python3 .projection-v37-deploy/build_v37.py
      - name: Run V37 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v37-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v37-deploy/test_v37.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v37-proof
          path: /tmp/v37-proof.png
          retention-days: 1
      - name: Publish immutable V37
        run: python3 .projection-v37-deploy/publish_v37.py
