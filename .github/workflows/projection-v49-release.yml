name: Release projection configurator V49 viewer priority
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v49-release.yml'
      - '.projection-v49-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v49
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V49 from live V48
        run: python3 .projection-v49-deploy/build_v49.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify viewer-first Step 3 geometry
        run: |
          python3 -m http.server 8765 >/tmp/v49-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v49-deploy/test_v49_layout.py
          python3 .projection-v49-deploy/test_v49_delivery.py
          kill $P || true
      - name: Publish V49 and switch live navigation
        run: python3 .projection-v49-deploy/publish_v49.py
