name: Inspect projection route and LED payload strategy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-projection-route-limit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare live endpoints and routing
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re,json,urllib.request
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(path):
              out=[];f.retrbinary('RETR /htdocs/'+path,out.append);return b''.join(out).decode('utf-8','replace')
          for path in ['projection-quote-submit.php','led-quote-submit.php']:
              s=read(path)
              print('\n###',path,'LEN',len(s))
              for term in ['post_max_size','php://input','json_decode','proposal_html','images','data:image','multipart/related','base64_decode','Content-Length','CONTENT_LENGTH']:
                  if term in s:
                      print('TERM',term)
                      for m in list(re.finditer(re.escape(term),s,re.I))[:8]:
                          print(s[max(0,m.start()-700):m.start()+1800])
          # list root routing/config candidates only
          names=[]
          for name,facts in f.mlsd('/htdocs'):
              if facts.get('type')=='file' and name.lower() in ['.htaccess','web.config','php.ini','.user.ini']:
                  names.append(name)
          print('ROUTE_FILES',names)
          for name in names:
              print('\n###',name);print(read(name)[:20000])
          f.quit()

          # Compare GET capabilities response headers/body to POST-like invalid body response without Turnstile.
          for method,data,ctype in [
              ('GET',None,None),
              ('POST',b'{}','application/json'),
              ('POST',b'x'*1100000,'application/json'),
          ]:
              url='https://www.sim-worx.com/projection-quote-submit.php'
              if method=='GET': url+='?action=capabilities'
              req=urllib.request.Request(url,data=data,method=method,headers={'User-Agent':'Simworx-route-diagnostic','Accept':'application/json',**({'Content-Type':ctype} if ctype else {})})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read().decode('utf-8','replace')
                      print('HTTP',method,len(data or b''),r.status,dict(r.headers),body[:1000])
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  print('HTTPERR',method,len(data or b''),e.code,dict(e.headers),body[:1000])
          PY
