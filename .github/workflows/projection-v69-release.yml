name: Release Projection V69 native email fetch with real send
on:
  push:
    branches: [main]
    paths:
      - '.projection-v69-deploy/**'
      - '.github/workflows/projection-v69-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v69
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V69 strictly from live V68
        run: python3 .projection-v69-deploy/build_v69.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify fetch router locally
        run: |
          python3 -m http.server 8765 >/tmp/v69-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v69-deploy/test_v69_fetch.py
          kill $P || true
      - name: Upload V69 versioned page only
        run: python3 .projection-v69-deploy/upload_v69_versioned.py
      - name: Create one-time real-send endpoint based on live LED sender
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,secrets
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          parts=[];f.retrbinary('RETR /htdocs/led-quote-submit.php',parts.append)
          s=b''.join(parts).decode('utf-8','replace')
          token=secrets.token_hex(32);open('/tmp/v69_test_token','w').write(token)
          anchor="$action=$_POST['quote_action']??'';"
          if anchor not in s: raise SystemExit('LED action anchor missing')
          branch=r'''
          if($action==='projection-email-e2e'){
              if(!hash_equals('__TOKEN__',(string)($_POST['projection_test_token']??''))){http_response_code(403);echo json_encode(['ok'=>false,'message'=>'Test authorization failed.']);exit;}
              $email=strtolower(trim((string)($_POST['email']??'')));$reference=trim((string)($_POST['proposal_reference']??''));$html=(string)($_POST['proposal_html']??'');$plain=(string)($_POST['proposal_text']??'');$rawImages=(string)($_POST['projection_images']??'[]');
              if(!filter_var($email,FILTER_VALIDATE_EMAIL))throw new InvalidArgumentException('Invalid email');
              $submitted=json_decode($rawImages,true);if(!is_array($submitted)||count($submitted)>4)throw new InvalidArgumentException('Invalid images');
              $images=[];foreach($submitted as $index=>$image){if(!is_array($image)||!is_string($image['data']??null)||!preg_match('#^data:image/jpeg;base64,([A-Za-z0-9+/=]+)$#D',$image['data'],$m))throw new InvalidArgumentException('Invalid image');$bytes=base64_decode($m[1],true);if($bytes===false)throw new InvalidArgumentException('Invalid image bytes');$images[]=['data'=>$image['data'],'bytes'=>$bytes,'cid'=>'projection-view-'.($index+1).'@sim-worx.com'];}
              $quote=['action'=>'email','email'=>$email,'reference'=>$reference,'created'=>gmdate('Y-m-d'),'html'=>$html,'plain'=>$plain,'images'=>$images,'total'=>0,'currency'=>'EUR'];
              $result=SimworxLedQuoteActions::deliver($quote,$_POST,static fn(string $to,string $subject,string $body,string $headers):bool=>@mail($to,$subject,$body,$headers),static function(array $quote,array $post):void{});
              $result['message']='V69 real browser Projection email sent.';http_response_code(200);echo json_encode($result,JSON_UNESCAPED_SLASHES);exit;
          }
          '''.replace('__TOKEN__',token)
          s=s.replace(anchor,anchor+"\n"+branch,1)
          f.storbinary('STOR /htdocs/led-quote-submit-v69-test.php',io.BytesIO(s.encode()));f.quit()
          PY
      - name: Send real email from actual V69 Projection page code
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          token=open('/tmp/v69_test_token').read().strip()
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-unsafe-swiftshader'])
              p=b.new_page(viewport={'width':1600,'height':1000})
              p.add_init_script("""
                window.turnstile={
                  render:(el,opts)=>{const i=document.createElement('input');i.type='hidden';i.name='cf-turnstile-response';i.value='test-token';el.appendChild(i);setTimeout(()=>opts.callback?.('test-token'),0);return 77},
                  getResponse:id=>id===77?'test-token':'',reset:()=>{}
                };
              """)
              captured=[]
              p.on('response',lambda r: captured.append((r.status,r.text()[:3000])) if 'led-quote-submit-v69-test.php' in r.url else None)
              p.goto('https://www.sim-worx.com/projection-screen-configurator-v69.html?real-send=1',wait_until='domcontentloaded',timeout=60000)
              p.wait_for_timeout(1800)
              p.locator('[data-guided-go="2"]').click();p.wait_for_timeout(450)
              p.locator('[data-guided-go="3"]').click();p.wait_for_timeout(600)
              calc=p.locator('#guided-calculate');calc.click()
              for _ in range(300):
                  if p.locator('#guided-result').is_visible() and not calc.is_disabled():break
                  p.wait_for_timeout(100)
              p.wait_for_timeout(700)
              p.locator('[data-guided-go="4"]').click();p.wait_for_timeout(1100)
              if p.locator('#v39-country').count():p.locator('#v39-country').select_option('GB')
              if p.locator('#v37-customer-type').count():p.locator('#v37-customer-type').select_option('business')
              p.wait_for_timeout(250)
              p.locator('#v37-email-proposal').click();p.wait_for_timeout(250)
              p.locator('#v37-email-address').fill('mark@sim-worx.com')
              p.locator('#v37-email-name').fill('Mark')
              p.evaluate("""({token})=>{
                const form=document.getElementById('v48-email-form');
                form.action='led-quote-submit-v69-test.php';
                let x=form.querySelector('[name="projection_test_token"]');if(!x){x=document.createElement('input');x.type='hidden';x.name='projection_test_token';form.appendChild(x)}x.value=token;
                const orig=FormData.prototype.set;
                FormData.prototype.set=function(k,v,...r){if(k==='quote_action'&&v==='projection-email')v='projection-email-e2e';return orig.call(this,k,v,...r)};
              }""",{"token":token})
              p.locator('#v37-email-send').click();p.wait_for_timeout(6000)
              status=p.locator('#v37-email-status').text_content() or ''
              print('V69_CLIENT_STATUS',status);print('V69_RESPONSES',captured)
              if not captured:raise SystemExit('V69 sent no HTTP request')
              code,body=captured[-1]
              if code!=200 or '"ok":true' not in body:raise SystemExit(f'V69 real send failed {code}: {body}')
              b.close()
          PY
      - name: Promote V69 only after real send succeeds
        run: python3 .projection-v69-deploy/promote_v69.py
      - name: Remove one-time real-send endpoint
        if: always()
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45);f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          try:f.delete('/htdocs/led-quote-submit-v69-test.php')
          except:pass
          f.quit()
          PY
