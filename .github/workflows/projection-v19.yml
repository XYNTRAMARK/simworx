name: Publish projection configurator V19
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v19.yml'
      - '.projection-v19-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v19
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated V19
        run: python3 .projection-v19-deploy/build_v19.py
      - name: Check sticky estimate CSS
        run: |
          grep -q 'projection-sticky-estimate-v19' projection-screen-configurator-v19.html
          grep -q 'position: sticky !important' projection-screen-configurator-v19.html
      - name: Browser startup smoke test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 45 "$CHROME"             --headless=new --no-sandbox --disable-dev-shm-usage             --use-gl=swiftshader --enable-unsafe-swiftshader             --enable-logging=stderr --v=0             --virtual-time-budget=10000             --dump-dom http://127.0.0.1:8765/projection-screen-configurator-v19.html             >/tmp/v19-dom.html 2>/tmp/v19-console.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          echo "Chrome rc=$RC"
          grep -E 'SyntaxError|TypeError|ReferenceError|CONSOLE:' /tmp/v19-console.log || true
          if grep -Eq 'SyntaxError|TypeError|ReferenceError' /tmp/v19-console.log; then
            echo "Browser console contains startup errors"
            exit 5
          fi
          if ! grep -q 'data-standalone-ready="true"' /tmp/v19-dom.html; then
            echo "Standalone app did not reach ready state"
            exit 6
          fi
          echo "V19 browser startup reached standalone ready state"
      - name: Publish immutable V19
        run: python3 .projection-v19-deploy/publish_v19.py
