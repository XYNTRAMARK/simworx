name: Read temporary arrival diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-arrival-diagnostic.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json,urllib.request
          u='https://euttubfvsrgkeiescsdm.supabase.co/functions/v1/simworx-intelligence'
          req=urllib.request.Request(u,data=json.dumps({'action':'diagnostic_counts'}).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=45) as r:
              print(r.read().decode())
          PY
