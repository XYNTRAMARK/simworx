name: Publish projection configurator V23
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v23.yml'
      - '.projection-v23-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v23
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V23 from finished V21
        run: python3 .projection-v23-deploy/build_v23.py
      - name: Verify V21 inheritance and V23 controls
        run: |
          grep -q 'projection-sticky-estimate-v19' projection-screen-configurator-v23.html
          grep -q 'projection-hide-enclosure-options-v20' projection-screen-configurator-v23.html
          grep -q '"screenSystemPerM2Eur":500' projection-screen-configurator-v23.html
          grep -q "Projector ceiling mounts',amount:eur(300)" projection-screen-configurator-v23.html
          grep -q "Floor-supported projector truss',amount:eur(1000)" projection-screen-configurator-v23.html
          grep -q 'id="projection-x"' projection-screen-configurator-v23.html
          grep -q 'id="projection-yaw"' projection-screen-configurator-v23.html
          grep -q 'data-transform="translate"' projection-screen-configurator-v23.html
          grep -q 'data-transform="rotate"' projection-screen-configurator-v23.html
          grep -q 'Projector position, swivel &amp; throw' projection-screen-configurator-v23.html
          grep -q 'planning range 0.30–2.10' projection-screen-configurator-v23.html
      - name: Browser startup smoke test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 45 "$CHROME"             --headless=new --no-sandbox --disable-dev-shm-usage             --use-gl=swiftshader --enable-unsafe-swiftshader             --enable-logging=stderr --v=0             --virtual-time-budget=12000             --dump-dom http://127.0.0.1:8765/projection-screen-configurator-v23.html             >/tmp/v23-dom.html 2>/tmp/v23-console.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          echo "Chrome rc=$RC"
          grep -E 'SyntaxError|TypeError|ReferenceError|CONSOLE:' /tmp/v23-console.log || true
          if grep -Eq 'SyntaxError|TypeError|ReferenceError' /tmp/v23-console.log; then exit 5; fi
          if ! grep -q 'data-standalone-ready="true"' /tmp/v23-dom.html; then exit 6; fi
          grep -q 'Projector position, swivel &amp; throw' /tmp/v23-dom.html
      - name: Publish V23 and remove V22
        run: python3 .projection-v23-deploy/publish_v23.py
