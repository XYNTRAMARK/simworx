name: Fix Support Tier Dropdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-support-tier-dropdown.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace datalist with a real select dropdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin/admin.js')
          source = path.read_text(encoding='utf-8')

          marker = "    const initialPreset = editing ? null : TIER_PRESETS.Basic;\n"
          replacement_marker = """    const initialPreset = editing ? null : TIER_PRESETS.Basic;
    const selectedTier = editing?.tier_name || initialPreset?.tier || 'Basic';
    const tierOptions = Object.keys(TIER_PRESETS);
    if (selectedTier && !tierOptions.includes(selectedTier)) tierOptions.push(selectedTier);
"""
          if marker not in source:
              raise SystemExit('Could not find contract preset marker')
          source = source.replace(marker, replacement_marker, 1)

          old = """          <label>Support level<input id=\"contractTier\" list=\"supportTierOptions\" value=\"${esc(editing?.tier_name || initialPreset?.tier || 'Basic')}\" required><datalist id=\"supportTierOptions\"><option value=\"Basic\"><option value=\"Standard\"><option value=\"Premium\"><option value=\"Pay As You Go\"></datalist></label>"""
          new = """          <label>Support level<select id=\"contractTier\" required>${tierOptions.map((tier) => `<option value=\"${esc(tier)}\" ${tier === selectedTier ? 'selected' : ''}>${esc(tier)}</option>`).join('')}</select></label>"""
          if old not in source:
              raise SystemExit('Could not find support level datalist')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check admin/admin.js

      - name: Commit dropdown fix
        shell: bash
        run: |
          git config user.name "XYNTRAMARK"
          git config user.email "mark@xyntra-ai.com"
          git add admin/admin.js
          git commit -m "Fix support level dropdown behaviour"
          git push
