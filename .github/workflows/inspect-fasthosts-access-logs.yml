name: Inspect Fasthosts access log availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: List likely log locations read-only
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          for path in ['.','/','/htdocs','/logs','/log','/logfiles','/statistics','/stats']:
              print('\nPATH',path)
              try:
                  rows=[]
                  f.retrlines('LIST '+path,rows.append)
                  for row in rows[:120]: print(row)
              except Exception as e: print('UNAVAILABLE',type(e).__name__,str(e)[:120])
          f.quit()
          PY
