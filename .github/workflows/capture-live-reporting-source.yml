name: Capture live reporting source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-live-reporting-source.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy current live reporting code into audit source folder
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,pathlib,hashlib,json
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          paths=[
            '/htdocs/reports/analytics.js',
            '/htdocs/reports/app.js',
            '/htdocs/reports/config.js',
            '/htdocs/reports/index.html',
            '/htdocs/assets/js/simworx-intelligence-tracker-v2.js',
            '/htdocs/assets/js/simworx-intelligence-configurator-v2.js',
            '/htdocs/assets/js/simworx-intelligence-bootstrap-v2.js',
          ]
          out=pathlib.Path('.reporting-audit/live-source');out.mkdir(parents=True,exist_ok=True)
          manifest={}
          for remote in paths:
              parts=[];f.retrbinary('RETR '+remote,parts.append);body=b''.join(parts)
              name=remote.replace('/htdocs/','').replace('/','__')
              (out/name).write_bytes(body)
              manifest[remote]={'file':name,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          f.quit()
          PY
      - name: Commit captured source if changed
        run: |
          git config user.name "simworx-reporting-audit"
          git config user.email "actions@users.noreply.github.com"
          git add .reporting-audit/live-source
          if git diff --cached --quiet; then
            echo "No reporting source changes to commit"
          else
            git commit -m "Capture live reporting source for audit"
            git push
          fi
