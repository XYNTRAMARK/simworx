name: Publish projection configurator V29
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v29.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Start from published V28 exactly
        run: |
          curl -fsSL https://www.sim-worx.com/projection-screen-configurator-v28.html -o projection-screen-configurator-v29.html
          grep -q 'projection-v28-step-viewer-owner' projection-screen-configurator-v29.html
          grep -q 'projection-v26-workspace' projection-screen-configurator-v29.html
          grep -q 'projection-v25-controls' projection-screen-configurator-v29.html
          grep -q 'projection-fixed-estimate-v24' projection-screen-configurator-v29.html

      - name: Remove silent Step 3 block and prevent price-card click interception
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projection-screen-configurator-v29.html')
          s=p.read_text()

          token='if(n>1){'
          count=s.count(token)
          if count!=1:
              raise SystemExit(f'Expected exactly one Step navigation guard, found {count}')
          s=s.replace(token,'if(n===2){',1)

          css='<style id="projection-v29-navigation-fix">.led-estimate-bar{pointer-events:none!important}.led-estimate-bar select,.led-estimate-bar button,.led-estimate-bar input,.led-estimate-bar a{pointer-events:auto!important}.guided-steps{scroll-margin-top:130px}</style>'
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s)

          checks=['projection-v29-navigation-fix','projection-v28-step-viewer-owner','projection-v26-workspace','projection-v25-controls','projection-fixed-estimate-v24','"screenSystemPerM2Eur":500','Projector position, swivel &amp; throw','if(n===2){']
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('V29 inheritance check failed '+repr(missing))
          if token in s: raise SystemExit('V29 old Step navigation guard still present')
          print('V29 navigation patch applied on top of published V28')
          PY

      - name: Real in-page Step 3 navigation test
        run: |
          cp projection-screen-configurator-v29.html projection-screen-configurator-v29-test.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projection-screen-configurator-v29-test.html')
          s=p.read_text()
          test='''<script id="v29-navigation-selftest">
          (async function(){
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const current=()=>document.querySelector('[data-guided-go][aria-current="step"]')?.dataset?.guidedGo||'';
            const status=()=>document.getElementById('guided-step-status')?.textContent||'';
            const checks=[];

            await sleep(1800);
            document.querySelector('[data-guided-go="2"]')?.click();
            await sleep(600);
            checks.push(current()==='2');

            document.querySelector('[data-guided-go="3"]')?.click();
            await sleep(1000);
            checks.push(current()==='3' && status().includes('Step 3 of 4'));

            document.querySelector('[data-guided-go="2"]')?.click();
            await sleep(500);
            const width=document.getElementById('projection-room-width');
            const budget=document.getElementById('guided-budget');
            if(width)width.value='0';
            if(budget)budget.value='-1';
            document.querySelector('[data-guided-go="3"]')?.click();
            await sleep(1000);
            checks.push(current()==='3');

            const bar=document.querySelector('.led-estimate-bar');
            checks.push(bar && getComputedStyle(bar).pointerEvents==='none');

            const out=document.createElement('div');
            out.id='v29-navigation-result';
            out.dataset.result=checks.every(Boolean)?'PASS':'FAIL';
            out.textContent=(checks.every(Boolean)?'PASS':'FAIL')+' '+JSON.stringify({checks,current:current(),status:status()});
            document.body.appendChild(out);
          })();
          </script>'''
          s=s.replace('</body>',test+'\n</body>',1)
          p.write_text(s)
          PY

          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          P=$!
          sleep 2
          C="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 45 "$C" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8765/projection-screen-configurator-v29-test.html >/tmp/v29-dom.html 2>/tmp/v29-console.log
          RC=$?
          set -e
          kill $P || true
          echo "Chrome rc=$RC"
          grep -E 'SyntaxError|TypeError|ReferenceError' /tmp/v29-console.log && exit 5 || true
          grep 'v29-navigation-result' /tmp/v29-dom.html | tail -1
          grep -q 'data-result="PASS"' /tmp/v29-dom.html
          cp /tmp/v29-dom.html /tmp/v29-step3-proof.html

      - uses: actions/upload-artifact@v4
        with:
          name: v29-step3-proof
          path: /tmp/v29-step3-proof.html
          retention-days: 1

      - name: Publish V29
        run: |
          cp .projection-v23-deploy/publish_v23.py /tmp/publish_v29.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/publish_v29.py')
          s=p.read_text()
          s=s.replace('projection-screen-configurator-v23.html','projection-screen-configurator-v29.html')
          s=s.replace('projection-screen-configurator-v22.html','projection-screen-configurator-v29-old.html')
          s=s.replace('Published immutable V23 and removed public V22','Published immutable V29')
          p.write_text(s)
          PY
          python3 /tmp/publish_v29.py
