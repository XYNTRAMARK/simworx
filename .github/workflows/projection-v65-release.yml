name: Release projector configurator V65 true PDF save
on:
  push:
    branches: [main]
    paths:
      - '.projection-v65-deploy/**'
      - '.github/workflows/projection-v65-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v65
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V65 strictly from live V64
        run: python3 .projection-v65-deploy/build_v65.py
      - name: Verify pinned PDF libraries are reachable
        run: |
          curl -fsI https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js >/dev/null
          curl -fsI https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js >/dev/null
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify true PDF save and email gate
        run: |
          python3 -m http.server 8765 >/tmp/v65-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v65-deploy/test_v65_pdf.py
          kill $P || true
      - name: Publish V65 and promote stable page
        run: python3 .projection-v65-deploy/publish_v65.py
