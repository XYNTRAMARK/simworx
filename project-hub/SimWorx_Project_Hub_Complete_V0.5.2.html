.v52-page>header h3{margin:6px 0 4px;font-size:22px;line-height:1.25}
.v52-page p{line-height:1.55;color:var(--muted);font-size:12px}
.v52-stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.v52-stat>div{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:13px 16px}
.v52-stat small,.v52-stat strong{display:block}
.v52-stat small{color:var(--muted);font-size:10px}
.v52-stat strong{font-size:23px;margin-top:3px;color:var(--ink)}
.v52-warning{border:1px solid var(--amber);border-radius:12px;background:var(--amber2);padding:14px}
.v52-warning h4{margin:2px 0;font-size:13px;color:var(--ink)}
.v52-warning p{color:var(--ink)}
.v52-queue{display:grid;gap:8px}
.v52-item{display:flex;align-items:center;justify-content:space-between;gap:15px;border:1px solid var(--line);padding:13px 15px;border-radius:10px;background:var(--panel2)}
.v52-item.v52-urgent{border-left:4px solid var(--red)}
.v52-item small,.v52-item b{display:block}
.v52-item small{color:var(--muted);font-size:10px}
.v52-item b{font-size:13px;margin-top:3px}
.v52-item p{margin:3px 0;color:var(--ink)}
.v52-item .btn{flex-shrink:0}
.v52-form{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--panel2);min-width:0}
.v52-form h4{font-size:13px;margin:0 0 4px}
.v52-form p{margin:0}
.v52-form label,.v52-select label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700}
.v52-form input,.v52-form textarea,.v52-form select,.v52-select select{width:100%;min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:12px}
.v52-form textarea{resize:vertical;font-family:inherit}
.v52-form .v52-ack{display:flex;flex-direction:row;align-items:flex-start;gap:9px;line-height:1.5}
.v52-ack input{width:auto;flex-shrink:0;margin-top:3px}
.v52-form>.btn{align-self:flex-start}
.v52-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.v52-invoice{border:1px solid var(--line);border-radius:11px;padding:14px;display:grid;gap:10px;background:var(--panel)}
.v52-invoice small{display:block;color:var(--muted)}
.v52-invoice b{font-size:13px}
.v52-invoice p{margin:4px 0}
.v52-invoice .v52-good{color:var(--green)}
.v52-invoice .v52-bad{color:var(--red)}
.v52-select select{max-width:450px}
.v52-assurance{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:17px 0}
.v52-assurance summary{font-size:12px;font-weight:800;cursor:pointer}
.v52-assurance .v52-form{margin-top:12px}
@media(max-width:850px){.v52-grid,.v52-stat{grid-template-columns:1fr}.v52-item{align-items:flex-start;flex-direction:column}.v52-form>.btn{white-space:normal}}

</style></head><body><div id="app"><p style="font:14px system-ui;padding:26px">Loading complete Sim-Worx Project Hub V0.5.2…</p></div><script type="application/json" id="sw-source">{"modules":{"model.mjs":"/* Sim-Worx Project Hub. Pure domain functions for the local demonstration.\n   This is not a security boundary: production requires server-side permission checks and RLS. */\nexport const uid = (prefix = 'id') =\u003e `${prefix}-${Math.random().toString(36).slice(2, 10)}`;\nexport const today = () =\u003e new Date().toISOString().slice(0, 10);\nexport const money = n =\u003e new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Number(n || 0));\nexport const number = n =\u003e new Intl.NumberFormat('en-GB').format(Number(n || 0));\nexport const escapeHtml = value =\u003e String(value ?? '').replace(/[\u0026\u003c\u003e\"']/g, char =\u003e ({ '\u0026': '\u0026amp;', '\u003c': '\u0026lt;', '\u003e': '\u0026gt;', '\"': '\u0026quot;', \"'\": '\u0026#39;' }[char]));\nexport const taskProgress = (projectId, tasks) =\u003e {\n  const list = tasks.filter(t =\u003e t.projectId === projectId \u0026\u0026 !t.archivedAt \u0026\u0026 t.status !== 'Cancelled' \u0026\u0026 !tasks.some(child =\u003e !child.archivedAt \u0026\u0026 child.parentId === t.id));\n  return list.length ? Math.round(list.reduce((sum,t)=\u003esum + (t.status === 'Done' ? 100 : t.status === 'Inspection' ? 80 : t.status === 'In progress' ? 45 : 0),0)/list.length) : 0;\n};\nexport const availableStock = part =\u003e Number(part.onHand) - Number(part.reserved);\nexport const lineOutstanding = line =\u003e Math.max(0, Number(line.quantity)-Number(line.received||0));\nexport function stockMove(state, {partId, quantity, type, actor = 'Sim-Worx Admin', projectId = null}) {\n  const part = state.parts.find(p=\u003ep.id===partId);\n  if (!part) throw Error('Part not found');\n  const q = Number(quantity);\n  if (!Number.isFinite(q) || q \u003c= 0 || !Number.isInteger(q)) throw Error('Quantity must be a positive whole number');\n  if (!['receipt','issue','adjust-in','adjust-out'].includes(type)) throw Error('Invalid movement');\n  if (['issue','adjust-out'].includes(type) \u0026\u0026 availableStock(part)\u003cq) throw Error('Insufficient available stock');\n  if (type==='issue' || type==='adjust-out') part.onHand-=q;\n  else part.onHand+=q;\n  state.movements.unshift({id:uid('mv'),partId,quantity:q,type,actor,projectId,date:new Date().toISOString()});\n  state.audit.unshift({id:uid('audit'),actor,action:`Stock ${type}`,detail:`${q} × ${part.code}`,at:new Date().toISOString()});\n  return part;\n}\nexport function receiveOrder(state, orderId, actor='Sim-Worx Admin') {\n  const order=state.orders.find(o=\u003eo.id===orderId);\n  if(!order)throw Error('Purchase order not found');\n  const quantities=order.items.map(i=\u003elineOutstanding(i));\n  if(!quantities.some(q=\u003eq\u003e0))throw Error('This order is already fully received');\n  // Validate every line before mutating anything.\n  order.items.forEach(i=\u003e{if(!state.parts.some(p=\u003ep.id===i.partId)) throw Error('Order has an unknown part')});\n  order.items.forEach((i,idx)=\u003e{\n    if(quantities[idx]\u003e0){stockMove(state,{partId:i.partId,quantity:quantities[idx],type:'receipt',actor,projectId:order.projectId});i.received=Number(i.quantity)}\n  });\n  order.status='Received';\n  state.audit.unshift({id:uid('audit'),actor,action:'Purchase order received',detail:order.code,at:new Date().toISOString()});\n}\nexport function publishUpdate(state, updateId, actor='Sim-Worx Admin') {\n  const u=state.updates.find(u=\u003eu.id===updateId);\n  if(!u)throw Error('Update not found');\n  if(u.status==='published')throw Error('Already published');\n  u.status='published';u.publishedAt=new Date().toISOString();u.publishedBy=actor;\n  state.audit.unshift({id:uid('audit'),actor,action:'Customer publication',detail:u.title,at:u.publishedAt});\n  state.notifications.unshift({id:uid('note'),text:`${u.title} has been published to the customer portal.`,date:today(),read:false});\n}\nexport function decideApproval(state, approvalId, decision, actor='Client Approver'){\n  const a=state.approvals.find(a=\u003ea.id===approvalId);\n  if(!a || a.status!=='Pending')throw Error('Approval is not pending');\n  if(!['Approved','Changes requested','Rejected'].includes(decision))throw Error('Invalid decision');\n  a.status=decision;a.decisionBy=actor;a.decidedAt=new Date().toISOString();\n  state.audit.unshift({id:uid('audit'),actor,action:'Customer decision',detail:`${a.title} (${a.revision}): ${decision}`,at:a.decidedAt});\n}\nexport function clientProjection(state, orgId, projectId, memberId=null){\n  const organization=state.organizations.find(o=\u003eo.id===orgId \u0026\u0026 !o.archivedAt);\n  if(!organization)return null;\n  const accessibleProjects=state.projects.filter(p=\u003e!p.archivedAt \u0026\u0026 p.orgId===orgId \u0026\u0026 (!memberId || state.members.some(m=\u003e!m.archivedAt\u0026\u0026m.id===memberId\u0026\u0026m.orgId===orgId\u0026\u0026m.projects.includes(p.id))));\n  const project=accessibleProjects.find(p=\u003ep.id===projectId)||accessibleProjects[0];\n  if(!project)return {organization,projects:accessibleProjects,project:null,updates:[],approvals:[],documents:[],messages:[],members:[]};\n  // Explicit allowlist: no internal cost, task, supplier, PO or stock fields escape this function.\n  return {\n    organization:{id:organization.id,name:organization.name,accent:organization.accent,logo:organization.logo},\n    projects:accessibleProjects.map(p=\u003e({id:p.id,name:p.name,code:p.code})),\n    project:{id:project.id,name:project.name,code:project.code,description:project.publicDescription||project.description,delivery:project.due,publishedProgress:project.publishedProgress,phase:project.phase},\n    updates:state.updates.filter(u=\u003e!u.archivedAt\u0026\u0026u.projectId===project.id\u0026\u0026u.status==='published').map(u=\u003e({id:u.id,title:u.title,description:u.description,kind:u.kind,part:u.part,status:u.status,publishedAt:u.publishedAt||u.date})),\n    approvals:state.approvals.filter(a=\u003e!a.archivedAt\u0026\u0026a.projectId===project.id\u0026\u0026a.shared).map(a=\u003e({id:a.id,title:a.title,kind:a.kind,revision:a.revision,status:a.status,due:a.due,requested:a.requested})),\n    documents:state.documents.filter(d=\u003e!d.archivedAt\u0026\u0026d.projectId===project.id\u0026\u0026d.visibility==='customer').map(d=\u003e({id:d.id,title:d.title,rev:d.rev,type:d.type,date:d.date})),\n    messages:state.messages.filter(m=\u003e!m.archivedAt\u0026\u0026m.projectId===project.id\u0026\u0026m.visibility==='customer').map(m=\u003e({id:m.id,author:m.author,text:m.text,at:m.at})),\n    members:state.members.filter(m=\u003e!m.archivedAt\u0026\u0026m.orgId===orgId \u0026\u0026 m.projects.includes(project.id)).map(m=\u003e({id:m.id,name:m.name,role:m.role,email:m.email}))\n  };\n}\nexport function clientInvite(state,{orgId,name,email,role,projectIds},actor='Client Admin'){\n  if(!name?.trim()||!email?.includes('@'))throw Error('Enter a valid name and email');\n  if(!['Client Viewer','Client Engineer','Client Approver','Client Lead'].includes(role))throw Error('Role outside delegation ceiling');\n  if(!projectIds?.length || !projectIds.every(p=\u003estate.projects.some(x=\u003ex.id===p\u0026\u0026x.orgId===orgId)))throw Error('Project outside customer organisation');\n  if(state.members.some(m=\u003em.email.toLowerCase()===email.toLowerCase()))throw Error('Email already exists in this demo');\n  state.members.push({id:uid('mem'),orgId,name:name.trim(),email:email.trim(),role,projects:projectIds,status:'Demo invite'});\n  state.audit.unshift({id:uid('audit'),actor,action:'Client invitation drafted',detail:`${email} / ${role} / ${projectIds.join(',')}`,at:new Date().toISOString()});\n}\n\n// V0.2 local-domain integrity rules. Production must enforce these server-side.\nexport const activeRecords = list =\u003e list.filter(item =\u003e !item.archivedAt);\nconst requireText = (value,label) =\u003e {\n  const text=String(value ?? '').trim();\n  if(!text)throw Error(`${label} is required`);\n  return text;\n};\nconst requireAmount = (value,label) =\u003e {\n  const n=Number(value);\n  if(!Number.isFinite(n)||n\u003c0)throw Error(`${label} must be zero or greater`);\n  return n;\n};\nconst logChange = (state,action,detail) =\u003e {\n  state.audit.unshift({id:uid('audit'),actor:'Sim-Worx Admin',action,detail,at:new Date().toISOString()});\n};\nexport function saveOrganization(state,{id,name,code,contact,accent}){\n  const n=requireText(name,'Customer name'),c=requireText(code,'Customer code').toUpperCase();\n  if(state.organizations.some(o=\u003eo.id!==id \u0026\u0026 o.code.toUpperCase()===c))throw Error('Customer code already exists');\n  const color=/^#[0-9a-f]{6}$/i.test(accent)?accent:'#5369c4';\n  if(id){const o=state.organizations.find(o=\u003eo.id===id \u0026\u0026 !o.archivedAt);if(!o)throw Error('Customer unavailable');\n    Object.assign(o,{name:n,code:c,contact:String(contact||''),accent:color,logo:n[0]?.toUpperCase()||'?'});logChange(state,'Customer updated',n);return o;}\n  const org={id:uid('org'),name:n,code:c,contact:String(contact||''),accent:color,logo:n[0].toUpperCase()};\n  state.organizations.push(org);logChange(state,'Customer created',n);return org;\n}\nexport function saveProject(state,{id,orgId,name,template,status,phase,due,budget,contract,lead,description}){\n  const org=state.organizations.find(o=\u003eo.id===orgId\u0026\u0026!o.archivedAt);\n  if(!org)throw Error('Choose an active customer');\n  const n=requireText(name,'Project name');const b=requireAmount(budget,'Budget'),c=requireAmount(contract,'Contract value');\n  if(id){const p=state.projects.find(p=\u003ep.id===id\u0026\u0026!p.archivedAt);if(!p)throw Error('Project unavailable');\n    if(p.orgId!==orgId)throw Error('Moving a project to a different customer is not permitted');\n    Object.assign(p,{name:n,status:status||p.status,phase:phase||p.phase,due:String(due||''),budget:b,contract:c,lead:String(lead||''),description:String(description||'')});\n    logChange(state,'Project updated',p.code);return p;}\n  const code=`SW-${String(new Date().getFullYear()).slice(-2)}${String(Math.max(0,...state.projects.map(x=\u003eNumber(String(x.code).match(/\\d{3}$/)?.[0]||0)))+1).padStart(3,'0')}`;\n  const p={id:uid('p'),orgId,name:n,code,template:template||'Bespoke Simulator',status:'Design',phase:'Engineering',due:String(due||''),budget:b,contract:c,spent:0,committed:0,publishedProgress:0,lead:String(lead||''),description:String(description||''),created:today()};\n  state.projects.unshift(p);logChange(state,'Project created',`${code} for ${org.name}`);return p;\n}\nexport function saveSection(state,{id,projectId,name,weight}){\n  if(!state.projects.some(p=\u003ep.id===projectId\u0026\u0026!p.archivedAt))throw Error('Project unavailable');\n  const n=requireText(name,'Section name'),w=Number(weight);\n  if(!Number.isFinite(w)||w\u003c0||w\u003e100)throw Error('Weight must be between 0 and 100');\n  if(id){const s=state.sections.find(s=\u003es.id===id\u0026\u0026!s.archivedAt\u0026\u0026s.projectId===projectId);if(!s)throw Error('Section unavailable');Object.assign(s,{name:n,weight:w});logChange(state,'Section updated',n);return s;}\n  const s={id:uid('s'),projectId,name:n,weight:w};state.sections.push(s);logChange(state,'Section created',n);return s;\n}\n// V0.3 planning model: dependency graph, dated plans and immutable-by-default baselines.\nexport function predecessorIds(task){\n  return [...new Set([...(Array.isArray(task.predecessors)?task.predecessors:[]),...(task.blockedBy?[task.blockedBy]:[])].filter(Boolean))];\n}\nconst validDate = value =\u003e !value || (/^\\d{4}-\\d{2}-\\d{2}$/.test(value) \u0026\u0026 !Number.isNaN(Date.parse(value+'T12:00:00Z')) \u0026\u0026 new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value);\nfunction verifyJobDates(start,due){\n  if(!validDate(start)||!validDate(due))throw Error('Enter valid ISO dates');\n  if(start \u0026\u0026 due \u0026\u0026 due\u003cstart)throw Error('Finish date cannot precede start date');\n}\nfunction verifyPredecessors(state, projectId, taskId, ids){\n  const all=[...new Set(ids.filter(Boolean))];\n  for(const id of all){const other=state.tasks.find(t=\u003et.id===id\u0026\u0026!t.archivedAt);if(!other||other.projectId!==projectId||id===taskId)throw Error('Predecessors must be different jobs from this project');}\n  const adjacency=id=\u003eid===taskId?all:predecessorIds(state.tasks.find(t=\u003et.id===id)||{});\n  for(const id of all){const seen=new Set();const check=node=\u003e{if(node===taskId)throw Error('Circular predecessor dependency is not permitted');if(seen.has(node))return;seen.add(node);adjacency(node).forEach(check)};check(id);}\n  return all;\n}\nexport function saveTask(state,{id,projectId,sectionId,title,description='',department,assignee,priority,due,start,status,parentId,blockedBy,predecessors}){\n  if(!state.projects.some(p=\u003ep.id===projectId\u0026\u0026!p.archivedAt))throw Error('Project unavailable');\n  if(!state.sections.some(s=\u003es.id===sectionId\u0026\u0026s.projectId===projectId\u0026\u0026!s.archivedAt))throw Error('Invalid section for project');\n  const name=requireText(title,'Job title');\n  const details=String(description||'').trim();if(details.length\u003e4000)throw Error('Job description must be 4,000 characters or less');\n  if(!['Office','Workshop','Purchasing','Quality','IT','Engineering','Electronics','Visual Systems','Mechanical'].includes(department))throw Error('Invalid department');\n  if(!['Normal','High','Critical'].includes(priority))throw Error('Invalid priority');\n  const current=id?state.tasks.find(t=\u003et.id===id\u0026\u0026!t.archivedAt):null;\n  if(id\u0026\u0026!current)throw Error('Job unavailable');\n  if(id\u0026\u0026current.projectId!==projectId)throw Error('Cannot move a job to another project');\n  const parent=parentId?state.tasks.find(t=\u003et.id===parentId\u0026\u0026!t.archivedAt):null;\n  if(parentId\u0026\u0026(!parent||parent.projectId!==projectId||parent.sectionId!==sectionId||parent.id===id))throw Error('Parent job must belong to this section');\n  if(current \u0026\u0026 sectionId!==current.sectionId\u0026\u0026state.tasks.some(c=\u003e!c.archivedAt\u0026\u0026c.parentId===id))throw Error('Move child jobs before moving this parent');\n  let cursor=parent;const ancestors=new Set(id?[id]:[]);\n  while(cursor){if(ancestors.has(cursor.id))throw Error('Circular work breakdown is not permitted');ancestors.add(cursor.id);cursor=state.tasks.find(t=\u003et.id===cursor.parentId\u0026\u0026!t.archivedAt)}\n  const startDate=start===undefined?(current?.start||''):String(start||'');\n  const finishDate=String(due||'');verifyJobDates(startDate,finishDate);\n  let requested=Array.isArray(predecessors)?predecessors.slice():blockedBy?[blockedBy]:[];\n  // Backward compatible with V0.2 callers modifying blockedBy while spreading an existing record.\n  if(Array.isArray(predecessors)\u0026\u0026blockedBy \u0026\u0026 current \u0026\u0026 blockedBy!==current.blockedBy)requested=[blockedBy,...requested];\n  const dependencies=verifyPredecessors(state,projectId,id,requested);\n  if(status==='Done' \u0026\u0026 dependencies.some(x=\u003estate.tasks.find(t=\u003et.id===x)?.status!=='Done'))throw Error('Complete predecessor job first');\n  if(id\u0026\u0026status==='Done'\u0026\u0026state.tasks.some(child=\u003e!child.archivedAt\u0026\u0026child.parentId===id\u0026\u0026!['Done','Cancelled'].includes(child.status)))\n    throw Error('Complete the child jobs before marking the parent job Done');\n  const fields={sectionId,title:name,description:details,department,assignee:String(assignee||'Unassigned'),priority,due:finishDate,start:startDate,status:status||current?.status||'Backlog',parentId:parentId||null,predecessors:dependencies,blockedBy:dependencies[0]||null};\n  if(current){Object.assign(current,fields);logChange(state,'Job updated',name);return current;}\n  const record={id:uid('t'),projectId,...fields};state.tasks.push(record);logChange(state,'Job created',name);return record;\n}\nexport function setTaskStatus(state,id,status){\n  const t=state.tasks.find(t=\u003et.id===id\u0026\u0026!t.archivedAt);if(!t)throw Error('Job unavailable');\n  if(!['Backlog','Ready','In progress','Blocked','Inspection','Done','Cancelled'].includes(status))throw Error('Invalid job status');\n  if(['Ready','In progress','Inspection','Done'].includes(status)){\n    const waiting=predecessorIds(t).filter(x=\u003estate.tasks.find(d=\u003ed.id===x\u0026\u0026!d.archivedAt)?.status!=='Done');\n    if(waiting.length)throw Error('Complete predecessor job first');\n  }\n  if(status==='Done'\u0026\u0026state.tasks.some(child=\u003e!child.archivedAt\u0026\u0026child.parentId===id\u0026\u0026!['Done','Cancelled'].includes(child.status)))\n    throw Error('Complete the child jobs before marking the parent job Done');\n  t.status=status;logChange(state,'Job status updated',`${t.title} → ${status}`);return t;\n}\nexport function updateTaskPlan(state,taskId,{start,due,predecessors}){\n  const task=state.tasks.find(t=\u003et.id===taskId\u0026\u0026!t.archivedAt);if(!task)throw Error('Job unavailable');\n  const draft={...task,start:start===undefined?task.start:start,due:due===undefined?task.due:due,predecessors:predecessors===undefined?predecessorIds(task):predecessors,blockedBy:null};\n  return saveTask(state,draft);\n}\nexport function captureBaseline(state,projectId,actor='Sim-Worx Project Manager'){\n  const project=state.projects.find(p=\u003ep.id===projectId\u0026\u0026!p.archivedAt);if(!project)throw Error('Project unavailable');\n  const jobs=state.tasks.filter(t=\u003et.projectId===projectId\u0026\u0026!t.archivedAt\u0026\u0026t.status!=='Cancelled'\u0026\u0026t.start\u0026\u0026t.due);\n  if(!jobs.length)throw Error('Plan start and finish dates for at least one job first');\n  project.baseline={capturedAt:new Date().toISOString(),capturedBy:actor,jobs:Object.fromEntries(jobs.map(t=\u003e[t.id,{start:t.start,due:t.due}]))};\n  logChange(state,'Schedule baseline captured',`${project.code} · ${jobs.length} planned jobs`);return project.baseline;\n}\nexport function scheduleSummary(state,projectId,asOf=today()){\n  const jobs=state.tasks.filter(t=\u003et.projectId===projectId\u0026\u0026!t.archivedAt\u0026\u0026t.status!=='Cancelled');\n  const byId=new Map(jobs.map(t=\u003e[t.id,t]));\n  const project=state.projects.find(p=\u003ep.id===projectId);const base=project?.baseline?.jobs||{};\n  const lagDays=(newDate,oldDate)=\u003eMath.round((Date.parse(newDate+'T12:00:00Z')-Date.parse(oldDate+'T12:00:00Z'))/86400000);\n  const conflicts=[];\n  jobs.forEach(t=\u003epredecessorIds(t).forEach(id=\u003e{const p=byId.get(id);if(p\u0026\u0026t.start\u0026\u0026p.due\u0026\u0026t.start\u003c=p.due)conflicts.push({jobId:t.id,predecessorId:id,job:t.title,predecessor:p.title});}));\n  const slipped=jobs.filter(t=\u003ebase[t.id]?.due\u0026\u0026t.due\u0026\u0026t.due\u003ebase[t.id].due);\n  const unscheduled=jobs.filter(t=\u003e!t.start||!t.due);\n  const overdue=jobs.filter(t=\u003et.due\u0026\u0026t.due\u003casOf\u0026\u0026t.status!=='Done');\n  return {total:jobs.length,planned:jobs.length-unscheduled.length,unscheduled,overdue,conflicts,slipped,baselineAt:project?.baseline?.capturedAt||null,lagDays};\n}\nexport function materialReadiness(state,projectId){\n  return state.bom.filter(b=\u003eb.projectId===projectId\u0026\u0026!b.archivedAt).map(b=\u003e{\n    const part=state.parts.find(p=\u003ep.id===b.partId);\n    const outstanding=Math.max(0,Number(b.required||0)-Number(b.issued||0)-Number(b.reserved||0));\n    const freeStock=part?Math.max(0,availableStock(part)):0;\n    const incoming=state.orders.filter(o=\u003eo.projectId===projectId\u0026\u0026!o.archivedAt).reduce((sum,o)=\u003esum+o obs(s,a,linked){const available=s.tasks.filter(t=\u003et.projectId===a.projectId\u0026\u0026!t.archivedAt);return panel('Linked office \u0026 workshop jobs',`\u003cp\u003eLink jobs to a specific assembly and drawing instruction. Manufacturing readiness is checked separately from the existing WBS task status.\u003c/p\u003e${available.length?`\u003cform class=\"mfg-edit-grid\" data-form=\"mfg-job\"\u003e\u003cinput type=\"hidden\" name=\"assemblyId\" value=\"${h(a.id)}\"\u003e${pick('Job','taskId',available.map(x=\u003e[x.id,x.title]))}${pick('Work instruction revision','revisionId',[['','Unassigned — flag for traceability'],...s.drawingRevisions.filter(r=\u003er.assemblyId===a.id).map(r=\u003e[r.id,`Rev ${r.revision} · ${r.status}`])],a.releasedRevisionId||'')}\u003cbutton class=\"btn primary\" type=\"submit\"\u003eLink job\u003c/button\u003e\u003c/form\u003e`:'\u003cp\u003eNo jobs exist in this project yet.\u003c/p\u003e'}${linked.map(l=\u003e{const t=s.tasks.find(x=\u003ex.id===l.taskId),readiness=jobManufacturingReadiness(s,l.taskId);return `\u003cdiv class=\"mfg-job\"\u003e\u003cdiv class=\"mfg-line\"\u003e\u003cb\u003e${h(t?.title)}\u003c/b\u003e${chip(readiness.ready?'Ready to manufacture':'Blocked',readiness.ready)}${button('Unlink','mfg-unlink',`data-id=\"${h(t.id)}\"`,'small')}\u003c/div\u003e\u003cp class=\"mfg-caption\"\u003e${h(t.department)} · ${h(t.assignee)} · WBS status ${h(t.status)}\u003c/p\u003e${readiness.blockers.map(x=\u003e`\u003cp class=\"mfg-alert\"\u003e⚠ ${h(x)}\u003c/p\u003e`).join('')}${readiness.warnings.map(x=\u003e`\u003cp class=\"mfg-notice\"\u003eⓘ ${h(x)}\u003c/p\u003e`).join('')}\u003c/div\u003e`}).join('')||'\u003cp class=\"mfg-caption\"\u003eNothing linked yet.\u003c/p\u003e'}`);\n}\nfunction changes(s,a){const list=s.engineeringChanges.filter(x=\u003ex.assemblyId===a.id\u0026\u0026!x.archivedAt);return panel('Engineering change register',`\u003cdiv class=\"mfg-toolbar\"\u003e\u003cp\u003eRecord why drawings and production instructions might change, with ownership and schedule/material impacts.\u003c/p\u003e${button('+ Change request','mfg-editor',`data-kind=\"change\"`,'small primary')}\u003c/div\u003e${list.map(x=\u003e`\u003cdiv class=\"mfg-rev\"\u003e\u003cdiv\u003e\u003cb\u003e${h(x.reason)}\u003c/b\u003e\u003cp\u003e${h(x.impact)}\u003c/p\u003e\u003csmall\u003eOwner: ${h(x.owner)}\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e${chip(x.status)}${button('Edit','mfg-editor',`data-kind=\"change\" data-id=\"${h(x.id)}\"`,'small')}${button('Archive','mfg-archive',`data-kind=\"change\" data-id=\"${h(x.id)}\"`,'small')}\u003c/div\u003e\u003c/div\u003e`).join('')||'\u003cp\u003eNo change requests yet.\u003c/p\u003e'}`);\n}\nfunction editor(s,ui,p,a){const ed=ui.mfgEditor;if(!ed)return '';let form='',title='',kind=ed.kind;\n if(kind==='assembly'){\n  const old=s.assemblies.find(x=\u003ex.id===ed.id),parent=ed.parent??old?.parentId??'';title=old?'Edit assembly':'Add assembly';\n  form=field('Assembly name','name',old?.name||'', 'text','required')+field('Code','code',old?.code||'ASM-', 'text','required')+pick('Parent','parentId',[['','Root assembly'],...activeAssemblies(s,p.id).filter(x=\u003ex.id!==old?.id).map(x=\u003e[x.id,x.name])],parent)+field('Qty per parent','perParentQty',old?.perParentQty??1,'number','min=\"1\" step=\"1\" required')+field('Root build quantity','buildQty',old?.buildQty??1,'number','min=\"1\" step=\"1\" required')+field('Owner','owner',old?.owner||'Unassigned')+pick('State','status',['Design','Ready','In manufacture','Inspection','Complete','On hold'].map(v=\u003e[v,v]),old?.status||'Design')+field('Notes','notes',old?.notes||'');\n }else if(kind==='occurrence'){\n  const old=s.assemblyBOM.find(x=\u003ex.id===ed.id);title=old?'Edit part occurrence':'Add part occurrence';\n  form=pick('Part master','partId',s.parts.filter(x=\u003e!x.archivedAt).map(x=\u003e[x.id,`${x.code} — ${x.name}`]),old?.partId||s.parts[0]?.id)+field('Quantity per assembly','quantity',old?.quantity??1,'number','min=\"1\" step=\"1\" required')+field('Position / reference','position',old?.position||'')+pick('Classification','makeBuy',[['Buy','Buy'],['Make','Make']],old?.makeBuy||'Buy')+field('Notes','notes',old?.notes||'');\n }else if(kind==='revision'){\n  const old=s.drawingRevisions.find(x=\u003ex.id===ed.id);title=old?'Edit draft drawing':'Create drawing revision';\n  form=field('Drawing title','title',old?.title||`${a.name} production drawing`,'text','required')+(old?`\u003cdiv class=\"mfg-field\"\u003e\u003cspan\u003eRevision\u003c/span\u003e\u003cb\u003e${h(old.revision)}\u003c/b\u003e\u003c/div\u003e`:field('Revision label','revision','A','text','required'))+field('Owner','owner',old?.owner||'Engineering')+field('Change summary','description',old?.description||'');\n }else if(kind==='change'){\n  const old=s.engineeringChanges.find(x=\u003ex.id===ed.id);title=old?'Edit engineering change':'New engineering change';\n  form=field('Reason','reason',old?.reason||'','text','required')+field('Owner','owner',old?.owner||'Engineering','text','required')+field('Schedule / cost / material impact','impact',old?.impact||'')+pick('Disposition','status',['Open','Assessing','Approved','Rejected','Closed'].map(v=\u003e[v,v]),old?.status||'Open');\n }\n return `\u003cdiv class=\"mfg-editor\"\u003e\u003cdiv class=\"mfg-toolbar\"\u003e\u003cstrong\u003e${h(title)}\u003c/strong\u003e${button('Cancel','mfg-cancel-editor','','small')}\u003c/div\u003e\u003cform data-form=\"mfg-${h(kind)}\" class=\"mfg-edit-grid\"\u003e\u003cinput type=\"hidden\" name=\"recordId\" value=\"${h(ed.id||'')}\"\u003e\u003cinput type=\"hidden\" name=\"projectId\" value=\"${h(p.id)}\"\u003e\u003cinput type=\"hidden\" name=\"assemblyId\" value=\"${h(a.id)}\"\u003e${form}\u003cdiv class=\"mfg-form-actions\"\u003e\u003cbutton type=\"submit\" class=\"btn primary\"\u003eSave to local demo\u003c/button\u003e\u003c/div\u003e\u003c/form\u003e\u003c/div\u003e`;\n}\nexport function handleManufacturingAction(s,ui,el,confirmFn){const action=el.dataset.action,asm=ui.mfgAssemblyId;if(!action?.startsWith('mfg-'))return false;\n if(action==='mfg-select'){ui.mfgAssemblyId=el.dataset.id;ui.mfgEditor=null;ui.mfgTab='overview';}\n if(action==='mfg-tab'){ui.mfgTab=el.dataset.id;ui.mfgEditor=null;}\n if(action==='mfg-editor'){ui.mfgEditor={kind:el.dataset.kind,id:el.dataset.id||null,parent:el.dataset.parent,assemblyId:asm};}\n if(action==='mfg-cancel-editor')ui.mfgEditor=null;\n if(action==='mfg-archive'){if(confirmFn('Archive this manufacturing record? It can be restored.'))archiveManufacturing(s,el.dataset.kind,el.dataset.id);}\n if(action==='mfg-restore')archiveManufacturing(s,el.dataset.kind,el.dataset.id,true);\n if(action==='mfg-revision-state'){if(el.dataset.state!=='Released'||confirmFn('Simulate internal engineering release? This freezes the current BOM as a revision-specific snapshot. No real approval is recorded.'))transitionRevision(s,el.dataset.id,el.dataset.state);}\n if(action==='mfg-unlink'){s.jobAssemblyLinks=s.jobAssemblyLinks.filter(x=\u003ex.taskId!==el.dataset.id);s.audit.unshift({id:'audit-'+Math.random().toString(36).slice(2),actor:'Sim-Worx Demo',action:'Job unlinked',detail:el.dataset.id,at:new Date().toISOString()});}\n return true;\n}\nexport function handleManufacturingSubmit(s,ui,form){const type=form.dataset.form;if(!type?.startsWith('mfg-'))return false;\n const fd=new FormData(form),v=k=\u003eString(fd.get(k)||'').trim(),recordId=v('recordId')||undefined,assemblyId=v('assemblyId');\n if(type==='mfg-assembly'){const a=saveAssembly(s,{id:recordId,projectId:v('projectId'),name:v('name'),code:v('code'),parentId:v('parentId'),perParentQty:v('perParentQty'),buildQty:v('buildQty'),owner:v('owner'),status:v('status'),notes:v('notes')});ui.mfgAssemblyId=a.id;}\n else if(type==='mfg-occurrence')saveOccurrence(s,{id:recordId,assemblyId,partId:v('partId'),quantity:v('quantity'),position:v('position'),makeBuy:v('makeBuy'),notes:v('notes')});\n else if(type==='mfg-revision'){if(recordId)updateDraftRevision(s,recordId,{title:v('title'),description:v('description')});else createDrawingRevision(s,{assemblyId,revision:v('revision'),title:v('title'),description:v('description'),owner:v('owner')});}\n else if(type==='mfg-change')saveEngineeringChange(s,{id:recordId,assemblyId,reason:v('reason'),owner:v('owner'),impact:v('impact'),status:v('status')});\n else if(type==='mfg-job')linkAssemblyJob(s,{taskId:v('taskId'),assemblyId,revisionId:v('revisionId')});\n else throw Error('Unrecognized manufacturing form');\n ui.mfgEditor=null;return true;\n}\n","materials-v041.mjs":"/* Project Hub V0.5.2 — browser-only purchasing, stock and backups.\n   This is NOT a multi-user inventory database or financial/accounting system. */\nimport {validateWorkEvidence} from './work-evidence-v051.mjs';\nimport {ensureManufacturing,activeAssemblies,assemblyRollup} from './manufacturing.mjs';\nimport {safeProductURL} from './procurement-sourcing-v046.mjs';\nimport {assertContractPOGate,contractControlled,acceptArrivalRecord} from './procurement-workflow-v047.mjs';\nimport {assertPOAuthorised} from './procurement-control-v049.mjs';\nconst uid = prefix =\u003e prefix+'-'+Math.random().toString(36).slice(2,11);\nconst timestamp = () =\u003e new Date().toISOString();\nconst live = x =\u003e x \u0026\u0026 !x.archivedAt;\nconst integer = (value,label) =\u003e {\n  const n=Number(value);\n  if(!Number.isSafeInteger(n)||n\u003c=0)throw Error(label+' must be a positive whole number');\n  return n;\n};\nconst amount = (v,label) =\u003e {\n  const n=Number(v);\n  if(!Number.isFinite(n)||n\u003c0)throw Error(label+' must be zero or greater');\n  return n;\n};\nconst required = (value,label) =\u003e {\n  const s=String(value??'').trim();\n  if(!s)throw Error(label+' is required');\n  return s;\n};\nconst note = (s,action,detail) =\u003e {\n  s.audit??=[];\n  s.audit.unshift({id:uid('audit'),action,detail,actor:'Internal staff',at:timestamp()});\n};\nconst recordMovement = (s,partId,type,quantity,projectId,ref='') =\u003e {\n  s.movements??=[];\n  s.movements.unshift({id:uid('mv'),partId,type,quantity,projectId,reference:ref,actor:'Workshop stores',date:timestamp()});\n};\nconst partById = (s,partId) =\u003e {\n  const p=s.parts?.find(p=\u003elive(p)\u0026\u0026p.id===partId);\n  if(!p)throw Error('Part master not found');\n  return p;\n};\nconst projectById = (s,projectId) =\u003e {\n  const p=s.projects?.find(p=\u003elive(p)\u0026\u0026p.id===projectId);\n  if(!p)throw Error('Project unavailable');\n  return p;\n};\nconst assemblyForProject=(s,id,projectId)=\u003e{\n  if(!id)return null;\n  const a=s.assemblies.find(a=\u003elive(a)\u0026\u0026a.id===id\u0026\u0026a.projectId===projectId);\n  if(!a)throw Error('Assembly does not belong to this project');\n  return a;\n};\nexport function ensureMaterials(s){\n  ensureManufacturing(s);\n  s.stockReservations??=[];\n  s.procurementReceipts??=[];\n  s.procurementReturns??=[];\n  s.procurementArrivals??=[];\n  s.orders??=[];\n  s.movements??=[];\n  for(const o of s.orders){\n    o.items??=[];\n    o.items.forEach((line,i)=\u003e{if(!line.id)line.id='legacy-line-'+o.id+'-'+i;});\n  }\n  s.materialsSchemaVersion=1;\n  return s;\n}\nexport const available = part =\u003e Math.max(0,Number(part.onHand||0)-Number(part.reserved||0));\nexport const outstanding = line =\u003e Math.max(0,Number(line.quantity||0)-Number(line.received||0)-Number(line.closedQuantity||0));\nexport const purchaseStatus = order =\u003e {\n  if(!order.items?.length)return 'Draft';\n  const all=order.items.every(l=\u003eoutstanding(l)===0);\n  if(all){\n   if(order.items.every(l=\u003eNumber(l.received||0)===Number(l.quantity||0)))return 'Received';\n   if(order.items.every(l=\u003e!Number(l.received||0)))return 'Closed';\n   return 'Part received · closed';\n  }\n  if(order.items.some(l=\u003eNumber(l.received||0)\u003e0))return 'Part received';\n  return order.dispatchState==='Out for delivery'?'Out for delivery':'Ordered';\n};\n/* Procurement stages do not affect stock. Only validated goods receipt changes on-hand. */\nexport function setPurchaseDispatch(state,{orderId,stage}){\n  ensureMaterials(state);\n  const o=state.orders.find(x=\u003elive(x)\u0026\u0026x.id===orderId);\n  if(!o)throw Error('Purchase order unavailable');\n  if(!['Ordered','Out for delivery'].includes(stage))throw Error('Choose Ordered or Out for delivery');\n  if(['Received','Closed','Part received · closed'].includes(purchaseStatus(o)))throw Error('Closed or fully received order cannot be changed to an earlier delivery stage');\n  o.dispatchState=stage;\n  o.status=purchaseStatus(o);\n  note(state,'Order delivery stage updated',o.code+' / '+stage);\n  return o;\n}\nfunction normalizedLine(s,projectId,input,supplier){\n  const part=partById(s,input.partId);\n  assemblyForProject(s,input.assemblyId,projectId);\n  const quantity=integer(input.quantity,'Order quantity');\n  const unitCost=amount(input.unitCost??0,'Unit cost');\n  const eta=String(input.eta||'').trim();\n  if(eta\u0026\u0026(!/^\\d{4}-\\d{2}-\\d{2}$/.test(eta)||new Date(eta+'T12:00:00Z').toISOString().slice(0,10)!==eta))throw Error('ETA must be a valid ISO date');\n  const sourceOccurrenceId=String(input.sourceOccurrenceId||'').trim();\n  if(sourceOccurrenceId\u0026\u0026!s.assemblyBOM?.some(x=\u003ex.id===sourceOccurrenceId\u0026\u0026!x.archivedAt\u0026\u0026x.projectId===projectId\u0026\u0026x.partId===part.id))\n    throw Error('Purchase source must match a live requirement for this project and part');\n  const verified=assertContractPOGate(s,projectId,input,supplier);\n  const vendorSku=String(input.vendorSku||'').trim(),quoteRef=String(input.quoteRef||'').trim(),notes=String(input.notes||'').trim();\n  if(vendorSku.length\u003e120||quoteRef.length\u003e120||notes.length\u003e800)throw Error('Supplier code, quote reference or purchase note too long');\n  return {id:uid('pol'),partId:part.id,assemblyId:input.assemblyId||null,quantity,rec lRef=approvals[i].approvalRef;\n  }\n  const prefix='PO-'+new Date().getFullYear()+'-';\n  let sequence=s.orders.length+1;\n  while(s.orders.some(o=\u003eo.code===prefix+String(sequence).padStart(4,'0')))sequence++;\n  const code=prefix+String(sequence).padStart(4,'0');\n  const order={id:uid('po'),code,projectId:project.id,supplier,currency,taxRate,eurExchangeRate,\n    date:timestamp().slice(0,10),status:'Ordered',dispatchState:'Ordered',origin:'v042',items};\n  s.orders.unshift(order);\n  note(s,'Purchase order created',code+' / '+items.length+' lines');\n  return order;\n}\nexport function addPurchaseLine(s,orderId,line){\n  ensureMaterials(s);\n  const o=s.orders.find(x=\u003elive(x)\u0026\u0026x.id===orderId);\n  if(!o)throw Error('Purchase order unavailable');\n  if(!contractControlled(s,o.projectId))throw Error('Adding an unapproved supplier order line is blocked until the project has controlled purchasing enabled');\n  const row=normalizedLine(s,o.projectId,line,o.supplier);\n  if(contractControlled(s,o.projectId)){\n   const available=materialReadinessV041(s,o.projectId).find(r=\u003er.partId===row.partId)?.toSource||0;\n   if(row.quantity\u003eavailable)throw Error('Added PO quantity exceeds the remaining engineering sourcing gap');\n  }\n  const approvals=assertPOAuthorised(s,{projectId:o.projectId,supplier:o.supplier,currency:o.currency,\n    taxRate:o.taxRate,eurExchangeRate:o.eurExchangeRate,items:[row]});\n  if(approvals[0]){row.purchaseAuthorisationId=approvals[0].authorizationId;\n   row.recordedApprovalRef=approvals[0].approvalRef;}\n  o.items.push(row);o.status=purchaseStatus(o);\n  note(s,'Purchase order line added',o.code);\n  return row;\n}\nfunction orderAndLine(s,orderId,lineId){\n  const o=s.orders.find(x=\u003elive(x)\u0026\u0026x.id===orderId);\n  if(!o)throw Error('Purchase order unavailable');\n  const line=o.items.find(x=\u003ex.id===lineId);\n  if(!line)throw Error('Purchase order line not found');\n  return {o,line};\n}\nexport funct ettings. Changes remain in this browser demo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"row-actions\"\u003e${button('Export WBS CSV','export-wbs','small',`data-id=\"${p.id}\"`)}${button(`${ico('plus')} New job`,'open-task-modal','small primary',`data-project=\"${p.id}\"`)}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"sheet-scroll\"\u003e\u003ctable class=\"work-sheet\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eWBS\u003c/th\u003e\u003cth style=\"min-width:240px\"\u003eJob / Work package\u003c/th\u003e\u003cth\u003eOwner\u003c/th\u003e\u003cth\u003eDepartment\u003c/th\u003e\u003cth\u003eStart\u003c/th\u003e\u003cth\u003eFinish\u003c/th\u003e\u003cth\u003eStatus\u003c/th\u003e\u003cth\u003ePriority\u003c/th\u003e\u003cth\u003eDependencies\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${rows.map(row=\u003e{\n if(row.section)return `\u003ctr class=\"sheet-section\"\u003e\u003ctd class=\"mono\"\u003e${e(row.code)}\u003c/td\u003e\u003ctd colspan=\"9\"\u003e${ico('projects',13)} ${e(row.section.name)}\u003c/td\u003e\u003c/tr\u003e`;\n const t=row.task;const predecessors=predecessorIds(t).map(id=\u003edata.tasks.find(x=\u003ex.id===id)?.title||id).join(', ');\n return `\u003ctr\u003e\u003ctd class=\"mono sheet-wbs\"\u003e${e(row.code)}\u003c/td\u003e\u003ctd\u003e\u003cdiv class=\"sheet-title\" style=\"padding-left:${row.depth*15}px\"\u003e${row.depth?'↳ ':''}\u003cstrong\u003e${e(t.title)}\u003c/strong\u003e\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e\u003cinput class=\"sheet-control owner\" data-inline-task=\"${e(t.id)}\" data-field=\"assignee\" aria-label=\"Owner for ${e(t.title)}\" value=\"${e(t.assignee)}\"\u003e\u003c/td\u003e\u003ctd\u003e${selector(t,'department',departments)}\u003c/td\u003e\u003ctd\u003e\u003cinput type=\"date\" class=\"sheet-control date\" data-inline-task=\"${e(t.id)}\" data-field=\"start\" aria-label=\"Start date for ${e(t.title)}\" value=\"${e(t.start||'')}\"\u003e\u003c/td\u003e\u .[t.id],deps=predecessorIds(t),conflict=summary.conflicts.some(x=\u003ex.jobId===t.id);\n  let bar='';\n  if(start\u0026\u0026due){const left=Math.max(0,xPos(start)),right=Math.min(100,xPos(shiftDate(due,1)));if(right\u003eleft)bar=`\u003cdiv class=\"gantt-bar ${t.status==='Done'?'complete':''} ${conflict?'conflict':''}\" title=\"${e(t.title)}: ${day(start)} – ${day(due)}\" style=\"left:${left}%;width:${Math.max(0.5,right-left)}%\"\u003e\u003c/div\u003e`;}\n  else if(due){const mark=xPos(due);if(mark\u003e=0\u0026\u0026mark\u003c=100)bar=`\u003cdiv class=\"gantt-marker\" style=\"left:${mark}%\" title=\"Finish ${day(due)} — add a start date\"\u003e\u003c/div\u003e`;}\n  let baseline='';if(base?.start\u0026\u0026base?.due){const left=Math.max(0,xPos(base.start)),right=Math.min(100,xPos(shiftDate(base.due,1)));if(right\u003eleft)baseline=`\u003cdiv class=\"gantt-baseline\" style=\"left:${left}%;width:${Math.max(0.5,right-left)}%\" title=\"Original baseline ${day(base.start)}–${day(base.due)}\"\u003e\u003c/div\u003e`;}\n  return `\u003cdiv class=\"gantt-row\"\u003e\u003cdiv class=\"gantt-label gantt-job\" style=\"padding-left:${14+row.depth*17}px\"\u003e\u003cspan class=\"mono\"\u003e${e(row.code)}\u003c/span\u003e\u003cbutton data-action=\"edit-task\" data-id=\"${e(t.id)}\" title=\"Edit job plan\"\u003e${e(t.title)}\u003c/button\u003e\u003csmall\u003e${e(t.department)}${deps.length?` · ${deps.length} predecessor${deps.length\u003e1?'s':''}`:''}\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gantt-grid\" data-action=\"edit-task\" data-id=\"${e(t.id)}\" title=\"Edit ${e(t.title)}\"\u003e${baseline}${bar}${!start?'\u003cspan class=\"gantt-unscheduled\"\u003ePlan start\u003c/span\u003e':''}${todayX\u003e=0\u0026\u0026todayX\u003c=100?`\u003cspan class=\"gantt-today\" style=\"left:${todayX}%\"\u003e\u003c/span\u003e`:''}\u003c/div\u003e\u003c/div\u003e`;\n }).join('');\n const alerts=[...summary.conflicts.map(x=\u003e`\u003cdiv class=\"plan-warning\"\u003e${ico('clock', 003c/div\u003e\u003cdiv\u003e\u003cstrong\u003e${rows.reduce((sum,r)=\u003esum+r.incoming,0)}\u003c/strong\u003e\u003cspan\u003eItems on open POs\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePart / assembly\u003c/th\u003e\u003cth\u003eRemaining need\u003c/th\u003e\u003cth\u003eUnreserved stores\u003c/th\u003e\u003cth\u003eOn project POs\u003c/th\u003e\u003cth\u003eUncovered estimate\u003c/th\u003e\u003cth\u003eSuggested action\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${rows.map(r=\u003e{const s=data.sections.find(x=\u003ex.id===r.sectionId)?.name||'Unassigned assembly';return `\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003e${e(r.part?.code||'Unknown')}\u003c/strong\u003e\u003csmall style=\"display:block\"\u003e${e(r.part?.name||'Missing part')} · ${e(s)}\u003c/small\u003e\u003c/td\u003e\u003ctd\u003e${number(r.quantityOutstanding)}\u003c/td\u003e\u003ctd\u003e${number(r.freeStock)}\u003c/td\u003e\u003ctd\u003e${number(r.incoming)}\u003c/td\u003e\u003ctd\u003e${badge(String(r.estimatedGap),r.estimatedGap?'red':'green')}\u003c/td\u003e\u003ctd\u003e${r.estimatedGap?'Check sourcing / ordering':'Material forecast covered'}\u003c/td\u003e\u003c/tr\u003e`}).join('')||'\u003ctr\u003e\u003ctd colspan=\"6\"\u003eNo BOM requirements\u003c/td\u003e\u003c/tr\u003e'}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"planning-foot\"\u003eForecast only: stores quantities can be shared across projects; this view does not reserve stock, allocate incoming orders or certify availability. Production must use transactional reservations.\u003c/div\u003e`;\n}\n\nfunction taskItem(t){return `\u003cdiv class=\"task-item\"\u003e\u003cbutton class=\"task-bullet ${t.status==='Done'?'done':''}\" data-action=\"toggle-task\" data-id=\"${t.id}\" aria-label=\"Toggle task completion\"\u003e${t.status==='Done'?ico('check',12):''}\u003c/button\u0 003e\u003ctd\u003e\u003cdiv class=\"row-actions\"\u003e${button('Edit','edit-bom','small',`data-id=\"${b.id}\"`)}${button('Archive','archive-record','small danger',`data-kind=\"bom\" data-id=\"${b.id}\"`)}\u003c/div\u003e\u003c/td\u003e\u003c/tr\u003e`}).join('')||'\u003ctr\u003e\u003ctd colspan=\"7\" class=\"subtle\"\u003eNo BOM items assigned\u003c/td\u003e\u003c/tr\u003e'}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e`}\n\nfunction projectDocuments(p){const docs=active(data.documents).filter(d=\u003ed.projectId===p.id);return `\u003cdiv class=\"toolbar\"\u003e\u003cspan class=\"subtle\"\u003eRevision-aware document register · demo metadata only\u003c/span\u003e\u003cdiv class=\"spacer\"\u003e\u003c/div\u003e${button(`${ico('plus')} Add document`,'open-document-modal','small',`data-project=\"${p.id}\"`)}\u003c/div\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eDocument\u003c/th\u003e\u003cth\u003eRevision\u003c/th\u003e\u003cth\u003eType\u003c/th\u003e\u003cth\u003eVisibility\u003c/th\u003e\u003cth\u003eUpdated\u003c/th\u003e\u003cth\u003eManage\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${docs.map(d=\u003e`\u003ctr\u003e\u003ctd\u003e${ico('file')} \u003cstrong\u003e${e(d.title)}\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e${e(d.rev)}\u003c/td\u003e\u003ctd\u003e${e(d.type)}\u003c/td\u003e\u003ctd\u003e${badge(d.visibility==='customer'?'Published':'Internal',d.visibility==='customer'?'green':'gray')}\u003c/td\u003e\u003ctd\u003e${day(d.date)}\u003c/td\u003e\u003ctd\u003e\u003cdiv class=\"row-actions\"\u003e${button('Edit','edit-document','small',`data-id=\"${d.id}\"`)}${button('Archive','archive-record','small danger',`data-kind=\"documents\" data-id=\"${d.id}\"`)}\u003c/div\u003e\u003c/td\u003e\u003c/tr\u003e`).join('')||'\u003ctr\u003e\u003ctd colspan=\"6\" class=\"subtle\"\u003eNo documents\u003c/td\u003e\u003c/tr\u003e'}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e`}\nfunction projectPublishing(p){const u=active(data.updates).filter(x=\u003ex.projectId===p.id);return `\u003cdiv class=\"toolbar\"\u003e\u003cdiv class=\"subtle\"\u003eNever automatically expose internal jobs to customers\u003c/div\u003e\u003cdiv class=\"spacer\"\u003e\u003c/div\u003e${button(`${ico('plus')} Draft update`,'open-update-modal','small',`data-project=\"${p.id}\"`)}\u003c/div\u003e\u003cdiv class=\"card-body\" style=\"padding-top:4px\"\u003e${u.map(x=\u003e`\u003cdiv class=\"approval-row\"\u003e\u003cdiv\u003e\u003cstrong\u003e${e(x.title)}\u003c/strong\u003e\u003csmall\u003e${e(x.kind)} · ${e(x.description)}\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"row-actions\"\u003e${badge(x.status==='published'?'Published':'Draft',x.status==='published'?'green':'purple')}${x.status==='draft'?button('Edit','edit-update','small',`data-id=\"${x.id}\"`):''}${x.status==='draft'?button('Publish','publish','small primary',`data-id=\"${x.id}\"`):''}${x.status==='published'?button('Withdraw','withdraw-update','small danger',`data-id=\"${x.id}\"`):''}${x.status==='draft'?button('Archive','archive-record','small danger',`data-kind=\"updates\" data-id=\"${x.id}\"`):''}\u003c/div\u003e\u003c/div\u003e`).join('')||'\u003cdiv class=\"empty\"\u003eNo updates yet\u003c/div\u003e'}\u003cp class=\"form-hint\"\u003ePublishing here updates only the local demo customer preview. Production requires a separate allowlisted customer representation and verified permissions.\u003c/p\u003e\u003c/div\u003e`}\nfunction tasksPage(){const project=ui.taskProject||'all';const filtered=active(data.tasks).filter(t=\u003eallActiveProjects().some(p=\u003ep.id===t.projectId)\u0026\u0026(ui.dept==='All'||t.department===ui.dept)\u0026\u0026(project==='all'||t.projectId===project));\n  const projectFilter=`\u003cselect class=\"filter-select\" data-filter=\"taskProject\"\u003e\u003coption value=\"all\"\u003eAll projects\u003c/option\u003e${allActiveProjects().map(p=\u003e`\u003coption value=\"${p.id}\" ${project===p.id?'selected':''}\u003e${e(p.code)} — ${e(p.name)}\u003c/option\u003e`).join('')}\u003c/select\u003e`;\n  const deptFilter=`\u003cselect class=\"filter-select\" data-filter=\"dept\"\u003e${['All','Office','Workshop','Purchasing','Quality'].map(d=\u003e`\u003coption ${ui.dept===d?'selected':''}\u003e${d}\u003c/option\u003e`).join('')}\u003c/select\u003e`;\n  const headTools=`${button(`${ico('plus')} New job`,'open-task-modal','primary')}`;\n  const cols=[['Backlog','Backlog'],['Ready','Ready'],['In progress','In progress'],['Blocked','Blocked'],['Inspection','Inspection'],['Done','Done']];\n  const board=`\u003cdiv class=\"kanban\"\u003e${cols.map(([status,label])=\u003e{const list=filtered.filter(t=\u003et.status===status);return `\u003cdiv class=\"kanban-col\"\u003e\u003cdiv class=\"kanban-head\"\u003e\u003cstrong\u003e${label}\u003c/strong\u003e\u003cspan class=\"pill no-dot gray\"\u003e${list.length}\u003c/span\u003e\u003c/div\u003e${list.map(t=\u003e`\u003cdiv class=\"task-card\"\u003e\u003cdiv class=\"row-actions\" style=\"float:right\"\u003e${button(ico('more',14),'edit-task','small',`data-id=\"${t.id}\" title=\"Edit job\" aria-label=\"Edit ${e(t.title)}\"`)}\u003c/div\u003e\u003cstrong\u003e${e(t.title)}\u003c/strong\u003e\u003cp\u003e${e(findProject(t.projectId)?.code)} · ${e(t.assignee)}\u003c/p\u003e\u003cdiv class=\"task-footer\"\u003e\u003cspan class=\"tag ${e(t.department.toLowerCase())}\"\u003e${e(t.department)}\u003c/span\u003e\u003cselect class=\"filter-select\" style=\"max-width:120px;min-height:29px;padding:5px\" data-task-status=\"${t.id}\" aria-label=\"Change task status\"\u003e${cols.map(([val])=\u003e`\u003coption value=\"${val}\" ${t.status===val?'selected':''}\u003e${val}\u003c/option\u003e`).join('')}\u003c/select\u003e\u003c/div\u003e\u003c/div\u003e`).join('')||'\u003cdiv class=\"subtle\" style=\"padding:12px 4px\"\u003eNo jobs\u003c/div\u003e'}\u003c/div\u003e`}).join('')}\u003c/div\u003e`;\n  const rows=filtered.map(t=\u003e`\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${e(t.title)}\u003c/b\u003e\u003cdiv class=\"subtle\"\u003e${e(findProject(t.projectId)?.code)}\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e${e(t.department)}\u003c/td\u003e\u003ctd\u003e${e(t.assignee)}\u003c/td\u003e\u003ctd\u003e${badge(t.status)}\u003c/td\u003e\u003ctd\u003e${day(t.due)}\u003c/td\u003e\u003ctd\u003e\u003cselect data-task-status=\"${t.id}\" class=\"filter-select\" style=\"max-width:150px\"\u003e${cols.map(([v])=\u003e`\u003coption value=\"${v}\" ${t.status===v?'selected':''}\u003e${v}\u003c/option\u003e`).join('')}\u003c/select\u003e\u003c/td\u003e\u003ctd\u003e\u003cdiv class=\"row-actions\"\u003e${button('Edit','edit-task','small',`data-id=\"${t.id}\"`)}${button('Archive','archive-record','small danger',`data-kind=\"tasks\" data-id=\"${t.id}\"`)}\u003c/div\u003e\u003c/td\u003e\u003c/tr\u003e`).join('');\n  return head('Workshop \u0026 office jobs','Assignable work across engineering, production, purchasing and quality.',headTools)+`\u003cdiv class=\"card\"\u003e\u003cdiv class=\"toolbar\"\u003e${projectFilter}${deptFilter}\u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\u003cdiv class=\"segmented\"\u003e${button('Board','task-board',`small ${ui.taskView==='board'?'active':''}`)}${button('List','task-list',`small ${ui.taskView==='list'?'active':''}`)}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card-body\"\u003e${ui.taskView==='board'?board:`\u003cdiv class=\"table-wrap\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eJob\u003c/th\u003e\u003cth\u003eDepartment\u003c/th\u003e\u003cth\u003eAssigned\u003c/th\u003e\u003cth\u003eStatus\u003c/th\u003e\u003cth\u003eDue\u003c/th\u003e\u003cth\u003eUpdate\u003c/th\u003e\u003cth\u003eEdit / archive\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${rows}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e`}\u003c/div\u003e\u003c/div\u003e`;\n}\nfunction purchasingPage(){const orders=active(data.orders),open=orders.filter(o=\u003eo.status!=='Received');const total=orders.reduce((s,o)=\u003es+o.items.reduce((x,l)=\u003ex+Number(l.quantity)*Number(l.unitCost),0),0);\n  return head('Purchasing','Supplier orders, open commitments and materials due for the workshop.',button(`${ico('plus')} New purchase order`,'open-po-modal','primary'))+`\u003cdiv class=\"kpis\"\u003e\u003cdiv class=\"kpi\"\u003e\u003cdiv\u003e\u003cdiv class=\"kpi-label\"\u003ePurchase orders\u003c/div\u003e\u003cdiv class=\"kpi-value\"\u003e${orders.length}\u003c/div\u003e\u003cdiv class=\"kpi-note\"\u003eAll tracked orders\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-icon\"\u003e${ico('purchasing')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi\"\u003e\u003cdiv\u003e\u003cdiv class=\"kpi-label\"\u003eOpen orders\u003c/div\u003e\u003cdiv class=\"kpi-value\"\u003e${open.length}\u003c/div\u003e\u003cdiv class=\"kpi-note\"\u003eAwaiting goods\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-icon\"\u003e${ico('clock')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi\"\u003e\u003cdiv\u003e\u003cdiv class=\"kpi-label\"\u003eOrder value\u003c/div\u003e\u003cdiv class=\"kpi-value\" style=\"font-size:23px\"\u003e${money(total)}\u003c/div\u003e\u003cdiv class=\"kpi-note\"\u003eDemonstration purchases\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-icon\"\u003e${ico('finance')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi\"\u003e\u003cdiv\u003e\u003cdiv class=\"kpi-label\"\u003ePartially received\u003c/div\u003e\u003cdiv class=\"kpi-value\"\u003e${orders.filter(o=\u003eo.status==='Part received').length}\u003c/div\u003e\u003cdiv class=\"kpi-note\"\u003eOutstanding balances\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-icon\"\u003e${ico('inventory')}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e${card('Purchase order register',`\u003cdiv class=\"table-wrap\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eOrder\u003c/th\u003e\u003cth\u003eSupplier\u003c/th\u003e\u003cth\u003eAllocated project\u003c/th\u003e\u003cth\u003eValue\u003c/th\u003e\u003cth\u003eDelivery status\u003c/th\u003e\u003cth\u003eAction\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${orders.map(o=\u003e`\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${e(o.code)}\u003c/b\u003e\u003cdiv class=\"subtle\"\u003e${day(o.date)}\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e${e(o.supplier)}\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"subtle\"\u003e${e(findProject(o.projectId)?.code)}\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e${money(o.items.reduce((x,l)=\u003ex+l.quantity*l.unitCost,0))}\u003c/td\u003e\u003ctd\u003e${badge(o.status)}\u003c/td\u003e\u003ctd\u003e\u003cdiv class=\"row-actions\"\u003e${o.status==='Received'?'\u003cspan class=\"subtle\"\u003eAll received\u003c/span\u003e':button('Receive remaining','receive-po','small',`data-id=\"${o.id}\"`)}${button('Archive','archive-record','small danger',`data-kind=\"orders\" data-id=\"${o.id}\"`)}\u003c/div\u003e\u003c/td\u003e\u003c/tr\u003e`).join('')}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e`,'','Receiving an order adds its outstanding quantity into local demo stock')}`;\n}\nfunction inventoryPage(){const low=active(data.parts).filter(p=\u003eavailableStock(p)\u003c=p.min);const rows=active(data.parts).map(p=\u003e`\u003ctr\u003e\u003ctd\u003e\u003cstrong class=\"mono\"\u003e${e(p.code)}\u003c/strong\u003e\u003cdiv class=\"subtle\"\u003e${e(p.supplier)}\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003e${e(p.name)}\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"subtle\"\u003e${e(p.location)}\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e${number(p.onHand)} ${e(p.unit)}\u003c/td\u003e\u003ctd\u003e${number(p.reserved)}\u003c/td\u003e\u003ctd\u003e\u003cstrong class=\"${availableStock(p)\u003c=p.min?'danger-text':'green-text'}\"\u003e${number(availableStock(p))}\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e${availableStock(p)\u003c=p.min?badge('Reorder','amber'):badge('Healthy','green')}\u003c/td\u003e\u003ctd\u003e\u003cdiv class=\"row-actions\"\u003e${button('Move','stock-modal','small',`data-id=\"${p.id}\"`)}${button('Edit','edit-part','small',`data-id=\"${p.id}\"`)}${button('Archive','archive-record','small danger',`data-kind=\"parts\" data-id=\"${p.id}\"`)}\u003c/div\u003e\u003c/td\u003e\u003c/tr\u003e`).join('');\n  return head('Parts \u0026 inventory','A joined-up view of quantities, reservations, stores and shortages.',button(`${ico('plus')} New part`,'add-part','primary')+button('Stock movement','stock-modal','small'))+`\u003cdiv class=\"kpis\"\u003e\u003cdiv class=\"kpi\"\u003e\u003cdiv\u003e\u003cdiv class=\"kpi-label\"\u003ePart SKUs\u003c/div\u003e\u003cdiv class=\"kpi-value\"\u003e${data.parts.length}\u003c/div\u003e\u003cdiv class=\"kpi-note\"\u003eStock catalogue\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-icon\"\u003e${ico('inventory')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi\"\u003e\u003cdiv\u003e\u003cdiv class=\"kpi-label\"\u003eBelow reorder level\u003c/div\u003e\u003cdiv class=\"kpi-value\"\u003e${low.length}\u003c/div\u003e\u003cdiv class=\"kpi-note\"\u003eAvailable stock\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-icon\"\u003e${ico('clock')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi\"\u003e\u003cdiv\u003e\u003cdiv class=\"kpi-label\"\u003eReserved units\u003c/div\u003e\u003cdiv class=\"kpi-value\"\u003e${number(data.parts.reduce((s,p)=\u003es+p.reserved,0))}\u003c/div\u003e\u003cdiv class=\"kpi-note\"\u003eAllocated to projects\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-icon\"\u003e${ico('projects')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi\"\u003e\u003cdiv\u003e\u003cdiv class=\"kpi-label\"\u003eInventory value\u003c/div\u003e\u003cdiv class=\"kpi-value\" style=\"font-size:22px\"\u003e${money(data.parts.reduce((s,p)=\u003es+p.onHand*p.cost,0))}\u003c/div\u003e\u003cdiv class=\"kpi-note\"\u003eAt rn `\u003cdiv class=\"org-card\"\u003e\u003cdiv class=\"org-header\"\u003e\u003cdiv class=\"org-logo\" style=\"background:${e(org.accent)}\"\u003e${e(org.logo)}\u003c/div\u003e\u003cdiv\u003e\u003ch3\u003e${e(org.name)}\u003c/h3\u003e\u003cspan class=\"subtle\"\u003e${e(org.contact)} · ${e(org.code)}\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e${projects.length} separate customer project${projects.length!==1?'s':''}, each with its own access controls.\u003c/p\u003e\u003cdiv class=\"org-stats\"\u003e\u003cdiv\u003e\u003cstrong\u003e${projects.length}\u003c/strong\u003e\u003cspan\u003eProjects\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003e${members.length}\u003c/strong\u003e\u003cspan\u003ePeople\u003c/span\u003e\u003c/div\u003e${button('Manage '+ico('chevron'),'customer-detail','small',`data-id=\"${org.id}\"`)}${button('Edit','edit-customer','small',`data-id=\"${org.id}\"`)}${button('Archive','archive-record','small danger',`data-kind=\"organizations\" data-id=\"${org.id}\"`)}\u003c/div\u003e\u003c/div\u003e`}).join('')}\u003c/div\u003e${detail\u0026\u0026!detail.archivedAt?customerDetail(detail):''}`}\nfunction customerDetail(org){const members=active(data.members).filter(m=\u003em.orgId===org.id),projects=activeOrgProjects(org.id);return card(`${org.name} · customer team`, `\u003cdiv class=\"toolbar\"\u003e\u003cspan class=\"subtle\"\u003eCustomer admins can only delegate pre-granted project scopes in the future secure portal.\u003c/span\u003e\u003cdiv class=\"spacer\"\u003e\u003c/div\u003e${button(`${ico('plus')} Add team member`,'invite-modal','small',`data-org=\"${org.id}\"`)}\u003c/div\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePerson\u003c/th\u003e\u003cth\u003eRole\u003c/th\u003e\u003cth\u003eProject access\u003c/th\u003e\u003cth\u003eStatus\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${members.map(m=\u003e`\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${e(m.name)}\u003c/b\u003e\u003cdiv class=\"subtle\"\u003e${e(m.email)}\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e${badge(m.role,'purple')}\u003c/td\u003e\u003ctd\u003e${m.projects.map(id=\u003e`\u003cspan class=\"tag\"\u003e${e(findProject(id)?.code||id)}\u003c/span\u003e`).join(' ')}\u003c/td\u003e\u003ctd\u003e${badge(m.status||'Active','green')}\u003c/td\u003e\u003c/tr\u003e`).join('')||'\u003ctr\u003e\u003ctd colspan=\"4\"\u003eNo team members yet.\u003c/td\u003e\u003c/tr\u003e'}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"card-body\"\u003e\u003cdiv class=\"subtle\"\u003eAuthorised projects: ${projects.map(p=\u003ee(p.code)).join(', ')||'None'}\u003c/div\u003e\u003c/div\u003e`);\n}\nfunction clientPage(){let projection=clientProjection(data,ui.clientOrg,ui.clientProject);if(!projection){ui.clientOrg=data.organizations[0]?.id;ui.clientProject=data.projects.find(p=\u003ep.orgId===ui.clientOrg)?.id;projection=clientProjection(data,ui.clientOrg,ui.clientProject)}\n  const org=projection?.organization,p=projection?.project;const options=projection?.projects||[];\n  const selectors=`\u003cdiv class=\"client-switch\"\u003e\u003cspan class=\"pill purple\"\u003e${ico('eye',13)} Client preview\u003c/span\u003e${customerSelect(ui.clientOrg,'data-filter=\"clientOrg\"')}\u003cselect class=\"filter-select\" data-filter=\"clientProject\"\u003e${options.map(q=\u003e`\u003coption value=\"${q.id}\" ${p?.id===q.id?'selected':''}\u003e${e(q.name)}\u003c/option\u003e`).join('')}\u003c/select\u003e\u003cdiv class=\"spacer\"\u003e\u003c/div\u003e${button(`${ico('plus')} Invite customer staff`,'invite-modal','small',`data-org=\"${org.id}\"`)}\u003c/div\u003e`;\n  if(!p)return head('Customer portal','Preview exactly which types of information a customer should see.')+selectors+`\u003cdiv class=\"empty\"\u003eThis customer has no projects.\u003c/div\u003e`;\n  const stages=['Discovery','Design','Manufacture','Assembly','Delivery'];let current=['Discovery','Engineering','Design','Manufacturing','Assembly','Commissioning','Testing','Delivery'].indexOf(p.phase);if(current\u003c0)current=2;const phaseIndex=p.phase==='Manufacturing'?2:p.phase==='Assembly'?3:p.phase==='Delivery'?4:p.phase==='Engineering'?1:2;\n  const preview=`\u003cdiv class=\"client-banner\" style=\"--customer:${e(org.accent)}\"\u003e\u003cdiv style=\"z-index:1;position:relative\"\u003e\u003cspan class=\"client-badge\"\u003e${e(org.name)} · PROJECT ACCESS\u003c/span\u003e\u003ch2\u003e${e(p.name)}\u003c/h2\u003e\u003cp\u003e${e(p.description)}\u003c/p\u003e\u003cdiv class=\"timeline-steps\"\u003e${stages.map((x,i)=\u003e`\u003cspan class=\"timeline-step ${i\u003cphaseIndex?'passed':i===phaseIndex?'current':''}\"\u003e\u003cb\u003e${i\u003cphaseIndex?ico('check',13):i+1}\u003c/b\u003e${x}\u003c/span\u003e`).join('')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"client-delivery\"\u003e\u003csmall\u003eTarget delivery\u003c/small\u003e\u003cstrong\u003e${day(p.delivery)}\u003c/strong\u003e${badge('In progress','green')}\u003c/div\u003e\u003c/div\u003e`;\n  const nav=[['updates','Progress updates'],['approvals','Approvals'],['files','Shared files'],['messages','Conversation'],['people','People \u0026 access']];\n  const content=ui.clientTab==='updates'?clientUpdates(projection):ui.clientTab==='approvals'?clientApprovals(projection):ui.clientTab==='files'?clientFiles(projection):ui.clientTab==='messages'?clientMessages(projection):clientPeople(projection);\n  return head('Customer portal preview','A separate, carefully curated view for each customer — not an internal dashboard.')+selectors+`\u003cdiv class=\"client-notice\"\u003e${ico('shield',15)} \u003cstrong\u003eDemonstration preview only.\u003c/strong\u003e Published records below are explicitly selected. The data is stored locally in this browser; production-grade customer isolation requires Supabase authentication and database security.\u003c/div\u003e\u003cdiv class=\"client-shell\" style=\"--customer:${e(org.accent)}\"\u003e${preview}\u003cdiv class=\"card\"\u003e\u003cdiv class=\"tabs\"\u003e${nav.map(([key,label])=\u003e`\u003cbutton class=\"${ui.clientTab===key?'active':''}\" data-action=\"client-tab\" data-id=\"${key}\"\u003e${label}${key==='approvals'?` \u003cspan class=\"count-dot\"\u003e${projection.approvals.filter(a=\u003ea.status==='Pending').length}\u003c/span\u003e`:''}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003cdiv class=\"card-body\"\u003e${content}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`;\n}\nfunction clientUpdates(pr){return `\u003cdiv class=\"grid-even\" style=\"margin-bottom:6px\"\u003e\u003cdiv\u003e\u003cdiv class=\"split-header\"\u003e\u003cb\u003ePublished project progress\u003c/b\u003e\u003cb style=\"color:var(--green)\"\u003e${pct(pr.project.publishedProgress)}%\u003c/b\u003e\u003c/div\u003e${meter(pr.project.publishedProgress,'green')}\u003cp class=\"form-hint\"\u003eThis number is a customer-approved snapshot, not the raw internal task average.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cdiv class=\"split-header\"\u003e\u003cb\u003eLatest milestones\u003c/b\u003e\u003cspan class=\"subtle\"\u003e${pr.updates.length} published\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"subtle\"\u003eUpdates and individual component status appear only after Sim-Worx publishes them.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch3 style=\"font:800 14px Manrope;margin:20px 0 12px\"\u003eProgress journal\u003c/h3\u003e${pr.updates.length?pr.updates.map(u=\u003e`\u003cdiv class=\"update-card\"\u003e\u003cdiv class=\"split-header\"\u003e${badge(u.kind,'purple')}\u003cspan class=\"date\"\u003e${day(u.publishedAt)}\u003c/span\u003e\u003c/div\u003e\u003ch4\u003e${e(u.title)}\u003c/h4\u003e\u003cp\u003e${e(u.description)}\u003c/p\u003e${u.part?`\u003cdiv class=\"subtle\" style=\"margin-top:10px\"\u003eRelated component: ${e(u.part)}\u003c/div\u003e`:''}\u003c/div\u003e`).join(''):`\u003cdiv class=\"empty\"\u oads and downloads will use private storage once the approved backend is connected. The demo does not save file bytes.\u003c/p\u003e`}\nfunction clientMessages(pr){return `\u003cdiv class=\"column\"\u003e${pr.messages.map(m=\u003e`\u003cdiv class=\"update-card\" style=\"background:${m.author.startsWith('Sim-Worx')?'var(--violet2)':'var(--panel2)'}\"\u003e\u003cb style=\"font-size:11px\"\u003e${e(m.author)}\u003c/b\u003e\u003cspan class=\"subtle\" style=\"float:right\"\u003e${day(m.at)}\u003c/span\u003e\u003cp style=\"margin-top:10px\"\u003e${e(m.text)}\u003c/p\u003e\u003c/div\u003e`).join('')||'\u003cp class=\"subtle\"\u003eStart a conversation with the project team.\u003c/p\u003e'}\u003cform data-form=\"message\" class=\"column\"\u003e\u003cdiv class=\"field\"\u003e\u003clabel for=\"message-text\"\u003eNew message\u003c/label\u003e\u003ctextarea id=\"message-text\" name=\"text\" required placeholder=\"Ask the project team a question...\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cbutton class=\"btn primary\" type=\"submit\" style=\"align-self:flex-end\"\u003e${ico('message')} Send demo message\u003c/button\u003e\u003c/form\u003e\u003c/div\u003e`}\nfunction clientPeople(pr){return `\u003cdiv class=\"split-header\"\u003e\u003cb\u003ePeople with access to this project\u003c/b\u003e${button(`${ico('plus')} Invite staff`,'invite-modal','small',`data-org=\"${pr.organization.id}\"`)}\u003c/div\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePerson\u003c/th\u003e\u003cth\u003eRole\u003c/th\u003e\u003cth\u003eScope\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${pr.members.map(m=\u003e`\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${e(m.name)}\u003c/b\u003e\u003cdiv class=\"subtle\"\u003e${e(m.email)}\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e${badge(m.role,'purple')}\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"tag\"\u003eThis project\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e`
