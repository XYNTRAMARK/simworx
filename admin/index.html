<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Simworx Portal Admin</title>
<style>
:root{--gold:#f2a900;--dark:#10161b;--ink:#20262c;--muted:#707983;--line:#dfe4e8;--bg:#f4f6f8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#18232d,#07090b)}.login-card{width:min(430px,92vw);background:#fff;padding:38px;border-radius:12px}.brand{font-size:28px;font-weight:900;letter-spacing:2px}.brand b{color:var(--gold)}.sub{font-size:12px;color:var(--muted);line-height:1.6}.pin{font-size:28px;letter-spacing:12px;text-align:center}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6dc;border-radius:6px;background:#fff}textarea{min-height:100px}.btn{border:0;border-radius:6px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#111}.dark{background:var(--dark);color:#fff}.ghost{background:#eef1f3}.danger{background:#ffeaea;color:#922}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--dark);color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0;width:260px}.side .brand{margin:0 10px 30px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d6dce1;border:0;padding:12px;border-radius:6px;margin:3px 0}.nav button.active,.nav button:hover{background:#27313a}.main{grid-column:2}.top{height:72px;background:#0c1115;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.content{padding:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.card strong.big{font-size:28px;display:block;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:14px}.row{display:flex;gap:8px;align-items:center}.stack{display:grid;gap:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.tag{font-size:10px;padding:4px 7px;border-radius:20px;background:#edf1f4}.gold{background:#fff3d4;color:#855a00}.chat{display:grid;gap:8px}.bubble{padding:10px;border-radius:8px;background:#eef1f3;font-size:12px}.bubble.staff{background:#fff5db}.muted{color:var(--muted);font-size:12px}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:11px 14px;border-radius:7px;display:none}.toast.show{display:block}
@media(max-width:900px){.app{display:block}.side{position:static;width:auto}.main{grid-column:auto}.cards,.grid{grid-template-columns:1fr}}
</style></head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand">SIMWOR<b>X</b></div><h1>Staff portal</h1><p class="sub">Enter the Simworx admin PIN.</p><form id="pin-form" class="stack"><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required autofocus><button class="btn primary">CONTINUE</button></form><p id="pin-msg" class="sub"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">SIMWOR<b>X</b></div><div class="nav" id="nav">
<button data-view="dashboard" class="active">Dashboard</button><button data-view="tickets">Support Requests</button><button data-view="customers">Customers & Access</button><button data-view="builds">Build Updates</button></div><button id="signout" class="btn ghost" style="width:100%;margin-top:26px">Lock portal</button></aside>
<main class="main"><header class="top"><div><strong>Customer Support & Build Portal</strong><div style="font-size:10px;color:#bbc3c9">SIMWORX STAFF ADMINISTRATION</div></div><div style="font-size:12px">PIN-protected admin</div></header><section id="content" class="content"></section></main></div>
<div id="toast" class="toast"></div><script src="./admin.js"></script>
</body></html>
