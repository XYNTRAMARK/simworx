name: Release projector configurator V72 VAT containment
on:
  push:
    branches: [main]
    paths:
      - '.projection-v72-deploy/**'
      - '.github/workflows/projection-v72-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v72
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V72 strictly from live V71
        run: python3 .projection-v72-deploy/build_v72.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify VAT box stays inside proposal card
        run: |
          python3 -m http.server 8765 >/tmp/v72-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v72-deploy/test_v72_vat.py
          kill $P || true
      - name: Publish V72 and promote stable page
        run: python3 .projection-v72-deploy/publish_v72.py
