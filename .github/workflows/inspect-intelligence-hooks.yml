name: Inspect intelligence bootstrap and key hooks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-intelligence-hooks.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect focused tracker source
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(name):
            out=[];f.retrbinary('RETR /htdocs/assets/js/'+name,out.append);return b''.join(out).decode('utf-8','replace')
          files={
            'bootstrap-v1':read('simworx-intelligence-bootstrap-v1.js'),
            'bootstrap-v2':read('simworx-intelligence-bootstrap-v2.js'),
            'tracker-v1':read('simworx-intelligence-tracker-v1.js'),
            'tracker-v2':read('simworx-intelligence-tracker-v2.js'),
            'config-v1':read('simworx-intelligence-configurator-v1.js'),
            'config-v2':read('simworx-intelligence-configurator-v2.js')
          }
          f.quit()
          terms={
            'bootstrap-v1':['configurator','version','tracker','dataset'],
            'bootstrap-v2':['configurator','version','tracker','dataset'],
            'tracker-v1':['pageId =','page_view','cta_clicked','click', 'configurationEmailed','configurationDownloaded','identify:','startConfigurator'],
            'tracker-v2':['pageId =','page_view','cta_clicked','click', 'configurationEmailed','configurationDownloaded','identify:','startConfigurator'],
            'config-v1':['var version','configuratorVersion','configuration_emailed','v65-save','v37-email','led-quote','configuration_downloaded'],
            'config-v2':['var version','configuratorVersion','configuration_emailed','v65-save','v37-email','led-quote','configuration_downloaded']
          }
          for label,s in files.items():
            print('\n###',label,'LEN',len(s))
            for term in terms[label]:
              hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
              if hits:
                print('TERM',term,'COUNT',len(hits))
                for i in hits[:8]:
                  print(s[max(0,i-1200):min(len(s),i+4200)])
          PY
      - name: Inspect live script datasets
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
            b=pw.chromium.launch(headless=True)
            for path in ['/led-screen-configurator.html','/projection-screen-configurator.html']:
              p=b.new_page();p.goto('https://www.sim-worx.com'+path,wait_until='domcontentloaded',timeout=60000);p.wait_for_timeout(600)
              rows=p.evaluate("""() => [...document.scripts].filter(s=>/simworx-intelligence/.test(s.src||'')).map(s=>({src:s.src,outer:s.outerHTML}))""")
              print('PAGE',path,rows);p.close()
            b.close()
          PY
