name: Fix Contract Client Assignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-contract-client-assignment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply contract and client portal workflow fix
        run: python tools/fix_contract_client_assignment.py

      - name: Validate JavaScript
        run: |
          node --check admin/admin.js
          node --check portal/portal.js

      - name: Commit workflow fix
        shell: bash
        run: |
          git config user.name "XYNTRAMARK"
          git config user.email "mark@xyntra-ai.com"
          git add admin/admin.js portal/portal.js portal/index.html
          git commit -m "Fix contract assignment and client fault workflow"
          git push
