name: Inspect V21 optical anchors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v21-optics.yml'
      - '.diagnostics/inspect-v21-optics.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .diagnostics/inspect-v21-optics.py
