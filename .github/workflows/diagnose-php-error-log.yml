name: Inspect live PHP error logs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-php-error-log.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect likely PHP error logs read-only
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip()
          p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          candidates=[]
          for folder in ['/htdocs','/htdocs/forms']:
              try:
                  for name,facts in f.mlsd(folder):
                      if facts.get('type')!='file': continue
                      low=name.lower()
                      if 'error' in low or 'log' in low or low.endswith('.log'):
                          candidates.append(folder+'/'+name)
              except Exception as e:
                  print('LIST_FAIL',folder,type(e).__name__)
          print('CANDIDATES',candidates)
          for path in candidates:
              try:
                  out=[];f.retrbinary('RETR '+path,out.append)
                  data=b''.join(out).decode('utf-8','replace')
                  print('\n###',path,'bytes',len(data))
                  print(data[-12000:])
              except Exception as e:
                  print('READ_FAIL',path,type(e).__name__)
          f.quit()
          PY
