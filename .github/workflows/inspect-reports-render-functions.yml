name: Inspect reports render functions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reports-render-functions.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Print focused reports functions
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45);f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(path):
            out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          files={'APP':read('/htdocs/reports/app.js'),'ANALYTICS':read('/htdocs/reports/analytics.js')}
          f.quit()
          wanted={'APP':['function renderConfigurators','function renderTraffic','function renderFunnels','const renderers','function renderOverview'],
                  'ANALYTICS':['export function buildReport','function buildConfigurator','function configurator','function funnel','function page','function source']}
          for label,s in files.items():
            print('\n###',label)
            for term in wanted[label]:
              for m in list(re.finditer(re.escape(term),s,re.I))[:6]:
                print('\nTERM',term,'AT',m.start())
                print(s[max(0,m.start()-1800):min(len(s),m.start()+15000)])
          PY
