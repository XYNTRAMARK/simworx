name: Release projection configurator V47 exact LED behaviour
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v47-release.yml'
      - '.projection-v47-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v47
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V47
        run: python3 .projection-v47-deploy/build_v47.py
      - name: Validate static shell conflicts removed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('projection-screen-configurator-v47.html').read_text()
          required=[
            '<body class="led-page">',
            'id="sw-global-footer"',
            'projection-v47-site-shell',
            '#projection-app.led-shell',
            'width:min(1180px,calc(100% - 54px))',
            'left:auto!important',
            'right:auto!important',
            'top:var(--sw-header-h)!important',
          ]
          missing=[x for x in required if x not in s]
          if missing:raise SystemExit('V47 missing LED parity rules: '+repr(missing))
          if 'id="projection-offline-banner"' in s:raise SystemExit('Preview banner still present')
          print('V47 static LED parity PASS')
          PY
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Runtime LED geometry acceptance
        run: |
          python3 -m http.server 8765 >/tmp/v47-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v47-deploy/test_v47.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v47-scroll-proof
          path: /tmp/v47-scroll-proof.png
          retention-days: 1
      - name: Publish V47 and switch live navigation
        run: python3 .projection-v47-deploy/publish_v47.py
