name: Inspect reports config and service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read config and reporting service
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re,posixpath
          from urllib.parse import urlsplit,urlparse
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(path):
              out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          cfg=read('/htdocs/reports/config.js')
          print('CONFIG_JS')
          print(cfg)
          m=re.search(r'endpoint\s*:\s*["\']([^"\']+)',cfg)
          if not m: raise SystemExit('endpoint missing')
          endpoint=m.group(1)
          if endpoint.startswith('http'):
              path=urlparse(endpoint).path
          elif endpoint.startswith('/'): path=endpoint
          else: path='/reports/'+endpoint
          remote='/htdocs'+path
          print('ENDPOINT_REMOTE',remote)
          service=read(remote)
          print('SERVICE_LEN',len(service))
          for term in ['collect','snapshot','event_id','visitor_id','session_id','configurator','contact','utm_','INSERT','SELECT','CREATE TABLE','JSON','events','analytics_consent','page_url']:
              hits=[x.start() for x in re.finditer(re.escape(term),service,re.I)]
              if hits:
                  print('TERM',term,'COUNT',len(hits))
                  for i in hits[:12]:
                      print(service[max(0,i-700):min(len(service),i+2600)].replace('\n',' ')[:3300])
          f.quit()
          PY
