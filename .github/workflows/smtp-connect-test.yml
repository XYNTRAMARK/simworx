name: Test webhost SMTP connectivity
on:
  push:
    branches: [main]
    paths:
      - '.smtp-connect-test/**'
      - '.github/workflows/smtp-connect-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload temporary SMTP connectivity probe
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          body=open('.smtp-connect-test/smtp-connect-test.php','rb').read()
          f.storbinary('STOR /htdocs/smtp-connect-test.php',io.BytesIO(body));f.quit()
          PY
      - name: Run probe and remove it
        run: |
          set -e
          curl -fsS https://www.sim-worx.com/smtp-connect-test.php
          python3 - <<'PY'
          import ftplib,ssl,os
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          try:f.delete('/htdocs/smtp-connect-test.php')
          except:pass
          f.quit()
          PY
