name: Publish projection configurator V32
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v32.yml'
      - '.projection-v32-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v32
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V32 from published V31
        run: python3 .projection-v32-deploy/build_v32.py
      - name: Run V32 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v32-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v32-deploy/test_v32.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v32-proof
          path: /tmp/v32-proof.png
          retention-days: 1
      - name: Publish immutable V32
        run: python3 .projection-v32-deploy/publish_v32.py
