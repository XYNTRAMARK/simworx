name: Audit collector and page coverage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect collector, report config and tracker coverage
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re,posixpath,json
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def ls(path):
              try:return list(f.mlsd(path))
              except:return []
          def read(path):
              out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          def walk(path,depth=0):
              out=[]
              if depth>3:return out
              for name,facts in ls(path):
                  if facts.get('type') in ('cdir','pdir'):continue
                  full=posixpath.join(path,name);out.append((full,facts))
                  if facts.get('type')=='dir' and name not in ['archive','backups','node_modules']:out.extend(walk(full,depth+1))
              return out

          # Reports config and files
          idx=read('/htdocs/reports/index.html')
          app=read('/htdocs/reports/app.js')
          print('REPORT_CONFIG_BLOCK')
          for pat in [r'window\.__SIMWORX_REPORTS_CONFIG__\s*=\s*\{.*?\};',r'const config\s*=\s*\{.*?\};',r'config\s*=\s*window\.[^;]+;']:
              m=re.search(pat,idx+'\n'+app,re.S)
              if m: print(m.group(0)[:5000])
          # find endpoint literal
          for sname,s in [('index',idx),('app',app)]:
              for m in re.finditer(r'endpoint',s,re.I):
                  frag=s[max(0,m.start()-500):m.start()+1200]
                  if 'http' in frag or '.php' in frag: print('ENDPOINT_SNIP',sname,frag.replace('\n',' ')[:1800])

          # Exact reports tree
          print('REPORTS_TREE')
          for n,facts in ls('/htdocs/reports'):print(facts.get('type'),facts.get('size'),n)

          # Inspect PHP endpoints in reports
          for n,facts in ls('/htdocs/reports'):
              if facts.get('type')=='file' and n.endswith('.php'):
                  s=read('/htdocs/reports/'+n)
                  print('\nPHP_FILE',n,'LEN',len(s))
                  for term in ['collect','snapshot','event_id','visitor_id','session_id','configurator_sessions','INSERT','SELECT','email','utm_','page_url','event_name']:
                      hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                      if hits:
                          print('TERM',term,'COUNT',len(hits))
                          for i in hits[:8]:print(s[max(0,i-500):min(len(s),i+1800)].replace('\n',' ')[:2300])

          # Root public HTML pages and tracking coverage
          entries=walk('/htdocs',2)
          rows=[]
          for full,facts in entries:
              if facts.get('type')!='file' or not full.lower().endswith(('.html','.htm')):continue
              if '/reports/' in full or '/admin/' in full:continue
              try:s=read(full)
              except:continue
              refs=re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I)
              trackers=[x for x in refs if 'simworx-intelligence' in x]
              is_product=any(k in full.lower() for k in ['a320','f16','cockpit','simstarter','software','custom-simulator','visual','projection','led'])
              rows.append((full,trackers,is_product))
          print('PAGE_COVERAGE')
          for full,trackers,is_product in rows:
              if is_product or trackers:
                  print(full,'TRACKERS',trackers if trackers else 'NONE')

          # Which configurator adapters exist/live
          print('INTELLIGENCE_ASSETS')
          for n,facts in ls('/htdocs/assets/js'):
              if facts.get('type')=='file' and 'simworx-intelligence' in n:
                  print(facts.get('size'),n)
          f.quit()
          PY
