name: Release projector configurator V63 clear stale email status
on:
  push:
    branches: [main]
    paths:
      - '.projection-v63-deploy/**'
      - '.github/workflows/projection-v63-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v63
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V63 strictly from live V62
        run: python3 .projection-v63-deploy/build_v63.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify stale status clears on dialog open
        run: |
          python3 -m http.server 8765 >/tmp/v63-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v63-deploy/test_v63_status.py
          kill $P || true
      - name: Publish V63 and promote stable page
        run: python3 .projection-v63-deploy/publish_v63.py
