name: Release Projection V73 reporting outcomes
on:
  push:
    branches: [main]
    paths:
      - '.projection-v73-deploy/**'
      - '.github/workflows/projection-v73-reporting.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v73
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V73 strictly from live V72
        run: python3 .projection-v73-deploy/build_v73.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Validate real PDF/email paths emit reporting outcomes
        run: |
          python3 -m http.server 8765 >/tmp/v73-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v73-deploy/test_v73_reporting.py
          kill $P || true
      - name: Publish V73 and promote stable page
        run: python3 .projection-v73-deploy/publish_v73.py
