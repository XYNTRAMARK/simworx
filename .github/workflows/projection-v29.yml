name: Publish projection configurator V29
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v29.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Start from published V28 exactly
        run: |
          curl -fsSL https://www.sim-worx.com/projection-screen-configurator-v28.html -o projection-screen-configurator-v29.html
          grep -q 'projection-v28-step-viewer-owner' projection-screen-configurator-v29.html
          grep -q 'projection-v26-workspace' projection-screen-configurator-v29.html
          grep -q 'projection-v25-controls' projection-screen-configurator-v29.html
          grep -q 'projection-fixed-estimate-v24' projection-screen-configurator-v29.html

      - name: Make Step 3 navigation lightweight and keep viewer DOM stable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('projection-screen-configurator-v29.html')
          s=p.read_text()

          # Step 3 must not be silently blocked by Step-1 validation.
          token='if(n>1){'
          if s.count(token)!=1:
              raise SystemExit(f'Expected one navigation guard, found {s.count(token)}')
          s=s.replace(token,'if(n===2){',1)

          # Do not run the full optical update synchronously merely to open Step 3.
          sync_nav="render();update({price:false});requestAnimationFrame(()=>$('guided-steps').scrollIntoView({block:'start',behavior:'instant'}));"
          async_nav="render();if(n!==3)update({price:false});requestAnimationFrame(()=>$('guided-steps').scrollIntoView({block:'start',behavior:'instant'}));"
          if s.count(sync_nav)!=1:
              raise SystemExit(f'Expected one synchronous guided navigation update, found {s.count(sync_nav)}')
          s=s.replace(sync_nav,async_nav,1)

          # Disable the inherited V26 Step-3 auto-workspace reaction. It used to
          # reparent the WebGL canvas and enable transform controls during the click.
          step3_pattern=re.compile(r"function step3Active\(\)\{\s*return document\.querySelector\('\[data-guided-go=\"3\"\]'\)\?\.getAttribute\('aria-current'\)==='step';\s*\}")
          s,count=step3_pattern.subn("function step3Active(){return false;}",s,count=1)
          if count!=1:
              raise SystemExit(f'Expected one V26 step3Active function, replaced {count}')

          # Make V25's explicit Move/Aim buttons enable manual projector editing
          # only when the user asks for it.
          old_move="q('v25-move')?.addEventListener('click',()=>document.querySelector('[data-transform=\"translate\"]')?.click());"
          new_move="q('v25-move')?.addEventListener('click',()=>{const manual=q('projection-manual-viewer');if(manual&&!manual.checked){manual.checked=true;manual.dispatchEvent(new Event('change',{bubbles:true}));}document.querySelector('[data-transform=\"translate\"]')?.click();});"
          old_aim="q('v25-aim')?.addEventListener('click',()=>document.querySelector('[data-transform=\"rotate\"]')?.click());"
          new_aim="q('v25-aim')?.addEventListener('click',()=>{const manual=q('projection-manual-viewer');if(manual&&!manual.checked){manual.checked=true;manual.dispatchEvent(new Event('change',{bubbles:true}));}document.querySelector('[data-transform=\"rotate\"]')?.click();});"
          if old_move not in s or old_aim not in s:
              raise SystemExit('V29 V25 Move/Aim event anchors missing')
          s=s.replace(old_move,new_move,1).replace(old_aim,new_aim,1)

          # Replace V28 ownership logic. The canvas is placed into one permanent row
          # once at startup. Step changes only show/hide the controls and change CSS.
          owner='''<script id="projection-v29-stable-viewer-owner">
          (function(){
            const q=id=>document.getElementById(id);
            let row=null,timer=null;
            function currentStep(){return Number(document.querySelector('[data-guided-go][aria-current="step"]')?.dataset?.guidedGo||1);}
            function ensureRow(){
              const preview=q('led-preview'),home=q('led-canvas-home'),panel=q('projection-v25-controls'),legacy=q('projection-v26-workspace');
              if(!preview||!home||!panel)return null;
              if(!row){
                row=document.createElement('div');
                row.id='projection-v29-edit-row';
                row.className='projection-v29-edit-row';
                const anchor=(legacy&&legacy.parentNode===preview)?legacy:preview.querySelector('.led-viewer-toolbar');
                if(anchor)preview.insertBefore(row,anchor);else preview.appendChild(row);
              }
              if(home.parentNode!==row)row.appendChild(home);
              if(panel.parentNode!==row)row.appendChild(panel);
              if(legacy)legacy.hidden=true;
              return {preview,home,panel};
            }
            function apply(){
              const parts=ensureRow();if(!parts)return;
              const step=currentStep(),active=step===3;
              row.classList.toggle('is-step3',active);
              parts.preview.classList.toggle('v29-editing',active);
              parts.panel.hidden=!active;
              const legacy=q('projection-v26-workspace');if(legacy)legacy.hidden=true;
              requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')));
            }
            function schedule(){clearTimeout(timer);timer=setTimeout(apply,0);}
            new MutationObserver(records=>{if(records.some(r=>r.type==='attributes'&&r.attributeName==='aria-current'))schedule();})
              .observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['aria-current']});
            document.querySelectorAll('[data-guided-go]').forEach(button=>button.addEventListener('click',schedule));
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
          })();
          </script>'''
          s,count=re.subn(r'<script id="projection-v28-step-viewer-owner">.*?</script>',owner,s,count=1,flags=re.S)
          if count!=1:
              raise SystemExit(f'Expected one V28 owner script, replaced {count}')

          css='''<style id="projection-v29-navigation-fix">
          .led-estimate-bar{pointer-events:none!important}
          .led-estimate-bar select,.led-estimate-bar button,.led-estimate-bar input,.led-estimate-bar a{pointer-events:auto!important}
          .guided-steps{scroll-margin-top:130px}
          #projection-v26-workspace{display:none!important}
          .projection-v29-edit-row{display:block;width:100%}
          .projection-v29-edit-row #led-canvas-home{width:100%;min-width:0}
          .projection-v29-edit-row #projection-v25-controls{display:none}
          .projection-v29-edit-row.is-step3{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:16px;align-items:start}
          .projection-v29-edit-row.is-step3 #projection-v25-controls{display:block;margin:0!important;min-width:0}
          .projection-v29-edit-row.is-step3 #projection-v25-controls .projection-v25-grid{grid-template-columns:1fr}
          @media(max-width:1050px){
            .projection-v29-edit-row.is-step3{grid-template-columns:1fr}
            .projection-v29-edit-row.is-step3 #projection-v25-controls .projection-v25-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
          }
          @media(max-width:650px){.projection-v29-edit-row.is-step3 #projection-v25-controls .projection-v25-grid{grid-template-columns:1fr}}
          </style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s)

          checks=['projection-v29-navigation-fix','projection-v29-stable-viewer-owner','projection-v29-edit-row','projection-v28-step-viewer-owner','projection-v26-workspace','projection-v25-controls','projection-fixed-estimate-v24','"screenSystemPerM2Eur":500','Projector position, swivel &amp; throw','if(n===2){',async_nav]
          missing=[x for x in checks if x not in s and x!='projection-v28-step-viewer-owner']
          if missing:raise SystemExit('V29 inheritance/architecture check failed '+repr(missing))
          if 'id="projection-v28-step-viewer-owner"' in s:raise SystemExit('Old V28 owner script still present')
          if token in s:raise SystemExit('Old Step navigation guard still present')
          print('V29 stable viewer architecture applied on top of published V28')
          PY

      - name: Playwright Step 3 navigation acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          P=$!
          sleep 2
          python3 - <<'PY'
          import json, shutil
          from playwright.sync_api import sync_playwright

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome: raise SystemExit('Chrome not found')

          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':1600,'height':1000})
              page.goto('http://127.0.0.1:8765/projection-screen-configurator-v29.html',wait_until='domcontentloaded',timeout=15000)
              for _ in range(100):
                  if page.locator('html').get_attribute('data-standalone-ready')=='true':
                      break
                  page.wait_for_timeout(200)
              else:
                  raise AssertionError('Standalone app did not become ready')

              def state(label):
                  data=page.evaluate("""() => {
                    const cur=document.querySelector('[data-guided-go][aria-current="step"]');
                    const ws=document.getElementById('projection-v26-workspace');
                    const panel=document.getElementById('projection-v25-controls');
                    const canvas=document.getElementById('led-canvas');
                    const r=canvas?.getBoundingClientRect();
                    return {
                      current:cur?.dataset?.guidedGo||'',
                      status:document.getElementById('guided-step-status')?.textContent||'',
                      workspaceHidden:ws?.hidden??true,
                      controlsHidden:panel?.hidden??true,
                      canvasWidth:r?.width||0,
                      canvasHeight:r?.height||0,
                      canvasInWorkspace:!!document.getElementById('led-canvas-home')?.closest('#projection-v26-workspace'),
                      canvasInStableRow:!!document.getElementById('led-canvas-home')?.closest('#projection-v29-edit-row'),
                      stableRowActive:document.getElementById('projection-v29-edit-row')?.classList.contains('is-step3')||false
                    };
                  }""")
                  print(label,json.dumps(data))
                  return data

              state('START')
              page.locator('[data-guided-go="2"]').scroll_into_view_if_needed()
              page.locator('[data-guided-go="2"]').click(timeout=5000)
              for _ in range(50):
                  cur=page.locator('[data-guided-go][aria-current="step"]')
                  if cur.count() and cur.get_attribute('data-guided-go')=='2':
                      break
                  page.wait_for_timeout(100)
              else:
                  raise AssertionError('Step 2 did not become current')
              state('STEP2')

              page.locator('[data-guided-go="3"]').scroll_into_view_if_needed()
              page.locator('[data-guided-go="3"]').click(timeout=5000)
              for _ in range(80):
                  cur=page.locator('[data-guided-go][aria-current="step"]')
                  if cur.count() and cur.get_attribute('data-guided-go')=='3':
                      break
                  page.wait_for_timeout(100)
              else:
                  raise AssertionError('Step 3 did not become current')
              for _ in range(50):
                  row=page.locator('#projection-v29-edit-row')
                  panel=page.locator('#projection-v25-controls')
                  row_class=row.get_attribute('class') or ''
                  panel_hidden=panel.get_attribute('hidden')
                  if 'is-step3' in row_class and panel_hidden is None:
                      break
                  page.wait_for_timeout(100)
              else:
                  raise AssertionError('Step 3 controls did not appear beside viewer')
              normal=state('STEP3_NORMAL')
              assert normal['current']=='3' and 'Step 3 of 4' in normal['status'], normal
              assert normal['workspaceHidden'] and not normal['controlsHidden'], normal
              assert normal['canvasWidth']>300 and normal['canvasHeight']>250 and normal['canvasInStableRow'] and normal['stableRowActive'], normal
              assert not normal['canvasInWorkspace'], normal

              # Return to Step 2 and deliberately make currently displayed inputs invalid.
              page.locator('[data-guided-go="2"]').click(timeout=5000)
              for _ in range(50):
                  cur=page.locator('[data-guided-go][aria-current="step"]')
                  if cur.count() and cur.get_attribute('data-guided-go')=='2':
                      break
                  page.wait_for_timeout(100)
              else:
                  raise AssertionError('Could not return to Step 2')
              page.locator('#projection-room-width').fill('0')
              page.locator('#guided-budget').fill('-1')
              page.locator('[data-guided-go="3"]').click(timeout=5000)
              for _ in range(80):
                  cur=page.locator('[data-guided-go][aria-current="step"]')
                  if cur.count() and cur.get_attribute('data-guided-go')=='3':
                      break
                  page.wait_for_timeout(100)
              else:
                  raise AssertionError('Step 3 was blocked by invalid inputs')
              for _ in range(50):
                  row_class=page.locator('#projection-v29-edit-row').get_attribute('class') or ''
                  if 'is-step3' in row_class:
                      break
                  page.wait_for_timeout(100)
              invalid=state('STEP3_INVALID_INPUTS')
              assert invalid['current']=='3', invalid

              page.screenshot(path='/tmp/v29-step3.png',full_page=False)
              browser.close()

          print('V29 PLAYWRIGHT STEP 3 NAVIGATION PASS')
          PY
          kill $P || true
          test -s /tmp/v29-step3.png

      - uses: actions/upload-artifact@v4
        with:
          name: v29-step3-proof
          path: /tmp/v29-step3.png
          retention-days: 1

      - name: Publish V29
        run: |
          cp .projection-v23-deploy/publish_v23.py /tmp/publish_v29.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/publish_v29.py')
          s=p.read_text()
          s=s.replace('projection-screen-configurator-v23.html','projection-screen-configurator-v29.html')
          s=s.replace('projection-screen-configurator-v22.html','projection-screen-configurator-v29-old.html')
          s=s.replace('Published immutable V23 and removed public V22','Published immutable V29')
          p.write_text(s)
          PY
          python3 /tmp/publish_v29.py
