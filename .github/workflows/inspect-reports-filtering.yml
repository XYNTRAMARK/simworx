name: Inspect reports filtering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reports-filtering.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_PASSWORD }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect filtering logic
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          out=[];f.retrbinary('RETR /htdocs/reports/analytics.js',out.append);a=b''.join(out).decode('utf-8','replace')
          out=[];f.retrbinary('RETR /htdocs/reports/app.js',out.append);b=b''.join(out).decode('utf-8','replace');f.quit()
          for label,s in [('analytics',a),('app',b)]:
              print('\n###',label)
              for term in ['tracking_validation','TRACKING-VALIDATION','verification','filterEvents','state.report','snapshot.events','utm_source','campaign']:
                  hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                  if hits:
                      print('TERM',term,'COUNT',len(hits))
                      for i in hits[:10]:print(s[max(0,i-900):min(len(s),i+2600)])
          PY
