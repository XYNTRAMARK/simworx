<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Simworx Client Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>:root{--gold:#f2a900;--dark:#10161b;--bg:#f4f6f8;--line:#dde3e8;--muted:#6e7780}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#20262c}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#18232d,#07090b)}.box{width:min(460px,92vw);background:white;border-radius:12px;padding:38px}.brand{font-size:28px;font-weight:900;letter-spacing:2px}.brand b{color:var(--gold)}.btn{border:0;border-radius:6px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--gold)}.dark{background:var(--dark);color:#fff}.ghost{background:#eef1f3}.app{min-height:100vh}.top{height:74px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.nav{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap}.nav button{border:0;background:#eef1f3;border-radius:6px;padding:9px 12px}.nav button.active{background:var(--gold)}.content{max-width:1180px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.panel{margin-top:14px}.big{font-size:28px;display:block;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stack{display:grid;gap:9px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6dc;border-radius:6px}textarea{min-height:110px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.muted{font-size:12px;color:var(--muted)}.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:20px;background:#edf1f4}.timeline{border-left:3px solid var(--gold);padding-left:14px}.update{margin:0 0 18px}.comment{background:#f1f3f5;padding:10px;border-radius:7px;margin:8px 0}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:11px 14px;border-radius:7px;display:none}.toast.show{display:block}@media(max-width:800px){.cards,.grid{grid-template-columns:1fr}}</style></head>
<body><div id="login" class="login"><div id="loginBox" class="box"><div class="brand">SIMWOR<b>X</b></div><h1>Client portal</h1><p class="muted">Sign in to access support requests and live simulator build updates.</p><form id="loginForm" class="stack"><input id="identifier" autocomplete="username" placeholder="Username or email address" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn primary">SIGN IN</button></form><button id="forgotPassword" class="btn ghost" style="width:100%;margin-top:9px">Forgot password?</button><p id="loginMsg" class="muted"></p></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">SIMWOR<b>X</b></div><div><span id="who"></span> <button id="signout" class="btn ghost">Sign out</button></div></header><nav id="nav" class="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="support">Support</button><button data-view="new-ticket">Log a Fault</button><button data-view="builds">Build Update</button></nav><main id="content" class="content"></main></div><div id="toast" class="toast"></div><script src="./portal.js"></script></body></html>
