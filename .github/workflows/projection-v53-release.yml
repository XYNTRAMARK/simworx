name: Release projector configurator V53 two-column layout
on:
  push:
    branches: [main]
    paths:
      - '.projection-v53-deploy/**'
      - '.github/workflows/projection-v53-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v53
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V53 strictly from live V52
        run: python3 .projection-v53-deploy/build_v53.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify exact two-column Step 3 and inherited delivery
        run: |
          python3 -m http.server 8765 >/tmp/v53-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v53-deploy/test_v53_layout.py
          python3 .projection-v53-deploy/test_v53_delivery.py
          kill $P || true
      - name: Publish V53 and promote to stable live projector page
        run: python3 .projection-v53-deploy/publish_v53.py
