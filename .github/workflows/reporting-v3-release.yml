name: Release SIMWORX Reporting V3
on:
  push:
    branches: [main]
    paths:
      - '.reporting-v3/**'
      - '.github/workflows/reporting-v3-release.yml'
permissions:
  contents: write
concurrency:
  group: simworx-reporting-v3
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build source-controlled Reporting V3
        run: python3 .reporting-v3/build.py
      - name: Syntax checks
        run: |
          node --check reports/analytics.js
          node --check reports/app.js
          node --check assets/js/simworx-intelligence-configurator-v1.js
          node --check assets/js/simworx-intelligence-configurator-v2.js
      - name: Canonical metric tests
        run: node .reporting-v3/tests/analytics.mjs
      - name: Commit generated reporting source
        run: |
          git config user.name "simworx-reporting-v3"
          git config user.email "actions@users.noreply.github.com"
          git add reports assets/js/simworx-intelligence-*.js
          if ! git diff --cached --quiet; then
            git commit -m "Reporting V3 generated source"
            git push
          fi
      - name: Publish only audited changed files
        run: python3 .reporting-v3/build.py publish
