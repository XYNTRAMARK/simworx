name: Extract reporting pipeline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-reporting-pipeline.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract live reporting files
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re,json
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(path):
              out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          paths=[
            '/htdocs/assets/js/simworx-intelligence-bootstrap-v1.js',
            '/htdocs/reports/analytics.js',
            '/htdocs/reports/app.js',
            '/htdocs/reports/config.js',
            '/htdocs/reports/index.html',
          ]
          for path in paths:
              try:s=read(path)
              except Exception as e:
                  print('\n###MISSING',path,repr(e));continue
              print('\n###FILE',path,'LEN',len(s))
              # compact structural extraction
              if path.endswith('simworx-intelligence-bootstrap-v1.js'):
                  for term in ['fetch(','sendBeacon','event','page','visitor','session','utm','configurator','pdf','email','click','aircraft','simulator','endpoint','api']:
                      hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                      if hits:
                          print('TERM',term,'COUNT',len(hits))
                          for i in hits[:8]:print(s[max(0,i-650):min(len(s),i+1600)].replace('\n',' ')[:2300])
              elif path.endswith('analytics.js'):
                  # print function declarations and endpoint constants
                  for line in s.splitlines():
                      if re.search(r'\b(function|const|let|class)\b',line) and re.search(r'(track|event|session|visitor|config|utm|lead|configurator|pdf|email|page|api|endpoint)',line,re.I):
                          print('DEF',line[:500])
                  for term in ['fetch(','sendBeacon','configurator','pdf','email','utm_','page_view','visitor','session','lead','aircraft','simulator']:
                      hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                      if hits:
                          print('TERM',term,'COUNT',len(hits))
                          for i in hits[:6]:print(s[max(0,i-500):min(len(s),i+1500)].replace('\n',' ')[:2100])
              elif path.endswith('app.js'):
                  for term in ['Visitors','Starts','Completed','Emailed','Emails captured','conversion','funnel','configurator','aircraft','simulator','utm','traffic','software','product','click','page','event']:
                      hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                      if hits:
                          print('TERM',term,'COUNT',len(hits))
                          for i in hits[:6]:print(s[max(0,i-600):min(len(s),i+1700)].replace('\n',' ')[:2300])
              else:
                  print(s[:20000])
          f.quit()
          PY
