name: Focused reports schema audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focused-reports-schema-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reports files and likely telemetry assets
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re,posixpath
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(path):
              out=[];f.retrbinary('RETR '+path,out.append);return b''.join(out).decode('utf-8','replace')
          def ls(path):
              try:return list(f.mlsd(path))
              except:return []
          print('REPORTS_FILES')
          for name,facts in ls('/htdocs/reports'): print(facts.get('type'),facts.get('size'),name)
          for path in ['/htdocs/reports/index.html','/htdocs/reports/app.js','/htdocs/reports/analytics.js']:
              s=read(path);print('\n###',path,'LEN',len(s))
              for term in ['endpoint','config =','config=','event_name','session_started','page_view','configuratorSessions','events','contacts','traffic','utm_source','configuration_downloaded','product_configurator','software']:
                  hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                  if hits:
                      print('TERM',term,'COUNT',len(hits))
                      for i in hits[:8]: print(s[max(0,i-450):min(len(s),i+1600)].replace('\n',' ')[:2100])
          print('\nASSETS_JS')
          for name,facts in ls('/htdocs/assets/js'):
              if facts.get('type')=='file':print(facts.get('size'),name)
          # inspect small likely tracking files only
          for name,facts in ls('/htdocs/assets/js'):
              if facts.get('type')!='file':continue
              low=name.lower()
              try:size=int(facts.get('size') or 0)
              except:size=0
              if size>500000:continue
              if any(k in low for k in ['track','report','analytic','traffic','config','header','form','site']):
                  path='/htdocs/assets/js/'+name
                  try:s=read(path)
                  except:continue
                  if any(t in s.lower() for t in ['event_name','visitor_id','session_id','sendbeacon','utm_','page_view']):
                      print('\n###TRACKER',path,'LEN',len(s))
                      for term in ['event_name','visitor_id','session_id','sendBeacon','utm_','page_view','fetch(']:
                          hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                          if hits:
                              print('TERM',term,'COUNT',len(hits))
                              for i in hits[:8]: print(s[max(0,i-500):min(len(s),i+1700)].replace('\n',' ')[:2200])
          f.quit()
          PY
