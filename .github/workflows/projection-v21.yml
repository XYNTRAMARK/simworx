name: Publish projection configurator V21
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v21.yml'
      - '.projection-v21-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v21
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated V21
        run: python3 .projection-v21-deploy/build_v21.py
      - name: Verify V21 pricing
        run: |
          grep -q '"screenSystemPerM2Eur":500' projection-screen-configurator-v21.html
          grep -q "label:'Projector ceiling mounts',amount:eur(300)" projection-screen-configurator-v21.html
          grep -q "label:'Floor-supported projector truss',amount:eur(1000)" projection-screen-configurator-v21.html
          grep -q 'projection-hide-enclosure-options-v20' projection-screen-configurator-v21.html
          grep -q 'projection-sticky-estimate-v19' projection-screen-configurator-v21.html
      - name: Browser startup smoke test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 45 "$CHROME"             --headless=new --no-sandbox --disable-dev-shm-usage             --use-gl=swiftshader --enable-unsafe-swiftshader             --enable-logging=stderr --v=0             --virtual-time-budget=10000             --dump-dom http://127.0.0.1:8765/projection-screen-configurator-v21.html             >/tmp/v21-dom.html 2>/tmp/v21-console.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          echo "Chrome rc=$RC"
          grep -E 'SyntaxError|TypeError|ReferenceError|CONSOLE:' /tmp/v21-console.log || true
          if grep -Eq 'SyntaxError|TypeError|ReferenceError' /tmp/v21-console.log; then exit 5; fi
          if ! grep -q 'data-standalone-ready="true"' /tmp/v21-dom.html; then exit 6; fi
      - name: Publish immutable V21
        run: python3 .projection-v21-deploy/publish_v21.py
