name: Publish projection configurator V18
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v18.yml'
      - '.projection-v18-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v18
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated V18
        run: python3 .projection-v18-deploy/build_v18.py
      - name: Check JavaScript syntax
        run: |
          for file in projection/src/*.js; do node --check "$file"; done
      - name: Browser startup smoke test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 45 "$CHROME"             --headless=new --no-sandbox --disable-dev-shm-usage             --use-gl=swiftshader --enable-unsafe-swiftshader             --enable-logging=stderr --v=0             --virtual-time-budget=10000             --dump-dom http://127.0.0.1:8765/projection-screen-configurator-v18.html             >/tmp/v18-dom.html 2>/tmp/v18-console.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          echo "Chrome rc=$RC"
          grep -E 'SyntaxError|TypeError|ReferenceError|CONSOLE:' /tmp/v18-console.log || true
          if grep -Eq 'SyntaxError|TypeError|ReferenceError' /tmp/v18-console.log; then
            echo "Browser console contains startup errors"
            exit 5
          fi
          if ! grep -q 'data-standalone-ready="true"' /tmp/v18-dom.html; then
            echo "Standalone app did not reach ready state"
            exit 6
          fi
          echo "V18 browser startup reached standalone ready state"
      - name: Publish immutable V18
        run: python3 .projection-v18-deploy/publish_v18.py
