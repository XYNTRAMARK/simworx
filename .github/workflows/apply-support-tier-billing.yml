name: Apply Support Tier Billing Patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_support_tier_billing_patch.py'
      - '.github/workflows/apply-support-tier-billing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-support-tier-billing
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_support_tier_billing_patch.py

      - name: Validate JavaScript
        run: |
          node --check admin/admin.js
          node --check portal/portal.js
          git diff --check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.js portal/portal.js
          git commit -m 'Apply support tier defaults and usage billing'
          git push
