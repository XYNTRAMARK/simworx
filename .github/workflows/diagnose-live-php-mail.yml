name: Compare live Simworx PHP mail endpoints
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-php-mail.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read only mail-related structure from live endpoints
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip()
          p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(name):
              out=[];f.retrbinary('RETR /htdocs/'+name,out.append);return b''.join(out).decode('utf-8','replace')
          for name in ['contact-submit.php','led-quote-submit.php','projection-quote-submit.php']:
              s=read(name)
              print('\n###',name)
              for pat in [r'function_exists\([^\n]+',r'mail\([^\n]+',r'@mail\([^\n]+',r'Sendmail[^\n]+',r'From:[^\n]+',r'Reply-To:[^\n]+',r'Content-Type:[^\n]+',r'json_encode\([^\n]+',r'http_response_code\([^\n]+']:
                  hits=re.findall(pat,s,re.I)
                  for h in hits[:20]: print(h[:800])
              print('LEN',len(s))
          f.quit()
          PY
