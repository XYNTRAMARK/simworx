name: Inspect funnel and simulator helpers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-report-funnel-helpers.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read helpers
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,re
          from urllib.parse import urlsplit
          raw=os.environ['FTP_HOST'].strip();p=urlsplit(raw if '://' in raw else 'ftp://'+raw)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45);f.connect(p.hostname,p.port or 21);f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);f.prot_p()
          def read(p):
            a=[];f.retrbinary('RETR '+p,a.append);return b''.join(a).decode('utf-8','replace')
          s=read('/htdocs/reports/analytics.js');a=read('/htdocs/reports/app.js');f.quit()
          for label,src,terms in [('ANALYTICS',s,['function makeFunnel','function measures','function configType','function simulator']),('APP',a,['function simulatorTable','function funnel('])]:
            print('\n###'+label)
            for term in terms:
              i=src.find(term);print('\nTERM',term,'AT',i)
              if i>=0:print(src[max(0,i-1000):i+10000])
          PY
