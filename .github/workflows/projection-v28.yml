name: Publish projection configurator V28
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v28.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Start from published V27 exactly
        run: |
          curl -fsSL https://www.sim-worx.com/projection-screen-configurator-v27.html -o projection-screen-configurator-v28.html
          grep -q 'projection-v27-step-viewer-restore' projection-screen-configurator-v28.html
          grep -q 'projection-v26-workspace' projection-screen-configurator-v28.html
          grep -q 'projection-v25-controls' projection-screen-configurator-v28.html
          grep -q 'projection-fixed-estimate-v24' projection-screen-configurator-v28.html

      - name: Correct viewer ownership by step
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('projection-screen-configurator-v28.html')
          s=p.read_text()

          corrected='''<script id="projection-v28-step-viewer-owner">
          (function(){
            const q=id=>document.getElementById(id);

            function currentStep(){
              return Number(document.querySelector('[data-guided-go][aria-current="step"]')?.dataset?.guidedGo||1);
            }

            function moveBefore(node,before){
              if(node&&before&&before.parentNode)before.parentNode.insertBefore(node,before);
            }

            function apply(forcedStep){
              const preview=q('led-preview');
              const home=q('led-canvas-home');
              const toolbar=preview?.querySelector('.led-viewer-toolbar');
              const workspace=q('projection-v26-workspace');
              const viewerColumn=workspace?.querySelector('.projection-v26-viewer-column');
              const panel=q('projection-v25-controls');
              if(!preview||!home||!workspace||!viewerColumn)return;

              const step=forcedStep||currentStep();
              if(step===3){
                preview.classList.add('v26-editing');
                workspace.hidden=false;
                if(home.parentNode!==viewerColumn)viewerColumn.appendChild(home);
                if(panel&&panel.parentNode!==workspace)workspace.appendChild(panel);
                if(panel)panel.hidden=false;
              }else{
                preview.classList.remove('v26-editing');
                if(toolbar&&home.parentNode!==preview)moveBefore(home,toolbar);
                if(workspace)workspace.hidden=true;
                if(panel)panel.hidden=true;
              }

              requestAnimationFrame(()=>{
                const canvas=q('led-canvas');
                if(canvas)canvas.dispatchEvent(new Event('resize',{bubbles:false}));
                window.dispatchEvent(new Event('resize'));
              });
            }

            window.__projectionV28ApplyViewer=apply;
            const observer=new MutationObserver(records=>{
              if(records.some(r=>r.type==='attributes'&&r.attributeName==='aria-current'))apply();
            });
            observer.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['aria-current']});
            document.querySelectorAll('[data-guided-go]').forEach(button=>button.addEventListener('click',()=>setTimeout(apply,50)));

            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,0));
            else setTimeout(apply,0);
          })();
          </script>'''

          pattern=re.compile(r'<script id="projection-v27-step-viewer-restore">.*?</script>',re.S)
          s,count=pattern.subn(corrected,s,count=1)
          if count!=1:raise SystemExit(f'Expected one V27 restore script, replaced {count}')

          p.write_text(s)
          checks=[
            'projection-v28-step-viewer-owner',
            'projection-v26-workspace',
            'projection-v25-controls',
            'projection-fixed-estimate-v24',
            'Projector position, swivel &amp; throw',
            '"screenSystemPerM2Eur":500'
          ]
          missing=[x for x in checks if x not in s]
          if missing:raise SystemExit('V28 inheritance failed '+repr(missing))
          print('V28 corrected viewer ownership without rebuilding earlier versions')
          PY

      - name: Selenium viewer visibility test
        run: |
          python3 -m pip install --quiet selenium
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          P=$!
          sleep 2
          python3 - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome: raise SystemExit('Chrome not found')
          options=webdriver.ChromeOptions()
          options.binary_location=chrome
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-unsafe-swiftshader','--window-size=1600,1000']:
              options.add_argument(arg)

          options.page_load_strategy='none'
          driver=webdriver.Chrome(options=options)
          driver.set_page_load_timeout(15)
          driver.get('http://127.0.0.1:8765/projection-screen-configurator-v28.html')
          WebDriverWait(driver,20).until(lambda d: d.execute_script("return document.documentElement.dataset.standaloneReady==='true'"))
          time.sleep(2)

          def measure(label, expect_step3):
              data=driver.execute_script("""
                const home=document.getElementById('led-canvas-home');
                const box=document.getElementById('led-canvas');
                const renderer=box?.querySelector('canvas');
                const workspace=document.getElementById('projection-v26-workspace');
                const panel=document.getElementById('projection-v25-controls');
                const r=box?.getBoundingClientRect();
                const rr=renderer?.getBoundingClientRect();
                const hidden=(el)=>{for(let n=el;n;n=n.parentElement){if(n.hidden||getComputedStyle(n).display==='none'||getComputedStyle(n).visibility==='hidden')return true;}return false;};
                return {
                  homeParentId:home?.parentElement?.id||'',
                  homeParentClass:home?.parentElement?.className||'',
                  inWorkspace:!!home?.closest('#projection-v26-workspace'),
                  inViewerColumn:!!home?.closest('.projection-v26-viewer-column'),
                  boxWidth:r?.width||0, boxHeight:r?.height||0,
                  rendererWidth:rr?.width||0, rendererHeight:rr?.height||0,
                  hidden:box?hidden(box):true,
                  workspaceHidden:workspace?.hidden??true,
                  panelHidden:panel?.hidden??true
                };
              """)
              print(label,json.dumps(data))
              assert data['boxWidth']>500 and data['boxHeight']>280, (label,data)
              assert not data['hidden'], (label,data)
              assert data['rendererWidth']>400 and data['rendererHeight']>250, (label,data)
              if expect_step3:
                  assert data['inViewerColumn'] and not data['workspaceHidden'] and not data['panelHidden'], (label,data)
              else:
                  assert not data['inWorkspace'] and data['homeParentId']=='led-preview', (label,data)
              return data

          measure('STEP1',False)
          driver.save_screenshot('/tmp/v28-step1.png')

          driver.find_element(By.CSS_SELECTOR,'[data-guided-go="2"]').click()
          time.sleep(1)
          measure('STEP2',False)

          driver.execute_script("""
            document.querySelectorAll('[data-guided-go]').forEach(b=>b.removeAttribute('aria-current'));
            document.querySelector('[data-guided-go="3"]').setAttribute('aria-current','step');
            window.__projectionV28ApplyViewer(3);
          """)
          time.sleep(1)
          measure('STEP3-LAYOUT',True)
          driver.save_screenshot('/tmp/v28-step3.png')

          driver.quit()
          print('SELENIUM VIEWER TEST PASS')
          PY
          kill $P || true
          test -s /tmp/v28-step1.png
          test -s /tmp/v28-step3.png

      - uses: actions/upload-artifact@v4
        with:
          name: v28-viewer-screenshots
          path: |
            /tmp/v28-step1.png
            /tmp/v28-step3.png
          retention-days: 1

      - name: Publish V28
        run: |
          cp .projection-v23-deploy/publish_v23.py /tmp/publish_v28.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/publish_v28.py')
          s=p.read_text()
          s=s.replace('projection-screen-configurator-v23.html','projection-screen-configurator-v28.html')
          s=s.replace('projection-screen-configurator-v22.html','projection-screen-configurator-v28-old.html')
          s=s.replace('Published immutable V23 and removed public V22','Published immutable V28')
          p.write_text(s)
          PY
          python3 /tmp/publish_v28.py
