name: Release projector configurator V64 hide recalculation strip
on:
  push:
    branches: [main]
    paths:
      - '.projection-v64-deploy/**'
      - '.github/workflows/projection-v64-release.yml'
permissions:
  contents: read
concurrency:
  group: simworx-projector-v64
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V64 strictly from live V63
        run: python3 .projection-v64-deploy/build_v64.py
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Verify recalculation strip only is hidden
        run: |
          python3 -m http.server 8765 >/tmp/v64-http.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v64-deploy/test_v64_recalc.py
          kill $P || true
      - name: Publish V64 and promote stable page
        run: python3 .projection-v64-deploy/publish_v64.py
