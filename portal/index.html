<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="robots" content="noindex,nofollow"><title>Simworx Client Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>:root{--gold:#f2a900;--dark:#10161b;--bg:#f4f6f8;--line:#dde3e8;--muted:#6e7780}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#20262c}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#18232d,#07090b)}.box{width:min(460px,92vw);background:white;border-radius:12px;padding:38px}.brand{font-size:28px;font-weight:900;letter-spacing:2px}.brand b{color:var(--gold)}.btn{border:0;border-radius:6px;padding:11px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--gold)}.dark{background:var(--dark);color:#fff}.ghost{background:#eef1f3}.app{min-height:100vh}.top{height:74px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.nav{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap}.nav button{border:0;background:#eef1f3;border-radius:6px;padding:9px 12px}.nav button.active{background:var(--gold)}.content{max-width:1180px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.panel{margin-top:14px}.big{font-size:28px;display:block;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stack{display:grid;gap:9px}.stack label{display:grid;gap:6px;font-size:12px;font-weight:700}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6dc;border-radius:6px;background:#fff}textarea{min-height:110px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.muted{font-size:12px;color:var(--muted)}.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:20px;background:#edf1f4}.timeline{border-left:3px solid var(--gold);padding-left:14px}.update{margin:0 0 18px}.comment{background:#f1f3f5;padding:10px;border-radius:7px;margin:8px 0}.upload-box{border:1px dashed #b8c0c7;border-radius:7px;padding:14px;background:#fafbfc;cursor:pointer}.upload-box input{margin-top:8px;background:#fff}.contract-status{padding:12px;border-radius:7px;border:1px solid var(--line)}.contract-status.ok{background:#eef9f2;border-color:#aed8bd;color:#245f39}.contract-status.error{background:#fff1f1;border-color:#e5b2b2;color:#8b2f2f}.attachment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}.media-card,.file-card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff;color:#20262c;text-decoration:none;min-width:0}.media-card img,.media-card video{width:100%;height:150px;object-fit:cover;border-radius:5px;background:#111}.media-card span,.file-card span,.file-card strong{font-size:11px;overflow-wrap:anywhere}.file-card small{color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:11px 14px;border-radius:7px;display:none;z-index:100}.toast.show{display:block}@media(max-width:800px){.cards,.grid{grid-template-columns:1fr}.top{height:auto;gap:12px;padding:14px}.content{padding:14px}.table{min-width:700px}.panel{overflow-x:auto}}</style></head>
<body><div id="login" class="login"><div id="loginBox" class="box"><div class="brand">SIMWOR<b>X</b></div><h1>Client portal</h1><p class="muted">Sign in to access support requests and live simulator build updates.</p><form id="loginForm" class="stack"><input id="identifier" autocomplete="username" placeholder="Username or email address" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn primary">SIGN IN</button></form><button id="forgotPassword" class="btn ghost" style="width:100%;margin-top:9px">Forgot password?</button><p id="loginMsg" class="muted"></p></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">SIMWOR<b>X</b></div><div><span id="who"></span> <button id="signout" class="btn ghost">Sign out</button></div></header><nav id="nav" class="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="support">Support</button><button data-view="new-ticket">Log a Fault</button><button data-view="builds">Build Update</button></nav><main id="content" class="content"></main></div><div id="toast" class="toast"></div><script src="./portal.js?v=20261009-0935"></script></body></html>
