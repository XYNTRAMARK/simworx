aset.action==='dismiss-modal'\u0026\u0026ev.target!==el)return;handleAction(el)}});\ndocument.addEventListener('submit',ev=\u003e{const form=ev.target.closest('form[data-form]');if(form){ev.preventDefault();formHandler(form)}});\ndocument.addEventListener('change',ev=\u003e{try{if(!staffGate.status().unlocked)return;const el=ev.target;\n if(el.id==='v52-emergency-restore'){\n  const file=el.files?.[0];if(!file)return;\n  if(file.size\u003e10000000)throw Error('Recovery backup exceeds 10 MB');\n  file.text().then(text=\u003e{\n   const recovered=parseWorkspaceBackup(text);\n   if(!confirm('Replace unreadable browser workspace with this verified private backup? Keep the original raw record separately for forensic recovery.'))return;\n   localStorage.setItem(STORAGE_KEY,JSON.stringify(recovered));\n   workspaceFile.detach();loadProblem='';data=recovered;ensureProgress(data);ensureExternalWork(data);ensureOps(data);\n   ui.project=data.projects.find(p=\u003e!p.archivedAt)?.id||'';ui.page='projects';ui.projectTab='attention';\n   render();toast('Valid private workspace recovered. The original unreadable record was replaced locally after confirmation.');\n  }).catch(error=\u003etoast('Recovery refused: '+String(error?.message||error),true));return;\n }\n if(loadProblem)return;\n if(el.dataset.v41Proof){handleMaterialsProof(data,el,()=\u003e{persist();render();toast('Proof document saved locally')},message=\u003etoast(message,true));return;}\n if(el.id==='v41-restore-file'){restoreBackupFile(el.files?.[0]);return;}\n if(el.id==='v49-backup-verify-file'){\n  const file=el.files?.[0];if(!file)return;\n  if(file.size\u003e10000000)throw Error('Backup file too large');\n  file.text().then(raw=\u003e{\n   const restored=parseWorkspaceBackup(raw);\n   const current=JSON.stringify(data);\n   if(JSON.stringify(restored)!==current)throw Error('Backup does not exactly match the current workspace. Export again after your last edit.');\n   ui.v49ResetSnapshot=current;ui.v49ResetBackupVerified=true;render();toast('Verified: selected private backup is readable and matches current workspace');\n  }).catch(err=\u003e{ui.v49ResetSnapshot=null;ui.v49ResetBackupVerified=false;toast(err.message||'Backup verification failed',true)});\n  return;\n }\n if(el.dataset.v42Delivery){updateOrderStage(data,el.dataset.v42Delivery,el.value);persist();render();toast('Delivery stage changed; stock unchanged');return;}\n const filter=el.dataset.filter;\n if(filter==='v47-buy-step'){\n  if(el.value)runProcurementStage(el.dataset.id,el.value);\n  return;\n }\n if(filter==='v48-dept'){ui.v48Dept=el.value;render();return;}\n if(filter==='v48-evidence-section'){ui.v48EvidenceSection=el.value;render();return;}\n if(filter==='v48-photo-section'){ui.v48PhotoSection=el.value;render();return;}\n if(filter==='v46-purchase-project'){\n  if(!data.projects.some(x=\u003ex.id===el.value\u0026\u0026!x.archivedAt))throw Error('Unknown project');\n  ui.procurementProject=el.value;ui.project=el.value;ui.materialPO=null;ui.materialOrderEditor=false;\n  ui.materialPrefill=null;ui.v46PurchaseLine=null;ui.v46EditOccurrence=null;ui.v46BuyingQuery='';render();return;\n }\n if(filter==='v50-search'){ui.v50Search=el.value;render();return;}\n if(filter==='v50-status'){ui.v50Status=el.value;render();return;}\n if(filter==='v46-work-query'){ui.v46WorkQuery=el.value;render();return;}\n if(filter==='v46-work-status'){ui.v46WorkStatus=el.value;render();return;}\n if(filter==='v46-work-section'){ui.v46WorkSection=el.value;render();return;}\n if(filter==='v52-order'){ui.v52SelectedOrder=el.value;render();return;}\n if(filter==='v46-buy-query'){ui.v46BuyingQuery=el.value;render();return;}\n if(filter==='v46-buy-mode'){ui.v46BuyingMode=el.value;ui.v46EditOccurrence=null;render();return;}\n if(filter==='v43-route'){ui.externalRouteId=el.value;ui.externalEditStage=null;render();return;}\n if(filter==='v43-progress-search'){ui.progressQuery=el.value;ui.progressPage=0;render();return;}\n if(filter==='v42-project'){ui.project=el.value;ui.procurementProject=el.value;ui.projectTab='focus';ui.materialEditOccurrence=null;render();return;}\n if(filter==='v42-project-extra'){if(el.value){ui.projectTab=el.value;render();}return;}\n if(filter==='v41-project'){ui.procurementProject=el.value;ui.project=el.value;ui.materialPO=null;ui.materialOrderEditor=false;render();return;}\n if(filter==='mfgProject'){ui.project=el.value;ui.mfgAssemblyId=null;ui.mfgEditor=null;render()}\n else if(filter==='dept'){ui.dept=el.value;render()}\n else if(filter==='taskProject'){ui.taskProject=el.value;render()}\n else if(filter==='clientOrg'){ui.clientOrg=el.value;ui.clientProject=activeOrgProjects(el.value)[0]?.id;ui.clientTab='updates';render()}\n else if(filter==='clientProject'){ui.clientProject=el.value;render()}\n else if(filter==='modalProject'){ui.modal.project=el.value;render()}\n else if(el.dataset.inlineTask){const t=data.tasks.find(x=\u003ex.id===el.dataset.inlineTask\u0026\u0026!x.archivedAt);if(!t)throw Error('Job missing');const field=el.dataset.field;if(field==='status')setTaskStatus(data,t.id,el.value);else if(['start','due'].includes(field))updateTaskPlan(data,t.id,{[field]:el.value});else if(['assignee','department','priority'].includes(field))saveTask(data,{...t,[field]:el.value});else throw Error('Field not editable');persist();render();toast('Work register updated locally')}\n else if(el.dataset.taskStatus){setTaskStatus(data,el.dataset.taskStatus,el.value);persist();render();toast('Job status updated')}\n}catch(err){toast(err.message||'Cannot update status',true);render()}});\ndocument.addEventListener('dragstart',ev=\u003e{\n if(!staffGate.status().unlocked)return;\n const row=ev.target.closest?.('[data-v47-occurrence]');if(!row)return;\n ui.v47Dragging=row.dataset.v47Occurrence;\n if(ev.dataTransfer){ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',row.dataset.v47Occurrence);}\n});\ndocument.addEventListener('dragover',ev=\u003e{\n if(staffGate.status().unlocked\u0026\u0026ui.v47Dragging\u0026\u0026ev.target.closest?.('[data-v47-drop-stage]')){\n  ev.preventDefault();if(ev.dataTransfer)ev.dataTransfer.dropEffect='move';\n }\n});\ndocument.addEventListener('drop',ev=\u003e{\n if(!staffGate.status().unlocked)return;\n const target=ev.target.closest?.('[data-v47-drop-stage]');if(!target)return;\n ev.preventDefault();const id=ui.v47Dragging;ui.v47Dragging=null;\n if(!id)return;\n try{runProcurementStage(id,target.dataset.v47DropStage);}catch(err){toast(err.message||'Unable to change sourcing stage',true)}\n});\ndocument.addEventListener('dragend',()=\u003e{ui.v47Dragging=null;});\ndocument.addEventListener('keydown',ev=\u003e{\n if(ev.key==='Enter'\u0026\u0026['v46-work-query','v46-buy-query','v50-search'].includes(ev.target?.dataset?.filter)){\n  ev.preventDefault();if(ev.target.dataset.filter==='v46-work-query')ui.v46WorkQuery=ev.target.value;\n  else if(ev.target.dataset.filter==='v50-search')ui.v50Search=ev.target.value;\n  else ui.v46BuyingQuery=ev.target.value;render();return;\n }\n if(ev.key==='Escape'\u0026\u0026ui.modal)closeModal();\n});\nrender();","clean-data-v043.mjs":"/* A clean new staff workspace. Contract-derived records are imported privately by the owner.\n   Never commit customer contracts, pricing, or project-specific state to the public repository. */\nexport function emptyWorkspace(){\n return {\n  version:1, organizations:[],projects:[],sections:[],tasks:[],parts:[],bom:[],orders:[],\n  movements:[],updates:[],approvals:[],documents:[],members:[],messages:[],\n  notifications:[],audit:[],settings:{theme:'light'},\n  assemblies:[],assemblyBOM:[],drawingRevisions:[],engineeringChanges:[],jobAssemblyLinks:[],\n  manufacturingMigrationVersion:1,materialsSchemaVersion:1,stockReservations:[],\n  procurementReceipts:[],procurementReturns:[],projectProgressSteps:[],progressSchemaVersion:1,\n  externalWorkRoutes:[],externalWorkEvents:[]\n };\n}\n","workspace-file-v043.mjs":"/* File-backed workspace for desktop Chromium. No network. File System Access API requires\n   supported Chromium \u0026 user-selected JSON file. Browser storage remains a fallback.\n   A file handle is intentionally not cached across origins; relink after opening a new HTML version. */\nexport function createWorkspaceFileController({onStatus=()=\u003e{}}={}){\n let fileHandle=null,queue=Promise.resolve(),state='Browser only',lastSaved='';\n const emit=(kind,message)=\u003e{state=kind;onStatus({kind,message,lastSaved,connected:!!fileHandle});};\n const status=()=\u003e({kind:state,connected:!!fileHandle,lastSaved});\n const supportsFiles=()=\u003etypeof window!=='undefined'\u0026\u0026\n   typeof window.showSaveFilePicker==='function'\u0026\u0026typeof window.showOpenFilePicker==='function';\n function ensureFileAPI(){if(!supportsFiles())throw Error('Automatic file save requires current Chrome/Edge with local file permission. Use Download JSON backup in Settings if unavailable.');}\n async function writeJSON(text){\n  if(!fileHandle)return false;\n  try{\n   const p=await fileHandle.queryPermission({mode:'readwrite'});\n   if(p!=='granted'\u0026\u0026await fileHandle.requestPermission({mode:'readwrite'})!=='granted')throw Error('File write permission was declined');\n   const writer=await fileHandle.createWritable();\n   try{await writer.write(new Blob([text],{type:'application/json;charset=utf-8'}));await writer.close();}\n   catch(err){try{await writer.abort()}catch{}throw err}\n   lastSaved=new Date().toISOString();\n   emit('file-saved','Saved to your chosen workspace file');\n   return true;\n  }catch(err){\n   emit('file-error',String(err?.message||err));throw err;\n  }\n }\n function scheduleSave(text){\n  if(!fileHandle)return Promise.resolve(false);\n  emit('file-saving','Saving workspace file…');\n  const action=queue.catch(()=\u003e{}).then(()=\u003ewriteJSON(text));\n  queue=action;\n  return action.catch(()=\u003efalse);\n }\n async function createAndConnect(text){\n  ensureFileAPI();\n  const selected=await window.showSaveFilePicker({suggestedName:'SimWorx_ProjectHub_Workspace.json',\n   types:[{description:'Sim-Worx workspace JSON',accept:{'application/json':['.json']}}]});\n  if(!selected)return false;\n  await queue.catch(()=\u003e{});\n  fileHandle=selected;\n  await writeJSON(text);\n  return true;\n }\n async function openCandidate(){\n  ensureFileAPI();\n  const [selected]=await window.showOpenFilePicker({multiple:false,types:[\n    {description:'Sim-Worx workspace JSON',accept:{'application/json':['.json']}}]});\n  if(!selected)return null;\n  const f=await selected.getFile();\n  if(f.size\u003e10000000)throw Error('Workspace JSON exceeds the 10 MB import limit');\n  const text=await f.text();\n  return {handle:selected,filename:f.name,text};\n }\n async function connectOpened(handle){\n  if(!handle)throw Error('No workspace file was selected');\n  await queue.catch(()=\u003e{});\n  fileHandle=handle;\n  emit('file-connected','Workspace file connected');\n }\n async function verifyConnected(expectedText){\n  if(!fileHandle)throw Error('Link a workspace file before checking recovery');\n  await queue.catch(()=\u003e{});\n  try{\n   const file=await fileHandle.getFile();\n   if(file.size\u003e10000000)throw Error('Linked workspace file exceeds the 10 MB restore limit');\n   const recorded=await file.text();\n   // Backup envelopes contain a fresh createdAt timestamp on each export; compare all\n   // persisted project state and schema instead of the export timestamp.\n   const normalize=text=\u003e{\n    const obj=JSON.parse(text);\n    if(obj\u0026\u0026obj.format==='simworx-project-hub-backup')delete obj.createdAt;\n    return JSON.stringify(obj);\n   };\n   if(normalize(recorded)!==normalize(expectedText))throw Error('File contents DO NOT match current browser records. Review your backups before replacing either copy.');\n   emit('file-verified','Read-back confirmed: linked file matches the browser workspace');\n   return {bytes:file.size,lastSaved};\n  }catch(err){\n   emit('file-error',String(err?.message||err));throw err;\n  }\n }\n function detach(){fileHandle=null;emit('browser-only','Browser-only saving');}\n return {supportsFiles,status,scheduleSave,createAndConnect,openCandidate,connectOpened,verifyConnected,detach};\n}\n","staff-access-v043.mjs":"/* Six-digit local convenience gate for the complete OFFLINE application.\n * This is NOT an authentication service and does NOT encrypt private workspace files.\n * The stored verifier is extractable from public client-side source: use OS/file security.\n * Previous local username/password credentials and all project data remain untouched.\n */\nconst SESSION_KEY='simworx-project-hub-pin-session-v1';\nconst PIN_CONFIG={\n version:1,\n salt:'f76bb20f3f607494a68f6301ab747964',\n verifier:'94e66b20259c138e8cd8914a8c61a2b85bd3c216daf4cc3fe2eb9eaeee5c521c'\n};\nconst digits=pin=\u003e/^[0-9]{6}$/.test(String(pin??''));\nconst toHex=bytes=\u003eArray.from(bytes,b=\u003eb.toString(16).padStart(2,'0')).join('');\nasync function derive(pin,saltHex){\n if(typeof crypto==='undefined'||!crypto.subtle)throw Error('This browser does not support PIN verification');\n const salt=new Uint8Array(saltHex.match(/../g).map(x=\u003eparseInt(x,16)));\n const input=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);\n const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},input,256);\n return toHex(new Uint8Array(bits));\n}\nexport function localStaffStatus(){\n return {configured:true,unlocked:sessionStorage.getItem(SESSION_KEY)==='unlocked',secure:false,mode:'pin'};\n}\nexport function createLocalStaffGate(){\n return {\n  status:localStaffStatus,\n  async signIn(pin){\n   const supplied=String(pin??'').trim();\n   if(!digits(supplied))throw Error('Enter exactly six digits');\n   const verifier=await derive(supplied,PIN_CONFIG.salt);\n   if(verifier!==PIN_CONFIG.verifier){\n    sessionStorage.removeItem(SESSION_KEY);\n    throw Error('Incorrect six-digit code');\n   }\n   sessionStorage.setItem(SESSION_KEY,'unlocked');\n   return localStaffStatus();\n  },\n  logout(){sessionStorage.removeItem(SESSION_KEY);return localStaffStatus();}\n };\n}\n","progress-v043.mjs":"/* V0.5.2: project-owned manual progress, with explicit weights and completion.\n   Not inferred from job counts, dates, or customer publication. Local demo only. */\nconst id=()=\u003e 'step-'+Math.random().toString(36).slice(2,11);\nconst validProject=(s,pid)=\u003e{if(!s.projects?.some(p=\u003ep.id===pid\u0026\u0026!p.archivedAt))throw Error('Active project not found');};\nconst basis=(value,label)=\u003e{\n const n=Number(value);\n if(!Number.isFinite(n)||n\u003c0||n\u003e100)throw Error(label+' must be between 0 and 100');\n const bp=Math.round(n*100);\n if(Math.abs(n*100-bp)\u003e0.00000001)throw Error(label+' supports up to two decimal places');\n return bp;\n};\nconst name=str=\u003e{const v=String(str||'').trim();if(!v||v.length\u003e140)throw Error('Progress step title must be 1–140 characters');return v;};\nconst now=()=\u003enew Date().toISOString();\nexport function ensureProgress(s){\n if(!Array.isArray(s.projectProgressSteps))s.projectProgressSteps=[];\n s.progressSchemaVersion=1;\n return s;\n}\nexport function projectSteps(s,projectId){\n ensureProgress(s);\n return s.projectProgressSteps.filter(x=\u003ex.projectId===projectId\u0026\u0026!x.archivedAt)\n  .sort((a,b)=\u003e(a.order||0)-(b.order||0)||a.id.localeCompare(b.id));\n}\nexport function progressSnapshot(s,projectId){\n validProject(s,projectId);\n const steps=projectSteps(s,projectId);\n const totalBasis=steps.reduce((n,x)=\u003en+x.weightBp,0);\n const earnedBasis=Math.round(steps.reduce((n,x)=\u003en+x.weightBp*x.doneBp,0)/10000);\n return {projectId,configured:steps.length\u003e0,count:steps.length,\n   weightTotal:totalBasis/100,unassigned:Math.max(0,10000-totalBasis)/100,\n   earned:earnedBasis/100,\n   completed:steps.filter(x=\u003ex.doneBp===10000).length,\n   partial:steps.filter(x=\u003ex.doneBp\u003e0\u0026\u0026x.doneBp\u003c10000).length,\n   outstanding:steps.length-steps.filter(x=\u003ex.doneBp===10000).length,\n   fullyWeighted:totalBasis===10000};\n}\nexport function saveProgressStep(s,{projectId,id:existingId,title,weight,completion}){\n ensureProgress(s);validProject(s,projectId);\n const existing=existingId?s.projectProgressSteps.find(x=\u003ex.id===existingId\u0026\u0026!x.archivedAt):null;\n if(existingId\u0026\u0026!existing)throw Error('Progress step not found');\n if(existing\u0026\u0026existing.projectId!==projectId)throw Error('Progress step belongs to another project');\n if(!existing\u0026\u0026projectSteps(s,projectId).length\u003e=1000)throw Error('Maximum 1,000 active progress steps per project');\n const w=basis(weight,'Weight'),done=basis(completion,'Completion'),label=name(title);\n const oldWeight=existing?.weightBp||0;\n const allocation=projectSteps(s,projectId).reduce((n,x)=\u003en+x.weightBp,0)-oldWeight+w;\n if(allocation\u003e10000)throw Error('Assigned progress weights exceed 100%; reduce another step first');\n if(existing){Object.assign(existing,{title:label,weightBp:w,doneBp:done,updatedAt:now()});return existing;}\n const current=projectSteps(s,projectId);\n const row={id:id(),projectId,title:label,weightBp:w,doneBp:done,\n  order:(current.at(-1)?.order||0)+1,createdAt:now()};\n s.projectProgressSteps.push(row);\n return row;\n}\nexport function archiveProgressStep(s,{projectId,stepId,restore=false}){\n ensureProgress(s);validProject(s,projectId);\n const row=s.projectProgressSteps.find(x=\u003ex.projectId===projectId\u0026\u0026x.id===stepId);\n if(!row)throw Error('Progress step not found');\n if(restore){\n   if(!row.archivedAt)throw Error('Progress step is already active');\n   if(projectSteps(s,projectId).length\u003e=1000)throw Error('Maximum 1,000 active progress steps');\n   const total=projectSteps(s,projectId).reduce((v,x)=\u003ev+x.weightBp,0);\n   if(total+row.weightBp\u003e10000)throw Error('Restoration would exceed 100% weighting');\n   delete row.archivedAt;\n }else{\n   if(row.archivedAt)throw Error('Already removed');\n   row.archivedAt=now();\n }\n return row;\n}\nexport function generateProgressSteps(s,{projectId,count,prefix='Step'}){\n ensureProgress(s);validProject(s,projectId);\n const n=Number(count),existing=projectSteps(s,projectId).length;\n if(!Number.isSafeInteger(n)||n\u003c1||n\u003e1000||existing+n\u003e1000)throw Error('Choose a number of steps that keeps the project at 1,000 or fewer');\n const label=name(prefix);\n const last=projectSteps(s,projectId).at(-1)?.order||0;\n const stamp=now();\n const created=Array.from({length:n},(_,i)=\u003e({id:id(),projectId,title:label+' '+(existing+i+1),\n  weightBp:0,doneBp:0,order:last+i+1,createdAt:stamp}));\n s.projectProgressSteps.push(...created);\n return created;\n}\nexport function importProgressSteps(s,{projectId,lines}){\n ensureProgress(s);validProject(s,projectId);\n const list=String(lines||'').split(/\\r?\\n/).map(x=\u003ex.trim()).filter(Boolean);\n if(!list.length||list.length+projectSteps(s,projectId).length\u003e1000)throw Error('Import must contain 1–1,000 steps within the project limit');\n // title | weight % | completion %, title|weight and title-only lines also accepted.\n const parsed=list.map(line=\u003e{\n   const a=line.split('|').map(x=\u003ex.trim());\n   if(a.length\u003e3)throw Error('Use: Step title | weight % | completion %');\n   return {title:name(a[0]),weightBp:basis(a[1]||0,'Weight'),doneBp:basis(a[2]||0,'Completion')};\n });\n const current=projectSteps(s,projectId),total=current.reduce((n,x)=\u003en+x.weightBp,0)+parsed.reduce((n,x)=\u003en+x.weightBp,0);\n if(total\u003e10000)throw Error('Imported step weights exceed 100% with existing steps');\n const order=current.at(-1)?.order||0;\n const added=parsed.map((x,i)=\u003e({id:id(),projectId,title:x.title,weightBp:x.w nconst createId=p=\u003ep+'-'+Math.random().toString(36).slice(2,12);\nconst stamp=()=\u003enew Date().toISOString();\nconst required=(v,kind)=\u003e{const s=String(v||'').trim();if(!s||s.length\u003e180)throw Error(kind+' is required (max 180 characters)');return s;};\nexport const validISODate=x=\u003e!x||(/^\\d{4}-\\d{2}-\\d{2}$/.test(x)\u0026\u0026!Number.isNaN(Date.parse(x+'T12:00:00Z'))\u0026\u0026new Date(x+'T12:00:00Z').toISOString().slice(0,10)===x);\nconst date=v=\u003e{const x=String(v||'').trim();if(!validISODate(x))throw Error('Enter a valid YYYY-MM-DD date');return x;};\nexport const daysBetween=(a,b)=\u003e{if(!a||!b)return null;return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000)};\nconst nowDate=()=\u003estamp().slice(0,10);\nfunction audit(s,routeId,stageId,event,detail='',old={},next={}){\n s.externalWorkEvents.unshift({id:createId('ev'),routeId,stageId:event==='Route created'?null:stageId,\n  event,detail:String(detail||'').slice(0,1200),previous:old,next,at:stamp(),recordedBy:'Sim-Worx Demo'});\n}\nexport function ensureExternalWork(s){s.externalWorkRoutes??=[];s.externalWorkEvents??=[];return s}\nconst getProject=(s,id)=\u003e{\n const p=s.projects?.find(x=\u003ex.id===id\u0026\u0026!x.archivedAt);if(!p)throw Error('Project not found');return p;\n};\nexport const activeRoutes=(s,projectId)=\u003e{ensureExternalWork(s);return s.externalWorkRoutes.filter(x=\u003e!x.archivedAt\u0026\u0026(!projectId||x.projectId===projectId))};\nconst getRoute=(s,id)=\u003e{ensureExternalWork(s);const v=s.externalWorkRoutes.find(x=\u003ex.id===id\u0026\u0026!x.archivedAt);if(!v)throw Error('External work package unavailable');return v};\nconst getStage=(r,id)=\u003e{const v=r.stages.find(x=\u003ex.id===id\u0026\u0026!x.archivedAt);if(!v)throw Error('Stage not found');return v;};\nexport const activeStages=route=\u003eroute.stages.filter(x=\u003e!x.archivedAt).sort((a,b)=\u003ea.order-b.order);\nexport function createExternalRoute(s,{ tageId,name,type,company,plannedStart,promisedFinish,notes,delayReason}){\n const r=getRoute(s,routeId),st=getStage(r,stageId),old={...st};\n const role=type==='Internal'?'Internal':'External',start=date(plannedStart),finish=date(promisedFinish);\n if(start\u0026\u0026finish\u0026\u0026finish\u003cstart)throw Error('Expected finish before planned start');\n const next={name:required(name,'Stage name'),type:role,company:required(company||'Sim-Worx','Company or team'),\n   plannedStart:start,promisedFinish:finish,notes:String(notes||'').slice(0,1000),\n   delayReason:String(delayReason||'').slice(0,600)};\n Object.assign(st,next);\n audit(s,r.id,st.id,'Stage details updated','Schedule and/or responsibility edited',\n  Object.fromEntries(Object.keys(next).map(k=\u003e[k,old[k]])),next);\n return st;\n}\nexport function recordExternalHandoff(s,{routeId,stageId,action,onDate,notes,reviewer='',evidenceRef=''}){\n const route=getRoute(s,routeId),st=getStage(route,stageId),when=date(onDate)||nowDate();\n const comment=String(notes||'').trim().slice(0,1200),prior={status:st.status,sentAt:st.sentAt,returnedAt:st.returnedAt,acceptedAt:st.acceptedAt};\n if(!['send','return','accept','reject','resend','hold','resume'].includes(action))throw Error('Invalid external handoff action');\n if(action==='send'){\n  if(st.status!=='Planned')throw Error('Stage must be planned before dispatch');\n  const stages=activeStages(route),idx=stages.findIndex(x=\u003ex.id===st.id);\n  if(idx\u003e0\u0026\u0026stages[idx-1].status!=='Accepted')throw Error('The previous handoff must be accepted first');\n  st.sentAt=when;st.status='With supplier';\n }else if(action==='resend'){\n  if(st.status!=='Rework required')throw Error('A stage can only be resent after failed inspection');\n  if(st.returnedAt\u0026\u0026when\u003cst.returnedAt)throw Error('Rework dispatch precedes rejected return');\n  st.sentAt=when;st.returnedAt='';st.acceptedAt='';st.status='With supplier';\n }else if(action==='return'){\n  if(st.status!=='With supplier'\u0026\u0026st.status!=='On hold')throw Error('Stage is not currently with supplier');\n  if(st.sentAt\u0026\u0026when\u003cst.sentAt)throw Error('Return date precedes dispatch');\n  st.returnedAt=when;st.status='Returned · inspect';\n }else if(action==='accept'){\n  if(st.status!=='Returned · inspect')throw Error('Inspect received work before accepting it');\n  if(st.returnedAt\u0026\u0026when\u003cst.returnedAt)throw Error('Acceptance date precedes receipt');\n  if(!comment)throw Error('Document the inspection result before accepting');\n  const inspector=required(reviewer,'QA reviewer');\n  const reference=required(evidenceRef,'QA evidence reference');\n  st.inspections??=[];\n  st.inspections.push({id:createId('qa'),decision:'Accepted',reviewer:inspector,evidenceRef:reference,\n   notes:comment,inspectedOn:when,recordedAt:stamp()});\n  st.acceptedAt=when;st.status='Accepted';\n }else if(action==='reject'){\n  if(st.status!=='Returned · inspect')throw Error('Only returned work can fail inspection');\n  if(st.returnedAt\u0026\u0026when\u003cst.returnedAt)throw Error('Inspection precedes return');\n  if(!comment)throw Error('Record the factual non-conformity before rejecting');\n  const inspector=required(reviewer,'QA reviewer');\n  const reference=required(evidenceRef,'QA evidence reference');\n  st.inspections??=[];\n  st.inspections.push({id:createId('qa'),decision:'Rejected',reviewer:inspector,evidenceRef:reference,\n   notes:comment,inspectedOn:when,recordedAt:stamp()});\n  st.status='Rework required';\n }else if(action==='hold'){\n  if(st.status!=='With supplier')throw Error('Only work currently with supplier can be placed on hold');\n  if(!comment)throw Error('Record a factual hold note');st.status='On hold';\n }else if(action==='resume'){\n  if(st.status!=='On hold')throw Error('Stage must be on hold first');\n  st.status='With supplier';\n }\n audit(s,route.id,st.id,{send:'Sent to company',return:'Returned to Sim-Worx',accept:'Inspected and accepted',\n  reject:'Inspection rejected / rework required',resend:'Resent for rework',hold:'Placed on hold',resume:'Hold cleared'}[action],comment,prior,\n  {status:st.status,sentAt:st.sentAt,returnedAt:st.returnedAt,acceptedAt:st.acceptedAt,date:when,inspection:st.inspections?.at(-1)||null});\n return st;\n}\nexport function archiveExternalRoute(s,routeId){\n const r=getRoute(s,routeId);r.archivedAt=stamp();\n audit(s,r.id,null,'Work package archived','Historical events remain preserved');return r;\n}\nexport function externalStageTiming(stage,today=nowDate()){\n const end=stage.returnedAt||((stage.status==='With supplier'||stage.status==='On hold')?today:'');\n const elapsed=stage.sentAt\u0026\u0026end?Math.max(0,daysBetween(stage.sentAt,end)):null;\n const overdue=stage.promisedFinish\u0026\u0026(stage.returnedAt||['With supplier','On hold'].includes(stage.status))\n   ?Math.max(0,daysBetween(stage.promisedFinish,stage.returnedAt||today)):0;\n return {elapsedDays:elapsed,overdueDays:overdue,finishedLate:!!(stage.returnedAt\u0026\u0026overdue\u003e0),\n   activeOverdue:!!(!stage.returnedAt\u0026\u0026['With supplier','On hold'].includes(stage.status)\u0026\u0026overdue\u003e0),\n   missingPromise:!stage.promisedFinish};\n}\nexport function externalRouteSummary(s,projectId,today=nowDate()){\n const routes=activeRoutes(s,projectId),all=routes.flatMap(activeStages);\n const late=all.map(st=\u003e({...st,timing:externalStageTiming(st,today)})).filter(x=\u003ex.timing.overdueDays\u003e0);\n return {routes:routes.length,stages:all.length,atSuppliers:all.filter(x=\u003e['With supplier','On hold'].includes(x.status)).length,\n  waitingInspection:all.filter(x=\u003ex.status==='Returned · inspect').length,rework:all.filter(x=\u003ex.status==='Rework required').length,late,\n  completedRoutes:routes.filter(r=\u003eactiveStages(r).length\u0026\u0026activeStages(r).every(x=\u003ex.status==='Accepted')).length};\n}\nexport function externalWorkTimeline(s,routeId,today=nowDate()){\n const route=getRoute(s,routeId);\n return {route,stages:activeStages(route).map(st=\u003e({...st,timing:externalStageTiming(st,today)})),\n  events:s.externalWorkEvents.filter(e=\u003ee.routeId===routeId).sort((a,b)=\u003ea.at.localeCompare(b.at))};\n}\nexport function exportExternalHistoryCSV(s,projectId,today=nowDate()){\n const header=['Project','Work package','Stage','Responsible company','Stage type','Status','Planned start','Promised finish','Sent to company','Returned to Sim-Worx','Inspected/accepted','Days at stage','Days after promised finish','Delay reason (staff entry)','Notes','Last QA decision','QA reviewer','Evidence reference (user-entered)','Inspection date','Inspection notes'];\n const cells=[header];\n for(const route of activeRoutes(s,projectId))\n for(const st of activeStages(route)){\n  const t=externalStageTiming(st,today);\n  cells.push([projectId,route.title,st.name,st.company,st.type,st.status,st.plannedStart,st.promisedFinish,\n  st.sentAt,st.returnedAt,st.acceptedAt,t.elapsedDays??'',t.overdueDays||0,st.delayReason||'',st.notes||'',\n  st.inspections?.at(-1)?.decision||'',st.inspections?.at(-1)?.reviewer||'',st.inspections?.at(-1)?.evidenceRef||'',\n  st.inspections?.at(-1)?.inspectedOn||'',st.inspections?.at(-1)?.notes||'']);\n }\n return cells.map(row=\u003erow.map(v=\u003e'\"'+String(v??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\\r\\n');\n}\n","external-ui-v043.mjs":"/* External supplier chain workspace: internal records, no customer auto-publication. */\nimport {ensureExternalWork,activeRoutes,activeStages,createExternalRoute,addExternalStage,\n updateExternalStage,recordExternalHandoff,archiveExternalRoute,externalRouteSummary,\n externalWorkTimeline,exportExternalHistoryCSV} from './external-work-v043.mjs';\nconst e=s=\u003eString(s??'').replace(/[\u0026\u003c\u003e\"']/g,ch=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;','\"':'\u0026quot;','\"':'\u0026#39;'}[ch]));\nconst input=(name,v='',type='text',extra='')=\u003e'\u003cinput name=\"'+e(name)+'\" type=\"'+type+'\" value=\"'+e(v)+'\" '+extra+'\u003e';\nconst sel=(name,rows,value='',extra='')=\u003e'\u003cselect name=\"'+e(name)+'\" '+extra+'\u003e'+rows.map(([v,t])=\u003e\n '\u003coption value=\"'+e(v)+'\" '+(v===value?'selected':'')+'\u003e'+e(t)+'\u003c/option\u003e').join('')+'\u003c/select\u003e';\nconst field=(name,element)=\u003e'\u003clabel class=\"v43-field\"\u003e\u003cspan\u003e'+e(name)+'\u003c/span\u003e'+element+'\u003c/label\u003e';\nconst button=(name,action,attrs='',klass='small')=\u003e'\u003cbutton type=\"button\" class=\"btn '+klass+'\" data-action=\"'+e(action)+'\" '+attrs+'\u003e'+e(name)+'\u003c/button\u003e';\nconst fmt=d=\u003ed||'Not recorded';\nconst stageStatus=st=\u003e{\n if(st.status==='Accepted')return 'green';\n if(st.status==='Returned · inspect')return 'amber';\n if(st.status==='On hold'||st.status==='Rework required')return 'red';\n if(st.status==='With supplier')return 'amber';return 'neutral';\n};\nfunction stageEditor(r,st){\n return '\u003cform data-form=\"v43-external-edit\" class=\"v43-ext-form\"\u003e'+\n '\u003cinput type=\"hidden\" name=\"routeId\" value=\"'+e(r.id)+'\"\u003e\u003cinput type=\"hidden\" name=\"stageId\" value=\"'+e(st.id)+'\"\u003e'+\n field('Stage name',input('name',st.name,'text','required'))+\n field('Type',sel('type',[['External','External company'],['Internal','Our workshop']],st.type))+\n field('Company / responsible team',input('company',st.company,'text','required'))+\n field('Planned start',input('plannedStart',st.plannedStart,'date'))+\n field('Promised finish',input('promisedFinish',st.promisedFinish,'date'))+\n field('Delay reason (staff note)',input('delayReason',st.delayReason||''))+\n field('Additional notes',input('notes',st.notes||''))+\n '\u003cbutton class=\"btn primary\" type=\"submit\"\u003eSave stage details\u003c/button\u003e\u003c/form\u003e';\n}\nexport function renderExternalWork(s,ui, '\u003cspan\u003e\u003csmall\u003eDays with supplier\u003c/small\u003e'+(timing.elapsedDays??'—')+'\u003c/span\u003e\u003c/div\u003e'+\n    (st.delayReason?'\u003cp class=\"v43-ext-reason\"\u003e\u003cb\u003eRecorded delay note:\u003c/b\u003e '+e(st.delayReason)+'\u003c/p\u003e':'')+\n    (st.inspections?.length?'\u003cp class=\"v43-ext-reason\"\u003e\u003cb\u003eLast QA: \u003c/b\u003e'+e(st.inspections.at(-1).decision)+' · '+e(st.inspections.at(-1).reviewer)+' · Ref: '+e(st.inspections.at(-1).evidenceRef)+' · '+e(st.inspections.at(-1).notes)+'\u003c/p\u003e':'')+\n    '\u003cdiv class=\"v43-ext-actions\"\u003e'+actions+\n    button(ui.externalEditStage===st.id?'Close edit':'Edit stage','v43-external-edit','data-stage=\"'+e(st.id)+'\"')+'\u003c/div\u003e'+\n    (ui.externalEditStage===st.id?stageEditor(selected,st):'')+'\u003c/div\u003e';\n  }).join('');\n  const history=timeline.events.slice().reverse().map(x=\u003e'\u003ctr\u003e\u003ctd\u003e'+e(x.at.replace('T',' ').slice(0,19))+\n   '\u003c/td\u003e\u003ctd\u003e'+e(x.event)+'\u003c/td\u003e\u003ctd\u003e'+e(x.detail||'—')+'\u003c/td\u003e\u003c/tr\u003e').join('');\n  const addStage='\u003cdetails class=\"v43-ext-creator\"\u003e\u003csummary\u003e+ Plan another supplier / workshop stage\u003c/summary\u003e'+\n    '\u003cform data-form=\"v43-external-stage\" class=\"v43-ext-form\"\u003e\u003cinput type=\"hidden\" name=\"routeId\" value=\"'+e(selected.id)+'\"\u003e'+\n    field('Stage',input('name','','text','required placeholder=\"Laser cutting / powder coating / inspection\"'))+\n    field('Type',sel('type',[['External','External supplier'],['Internal','Sim-Worx inspection']],'External'))+\n    field('Company',input('company','','text','required placeholder=\"External supplier name\"'))+\n    field('Planned start',input('plannedStart','','date'))+\n    field('Promised finish',input('promisedFinish','','date'))+\n    field('Notes',input('notes',''))+\n    '\u003cbutton class=\"btn primary\" type=\"submit\"\u003eAdd stage\u003c/button\u003e\u003c/form\u003e\u003c/details\u003e';\n  content='\u003cdiv class=\"v43-ext-project\"\u003e\u003cdiv class=\"v43-ext-header\"\u003e\u003cdiv\u003e\u003ch3\u003e'+e(selected.title)+'\u003c/h3\u003e'+\n    '\u003cp\u003e'+e(selected.notes||'Internal work package')+' · Needed by '+fmt(selected.requiredBy)+'\u003c/p\u003e\u003c/div\u003e'+\n    '\u003cdiv\u003e'+button('Export delays CSV','v43-external-export','data-project=\"'+e(projectId)+'\"')+\n    button('Archive package','v43-external-archive','data-route=\"'+e(selected.id)+'\"','small danger')+'\u003c/div\u003e\u003c/div\u003e'+\n    '\u003cdiv class=\"v43-ext-stages\"\u003e'+(stageRows||'\u003cp\u003eStart by adding a supplier or internal stage.\u003c/p\u003e')+'\u003c/div\u003e'+addStage+\n    '\u003cdetails class=\"v43-ext-history\"\u003e\u003csummary\u003eRecorded handoff history ('+timeline.events.length+')\u003c/summary\u003e'+\n    '\u003cdiv class=\"v43-scroll\"\u003e\u003ctable class=\"v43-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eRecorded at\u003c/th\u003e\u003cth\u003eEvent\u003c/th\u003e\u003cth\u003eNotes\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e'+history+'\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/details\u003e\u003c/div\u003e';\n }\n return '\u003cdiv class=\"v43-ext\"\u003e\u003cdiv class=\"v43-focus-heading\"\u003e\u003cdiv\u003e\u003ch2\u003eExternal work \u0026 supplier delays\u003c/h2\u003e'+\n  '\u003cp\u003eRecord each handoff from supplier to Sim-Worx and onward—actual and promised dates stay in the history.\u003c/p\u003e\u003c/div\u003e'+\n  '\u003cspan class=\"v43-ext-status\"\u003eInternal records only\u003c/span\u003e\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-ext-kpis\"\u003e\u003cdiv\u003e\u003cb\u003e'+summary.routes+'\u003c/b\u003e\u003csmall\u003eActive packages\u003c/small\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cb\u003e'+summary.atSuppliers+'\u003c/b\u003e\u003csmall\u003eWith external companies\u003c/small\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cb\u003e'+summary.waitingInspection+'\u003c/b\u003e\u003csmall\u003eBack for inspection\u003c/small\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cb\u003e'+summary.late.length+'\u003c/b\u003e\u003csmall\u003eStages with recorded delay\u003c/small\u003e\u003c/div\u003e'+ \n  '\u003cdiv\u003e\u003cb\u003e'+summary.rework+'\u003c/b\u003e\u003csmall\u003eFailed QA / rework\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e'+\n  routePicker+newRoute+content+\n  '\u003cp class=\"v43-ext-note\"\u003eEach event stores when staff recorded it and the date they entered. Overdue days compare the supplier’s promised date with the recorded return date or today. These are user-maintained records, not independent verification of supplier fault; Evidence references are staff-entered identifiers, not uploaded or independently verified files. Review evidence before publishing any client-facing explanation.\u003c/p\u003e\u003c/div\u003e';\n}\nexport function handleExternalForm(s,ui,form){\n const f=new FormData(form),v=k=\u003eString(f.get(k)||'').trim();\n switch(form.dataset.form){\n  case 'v43-external-new':{const r=createExternalRoute(s,{projectId:v('projectId'),title:v('title'),partId:v('partId'),quantity:v('quantity'),requiredBy:v('requiredBy'),notes:v('notes')});ui.externalRouteId=r.id;return r;}\n  case 'v43-external-stage':return addExternalStage(s,{routeId:v('routeId'),name:v('name'),type:v('type'),company:v('company'),plannedStart:v('plannedStart'),promisedFinish:v('promisedFinish'),notes:v('notes')});\n  case 'v43-external-edit':{const st=updateExternalStage(s,{routeId:v('routeId'),stageId:v('stageId'),name:v('name'),type:v('type'),company:v('company'),plannedStart:v('plannedStart'),promisedFinish:v('promisedFinish'),delayReason:v('delayReason'),notes:v('notes')});ui.externalEditStage=null;return st;}\n  default:throw Error('Unknown external-work form');\n }\n}\nexport function handleExternalAction(s,ui,el,confirmFn=()=\u003etrue){\n const d=el.dataset;\n switch(d.action){\n  case 'v43-external-edit':ui.externalEditStage=ui.externalEditStage===d.stage?null:d.stage;return 'ui';\n  case 'v43-external-archive':if(confirmFn('Archive this work package? Events remain in local records.')){archiveExternalRoute(s,d.route);ui.externalRouteId=null;}return 'ui';\n  case 'v43-external-export':return {download:exportExternalHistoryCSV(s,d.project||ui.project),name:'SimWorx-External-Work-'+(d.project||ui.project)+'.csv'};\n  case 'v43-external-action':{\n   const label={send:'Send to company',return:'Record return',accept:'Record inspection acceptance',\n    reject:'Record failed inspection',resend:'Resend for rework',hold:'Place work on hold',resume:'Resume supplier work'}[d.step];\n   if(!label)throw Error('Unknown handoff action');\n   const notes=prompt(label+' — factual notes (optional except for hold):','');\n   if(notes===null)return 'ui';\n   if(['hold','accept','reject'].includes(d.step)\u0026\u0026!notes.trim())throw Error('A factual note is required');\n   let reviewer='',evidenceRef='';\n   if(['accept','reject'].includes(d.step)){\n    const qaName=prompt('QA inspector/reviewer (required):','');if(qaName===null)return 'ui';reviewer=qaName.trim();\n    const qaRef=prompt('QA evidence reference (file name, controlled report number, or inspection log; no actual file attached):','');if(qaRef===null)return 'ui';evidenceRef=qaRef.trim();\n    if(!reviewer||!evidenceRef)throw Error('QA reviewer and evidence reference are required');\n   }\n   const today=new Date().toISOString().slice(0,10);\n   const date=prompt('Event date (YYYY-MM-DD); recorded at current time:',today);\n   if(date===null)return 'ui';\n   return recordExternalHandoff(s,{routeId:d.route,stageId:d.stage,action:d.step,onDate:date,notes,reviewer,evidenceRef});\n  }\n  default:throw Error('Unknown external work action');\n }\n}\n","procurement-planning-v043.mjs":"/* Procurement date planner for assembly E-BOM requirements. Local browser simulation. */\nimport {materialReadinessV041} from './materials-v041.mjs';\nconst goodDate=d=\u003e/^\\d{4}-\\d{2}-\\d{2}$/.test(d)\u0026\u0026!Number.isNaN(Date.parse(d+'T12:00:00Z'))\u0026\u0026new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d;\nconst validDate=(v,label)=\u003e{const s=String(v||'').trim();if(s\u0026\u0026!goodDate(s))throw Error(label+' must be YYYY-MM-DD');return s};\nconst nonnegative=(v,label)=\u003e{const n=Number(v);if(!Number.isSafeInteger(n)||n\u003c0||n\u003e3650)throw Error(label+' must be 0–3650 days');return n};\nexport const addDays=(date,days)=\u003e{if(!goodDate(date))throw Error('Invalid plan date');return new Date(Date.parse(date+'T12:00:00Z')+days*86400000).toISOString().slice(0,10)};\nexport const daysUntil=(date,today)=\u003eMath.round((Date.parse(date+'T12:00:00Z')-Date.parse(today+'T12:00:00Z'))/86400000);\nexport function saveRequirementPlan(s,{occurrenceId,requiredBy,leadDays,bufferDays,linkedTaskId,note}){\n const occ=s.assemblyBOM?.find(x=\u003ex.id===occurrenceId\u0026\u0026!x.archivedAt);\n if(!occ)throw Error('Material requirement not found');\n const projectId=occ.projectId;\n if(linkedTaskId\u0026\u0026!s.tasks.some(t=\u003et.id===linkedTaskId\u0026\u0026t.projectId===projectId\u0026\u0026!t.archivedAt))throw Error('Linked job must belong to this project');\n const plan={requiredBy:validDate(requiredBy,'Required-by date'),leadDays:nonnegative(leadDays,'Supplier lead time'),\n  bufferDays:nonnegative(bufferDays,'Safety buffer'),linkedTaskId:linkedTaskId||null,\n  purchaseNote:String(note||'').trim().slice(0,800)};\n occ.purchasePlan=plan;\n s.audit??=[];\n s.audit.unshift({id:'audit-'+Math.random().toString(36).slice(2,9),action:'Material order plan changed',\n  detail:occ.id+' / required '+(plan.requiredBy||'unscheduled'),actor:'Sim-Worx Demo',at:new Date().toISOString()});\n return plan;\n}\nexport function materialPlanDates(occ){\n const plan=occ.purchasePlan||{},need=plan.requiredBy||'';\n return {requiredBy:need,leadDays:plan.leadDays||0,bufferDays:plan.bufferDays||0,\n   orderBy:need?addDays(need,-(Number(plan.leadDays||0)+Number(plan.bufferDays||0))):'',\n   linkedTaskId:plan.linkedTaskId||null,purchaseNote:plan.purchaseNote||''};\n}\nexport function procurementPlan(s,projectId,today=new Date().toISOString().slice(0,10)){\n const need=materialReadinessV041(s,projectId),lookup=new Map(need.map(x=\u003e[x.partId,x]));\n const occurrences=(s.assemblyBOM||[]).filter(x=\u003ex.projectId===projectId\u0026\u0026!x.archivedAt);\n return occurrences.map(x=\u003e{\n  const part=s.parts.find(p=\u003ep.id===x.partId),dates=materialPlanDates(x),quantity=lookup.get(x.partId);\n  const toSource=quantity?.toSource||0,unresolved=quantity?.toAllocate||0;\n  const due=dates.orderBy?daysUntil(dates.orderBy,today):null;\n  const toBuy=toSource\u003e0,needsAttention=unresolved\u003e0;\n  const status=!dates.orderBy?'Unscheduled':!toBuy\u0026\u0026!needsAttention?'Stock allocated':\n    !toBuy?'Covered: reserve/receive':due\u003c0?'Order overdue':due\u003c=7?'Order this week':'Order planned';\n  const severity=!dates.orderBy?'neutral':toBuy\u0026\u0026due\u003c0?'danger':toBuy\u0026\u0026due\u003c=7?'warning':toBuy?'neutral':'success';\n  return {occurrenceId:x.id,partId:x.partId,partName:part?.name||'',partCode:part?.code||'',quantity:x.quantity,\n    projectId,assemblyId:x.assemblyId,...dates,toSource,unresolved,dueDays:due,status,severity};\n }).sort((a,b)=\u003e(a.orderBy||'9999').localeCompare(b.orderBy||'9999')||a.partCode.localeCompare(b.partCode));\n}\nexport function procurementAlerts(s,projectId,today=new Date().toISOString().slice(0,10)){\n const rows=procurementPlan(s,projectId,today);\n return {rows,overdue:rows.filter(x=\u003ex.severity==='danger'),thisWeek:rows.filter(x=\u003ex.severity==='warning'),\n  missingDate:rows.filter(x=\u003e!x.requiredBy),unresolved:rows.filter(x=\u003ex.toSource\u003e0)};\n}\n\n/* Read-only buying schedule handoff; never creates a PO, changes stock, or fills unknowns. */\nexport function exportProcurementReviewCSV(s,projectId,today=new Date().toISOString().slice(0,10)){\n const project=s.projects?.find(p=\u003ep.id===projectId\u0026\u0026!p.archivedAt);\n if(!project)throw Error('Project not found');\n const rows=procurementPlan(s,projectId,today);\n const header=['Occurrence ID','Part code','Part / package','Quantity','Required by','Supplier lead days (0 may mean unconfirmed)',\n 'Buffer days','Order by (calculated)','Planning status','Supplier name (staff master)',\n 'Lead time unconfirmed','Linked job ID','Internal purchase note'];\n const cells=[header,...rows.map(r=\u003e{\n  const p=s.parts.find(x=\u003ex.id===r.partId)||{};\n  return [r.occurrenceId,r.partCode,r.partName,r.quantity,r.requiredBy,r.leadDays,r.bufferDays,\n   r.orderBy,r.status,p.supplier||'',r.leadDays===0?'REVIEW':'',r.linkedTaskId||'',r.purchaseNote||''];\n })];\n const csv=v=\u003e{\n  let x=String(v??'');\n  // Spreadsheet formula injection protection for staff-entered names and notes.\n  if(/^\\s*[=+@-]/.test(x)\u0026\u0026!/^\\d{4}-\\d{2}-\\d{2}$/.test(x))x=\"'\"+x;\n  return '\"'+x.replace(/\"/g,'\"\"')+'\"';\n };\n return cells.map(row=\u003erow.map(csv).join(',')).join('\\r\\n');\n}\n","planning-ui-v043.mjs":"/* Engineering owner sets need-by dates; the buyer sees consolidated project deadlines. */\nimport {procurementPlan,procurementAlerts,saveRequirementPlan} from './procurement-planning-v043.mjs';\nconst h=s=\u003eString(s??'').replace(/[\u0026\u003c\u003e\"']/g,c=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;','\"':'\u0026quot;','\"':'\u0026#39;'}[c]));\nexport function renderProjectMaterialPlanner(s,projectId){\n const rows=procurementPlan(s,projectId),stats=procurementAlerts(s,projectId);\n const tasks=s.tasks.filter(t=\u003et.projectId===projectId\u0026\u0026!t.archivedAt);\n const taskOptions=[['','Not linked to a job'],...tasks.map(t=\u003e[t.id,t.title])];\n const formRows=rows.map(r=\u003e{\n  const occ=s.assemblyBOM.find(x=\u003ex.id===r.occurrenceId);\n  const selector='\u003cselect name=\"linkedTaskId\" aria-label=\"Linked project job\"\u003e'+taskOptions.map(([v,t])=\u003e\n    '\u003coption value=\"'+h(v)+'\" '+(r.linkedTaskId===v?'selected':'')+'\u003e'+h(t)+'\u003c/option\u003e').join('')+'\u003c/select\u003e';\n  return '\u003ctr\u003e\u003ctd\u003e\u003cb\u003e'+h(r.partCode)+'\u003c/b\u003e\u003csmall\u003e'+h(r.partName)+'\u003c/small\u003e\u003c/td\u003e'+\n   '\u003ctd\u003e\u003cform data-form=\"v43-material-plan\" class=\"v43-planning-form\" id=\"v43-plan-'+h(r.occurrenceId)+'\"\u003e'+\n   '\u003cinput type=\"hidden\" name=\"occurrenceId\" value=\"'+h(r.occurrenceId)+'\"\u003e'+\n   '\u003cinput name=\"requiredBy\" value=\"'+h(r.requiredBy)+'\" type=\"date\" aria-label=\"Material required date\"\u003e\u003c/form\u003e\u003c/td\u003e'+\n   '\u003ctd\u003e\u003cinput form=\"v43-plan-'+h(r.occurrenceId)+'\" type=\"number\" step=\"1\" min=\"0\" max=\"3650\" name=\"leadDays\" value=\"'+r.leadDays+'\" aria-label=\"Supplier lead days\"\u003e\u003c/td\u003e'+\n   '\u003ctd\u003e\u003cinput form=\"v43-plan-'+h(r.occurrenceId)+'\" type=\"number\" step=\"1\" min=\"0\" max=\"3650\" name=\"bufferDays\" value=\"'+r.bufferDays+'\" aria-label=\"Safety buffer days\"\u003e\u003c/td\u003e'+\n   '\u003ctd\u003e\u003cb\u003e'+h(r.orderBy||'Not scheduled')+'\u003c/b\u003e\u003c/td\u003e'+\n   '\u003ctd\u003e\u003cspan class=\"v43-timing '+h(r.severity)+'\"\u003e'+h(r.status)+'\u003c/span\u003e\u003c/td\u003e'+\n   '\u003ctd\u003e'+selector.replace('\u003cselect ','\u003cselect form=\"v43-plan-'+h(r.occurrenceId)+'\" ')+\n   '\u003cinput form=\"v43-plan-'+h(r.occurrenceId)+'\" type=\"text\" maxlength=\"800\" name=\"note\" aria-label=\"Purchasing note\" value=\"'+h(r.purchaseNote)+'\" placeholder=\"Notes\"\u003e\u003c/td\u003e'+\n   '\u003ctd\u003e\u003cbutton form=\"v43-plan-'+h(r.occurrenceId)+'\" type=\"submit\" class=\"btn small primary\"\u003eSave\u003c/button\u003e\u003c/td\u003e\u003c/tr\u003e';\n }).join('');\n return '\u003cdiv class=\"v43-planning\"\u003e\u003cdiv class=\"v43-focus-heading\"\u003e\u003cdiv\u003e\u003ch3\u003ePlan purchasing before parts are needed\u003c/h3\u003e'+\n  '\u003cp\u003eSet when the material must arrive, supplier lead time and a safety buffer. We calculate the latest order date.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cbutton type=\"button\" class=\"btn small\" data-action=\"v44-export-buying-schedule\" data-project=\"'+h(projectId)+'\"\u003eExport buying schedule CSV\u003c/button\u003e\u003c/div\u003e'+ \n  '\u003cdiv class=\"v43-planning-kpis\"\u003e'+\n  '\u003cdiv\u003e\u003cb\u003e'+stats.overdue.length+'\u003c/b\u003e\u003cspan\u003eOrder deadlines passed\u003c/span\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cb\u003e'+stats.thisWeek.length+'\u003c/b\u003e\u003cspan\u003eOrder within 7 days\u003c/span\u003e\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cb\u003e'+stats.missingDate.length+'\u003c/b\u003e\u003cspan\u003eNeed a required-by date\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-scroll\"\u003e\u003ctable class=\"v43-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eMaterial\u003c/th\u003e\u003cth\u003eRequired by\u003c/th\u003e\u003cth\u003eLead (days)\u003c/th\u003e\u003cth\u003eBuffer (days)\u003c/th\u003e'+\n  '\u003cth\u003eOrder no later than\u003c/th\u003e\u003cth\u003ePlanning status\u003c/th\u003e\u003cth\u003eLinked job / notes\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e'+\n  (formRows||'\u003ctr\u003e\u003ctd colspan=\"8\"\u003eCreate assembly material requirements above to schedule orders.\u003c/td\u003e\u003c/tr\u003e')+\n  '\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e'+\n  '\u003cp class=\"v43-note\"\u003eLead times and buffers use calendar days. A zero-day lead time is a planning placeholder until independently confirmed; exported schedules flag these for review. Changing a project Gantt task does not silently change a material date; link the task for traceability and update the dates explicitly. Dates only signal a need to order; they do not place an order or modify stock.\u003c/p\u003e\u003c/div\u003e';\n}\nexport function handleMaterialPlanningForm(s,form){\n const f=new FormData(form),v=k=\u003eString(f.get(k)||'').trim();\n return saveRequirementPlan(s,{occurrenceId:v('occurrenceId'),requiredBy:v('requiredBy'),leadDays:v('leadDays'),\n  bufferDays:v('bufferDays'),linkedTaskId:v('linkedTaskId'),note:v('note')});\n}\n","focus-ui-v043.mjs":"/* Single-project daily control dashboard. Internal only. */\nimport {progressSnapshot} from './progress-v043.mjs';\nimport {procurementAlerts} from './procurement-planning-v043.mjs';\nimport {materialReadinessV041,purchaseStatus,outstanding} from './materials-v041.mjs';\nimport {externalRouteSummary,activeRoutes,activeStages,externalStageTiming} from './external-work-v043.mjs';\nconst escape=s=\u003eString(s??'').replace(/[\u0026\u003c\u003e\"']/g,c=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;','\"':'\u0026quot;','\"':'\u0026#39;'}[c]));\nconst btn=(label,tab,cls='')=\u003e'\u003cbutton class=\"btn '+cls+'\" type=\"button\" data-action=\"project-tab\" data-id=\"'+tab+'\"\u003e'+escape(label)+'\u003c/button\u003e';\nconst num=s=\u003enew Intl.NumberFormat('en-GB',{maximumFractionDigits:2}).format(Number(s)||0);\nconst status=(title,kind)=\u003e'\u003cspan class=\"v43-status '+kind+'\"\u003e'+escape(title)+'\u003c/span\u003e';\nexport function renderProjectFocus(s,ui,projectId){\n const p=s.projects.find(x=\u003ex.id===projectId\u0026\u0026!x.archivedAt);if(!p)return '\u003cp\u003eProject not found.\u003c/p\u003e';\n const prog=progressSnapshot(s,projectId),planning=procurementAlerts(s,projectId);\n const materials=materialReadinessV041(s,projectId);\n const ext=externalRouteSummary(s,projectId),routes=activeRoutes(s,projectId);\n const orders=s.orders.filter(o=\u003e!o.archivedAt\u0026\u0026o.projectId===projectId);\n const actionable=materials.map(row=\u003e{\n  const pending=orders.filter(o=\u003eo.items.some(l=\u003el.partId===row.partId\u0026\u0026outstanding(l)\u003e0));\n  const dispatch=pending.some(o=\u003epurchaseStatus(o)==='Out for delivery');\n  const stage=row.toSource\u003e0?['Needs ordering','red']:\n   row.incoming\u003e0?[dispatch?'Out for delivery':'Ordered','amber']:\n   row.toAllocate\u003c=0?['Allocated','green']:row.freeStock\u003e=row.toAllocate?['In workshop stock','green']:['Covered / pending allocation','amber'];\n  return {...row,stage};\n });\n const materialsHTML=actionable.slice(0,20).map(x=\u003e'\u003ctr\u003e\u003ctd\u003e\u003cb\u003e'+escape(x.part.code)+'\u003c/b\u003e\u003csmall\u003e'+escape(x.part.name)+'\u003c/small\u003e\u003c/td\u003e'+\n  '\u003ctd\u003e'+num(x.required)+'\u003c/td\u003e\u003ctd\u003e'+num(x.toSource)+'\u003c/td\u003e\u003ctd\u003e'+status(x.stage[0],x.stage[1])+'\u003c/td\u003e\u003c/tr\u003e').join('');\n const ordersHTML=orders.slice(0,10).map(o=\u003e{\n  const phase=purchaseStatus(o),color=phase==='Received'?'green':phase==='Part received'||phase==='Out for delivery'?'amber':'amber';\n  return '\u003ctr\u003e\u003ctd\u003e'+escape(o.code)+'\u003c/td\u003e\u003ctd\u003e'+escape(o.supplier)+'\u003c/td\u003e\u003ctd\u003e'+status(phase==='Received'?'Delivered':phase,color)+'\u003c/td\u003e\u003c/tr\u003e';\n }).join('');\n const waits=routes.flatMap(route=\u003eactiveStages(route).filter(x=\u003e['With supplier','On hold','Returned · inspect'].includes(x.status))\n  .map(stage=\u003e({route,stage,timing:externalStageTiming(stage)})));\n const supplierHTML=waits.slice(0,10).map(({route,stage,timing})=\u003e\n  '\u003ctr\u003e\u003ctd\u003e\u003cb\u003e'+escape(route.title)+'\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e'+escape(stage.company)+'\u003c/td\u003e'+\n  '\u003ctd\u003e'+escape(stage.name)+'\u003c/td\u003e\u003ctd\u003e'+escape(stage.promisedFinish||'No date')+'\u003c/td\u003e'+\n  '\u003ctd\u003e'+status(timing.activeOverdue?timing.overdueDays+' days late':stage.status,timing.activeOverdue?'red':'amber')+'\u003c/td\u003e\u003c/tr\u003e').join('');\n const top='\u003cdiv class=\"v43-home-grid\"\u003e'+\n  '\u003cdiv class=\"v43-home-card v43-home-progress\"\u003e\u003cdiv class=\"v43-home-card-title\"\u003eMANUAL PROJECT COMPLETION\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-home-value\"\u003e'+num(prog.earned)+'%\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-progress-track\"\u003e\u003cspan style=\"width:'+prog.earned+'%\"\u003e\u003c/span\u003e\u003c/div\u003e'+\n  '\u003cp\u003e'+prog.completed+' of '+prog.count+' steps complete'+(prog.fullyWeighted?'':' · '+num(prog.unassigned)+'% weight unallocated')+'\u003c/p\u003e'+\n  btn('Edit progress steps','progress','small primary')+'\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-home-card\"\u003e\u003cdiv class=\"v43-home-card-title\"\u003eMATERIALS NEEDING PURCHASE\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-home-value\"\u003e'+materials.filter(x=\u003ex.toSource\u003e0).length+'\u003c/div\u003e'+\n  '\u003cp\u003e'+planning.overdue.length+' order deadlines passed · '+planning.thisWeek.length+' due within 7 days\u003c/p\u003e'+\n  btn('Manage material dates','procurement','small primary')+'\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-home-card\"\u003e\u003cdiv class=\"v43-home-card-title\"\u003eWITH EXTERNAL COMPANIES\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-home-value\"\u003e'+ext.atSuppliers+'\u003c/div\u003e'+\n  '\u003cp\u003e'+ext.late.length+' external stages have recorded delays · '+ext.waitingInspection+' to inspect\u003c/p\u003e'+\n  btn('See supplier handoffs','external','small primary')+'\u003c/div\u003e\u003c/div\u003e';\n return '\u003cdiv class=\"v43-project-focus\"\u003e\u003cdiv class=\"v43-focus-heading\"\u003e\u003cdiv\u003e\u003ch2\u003e'+escape(p.name)+' · Project control\u003c/h2\u003e'+\n  '\u003cp\u003eYour working dashboard for procurement, delivery dates, manual completion and suppliers.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e'+top+\n  '\u003cdiv class=\"v43-focus-section\"\u003e\u003cdiv class=\"v43-focus-heading\"\u003e\u003cdiv\u003e\u003ch3\u003eProject purchase list\u003c/h3\u003e\u003cp\u003eOne consolidated view by part, across the whole project.\u003c/p\u003e\u003c/div\u003e'+\n  btn('Manage orders \u0026 stock','procurement','small')+'\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-scroll\"\u003e\u003ctable class=\"v43-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eMaterial\u003c/th\u003e\u003cth\u003eNeeded\u003c/th\u003e\u003cth\u003eStill to order\u003c/th\u003e\u003cth\u003eSupply status\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e'+\n  (materialsHTML||'\u003ctr\u003e\u003ctd colspan=\"4\"\u003eNo material requirements yet.\u003c/td\u003e\u003c/tr\u003e')+'\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-focus-section\"\u003e\u003cdiv class=\"v43-focus-heading\"\u003e\u003cdiv\u003e\u003ch3\u003eOutstanding and recent purchase orders\u003c/h3\u003e\u003c/div\u003e'+\n  '\u003cbutton class=\"btn small\" type=\"button\" data-action=\"v43-purchasing\"\u003eOpen project purchasing\u003c/button\u003e'+'\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-scroll\"\u003e\u003ctable class=\"v43-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eOrder\u003c/th\u003e\u003cth\u003eSupplier\u003c/th\u003e\u003cth\u003eStatus\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e'+\n  (ordersHTML||'\u003ctr\u003e\u003ctd colspan=\"3\"\u003eNo purchase orders for this project.\u003c/td\u003e\u003c/tr\u003e')+'\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-focus-section\"\u003e\u003cdiv class=\"v43-focus-heading\"\u003e\u003cdiv\u003e\u003ch3\u003eCurrently with external companies\u003c/h3\u003e\u003c/div\u003e'+\n  btn('Manage external work','external','small')+'\u003c/div\u003e'+\n  '\u003cdiv class=\"v43-scroll\"\u003e\u003ctable class=\"v43-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eWork package\u003c/th\u003e\u003cth\u003eCompany\u003c/th\u003e\u003cth\u003eStage\u003c/th\u003e\u003cth\u003ePromised back\u003c/th\u003e\u003cth\u003eStatus\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e'+\n  (supplierHTML||'\u003ctr\u003e\u003ctd colspan=\"5\"\u003eNo active external stages yet. Add one in External work.\u003c/td\u003e\u003c/tr\u003e')+'\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e'+\n  '\u003cp class=\"v43-footnote\"\u003eData here are staff-entered internal project records. No automatic customer updates are published. Supplier delay claims require supporting evidence and review.\u003c/p\u003e\u003c/div\u003e';\n}\n","contract-scope-v043.mjs":"/* Contract scope and milestone register. All source content comes from imported private data.\n   The application never bundles or publishes the customer's contract. */\nconst safe=x=\u003eString(x??'').replace(/[\u0026\u003c\u003e\"']/g,ch=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;','\"':'\u0026quot;','\"':'\u0026#39;'}[ch]));\nconst iso=d=\u003e/^\\d{4}-\\d{2}-\\d{2}$/.test(d)\u0026\u0026!Number.isNaN(Date.parse(d+'T12:00:00Z'))\u0026\u0026new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d;\nconst money=(v,curr)=\u003enew Intl.NumberFormat('en-GB',{style:'currency',currency:curr,maximumFractionDigits:0}).format(Number(v)||0);\nfunction log(s,action,detail){s.audit??=[];s.audit.unshift({id:'contract-'+Math.random().toString(36).slice(2),at:new Date().toISOString(),actor:'Internal staff',action,detail});}\nexport function contractDatePlusMonths(date,months=12){\n if(!iso(date))throw Error('Enter a valid YYYY-MM-DD effective date');\n const [year,month,day]=date.split('-').map(Number);\n const targetYear=year+Math.floor((month-1+months)/12),targetMonth=(month-1+months)%12;\n const last=new Date(Date.UTC(targetYear,targetMonth+1,0)).getUTCDate();\n return new Date(Date.UTC(targetYear,targetMonth,Math.min(day,last))).toISOString().slice(0,10);\n}\nexport function setVerifiedContractEffectiveDate(s,{projectId,effectiveDate,verified}){\n const p=s.projects.find(x=\u003ex.id===projectId\u0026\u0026!x.archivedAt);\n if(!p)throw Error('Project does not exist');\n if(!verified)throw Error('Confirm you checked the signed effective date');\n if(!iso(effectiveDate))throw Error('Invalid executed contract date');\n p.contractInfo??={};\n const old=p.contractInfo.effectiveDate||'';\n p.contractInfo.effectiveDate=effectiveDate;\n p.contractInfo.signedStatus='Effective signature date entered and checked by staff; not independently verified by the application';\n p.due=contractDatePlusMonths(effectiveDate);\n log(s,'Contract date entered',p.code+' / '+old+' → '+effectiveDate+' / calculated SAT date '+p.due);\n return p;\n}\nexport function updateContractMilestone(s,{projectId,milestoneId,status,notes}){\n const p=s.projects.find(x=\u003ex.id===projectId\u0026\u0026!x.archivedAt);\n const x=s.projectCommercialMilestones?.find(x=\u003ex.id===milestoneId\u0026\u0026x.projectId===p?.id);\n if(!x)throw Error('Milestone not found');\n if(!['Not verified / not invoiced','Invoiced','Accepted in writing','Paid','Not verified / not ordered','Ordered','Supplier paid'].includes(status))throw Error('Unsupported milestone status');\n x.status=status;x.staffNotes=String(notes||'').slice(0,800);x.lastReviewedAt=new Date().toISOString();\n log(s,'Commercial milestone manually updated',x.title+' / '+status+' / '+x.staffNotes);return x;\n}\nexport function updateScopeReadiness(s,{checkId,status,note}){\n const x=s.readinessChecklist?.find(x=\u003ex.id===checkId);\n if(!x)throw Error('Scope checklist item missing');\n if(!['Open','In progress','Confirmed'].includes(status))throw Error('Invalid checklist status');\n x.status=status;x.reviewNotes=String(note||'').slice(0,800);\n x.lastReviewedAt=new Date().toISOString();\n log(s,'Contract readiness item updated',x.text+' / '+status);return x;\n}\nexport function renderContractScope(s,projectId){\n const p=s.projects.find(x=\u003ex.id===projectId\u0026\u0026!x.archivedAt);\n if(!p)return '\u003cp\u003eProject missing.\u003c/p\u003e';\n const info=p.contractInfo||{};\n const stages=(s.projectCommercialMilestones||[]).filter(x=\u003ex.projectId===projectId);\n const checks=s.readinessChecklist||[];\n const exclusions=s.scopeExclusions||[];\n const sections=s.sections.filter(x=\u003ex.projectId===projectId\u0026\u0026!x.archivedAt);\n const milestones=stages.map(x=\u003e'\u003ctr\u003e\u003ctd\u003e\u003cb\u003e'+safe(x.title)+'\u003c/b\u003e\u003csmall\u003e'+safe(x.trigger||x.source||'')+'\u003c/small\u003e\u003c/td\u003e'+\n '\u003ctd\u003e'+safe(x.simWorxEUR!=null?money(x.simWorxEUR,'EUR'):money(x.contractValue,x.currency||'EUR'))+'\u003c/td\u003e'+\n '\u003ctd\u003e\u003cform data-form=\"v43-contract-milestone\"\u003e\u003cinput type=\"hidden\" name=\"projectId\" value=\"'+safe(projectId)+'\"\u003e'+\n '\u003cinput type=\"hidden\" name=\"milestoneId\" value=\"'+safe(x.id)+'\"\u003e'+\n '\u003cselect name=\"status\" aria-label=\"Status\"\u003e'+['Not verified / not invoiced','Not verified / not ordered','Invoiced','Ordered','Accepted in writing','Paid','Supplier paid'].map(v=\u003e'\u003coption '+(v===x.status?'selected':'')+'\u003e'+v+'\u003c/option\u003e').join('')+'\u003c/select\u003e'+\n '\u003cinput name=\"notes\" placeholder=\"Evidence reference / review note\" value=\"'+safe(x.staffNotes||'')+'\"\u003e'+\n '\u003cbutton type=\"submit\" class=\"btn small primary\"\u003eSave\u003c/button\u003e\u003c/form\u003e\u003c/td\u003e\u003c/tr\u003e').join('');\n const checkRows=checks.map(x=\u003e'\u003ctr\u003e\u003ctd\u003e\u003cb\u003e'+safe(x.text)+'\u003c/b\u003e\u003csmall\u003e'+safe(x.source||'')+'\u003c/small\u003e\u003c/td\u003e'+\n '\u003ctd\u003e\u003cform data-form=\"v43-contract-check\"\u003e\u003cinput type=\"hidden\" name=\"checkId\" value=\"'+safe(x.id)+'\"\u003e'+\n '\u003cselect name=\"status\"\u003e'+['Open','In progress','Confirmed'].map(v=\u003e'\u003coption '+(v===x.status?'selected':'')+'\u003e'+v+'\u003c/option\u003e').join('')+'\u003c/select\u003e'+\n '\u003cinput name=\"note\" value=\"'+safe(x.reviewNotes||'')+'\" placeholder=\"Evidence or notes\"\u003e'+\n '\u003cbutton type=\"submit\" class=\"btn small primary\"\u003eSave\u003c/button\u003e\u003c/form\u003e\u003c/td\u003e\u003c/tr\u003e').join('');\n return '\u003cdiv class=\"v43-contract-scope\"\u003e\u003cdiv class=\"v43-focus-heading\"\u003e\u003cdiv\u003e\u003ch2\u003eContract scope \u0026 milestones\u003c/h2\u003e'+\n '\u003cp\u003ePrivate register populated from your contract import. Review and update status against real documentary evidence.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e'+\n '\u003cdiv class=\"v43-contract-stats\"\u003e\u003cdiv\u003e\u003csmall\u003eSim-Worx contracted scope\u003c/small\u003e\u003cstrong\u003e'+money(info.pricing?.simWorxEUR??p.contract,'EUR')+'\u003c/strong\u003e\u003c/div\u003e'+\n '\u003cdiv\u003e\u003csmall\u003eBuyer-paid motion system\u003c/small\u003e\u003cstrong\u003e'+money(info.pricing?.motionBuyerDirectEUR||0,'EUR')+'\u003c/strong\u003e\u003c/div\u003e'+\n '\u003cdiv\u003e\u003csmall\u003eBuyer-paid LED system\u003c/small\u003e\u003cstrong\u003e'+money(info.pricing?.ledBuyerDirectUSD||0,'USD')+'\u003c/strong\u003e\u003c/div\u003e'+\n '\u003cdiv\u003e\u003csmall\u003eApproved internal spend budget\u003c/small\u003e\u003cstrong\u003e'+money(p.budget||0,'EUR')+'\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e'+\n '\u003cdiv class=\"v43-contract-grid\"\u003e\u003cdiv\u003e\u003ch3\u003eDelivery \u0026 signature verification\u003c/h3\u003e'+\n '\u003cp\u003eContracted delivery/SAT rule: '+safe(info.deliveryRule||'Not entered')+'\u003c/p\u003e'+\n '\u003cp\u003e\u003cb\u003eEffective date:\u003c/b\u003e '+safe(info.effectiveDate||'Not verified')+' · \u003cb\u003eBinding SAT deadline:\u003c/b\u003e '+safe(p.due||'Not calculated')+'\u003c/p\u003e'+\n '\u003cform data-form=\"v43-contract-date\"\u003e\u003cinput type=\"hidden\" name=\"projectId\" value=\"'+safe(projectId)+'\"\u003e'+\n '\u003clabel\u003eSigned effective date\u003cinput name=\"effectiveDate\" type=\"date\" value=\"'+safe(info.effectiveDate||'')+'\" required\u003e\u003c/label\u003e'+\n '\u003clabel class=\"v43-contract-confirm\"\u003e\u003cinput name=\"verified\" type=\"checkbox\" value=\"yes\" required\u003e I checked the executed signature date\u003c/label\u003e'+\n '\u003cbutton class=\"btn primary\" type=\"submit\"\u003eSet date \u0026 calculate +12 months\u003c/button\u003e\u003c/form\u003e'+\n '\u003cp\u003eAny contractually permitted extension must be separately evidenced; changing this field is not legal approval of an extension.\u003c/p\u003e\u003c/div\u003e'+\n '\u003cdiv\u003e\u003ch3\u003eScope boundaries\u003c/h3\u003e'+exclusions.map(x=\u003e'\u003cdiv class=\"v43-contract-exclusion\"\u003e\u003cb\u003e'+safe(x.name)+'\u003c/b\u003e\u003csmall\u003e'+safe(x.owner||'')+' · '+safe(x.source||'')+'\u003c/small\u003e\u003c/div\u003e').join('')+'\u003c/div\u003e\u003c/div\u003e'+\n '\u003cdiv class=\"v43-contract-block\"\u003e\u003ch3\u003eDelivery work packages ('+sections.length+')\u003c/h3\u003e'+\n '\u003cdiv class=\"v43-contract-chips\"\u003e'+sections.map(x=\u003e'\u003cspan title=\"'+safe(x.notes||'')+'\"\u003e'+safe(x.name)+'\u003c/span\u003e').join('')+'\u003c/div\u003e\u003c/div\u003e'+\n '\u003cdiv class=\"v43-contract-block\"\u003e\u003ch3\u003eAcceptance, procurement and financial milestone register\u003c/h3\u003e'+\n '\u003cdiv class=\"v43-scroll\"\u003e\u003ctable class=\"v43-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eMilestone / trigger\u003c/th\u003e\u003cth\u003eAmount (source currency)\u003c/th\u003e\u003cth\u003eManual verification\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e'+\n (milestones||'\u003ctr\u003e\u003ctd colspan=\"3\"\u003eNo commercial milestones imported.\u003c/td\u003e\u003c/tr\u003e')+'\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e'+\n '\u003cdiv class=\"v43-contract-block\"\u003e\u003ch3\u003eProject startup / contract obligations checklist\u003c/h3\u003e'+\n '\u003cdiv class=\"v43-scroll\"\u003e\u003ctable class=\"v43-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eRequired action and source\u003c/th\u003e\u003cth\u003eProgress \u0026 evidence\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e'+\n (checkRows||'\u003ctr\u003e\u003ctd colspan=\"2\"\u003eNo startup checklist imported.\u003c/td\u003e\u003c/tr\u003e')+'\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e'+\n '\u003cp class=\"v43-note\"\u003eContract value is NOT an approved internal purchasing budget; motion/LED buyer-direct payments remain separate in their currencies. These are editable staff records, not electronic signatures or proof of an external payment.\u003c/p\u003e\u003c/div\u003e';\n}\nexport function handleContractForm(s,form){\n const fd=new FormData(form),v=k=\u003eString(fd.get(k)||'').trim();\n switch(form.dataset.form){\n  case 'v43-contract-date':return setVerifiedContractEffectiveDate(s,{projectId:v('projectId'),effectiveDate:v('effectiveDate'),verified:v('verified')==='yes'});\n  case 'v43-contract-milestone':return updateContractMilestone(s,{projectId:v('projectId'),milestoneId:v('milestoneId'),status:v('status'),notes:v('notes')});\n  case 'v43-contract-check':return updateScopeReadiness(s,{checkId:v('checkId'),status:v('status'),note:v('note')});\n  default:throw Error('Unknown contract form');\n }\n}\n","project-control-v046.mjs":"/* V0.5.2 — project-first workspace, work plan, and buying decision review.\n   Views are projections of existing staff records. No actual orders, approvals,\n   supplier confirmations, financials, stock or contract dates are fabricated. */\nimport {materialReadinessV041,purchaseStatus} from './materials-v041.mjs';\nimport {materialPlanDates,saveRequirementPlan} from './procurement-planning-v043.mjs';\nimport {progressSnapshot} from './progress-v043.mjs';\nimport {externalRouteSummary} from './external-work-v043.mjs';\nimport {saveRequirementSource,sourceInput,safeProductURL} from './procurement-sourcing-v046.mjs';\nimport {renderPlanningDropzones,renderRequirementOperation} from './procurement-ui-v047.mjs';\n\nconst esc=x=\u003eString(x??'').replace(/[\u0026\u003c\u003e\"']/g,c=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;','\"':'\u0026#39;'}[c]));\nconst live=x=\u003ex\u0026\u0026!x.archivedAt;\nconst button=(title,tab,extra='')=\u003e'\u003cbutton type=\"button\" class=\"btn small\" data-action=\"project-tab\" data-id=\"'+esc(tab)+'\" '+extra+'\u003e'+esc(title)+'\u003c/button\u003e';\nconst num=v=\u003enew Intl.NumberFormat('en-GB',{maximumFractionDigits:0}).format(Number(v)||0);\nconst date=s=\u003es?esc(s):'\u003cspan class=\"v46-missing\"\u003eNot planned\u003c/span\u003e';\nconst goodStatus=st=\u003est==='Done'?'good':st==='Blocked'?'danger':st==='In progress'||st==='Inspection'?'caution':'muted';\nconst pill=(text,tone='muted')=\u003e'\u003cspan class=\"v46-pill '+tone+'\"\u003e'+esc(text)+'\u003c/span\u003e';\nconst missingOwner=s=\u003e!String(s||'').trim()||/^(unassigned|tbc|tbd|unknown)$/i.test(String(s).trim());\nconst knownSupplier=s=\u003e!missingOwner(s)\u0026\u0026!/to confirm|not confirmed|awaiting supplier|supplier tbc/i.test(String(s));\nconst safeLink=raw=\u003e{try{return safeProductURL(raw)}catch{return ''}};\nconst intro=(title,subtitle)=\u003e'\u003cdiv class=\"v46-intro\"\u003e\u003cdiv\u003e\u003ch3\u003e'+esc(title)+'\u003c/h3\u003e\u003cp\u003e'+esc(subtitle)+'\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e';\n\nexport function projectWorkSnapshot(s,projectId){\n const project=s.projects?.find(x=\u003elive(x)\u0026\u0026x.id===projectId);\n if(!project)throw Error('Project not found');\n const jobs=(s.tasks||[]).filter(t=\u003elive(t)\u0026\u0026t.projectId===projectId);\n const sections=(s.sections||[]).filter(t=\u003elive(t)\u0026\u0026t.projectId===projectId);\n const done=jobs.filter(t=\u003et.status==='Done').length,blocked=jobs.filter(t=\u003et.status==='Blocked').length;\n const unassigned=jobs.filter(t=\u003emissingOwner(t.assignee)).length;\n const withoutDates=jobs.filter(t=\u003e!t.start||!t.due).length;\n return {project,jobs,sections,done,blocked,unassigned,withoutDates,remaining:jobs.length-done,\n  inProgress:jobs.filter(t=\u003et.status==='In progress').length};\n}\n\nexport function projectBuyingSnapshot(s,projectId){\n const project=s.projects?.find(x=\u003elive(x)\u0026\u0026x.id===projectId);\n if(!project)throw Error('Project not found');\n const requirements=(s.assemblyBOM||[]).filter(r=\u003elive(r)\u0026\u0026r.projectId===projectId);\n const parts=new Map((s.parts||[]).filter(live).map(p=\u003e[p.id,p]));\n const assemblies=new Map((s.assemblies||[]).filter(live).map(a=\u003e[a.id,a]));\n const byPart=new Map(materialReadinessV041(s,projectId).map(x=\u003e[x.partId,x]));\n const orders=(s.orders||[]).filter(o=\u003elive(o)\u0026\u0026o.projectId===projectId);\n const rows=requirements.map(occ=\u003e{\n  const part=parts.get(occ.partId)||{},assembly=assemblies.get(occ.assemblyId)||{};\n  const coverage=byPart.get(occ.partId)||{required:0,toSource:0,incoming:0,freeStock:0,reserved:0,issued:0};\n  const plan=materialPlanDates(occ);\n  const make=String(occ.makeBuy||'Buy').toLowerCase()==='make';\n  const source=occ.purchaseSource||{},responsibility=source.responsibility||'Unverified';\n  const supplierKnown=knownSupplier(source.supplier||part.supplier);\n  const missingDate=!plan.requiredBy,missingLead=!plan.leadDays;\n  const missingInputs=[responsibility==='Unverified'\u0026\u0026!make?'purchasing responsibility':null,missingDate?'need-by date':null,\n    missingLead?'supplier lead time':null,!supplierKnown\u0026\u0026!make?'supplier':null].filter(Boolean);\n  let stage='Review needed',tone='caution',next='Verify the requirement and request an RFQ';\n  if(make){stage='Make in-house';tone='muted';next='Schedule workshop fabrication and release drawings';}\n  else if(responsibility==='Customer-direct'){\n   stage='Customer-direct supply';tone='muted';next='Confirm customer purchasing/delivery evidence';\n  }else if(responsibility==='Subcontractor'){\n   stage='Subcontractor supply';tone='muted';next='Confirm external handoff and purchasing responsibility';\n  }else if(coverage.toSource\u003e0\u0026\u0026coverage.incoming\u003e0){stage='Part-covered by PO';tone='caution';next='Review remaining uncovered quantity and confirmed delivery';}\n  else if(coverage.toSource===0\u0026\u0026coverage.incoming\u003e0){stage='Ordered / awaiting receipt';tone='good';next='Track supplier delivery, then record actual receipt';}\n  else if(coverage.toSource===0\u0026\u0026coverage.freeStock\u003e0){stage='Workshop stock available';tone='good';next='Verify stock and allocate it to this project';}\n  else if(coverage.toSource===0){stage='Covered / verify allocation';tone='good';next='Check reservations, issued stock and PO documents';}\n  else if(missingInputs.length){stage='Needs sourcing review';tone='caution';next='Confirm '+missingInputs.join(', ')+' before proposing a PO';}\n  else {stage='RFQ / approval required';tone='caution';next='Verify quotation, purchase authority and order terms';}\n  return {occ,part,assembly,coverage,plan,source,responsibility,make,supplierKnown,missingDate,missingLead,missingInputs,stage,tone,next};\n });\n const buy=rows.filter(r=\u003e!r.make),manufacture=rows.filter(r=\u003er.make);\n return {project,rows,buy,manufacture,orders,\n  simworxBuy:buy.filter(r=\u003er.responsibility==='Sim-Worx'),customerDirect:buy.filter(r=\u003er.responsibility==='Customer-direct'),\n  ownerUnverified:buy.filter(r=\u003er.responsibility==='Unverified'),\n  unplannedBuy:buy.filter(r=\u003er.missingInputs.length\u0026\u0026r.coverage.toSource\u003e0),\n  coveredBuy:buy.filter(r=\u003er.coverage.toSource===0),\n  unconfirmedLead:buy.filter(r=\u003er.missingLead),\n  missingDates:buy.filter(r=\u003er.missingDate),\n  confirmedPOs:orders.length};\n}\n\nexport function renderProjectFocus(s,ui,projectId){\n const work=projectWorkSnapshot(s,projectId),buying=projectBuyingSnapshot(s,projectId);\n const progress=progressSnapshot(s,projectId),external=externalRouteSummary(s,projectId);\n const progressLabel=progress.weightTotal\u003e0?num(progress.earned)+'% recorded':'Not weighted';\n const progressNote=progress.weightTotal\u003e0?'Manual completion, not independently verified':'Progress headings exist but no weights have been confirmed';\n const summary='\u003cdiv class=\"v46-metrics\"\u003e'+\n  '\u003cbutton type=\"button\" data-action=\"project-tab\" data-id=\"work\" class=\"v46-metric\"\u003e\u003csmall\u003eWORK PLAN\u003c/small\u003e\u003cstrong\u003e'+num(work.jobs.length)+'\u003c/strong\u003e\u003cspan\u003e'+num(work.remaining)+' not done · '+num(work.withoutDates)+' not fully scheduled\u003c/span\u003e\u003c/button\u003e'+\n  '\u003cbutton type=\"button\" data-action=\"project-tab\" data-id=\"buying\" class=\"v46-metric\"\u003e\u003csmall\u003ePURCHASING REQUIREMENTS\u003c/small\u003e\u003cstrong\u003e'+num(buying.buy.length)+'\u003c/strong\u003e\u003cspan\u003e'+num(buying.manufacture.length)+' make in-house · '+num(buying.unplannedBuy.length)+' need sourcing details\u003c/span\u003e\u003c/button\u003e'+\n  '\u003cbutton type=\"button\" data-action=\"v43-purchasing\" class=\"v46-metric\"\u003e\u003csmall\u003eACTUAL PURCHASE ORDERS\u003c/small\u003e\u003cstrong\u003e'+num(buying.confirmedPOs)+'\u003c/strong\u003e\u003cspan\u003eOnly orders entered by staff\u003c/span\u003e\u003c/button\u003e'+\n  '\u003cbutton type=\"button\" data-action=\"project-tab\" data-id=\"progress\" class=\"v46-metric\"\u003e\u003csmall\u003ePROJECT PROGRESS\u003c/small\u003e\u003cstrong class=\"v46-text-value\"\u003e'+esc(progressLabel)+'\u003c/strong\u003e\u003cspan\u003e'+esc(progressNote)+'\u003c/span\u003e\u003c/button\u003e\u003c/div\u003e';\n const process='\u003cdiv class=\"v46-process\"\u003e'+\n  '\u003cdiv\u003e\u003cspan\u003e01\u003c/span\u003e\u003cb\u003ePlan the work\u003c/b\u003e\u003cp\u003eSee '+num(work.jobs.length)+' tasks organised by work package. Assign people, dependencies and real dates.\u003c/p\u003e'+button('Open work plan','work')+'\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cspan\u003e02\u003c/span\u003e\u003cb\u003eReview what to source\u003c/b\u003e\u003cp\u003eSeparate '+num(buying.buy.length)+' proposed buy requirements from '+num(buying.manufacture.length)+' in-house make requirements.\u003c/p\u003e'+button('Open buying review','buying')+'\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cspan\u003e03\u003c/span\u003e\u003cb\u003eTrack actual orders\u003c/b\u003e\u003cp\u003eOnly record a purchase after it has really been placed. Receipt is a separate step.\u003c/p\u003e'+button('Open orders \u0026 stock','procurement')+'\u003c/div\u003e'+\n  '\u003cdiv\u003e\u003cspan\u003e04\u003c/span\u003e\u003cb\u003eInspect and deliver\u003c/b\u003e\u003cp\u003eTrack suppliers, acceptance evidence, project schedule and completion without claiming unverified work.\u003c/p\u003e'+button('Supplier QA','external')+'\u003c/div\u003e\u003c/div\u003e';\n const next=work.jobs.filter(t=\u003et.status==='Blocked'||t.status==='In progress'||t.status==='Ready').slice(0,8);\n const important=next.length?next:work.jobs.slice(0,8);\n const wrows=important.map(t=\u003e'\u003ctr\u003e\u003ctd\u003e\u003cb\u003e'+esc(t.title)+'\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e'+esc(work.sections.find(x=\u003ex.id===t.sectionId)?.name||'Uncategorised')+'\u003c/td\u003e'+\n  '\u003ctd\u0
