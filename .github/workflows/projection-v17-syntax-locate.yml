name: Locate V17 syntax error
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v17-syntax-locate.yml'
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V17
        run: python3 .projection-v17-deploy/build_v17.py
      - name: Show failing HTML lines
        run: |
          nl -ba projection-screen-configurator-v17.html | sed -n '795,822p'
