name: Publish projection configurator V39
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projection-v39.yml'
      - '.projection-v39-deploy/**'
permissions:
  contents: read
concurrency:
  group: simworx-projection-v39
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build V39 from published V38
        run: python3 .projection-v39-deploy/build_v39.py
      - name: Run V39 browser acceptance test
        run: |
          python3 -m pip install --quiet playwright
          python3 -m http.server 8765 >/tmp/v39-server.log 2>&1 &
          P=$!
          sleep 2
          python3 .projection-v39-deploy/test_v39.py
          kill $P || true
      - uses: actions/upload-artifact@v4
        with:
          name: v39-proof
          path: /tmp/v39-proof.png
          retention-days: 1
      - name: Publish immutable V39
        run: python3 .projection-v39-deploy/publish_v39.py
